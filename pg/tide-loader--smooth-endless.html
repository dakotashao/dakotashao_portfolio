<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tide Smooth Endless</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* the white square is the component: 300px, centred in the stage */
#sea{position:absolute;left:80px;top:60px;display:block;width:300px;height:300px;background:#fff}
</style>
</head><body>
<div id="stage" data-w="460" data-h="420">
  <canvas id="sea" role="img" aria-label="ASCII ocean loader: blue waves flood a white square from left to right"></canvas>
</div>
<script src="kit.js"></script>
<script>
(() => {
  const cv = document.getElementById('sea'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const COLS = 52, ROWS = 52;
  const FILL = 12, HOLD = 3, EBB = 0, REST = 0;   // no ebb: fill, hold 3s, restart   // seconds
  const DRY = .35;     // grains stay still, but the far edge of the wet sand slowly dries away
  // the tide comes in as a series of surges: run up, pull back a little, run up further
  const PEAKS   = [.30, .55, .78, 1.0];
  const TROUGHS = [.21, .46, .69];
  const KEYS = (() => {           // [time 0..1, level, 'up' | 'back']
    const k = [[0, 0, 'up']], n = PEAKS.length, seg = 1/(n*2 - 1);
    let t = 0;
    PEAKS.forEach((pk, i) => {
      t += seg*1.15; k.push([t, pk, 'up']);
      if (i < TROUGHS.length){ t += seg*.85; k.push([t, TROUGHS[i], 'back']); }
    });
    k.forEach(e => e[0] /= t);
    return k;
  })();
  const wet = new Float32Array(ROWS).fill(-99);   // furthest reach per row, drying over time
  let lastT = 0, lastCycle = 0;
  const FRAG = "+=-:·*=+-";
  let loop = true, calm = reduce, start = performance.now(), size = 0, cell = 0;

  // palette: paper → shallow → deep
  const PAPER = [255,255,255];
  const FOAM_BG = [0,72,255], SHALLOW = [0,60,255], MID = [0,46,245], DEEP = [0,30,190], ABYSS = [0,18,120];
  const RAMP = " .·:-=+*≈#%@";
  const FOAM = "~≈^~∽-";

  const mix = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
  const rgb = c => `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
  const clamp = (v,a,b) => v<a?a:v>b?b:v;
  const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  const hash = (x,y) => { const s = Math.sin(x*127.1 + y*311.7)*43758.5453; return s - Math.floor(s); };

  function resize(){
    const dpr = Math.min(devicePixelRatio||1, 2);   // design size, not the scaled card size
    size = cv.offsetWidth; cv.width = cv.height = Math.round(size*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cell = size/COLS;
    ctx.font = `500 ${cell*1.02}px "IBM Plex Mono", ui-monospace, monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  }

  // returns {level 0..1 of fill, label, pct}
  // indeterminate: no progress to show, so the tide never fills or resets.
  // each wave runs up to its own peak, then drains back to its own trough, forever.
  const WAVE = 3.4;                                   // seconds per wave (run-up + backwash)
  const peakOf   = k => .50 + .16*(hash(k, 1) - .5)*2;   // how far wave k reaches (0..1 of the square)
  const troughOf = k => .30 + .08*(hash(k, 2) - .5)*2;   // where the water settles before wave k
  function phase(s){
    const k = Math.floor(s / WAVE), u = s/WAVE - k;
    const ease = x => (1 - Math.cos(x*Math.PI))/2;       // gentle in, gentle out
    if (u < .55) return {lv: troughOf(k) + (peakOf(k) - troughOf(k))*ease(u/.55), pct:0, label:''};
    return {lv: peakOf(k) + (troughOf(k+1) - peakOf(k))*ease((u-.55)/.45), pct:0, label:''};
  }


  function surface(x, t, lv, amp){
    // reach of the water from the left edge, in columns (x = row index here)
    const base = lv*(COLS+14) - 9;   // starts off-canvas so the square begins pure white
    const w = Math.sin(x*.17 + t*1.7)*1.0
            + Math.sin(x*.063 - t*.8 + 1.3)*1.4
            + Math.sin(x*.41 + t*2.2)*.3
            + Math.sin(x*.11 + t*1.1 + Math.sin(t*.4)*2)*.8;
    // a rolling swell that travels down the front
    const swell = Math.exp(-Math.pow(((x/COLS) - ((t*.18)%1.6 - .3))*4, 2)) * 3.2;
    return base + (w + swell)*amp;
  }

  function frame(now){
    const t = (now - start)/1000;
    const {lv, pct, label} = phase(t);
    const tt = calm ? t*.35 : t;
    const dt = clamp(t - lastT, 0, .1); lastT = t;
    const amp = calm ? .35 : (0.9 + 2.0*Math.sin(Math.PI*clamp(lv,0,1))) * (1 - .75*clamp((lv-.9)/.1, 0, 1));

    ctx.fillStyle = (window.KIT && KIT.dark) ? '#242424' : '#fff'; ctx.fillRect(0,0,size,size);

    for (let r=0; r<ROWS; r++){
      const h = surface(r, tt, lv, amp);   // how far the water reaches from the left, in columns
      const cy = r*cell + cell/2;
      wet[r] = Math.max(h, wet[r] - DRY*dt);
      for (let c=0; c<COLS; c++){
        const xl = c + .5;                 // column distance from the left edge
        const d = h - xl;                  // depth behind the wave front
        const cx = c*cell + cell/2;
        const n = hash(c, r);

        if (d < 0 && xl < wet[r]){
          // wet sand the wave just left: scattered blue grains and bubbles, densest along the high-water line
          // grains are fixed to the sand: same cells, same symbols, no flicker
          const k = hash(c*1.3, r*1.7);
          if (k < .34){
            const g = FRAG[Math.floor(hash(r, c)*FRAG.length)];
            ctx.fillStyle = k < .15 ? rgb(MID) : rgb(SHALLOW);
            ctx.fillText(g, cx, cy);
          }
          continue;
        }
        if (d < 0){
          // above water: paper with faint grain; spray right above crests
          continue;   // dry paper stays pure white
        }

        // water body
        const dn = clamp(d/(ROWS*.9), 0, 1);
        let bg;
        if (d < 1)      bg = mix(FOAM_BG, SHALLOW, d);
        else if (dn<.25) bg = mix(SHALLOW, MID, dn/.25);
        else if (dn<.6)  bg = mix(MID, DEEP, (dn-.25)/.35);
        else             bg = mix(DEEP, ABYSS, (dn-.6)/.4);
        ctx.fillStyle = rgb(bg);
        if (d < 1) { const fw = cell*Math.max(d,.35); ctx.fillRect(c*cell, r*cell, fw+.6, cell+.6); }
        else ctx.fillRect(c*cell, r*cell, cell+.6, cell+.6);

        if (d < 1.1){
          // foam line on the crest
          ctx.fillStyle = d < .5 ? rgb(SHALLOW) : '#ffffff';
          ctx.fillText(FOAM[(c + Math.floor(tt*6)) % FOAM.length], cx, cy);
          continue;
        }
        // current field → glyph density
        const f = Math.sin(c*.23 + tt*1.3 + Math.sin(r*.19 - tt*.7)*1.8)
                + Math.sin(r*.31 - tt*1.1 + c*.07)*.8
                + Math.sin((c-r)*.12 + tt*.9)*.6;
        const v = clamp((f+2.4)/4.8 + (n-.5)*.18, 0, .999);
        const ch = RAMP[Math.floor(v*RAMP.length)];
        if (ch === ' ') continue;
        // crisp two-tone glyphs: bright white crests, dark carved troughs — no tinted overlay
        ctx.fillStyle = v > .62 ? '#ffffff' : v > .4 ? rgb(mix(bg,[255,255,255],.55)) : rgb(mix(bg,[0,0,40],.55));
        ctx.fillText(ch, cx, cy);
      }
    }

    requestAnimationFrame(frame);
  }


  addEventListener('resize', resize);
  resize();
  document.fonts?.ready.then(resize);
  requestAnimationFrame(frame);
})();
</script>
</body></html>
