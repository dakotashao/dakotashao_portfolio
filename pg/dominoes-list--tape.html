<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dominoes List · Tape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap">
<style>
/* v2: v1's wheel in the slider's parts. The grey well is the rail (draggable), the 1 px line across it is the reader and
   stays still; each row carries four of the slider's dominoes, which tip back with it. */
:root {
  --bg: #f6f6f6; --card: #ffffff; --ink: #17181b; --muted: #62666d; --line: #dfe0e4; --press: #eeeef1;
  --rail: #eeeef1; --rail-hover: #e8e8ec; --rail-press: #e3e3e7; --rail-limit: #d6d7dc; --stop: #b9bcc2; --solid: #1b1c20;
  --card-shadow: 0 22px 44px -14px rgba(26, 28, 36, 0.18), 0 3px 8px rgba(26, 28, 36, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.9);
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
#stage, #stage * { box-sizing: border-box; }
#stage { color: var(--ink); font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
.list { position: absolute; left: 70px; top: 60px; width: 320px; padding: 8px; border-radius: 24px; background: var(--card); box-shadow: var(--card-shadow); will-change: transform; }
.lhead { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 8px 0 16px; }
.ltitle { flex: 1; margin: 0; font: 600 15px/20px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; letter-spacing: -0.01em; }
.tk { stroke: var(--stop); stroke-width: 1; stroke-linecap: round; }
.tk.on { stroke: var(--muted); stroke-width: 1.25; }
.pk-rows { position: absolute; inset: 0; }
.pk-row { position: absolute; left: 0; right: 0; top: 0; height: 44px; }
.pk-tape { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.pk-row .vl .d { display: inline-block; }
.pk-row .nm { position: absolute; left: 40px; top: 10px; font: 400 16px/24px var(--sans); letter-spacing: -0.005em; color: var(--muted); transition: color 140ms ease; }
.pk-row .vl { position: absolute; right: 18px; top: 10px; font: 400 16px/24px var(--sans); font-variant-numeric: tabular-nums; color: var(--muted); transition: color 140ms ease; }
.pk-row.now .nm, .pk-row.now .vl { color: var(--ink); }
#pk3 .vl { display: none; }   /* pickers: nothing to change here, so no values */
/* v3: grey well = rail (draggable), 1 px line across = reader, still. */
.pk3 { position: relative; height: 220px; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; outline: none; border-radius: 23px; background: var(--rail); transition: background-color 140ms ease; }
.pk3:hover { background: var(--rail-hover); }
.pk3.drag { background: var(--rail-press); cursor: grabbing; }
.pk3:focus-visible { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ink); }
#pk3 { perspective: 520px; }
#pk3 .pk-row { transform-origin: 50% 100%; }
#pk3 .pk-row .pk-tape { position: absolute; left: 0; top: 0; overflow: visible; }
.pk3-line { position: absolute; left: 0; right: 0; top: 132px; height: 1px; margin-top: -0.5px; background: var(--ink); pointer-events: none; }
.pk3[data-kit-hover] { background: var(--rail-hover); }
.pk3.drag[data-kit-hover] { background: var(--rail-press); }
#stage[data-demo] :focus-visible { box-shadow: none; outline: none; }
</style>
</head><body>
<div id="stage" data-w="460" data-h="404">
    <div class="list" id="card3">
      <div class="lhead"><h2 class="ltitle" id="pk3-label">Adjust</h2></div>
      <div class="pk3" id="pk3" tabindex="0" role="listbox" aria-labelledby="pk3-label"><div class="pk-rows" id="pk3-rows"></div><span class="pk3-line" id="pk3-line" aria-hidden="true"></span></div>
    </div>
</div>
<script src="kit.js"></script>
<script>
(() => {
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NS = 'http://www.w3.org/2000/svg';
  const PX = 1.33, STEP = 5, H = 14, FOOT = 30, CX = 80, GAP = STEP * PX - 3, CAP = 76;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const deg = (r) => r * 180 / Math.PI, rad = (d) => d * Math.PI / 180;
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; };
  const sp = (s, t, k, c, dt) => { if (REDUCE) { s.x = t; s.v = 0; return; } s.v += (-k * (s.x - t) - c * s.v) * dt; s.x += s.v * dt; };
  const fmt = (v) => v > 0 ? '+' + v : v < 0 ? '−' + (-v) : '0';
  const KMS = 360, kShape = (u) => Math.sin(2 * Math.PI * u * KMS / 170) * Math.exp(-3.2 * u) * (1 - u);
  const kNorm = (() => { let m = 0; for (let i = 0; i <= 200; i++) m = Math.max(m, Math.abs(kShape(i / 200))); return m; })();
  const RESET_SVG = '<svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.05-4.95"/><path d="M5 4.5v3.5h3.5"/><circle cx="12" cy="12" r="1.75" fill="currentColor" stroke="none"/></svg>';
  let speed = 1;
  // ---- v3: v1's structure in the slider's parts. The grey well is the rail (the slider's pill, upright), the line
  //      across it is the reader (the slider's centre line, turned with the tape) and stays still. Rows sit on the line. ----
  function makePicker3() {
    const ITEMS = [['Exposure', 12], ['Contrast', 0], ['Highlights', -30], ['Shadows', 18], ['Saturation', 0], ['Warmth', 0], ['Sharpness', 0], ['Grain', 40]];
    const N = ITEMS.length, RH = 44, SLOT = 88, MIDY = SLOT + RH;   // the line is the floor under the current row
    const SPV = RH / 4, HV = 14, GAPV = SPV - 3, CAPV = 76, X0 = 14;   // slider dominoes (14 long, 3 thick), four to a row
    const box = document.getElementById('pk3'), pill = box, rowsBox = document.getElementById('pk3-rows'), card2 = document.getElementById('card3');
    const rows = ITEMS.map(([n, v], i) => {
      const el = document.createElement('div'); el.className = 'pk-row'; el.id = 'pk3-' + i; el.setAttribute('role', 'option');
      el.innerHTML = `<span class="nm">${n}</span><span class="vl"></span>`;
      rowsBox.append(el);
      const vl = el.querySelector('.vl'), digits = [...fmt(v)].map((ch) => { const s = document.createElement('span'); s.className = 'd'; s.textContent = ch; vl.append(s); return { el: s, x: 0, v: 0 }; });
      return { el, digits, w: Math.abs(v) / 100, ang: { x: 0, v: 0 } };
    });
    // The tape is the same (four dominoes a row, falling down onto each other), but each row carries its own four:
    // they're drawn in the row's plane, so when the row tips back like the text, its dominoes tip back with it.
    box.append(document.getElementById('pk3-line'));
    const ticks = [];
    rows.forEach((r, ri) => {
      const rs = mk('svg', { class: 'pk-tape', width: 40, height: RH }, r.el);
      for (let j = 0; j < 4; j++) { const ly = SPV / 2 + j * SPV; ticks.push({ y: ri * RH + ly, ly, i: ticks.length, a: 0, v: 0, l: mk('line', { class: 'tk', x1: X0, x2: X0 + HV, y1: ly, y2: ly }, rs) }); }
    });
    const st = { p: { x: 0, v: 0 }, prevP: 0, pv: 0, target: 0, drag: false, moved: false, y0: 0, p0: 0, lastY: 0, lastT: 0, vel: 0, wheel: false,
      nF: 0, peak: 0, settled: true, knock: null, dip: { x: 0, v: 0 }, cdip: { x: 0, v: 0 }, last: 0 };
    const cur = () => clamp(Math.round(st.p.x), 0, N - 1);
    const WCH = [0]; for (let k = 1; k <= N + 1; k++) WCH.push(Math.min(78, WCH[k - 1] + deg(Math.asin(0.6 * Math.cos(rad(WCH[k - 1]))))));
    const lineY = () => st.p.x * RH + RH;                // where the line is, in tape coordinates
    // like the slider: everything the line has reached is down, the selected row's own dominoes included
    const front = () => lineY();
    function targets() {
      const tg = ticks.map(() => 0), L = front();
      let f = -1; for (const t of ticks) if (L - t.y > 0.01) f = t.i;
      if (f < 0) return tg;
      let a = deg(Math.asin(clamp(L - ticks[f].y, 0, GAPV) / HV)); tg[f] = a;
      for (let k = f - 1; k >= 0; k--) { a = Math.min(CAPV, a + deg(Math.asin((GAPV / HV) * Math.cos(rad(a))))); tg[k] = a; }
      return tg;
    }
    box.addEventListener('pointerenter', () => {      // hover: the line taps the first domino still standing below it
      if (REDUCE) return; const L = front(), t = ticks.find((tk) => tk.y - L >= -0.01); if (t) t.v += 90;
    });
    box.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      box.setPointerCapture(e.pointerId); Object.assign(st, { drag: true, moved: false, y0: (e.clientY / KIT.scale), p0: st.p.x, lastY: (e.clientY / KIT.scale), lastT: performance.now(), vel: 0, settled: false });
    });
    box.addEventListener('pointermove', (e) => {
      if (!st.drag) return;
      const dy = (e.clientY / KIT.scale) - st.y0; if (Math.abs(dy) > 3) { st.moved = true; box.classList.add('drag'); }
      if (!st.moved) return;
      let p = st.p0 - dy / RH;
      if (p < 0) p = -Math.sqrt(-p) * 0.5; if (p > N - 1) p = N - 1 + Math.sqrt(p - N + 1) * 0.5;
      st.p.x = p; st.p.v = 0;
      const now = performance.now(); st.vel = 0.6 * st.vel + 0.4 * (-((e.clientY / KIT.scale) - st.lastY) / RH / Math.max(0.008, (now - st.lastT) / 1000)); st.lastY = (e.clientY / KIT.scale); st.lastT = now;
    });
    const up = (e) => {
      if (!st.drag) return; st.drag = false; box.classList.remove('drag');
      if (!st.moved) { const r = box.getBoundingClientRect(); st.target = clamp(Math.floor(((e.clientY / KIT.scale) - (r.top / KIT.scale) - SLOT) / RH + st.p.x), 0, N - 1); st.p.v = 0; }
      else {
        if (performance.now() - st.lastT > 80) st.vel = 0;
        st.target = clamp(Math.round(st.p.x + clamp(st.vel, -14, 14) * 0.17), 0, N - 1);
        st.p.v = clamp(st.vel, -14, 14);                  // a flick carries its speed into the landing
      }
    };
    box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
    let wt = 0;
    box.addEventListener('wheel', (e) => { e.preventDefault(); st.wheel = true; st.settled = false; st.p.x = clamp(st.p.x + e.deltaY / RH * 0.5, -0.3, N - 0.7); st.p.v = 0; clearTimeout(wt); wt = setTimeout(() => { st.wheel = false; st.target = cur(); }, 140); }, { passive: false });
    box.addEventListener('keydown', (e) => {
      let t = null; if (e.key === 'ArrowDown') t = st.target + 1; else if (e.key === 'ArrowUp') t = st.target - 1; else if (e.key === 'Home') t = 0; else if (e.key === 'End') t = N - 1;
      if (t == null) return; e.preventDefault(); st.target = clamp(t, 0, N - 1); st.settled = false;
    });
    function step(dt) {
      if (!st.drag && !st.wheel) sp(st.p, st.target, 170, 20, dt);   // light enough to overshoot a touch after a hard flick
      st.pv += ((st.p.x - st.prevP) / Math.max(dt, 1e-4) - st.pv) * Math.min(1, dt * 30); st.prevP = st.p.x;
      st.peak = Math.max(st.peak * Math.exp(-2 * dt), Math.abs(st.pv));
      const tg = targets();
      for (const t of ticks) {
        const T = tg[t.i];
        if (REDUCE) { t.a = T; t.v = 0; continue; }
        t.v += (-700 * (t.a - T) - 50 * t.v) * dt; t.a += t.v * dt; if (t.a < 0) { t.a = 0; if (t.v < 0) t.v = 0; }
      }
      // every domino that goes over (or is stood up) knocks the pill, harder the faster the tape runs
      const L = front(), nF = ticks.filter((t) => L - t.y > 0.01).length;
      if (nF !== st.nF && !REDUCE) {
        const sp_ = Math.abs(st.pv) * RH;
        st.knock = { ms: 0, dir: Math.sign(nF - st.nF), amp: clamp(0.08 + sp_ * 0.0012, 0.08, 0.6) };
        st.dip.v += 1 + Math.min(4, sp_ * 0.004);
      }
      st.nF = nF;
      if (st.knock) { st.knock.ms += dt * 1000; if (st.knock.ms >= KMS) st.knock = null; }
      // landing: the number takes the weight of its own value; a hard landing shakes the pill
      if (!st.settled && !st.drag && !st.wheel && Math.abs(st.p.x - st.target) < 0.02 && Math.abs(st.p.v) < 0.4) {
        st.settled = true; const r = rows[st.target];
        if (!REDUCE) { r.digits.forEach((d) => { d.v -= (0.8 + r.w * 1.5) * rand(30, 70); }); st.dip.v += 2 + Math.min(6, st.peak * 0.8); }
        st.peak = 0;
      }
      rows.forEach((r) => r.digits.forEach((d) => sp(d, 0, 520, 16, dt)));
      // the wheel (v1's): rows the line has passed tip back on their bottom edge, each resting on the one in front
      { const P = st.p.x, base = Math.floor(P), frac = P - base;
        rows.forEach((r, i) => {
          const k = base - i;
          // standing rows lean with the run (they're dragged along and lag behind it); fallen ones lie on the pile
          let T = k >= 0 ? WCH[k] + (WCH[k + 1] - WCH[k]) * clamp(frac, 0, 1) : clamp(st.pv * 3.5, -14, 14);
          if (REDUCE) { r.ang.x = T; r.ang.v = 0; return; }
          if (k >= 0 && T > r.ang.x + 0.5) {
            // going over: gravity takes it, faster the further it's gone; it lands on the pile and bounces once
            r.ang.v = Math.max(r.ang.v, 40) + 2400 * (0.2 + Math.sin(rad(clamp(r.ang.x, 0, 85)))) * dt; r.ang.x += r.ang.v * dt;
            if (r.ang.x >= T) { r.ang.x = T; if (r.ang.v > 120) { const hit = r.ang.v; r.ang.v *= -0.3; st.dip.v += Math.min(5, hit * 0.006); st.knock = { ms: 0, dir: 1, amp: clamp(hit * 0.0006, 0.1, 0.5) }; } else r.ang.v = 0; }
          } else { r.ang.v += (-420 * (r.ang.x - T) - 22 * r.ang.v) * dt; r.ang.x += r.ang.v * dt; }   // stood back up: a little past, then still
        }); }
      sp(st.dip, 0, 300, 16, dt);
      sp(st.cdip, clamp(st.p.x / (N - 1), 0, 1) * 1.5, 200, 16, dt);   // dominoes fall downward here: the card sinks, it doesn't tip
    }
    function tick(dt) {
      const n = Math.max(1, Math.ceil(dt / (1 / 240)));
      for (let i = 0; i < n; i++) step(dt / n);
      const P = st.p.x, c = cur();
      // standing rows keep their 44 slots; fallen ones pile up above, each taking only cos θ of its height
      const base = Math.floor(P), ys = new Array(N);
      for (let i = Math.max(0, base); i < N; i++) ys[i] = SLOT + (i - P) * RH;
      for (let i = Math.min(N - 1, base) - 1; i >= 0; i--) ys[i] = ys[i + 1] - RH * Math.max(0.2, Math.cos(rad(clamp(rows[i + 1].ang.x, 0, 85))));
      rows.forEach((r, i) => {
        const wa = clamp(r.ang.x, -10, 85);
        r.el.style.transform = `translateY(${ys[i].toFixed(2)}px) rotateX(${wa.toFixed(2)}deg)`;
        r.el.style.opacity = (1 - 0.6 * clamp(wa / 76, 0, 1)).toFixed(3);
        r.el.classList.toggle('now', i === c); r.el.setAttribute('aria-selected', String(i === c));
        r.digits.forEach((d) => { d.el.style.transform = Math.abs(d.x) > 0.05 ? `translateY(${d.x.toFixed(2)}px)` : ''; });
      });
      for (const t of ticks) {
        t.l.classList.toggle('on', t.a > 1);
        t.l.setAttribute('transform', t.a > 0.05 ? `rotate(${t.a.toFixed(2)} ${X0} ${t.ly.toFixed(2)})` : '');
      }
      box.setAttribute('aria-activedescendant', 'pk3-' + c);
      const kn = st.knock ? st.knock.dir * st.knock.amp * kShape(st.knock.ms / KMS) / kNorm : 0;
      pill.style.transform = `translateY(${st.dip.x.toFixed(2)}px) rotate(${(kn * 0.6).toFixed(3)}deg)`;
      card2.style.transform = `translateY(${st.cdip.x.toFixed(2)}px)`;
    }
    return { tick, st, rows, ticks };
  }
  const picker3 = makePicker3();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000) * speed; last = now;
    picker3.tick(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.TAPE = picker3;
})();
</script>
<script>
addEventListener('pointerdown', e => { if (e.isTrusted) delete document.getElementById('stage').dataset.demo; }, true);
KIT.demo(async c => {
  document.getElementById('stage').dataset.demo = '';
  const [tx] = c.at('#pk3', .55, .5), [, top] = c.at('#pk3', .5, 0);
  // wind the well up: the line runs down each row's dominoes, the rows it has passed tip back
  await c.move(tx, top + 186, 900);
  await c.wait(400);
  await c.down();
  await c.wait(120);
  await c.drag(tx, top + 186 - 44 * 2.6, 1500);
  await c.wait(250);
  await c.up();
  await c.wait(900);
  // a flick the other way: the pile stands back up and the landing shakes the well
  await c.down();
  await c.drag(tx, top + 186, 380);
  await c.up();
  await c.wait(1200);
  await c.leave();
}, { tint: '#17181b', reset() {
  const T = window.TAPE; if (!T) return;
  Object.assign(T.st, { target: 0, drag: false, moved: false, wheel: false, settled: true, knock: null, vel: 0, pv: 0, peak: 0, prevP: 0, nF: 0 });
  T.st.p.x = 0; T.st.p.v = 0;
  T.rows.forEach(r => { r.ang.x = r.ang.v = 0; }); T.ticks.forEach(t => { t.a = 0; t.v = 0; });
  document.getElementById('pk3').classList.remove('drag');
} });
</script>
</body></html>
