<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotation Slider · Domino Stacks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root {
  --card: #ffffff; --ink: #17181b; --muted: #62666d; --line: #dfe0e4; --press: #eeeef1;
  --rail: #eeeef1; --rail-hover: #e8e8ec; --rail-press: #e3e3e7; --stop: #b9bcc2; --solid: #1b1c20;
  --card-shadow: 0 22px 44px -14px rgba(26, 28, 36, 0.18), 0 3px 8px rgba(26, 28, 36, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.9);
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
#stage { color: var(--ink); font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
.wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
.list { position: relative; width: 320px; padding: 8px; border-radius: 24px; background: var(--card); box-shadow: var(--card-shadow); will-change: transform; }
.srow { padding: 14px 16px 16px; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.label { font: 400 16px/24px var(--sans); letter-spacing: -0.005em; }
.unit { font: 400 12px/16px var(--mono); color: var(--muted); }

/* Ruler: 272 × 46 pill, no border; value 18 from the left; tape window 160 centred on 136; 1 centre line;
   ticks 6.65 apart (one per day), centred on 23: counted 14 #62666D, the rest 7 #B9BCC2. */
.ruler { position: relative; width: 272px; max-width: 100%; height: 46px; margin-top: 8px; border-radius: 23px; background: var(--rail); touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; outline: none; transition: background-color 140ms ease; }
.ruler.is-hover { background: var(--rail-hover); }
.ruler.is-press, .ruler.is-drag { background: var(--rail-press); }
.ruler.is-drag { cursor: grabbing; }
.ruler:focus-visible { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ink); }
.r-val { position: absolute; left: 18px; top: 13px; font: 400 16px/20px var(--sans); font-variant-numeric: tabular-nums; pointer-events: none; }
.r-val .d { display: inline-block; will-change: transform; }
.r-window { position: absolute; left: 56px; width: 160px; top: 0; height: 46px; overflow: hidden; pointer-events: none;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); }
.r-window svg { position: absolute; left: 0; top: 0; overflow: visible; }
.tk { stroke: var(--stop); stroke-width: 1; stroke-linecap: round; }
.tk.on { stroke: var(--muted); stroke-width: 1.25; }
.bar { stroke: var(--muted); stroke-width: 1.25; stroke-linecap: round; }
.r-ind { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.r-ind .ln { stroke: var(--ink); stroke-width: 1; }
.ruler.is-press .r-ind .ln.taut, .ruler.is-drag .r-ind .ln.taut { stroke-width: 1.25; }
.r-ind .solid { fill: var(--solid); }
.r-rod { position: absolute; left: 136px; top: 0; width: 1px; height: 31px; margin-left: -0.5px; background: var(--ink); transform-origin: 50% 0; pointer-events: none; will-change: transform; }
.r-rod.full { height: 46px; }
.ruler.big .tk { stroke-width: 1.75; }
.tk.stage { stroke: var(--ink); stroke-width: 1.5; transition: stroke 120ms ease; }
.wall { stroke: #a9adb4; stroke-width: 3; stroke-linecap: round; }
.r-rod .r-bob { position: absolute; left: -3.5px; top: 30px; width: 8px; height: 11px; overflow: visible; will-change: transform; }
.r-rod .r-bob path { fill: var(--solid); }
.r-who { position: absolute; right: 8px; top: 7px; display: grid; place-items: center; width: 32px; height: 32px; color: var(--ink); pointer-events: none; }
.r-who svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.r-reset { position: absolute; right: 8px; top: 7px; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 16px; background: none; color: var(--ink); cursor: pointer; transition: background-color 140ms ease; }
.r-reset:hover, .r-reset[data-kit-hover] { background: rgba(23, 24, 27, 0.06); }
.r-reset:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.r-reset svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
html.pointer-mode *:focus, html.pointer-mode *:focus-visible { outline: none !important; }
html.pointer-mode .ruler:focus-visible { box-shadow: none; }
</style>
</head><body>
<div id="stage" data-w="460" data-h="300">
  <div class="wrap">
    <div class="demo" data-mode="stage">
      <div class="list"><div class="srow"><div class="head"><span class="label" id="lc2">Grain</span><span class="unit">%</span></div></div></div>
    </div>
  </div>
</div>
<script src="kit.js"></script>
<script>
(() => {
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NS = 'http://www.w3.org/2000/svg';
  const MIN = 0, MAX = 100, DEF = 40, HOME = 0, STEP = 5, PX = 1.33, MID = 23, LEAN_MAX = Math.asin(6.65 / 14) * 180 / Math.PI, DH = 14, DFOOT = 30, CX = 80, ACX = 136, G = 2600;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; };
  const sp = (s, t, k, c, dt) => { if (REDUCE) { s.x = t; s.v = 0; return; } s.v += (-k * (s.x - t) - c * s.v) * dt; s.x += s.v * dt; };
  let speed = 1;
  // A fallen row of dominoes, as in the real world: the one nearest the standing ones rests its top on the first
  // standing one (asin(gap / height)); each one behind rests on the one in front, which already leans, so it lies
  // further down: phi[k] = phi[k-1] + asin(gap / height · cos phi[k-1]). Far back they lie low (cap 76°).
  const PHI = [0];
  // Dominoes have thickness (3 here), so the gap a top falls across is 6.65 − 3: the row lowers gradually.
  for (let k = 1; k <= 30; k++) PHI.push(Math.min(76, PHI[k - 1] + Math.asin(((1.33 * 5 - 3) / 14) * Math.cos(PHI[k - 1] * Math.PI / 180)) * 180 / Math.PI));
  const SC = () => (window.KIT && KIT.scale) || 1;   // #stage is scaled: pointer px -> design px

  /* ---------- C stepped: stops you run into ----------
     Dominoes every 5, one row; everything passed lies down. Every 20th one (0 · 20 · … · 100) is a stop, and
     looks like the rest. Real physics, not effects:
     · The tape has mass. Your hand (drag, or a trackpad swipe) pulls it through a stiff spring.
     · One gesture may reach one stop. That stop is a wall with some give: the tape hits it, rebounds at about half
       the speed it arrived with, gets pushed back by your hand, hits again (softer), and so on until it rests
       against it. Each hit is its own event, sized by that hit's speed: the stop stands up dark, the fill dims,
       the number jumps, and a beat later (45 ms, the knock travelling) the bar takes a one-sided knock (Week 3's
       press shake, ≤ 1°, 360 ms). Leaning on it gently makes no hit. Pushing again (pull back, shove) hits again.
     · Let go (or the swipe ends): it settles on the stop it reached, or the nearer one. To go on, drag again. */
  function makeStage(demo) {
    const MINs = 0, MAXs = 100, STAGE = 20, MINOR = 5, PXs = 1.33;
    const H = 14, FOOT = 30, GAP = MINOR * PXs - 3, R = GAP / H, CAP = 76, RISE = 19;
    const KH = 900, CH = 55, MIN_HIT = 12, PUSH = 1.4;   // hand spring, damping, hit threshold (units/s), max push past a wall (units)
    const card = demo.querySelector('.list'), row = demo.querySelector('.srow'), labelId = demo.querySelector('.label').id;
    const el = document.createElement('div');
    el.className = 'ruler'; el.tabIndex = 0; el.setAttribute('role', 'slider'); el.setAttribute('aria-labelledby', labelId);
    el.setAttribute('aria-valuemin', MINs); el.setAttribute('aria-valuemax', MAXs);
    el.innerHTML = `<span class="r-val" aria-hidden="true"></span><div class="r-window"><svg height="46"></svg></div>
      <button class="r-reset" type="button" aria-label="Reset grain to 0"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.05-4.95"/><path d="M5 4.5v3.5h3.5"/><circle cx="12" cy="12" r="1.75" fill="currentColor" stroke="none"/></svg></button>`;
    row.append(el);
    const out = el.querySelector('.r-val'), tape = el.querySelector('.r-window svg');
    const rod = document.createElement('span'); rod.className = 'r-rod full'; rod.setAttribute('aria-hidden', 'true'); el.append(rod);
    const deg = (r) => r * 180 / Math.PI, rad = (d) => d * Math.PI / 180;

    const wallEl = mk('line', { class: 'wall', x1: 0, x2: 0, y1: 0, y2: 46 }, tape);   // the invisible wall, behind the dominoes
    wallEl.style.opacity = 0;
    const items = [];
    for (let u = MINs; u <= MAXs; u += MINOR) {
      const x = (u - MINs) * PXs;
      items.push({ u, x, i: items.length, post: u % STAGE === 0, l: mk('line', { class: 'tk', x1: x, x2: x }, tape), a: 0, v: 0, h: { x: H, v: 0 }, until: 0 });
    }
    const st = { wall: 0, wallAt: 60, stop: 2, value: 40, prev: 40, vx: 0, raw: 40, lo: 20, hi: 60, gesture: null, reached: null, pressing: 0,
      target: 40, sv: 0, tapeV: 0, time: 0, tapAt: 0, flash: 0, knocks: [], knock: null,
      pressed: false, moved: false, hover: false, startX: 0, startRaw: 0,
      pill: { x: 0, v: 0 }, cdip: { x: 0, v: 0 }, crot: { x: 0, v: 0 }, prot: { x: 0, v: 0 }, swing: { x: 0, v: 0 }, kick: { x: 0, v: 0 }, lift: { x: 0, v: 0 }, digits: [], dtxt: '' };
    const load = () => (clamp(st.value, MINs, MAXs) - MINs) / (MAXs - MINs);
    const nearestStage = (v) => clamp(Math.round(v / STAGE) * STAGE, MINs, MAXs);
    const postAt = (u) => items.find((i) => i.post && i.u === u);
    const KNOCK_MS = 360, knockShape = (u) => Math.sin(2 * Math.PI * u * KNOCK_MS / 170) * Math.exp(-3.2 * u) * (1 - u);
    const knockNorm = (() => { let m = 0; for (let i = 0; i <= 200; i++) m = Math.max(m, Math.abs(knockShape(i / 200))); return m; })();

    function setDigits(text) {
      if (st.dtxt === text) return;
      const old = st.digits; out.textContent = '';
      st.digits = [...text].map((ch, i) => { const s = document.createElement('span'); s.className = 'd'; s.textContent = ch; out.append(s); return { el: s, x: old[i] ? old[i].x : 0, v: old[i] ? old[i].v : 0 }; });
      st.dtxt = text;
    }

    // One hit against a stop, at speed v (units/s). k: 0 (a touch) … 1 (a slam, ~400 units/s).
    // A hit: the ticks stay put and only the wall shows, a grey line under them, a little heavier than the centre
    // line (it stays while you lean on it). What moves is the container and the line that hit: the bar takes a
    // one-sided knock (≈0.35° … 1.1°), the card tips toward the hit (≈0.8° … 3°) and dips, and the centre line is
    // knocked back off the wall, the way it came, and swings (never through the wall). The fill dims, the number jumps. All by hit speed.
    function impact(P, dir, v) {
      const k = clamp((v - MIN_HIT) / 400, 0, 1);
      st.wallAt = P; st.wall = 1; st.wallDir = dir;
      st.flash = Math.max(st.flash, 0.4 + 0.6 * k);
      if (REDUCE) return;
      st.digits.forEach((d) => { d.v -= rand(40, 90) * (0.35 + 0.65 * k); });
      st.pill.v += 2 + 6 * k;
      st.knocks.push({ at: st.time + 0.03, dir, amp: 0.15 + 0.4 * k });      // the bar: a small one-sided knock
      st.crot.v += dir * (7 + 23 * k); st.cdip.v += 5 + 15 * k;             // the card: tips toward the hit a little and dips
      // the line is what runs into the wall: it can't go through, so it's knocked back the way it came
      // (≈10° nudged … 18° slammed) and keeps swinging, bouncing off the wall each time it comes back (75%)
      st.swing.v = dir * (140 + 200 * k); st.wallDir = dir;
    }

    function targets() {
      const tg = items.map(() => 0);
      const fallen = items.filter((i) => (st.value - i.u) * PXs > 0.01);
      let prev = null;
      for (let k = fallen.length - 1; k >= 0; k--) {
        const it = fallen[k];
        const a = k === fallen.length - 1 ? deg(Math.asin(clamp((st.value - it.u) * PXs, 0, GAP) / H))
          : Math.min(CAP, prev + deg(Math.asin(R * Math.cos(rad(prev)))));
        tg[it.i] = a; prev = a;
      }
      if (st.gesture && st.reached != null && Math.abs(st.value - st.reached) < 0.5) { const p = postAt(st.reached); if (p && tg[p.i] === 0) tg[p.i] = 4; }
      return tg;
    }

    function physics(dt) {
      // hand → tape through a stiff spring; walls at this gesture's two stops. A finger pushing past a wall can only
      // push so hard (the pull saturates, light damping), so the tape really bounces off before it's pressed back.
      const past = st.raw > st.hi || st.raw < st.lo;
      const pull = past ? KH * clamp(st.raw - st.value, -PUSH, PUSH) : KH * (st.raw - st.value);
      st.vx += (pull - (past ? 6 : CH) * st.vx) * dt;
      st.value += st.vx * dt;
      for (const [P, dir] of [[st.hi, 1], [st.lo, -1]]) {
        if ((dir > 0 && st.value > P) || (dir < 0 && st.value < P)) {
          st.value = P;
          const v = dir * st.vx;                              // speed into the wall
          if (v > 0) {
            st.vx = 0;                                        // the tape stops dead: the ticks don't bounce, the bar takes it
            if (P !== st.gStart && v > MIN_HIT) { if (st.reached !== P) st.stop = P / STAGE; st.reached = P; impact(P, dir, v); }
            else if (P !== st.gStart && st.reached == null) { st.reached = P; st.stop = P / STAGE; }
          }
        }
      }
    }

    function step(dt) {
      st.time += dt;
      if (st.gesture && !REDUCE) physics(dt);
      else if (st.gesture) { st.value = clamp(st.raw, st.lo, st.hi); if (st.value === st.hi && st.hi !== st.gStart) { st.reached = st.hi; st.stop = st.hi / STAGE; } }
      const v = (st.value - st.prev) * PXs / Math.max(dt, 1e-4); st.prev = st.value;
      st.tapeV += (v - st.tapeV) * Math.min(1, dt * 30);
      st.flash *= Math.exp(-dt / 0.2);
      for (let i = st.knocks.length - 1; i >= 0; i--) if (st.time >= st.knocks[i].at) { const k = st.knocks.splice(i, 1)[0]; if (!st.knock || k.amp > st.knock.amp * (1 - st.knock.ms / KNOCK_MS)) st.knock = { ms: 0, dir: k.dir, amp: k.amp }; }
      if (st.knock) { st.knock.ms += dt * 1000; if (st.knock.ms >= KNOCK_MS) st.knock = null; }
      if (st.tapAt && st.time >= st.tapAt) { st.tapAt = 0; const o = items.find((i) => !i.post && i.u >= st.value - 0.01 && i.a < 1); if (o) o.v += 70; }
      const tg = targets();
      for (const it of items) {
        if (it.post) { const up = st.time < it.until; sp(it.h, up ? RISE : H, 500, 22, dt); }
        const T = tg[it.i];
        if (REDUCE) { it.a = T; it.v = 0; continue; }
        if (it.post && T === 0 || it.post && T === 4) { it.v += (-500 * (it.a - T) - 18 * it.v) * dt; it.a += it.v * dt; continue; }   // a standing stop rocks back and forth
        it.v += (-700 * (it.a - T) - 50 * it.v) * dt; it.a += it.v * dt;
        if (it.a < 0) { it.a = 0; if (it.v < 0) it.v = 0; }
      }
      for (const d of st.digits) sp(d, 0, 520, 16, dt);
      const L = load();
      // as in the continuous one, fallen dominoes move the weight right: the bar tips right (1.5° at 100, same as the
      // continuous one), the card follows at half; a trace of sinking stays
      sp(st.pill, L * 0.5, 260, 18, dt);
      sp(st.cdip, L * 0.4, 200, 16, dt);
      sp(st.prot, 1.5 * L, 120, 14, dt);
      sp(st.crot, st.prot.x * 0.5, 290, 11, dt);
      if (!REDUCE) {
        const drag = clamp(st.tapeV * 0.022, -9, 9);
        const damp = st.gesture || Math.abs(st.tapeV) > 5 || Math.abs(st.swing.x) > 1 ? 2.2 : 14;   // swings on, then settles
        st.swing.v += (-90 * (st.swing.x - drag) - damp * st.swing.v) * dt; st.swing.x = clamp(st.swing.x + st.swing.v * dt, -18, 18);
        // the line's foot can't pass the wall it's pressed against: it bounces off it
        if (st.gesture && st.reached != null && st.wallDir && st.wallDir * st.swing.x < 0) { st.swing.x = 0; if (st.wallDir * st.swing.v < 0) st.swing.v = -st.swing.v * 0.75; }
      }
      sp(st.lift, st.hover && !st.gesture ? -5 : 0, 420, 28, dt);
      // the wall fades unless you're leaning on it
      const leaning = st.gesture && st.reached != null && st.wallAt === st.reached && Math.abs(st.value - st.reached) < 1.5;
      st.wall = leaning ? Math.max(st.wall, 0.7) : st.wall * Math.exp(-dt / 0.22);
    }

    function render() {
      tape.style.transform = `translateX(${(CX - (st.value - MINs) * PXs).toFixed(2)}px)`;
      setDigits(String(st.stop * STAGE));
      for (const d of st.digits) d.el.style.transform = Math.abs(d.x) > 0.05 ? `translateY(${d.x.toFixed(2)}px)` : '';
      el.setAttribute('aria-valuenow', st.stop * STAGE); el.setAttribute('aria-valuetext', st.stop * STAGE + '%');
      for (const it of items) {
        it.l.setAttribute('y1', (FOOT - it.h.x).toFixed(2)); it.l.setAttribute('y2', FOOT);
        it.l.classList.toggle('on', it.a > 1 && !(it.post && it.a < 12));
        it.l.style.transform = Math.abs(it.a) > 0.05 ? `rotate(${it.a.toFixed(2)}deg)` : '';
        it.l.style.transformOrigin = `${it.x}px ${FOOT}px`;
      }
      wallEl.setAttribute('x1', (st.wallAt - MINs) * PXs); wallEl.setAttribute('x2', (st.wallAt - MINs) * PXs);
      wallEl.style.opacity = 0;   // no visible wall: the swing says it
      rod.style.height = (46 + st.lift.x).toFixed(2) + 'px';
      const lineA = st.swing.x;
      rod.style.transform = Math.abs(lineA) > 0.01 ? `rotate(${lineA.toFixed(3)}deg)` : '';
      el.classList.toggle('is-hover', st.hover && !st.pressed && !st.gesture);
      el.classList.toggle('is-press', st.pressed && !st.moved);
      el.classList.toggle('is-drag', st.gesture === 'drag' && st.moved);
      const kn = st.knock ? st.knock.dir * st.knock.amp * knockShape(st.knock.ms / KNOCK_MS) / knockNorm : 0;
      // tilt about the centre, then the one-sided knock about the far end
      const half = (el.offsetWidth || 272) / 2, pv = st.knock && st.knock.dir > 0 ? -half : half;
      el.style.transformOrigin = '50% 50%';
      el.style.transform = `translateY(${st.pill.x.toFixed(2)}px) rotate(${st.prot.x.toFixed(3)}deg) translateX(${pv}px) rotate(${kn.toFixed(3)}deg) translateX(${-pv}px)`;
      el.style.boxShadow = st.flash > 0.01 ? `inset 0 0 0 999px rgba(23, 24, 27, ${(0.09 * st.flash).toFixed(3)})` : '';
      card.style.transform = Math.abs(st.cdip.x) > 0.01 || Math.abs(st.crot.x) > 0.005 ? `translateY(${st.cdip.x.toFixed(2)}px) rotate(${st.crot.x.toFixed(3)}deg)` : '';
    }

    function begin(kind) {
      st.gStart = nearestStage(st.value);
      st.lo = Math.max(MINs, st.gStart - STAGE); st.hi = Math.min(MAXs, st.gStart + STAGE);
      Object.assign(st, { gesture: kind, raw: st.value, startRaw: st.value, vx: 0, reached: null, target: null });
    }
    function end() {
      if (!st.gesture) return;
      const n = (st.reached != null ? st.reached : nearestStage(st.value)) / STAGE;
      st.gesture = null; st.reached = null; st.stop = n; st.target = n * STAGE; st.sv = st.vx;
    }
    function goStop(i, dir) {   // keys / reset: arrive at the stop with a light hit
      const n = clamp(i, 0, (MAXs - MINs) / STAGE);
      if (n !== st.stop) { st.stop = n; impact(n * STAGE, dir, 120); }
      st.target = n * STAGE;
    }

    el.addEventListener('pointerenter', () => { st.hover = true; if (!st.gesture && !REDUCE) { st.swing.v -= 10; st.tapAt = st.time + 0.09; } });
    el.addEventListener('pointerleave', () => { st.hover = false; });
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || e.target.closest('.r-reset')) return;
      el.setPointerCapture(e.pointerId);
      begin('drag'); st.pressed = true; st.moved = false; st.startX = e.clientX;
      if (!REDUCE) st.pill.v += 4;
    });
    el.addEventListener('pointermove', (e) => {
      if (st.gesture !== 'drag') return;
      if (!st.moved && Math.abs(e.clientX - st.startX) > 3) { st.moved = true; st.pressed = false; }
      st.raw = st.startRaw - (e.clientX - st.startX) / SC() / PXs;
    });
    const up = () => { if (st.gesture !== 'drag') return; st.pressed = false; st.moved = false; end(); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);

    // Trackpad: a swipe (with its momentum) is one push of the hand. A new swipe is told from the fading tail by its
    // deltas rising again, a change of direction, or a 120 ms gap; the swipe ends 160 ms after the last event.
    let wTimer = 0, wT = 0, peak = 0, faded = false, lastAbs = 0, wDir = 0;
    el.addEventListener('wheel', (e) => {
      const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; e.preventDefault();
      if (!d) return;
      const now = performance.now(), gap = now - wT, abs = Math.abs(d); wT = now;
      const fresh = st.gesture !== 'wheel' || gap > 120 || Math.sign(d) !== wDir || (faded && abs > lastAbs * 1.5 && abs > 4);
      if (fresh) { if (st.gesture === 'wheel') end(); begin('wheel'); peak = abs; faded = false; wDir = Math.sign(d); }
      peak = Math.max(peak, abs); if (abs < peak * 0.5) faded = true; lastAbs = abs;
      st.raw += d / PXs * 0.7;
      clearTimeout(wTimer); wTimer = setTimeout(() => { if (st.gesture === 'wheel') end(); }, 160);
    }, { passive: false });
    el.addEventListener('keydown', (e) => {
      const k = e.key; let i = null;
      if (k === 'ArrowRight' || k === 'ArrowUp' || k === 'PageUp') i = st.stop + 1;
      else if (k === 'ArrowLeft' || k === 'ArrowDown' || k === 'PageDown') i = st.stop - 1;
      else if (k === 'Home') i = 0; else if (k === 'End') i = (MAXs - MINs) / STAGE;
      if (i == null) return; e.preventDefault(); goStop(i, i > st.stop ? 1 : -1);
    });
    el.querySelector('.r-reset').addEventListener('click', () => goStop(0, -1));

    function reset() {
      Object.assign(st, { stop: 2, value: 40, prev: 40, raw: 40, vx: 0, target: 40, sv: 0, gesture: null, reached: null, knock: null, knocks: [], flash: 0 });
      st.kick.x = st.kick.v = 0; st.crot.x = st.crot.v = 0;
      const tg = targets(); items.forEach((it, i) => { it.a = tg[i]; it.v = 0; it.h.x = H; it.h.v = 0; it.until = 0; });
      st.pill.x = load() * 0.5; st.cdip.x = load() * 0.4; st.pill.v = st.cdip.v = 0; st.swing.x = st.swing.v = 0;
      st.prot.x = 1.5 * load(); st.crot.x = st.prot.x * 0.5; st.prot.v = st.crot.v = 0;
    }
    reset();

    function tick(dt) {
      if (!st.gesture && st.target != null) {
        if (REDUCE) st.value = st.target;
        else { st.sv += (-500 * (st.value - st.target) - 40 * st.sv) * dt; st.value += st.sv * dt; if (Math.abs(st.value - st.target) < 0.01 && Math.abs(st.sv) < 0.3) { st.value = st.target; st.sv = 0; } }
      }
      const n = Math.max(1, Math.ceil(dt / (1 / 480)));
      for (let i = 0; i < n; i++) step(dt / n);
      render();
    }
    return { tick, reset };
  }

  const ruler = makeStage(document.querySelector('.demo'));
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000) * speed; last = now;
    ruler.tick(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__rot = { reset() { ruler.reset(); } };
  const root = document.documentElement;
  addEventListener('pointerdown', () => root.classList.add('pointer-mode'), true);
  addEventListener('keydown', (e) => { if (!e.metaKey && !e.ctrlKey && !e.altKey) root.classList.remove('pointer-mode'); }, true);
})();
</script>
<script>
KIT.demo(async c => {
  const r = c.el('.ruler');
  // one pull reaches one stop: the tape slams into it, the line is knocked back and swings
  const [ax, ay] = c.at(r, 0.6, 0.5);
  await c.move(ax + 10, ay + 40, 700);
  await c.move(ax, ay, 450);
  await c.wait(400);
  await c.down();
  await c.wait(100);
  await c.drag(ax - 60, ay, 520);
  await c.wait(700);
  await c.up();
  await c.wait(900);
  // a second pull, the other way, back to the stop it came from
  await c.down();
  await c.wait(100);
  await c.drag(ax + 50, ay, 480);
  await c.wait(600);
  await c.up();
  await c.wait(1000);
  await c.leave();
}, { tint: '#1b1c20', reset() { window.__rot.reset(); } });
</script>
