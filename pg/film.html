<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film</title>
<style>
#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#1a1a1a}
</style>
</head><body>
<div id="stage" data-w="1280" data-h="720">
  <video src="film.mp4" poster="film-poster.jpg" autoplay muted loop playsinline preload="auto" aria-label="Short film, three scenes"></video>
</div>
<script src="kit.js"></script>
<script>
// full bleed: the film always covers the whole card, whatever its shape
(function(){
  const st=document.getElementById('stage'), v=st.querySelector('video');
  function cover(){ const s=Math.max(innerWidth/1280, innerHeight/720); st.style.left=Math.round((innerWidth-1280*s)/2)+'px'; st.style.top=Math.round((innerHeight-720*s)/2)+'px'; st.style.transform=`scale(${s})`; }
  addEventListener('resize', cover); cover();
  v.play && v.play().catch(()=>{});
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { v.removeAttribute('autoplay'); v.pause(); }
})();
</script>
</body></html>
