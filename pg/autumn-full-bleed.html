<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autumn, Full Bleed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  :root {
    --page: #E9E6E0;
    --ui: "Newsreader", "Iowan Old Style", Georgia, serif;
    --mono: "Newsreader", "Iowan Old Style", Georgia, serif;
    --out: cubic-bezier(.22, .8, .3, 1);
    --in: cubic-bezier(.5, 0, .75, .3);
    color-scheme: light;
  }
  #stage, #stage * { box-sizing: border-box; }
  #stage { font-family: var(--ui); }

  /* full-bleed: the leaf runs under the type, so each side pairs colors that keep the type readable on both */
  .sleeve[data-side="red"]   { --sky: #62331B; --leaf: #C55129; --ink: #F9EAD6; --blend: normal; --tints: #FF9A5C,#FFB347,#FFBE55; }
  .sleeve[data-side="gold"]  { --sky: #BF9B6B; --leaf: #F1CC82; --ink: #2E1806; --blend: normal; --tints: #685000,#6E5200,#735A08; }
  .sleeve[data-side="brown"] { --sky: #605407; --leaf: #391E03; --ink: #E7DACB; --blend: normal; --tints: #EDE6C0,#D6CB8F,#C9BC74; }
  .sleeve { position: absolute; left: 30px; top: 40px; width: 400px; height: 600px; overflow: hidden; border-radius: 12px;
    background: var(--sky); color: var(--ink); isolation: isolate;
    box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 20px 50px -24px rgba(20, 30, 40, .45);
    transition: background-color .3s ease, color .3s ease; }

  /* ---------- the giant leaf ---------- */
  /* every leaf sits in the same place: one large full-bleed shape behind everything */
  .giant { position: absolute; z-index: 0; left: -20%; top: 6%; width: 130%; height: 104%; pointer-events: none;
    transition: left .55s var(--out), top .55s var(--out), width .55s var(--out), height .55s var(--out); }
  .drift { position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity .4s ease; }
  .drift span { position: absolute; left: 0; top: 0; font-style: italic; line-height: 1; will-change: transform; mix-blend-mode: var(--blend); }

  .giant svg { width: 100%; height: 100%; display: block; fill: var(--leaf); transition: fill .3s ease; }

  /* everything printed over the leaf */
  .print { position: relative; z-index: 1; mix-blend-mode: var(--blend); height: 100%; padding: 22px 22px 18px;
    display: grid; grid-template-rows: auto minmax(0, 1fr); transition: opacity .2s ease; }
  /* two columns borrowed from a contents page: a big numeral on the left, the list on the right */
  .head, .body { display: grid; grid-template-columns: 40% 1fr; column-gap: 10px; }
  /* one word as the masthead: large italic, top-left, the visual anchor the list hangs from */
  .title { grid-column: 1 / -1; margin: 0; font-style: italic; font-weight: 400; font-size: 60px; line-height: 1; letter-spacing: -.015em; }
  .tip { font-size: 13px; line-height: 20px; opacity: .85; }
  .body { align-items: center; min-height: 0; padding-block: 16px 0; }
  .body > .sides { max-height: 100%; overflow-y: auto; scrollbar-width: none; padding-block: 8px; }
  .body > .sides::-webkit-scrollbar { display: none; }
  /* the hovered leaf's Latin name, genus over species, set large in italic */
  .big { align-self: center; font-style: italic; font-weight: 400; font-size: 24px; line-height: 28px; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .big span { display: block; }
  .list { list-style: none; margin: 0; padding: 0; }

  .row { display: grid; grid-template-columns: 26px 1fr 14px; align-items: baseline; column-gap: 10px; width: 100%;
    border: 0; background: none; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
    -webkit-tap-highlight-color: transparent; }
  .row:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  .num { font-size: 13px; font-variant-numeric: oldstyle-nums tabular-nums; opacity: .8; }
  .name { font-weight: 400; font-size: 16px; line-height: 28px; min-width: 0;
    overflow: hidden; white-space: nowrap; }
  .meta { font-style: italic; font-size: 13px; opacity: .85; }

  /* side rows */
  .side { align-items: center; }
  .side .num { font-style: italic; }
  /* parent rows outrank children: larger, full weight */
  .side { min-height: 44px; }
  .side .name { font-style: italic; font-size: 21px; line-height: 28px; }
  .side .num { font-size: 15px; }
  .sides > li + li { margin-top: 6px; }
  .tog { position: relative; width: 14px; height: 14px; align-self: center; }
  .tog i { position: absolute; right: 3px; top: 6.25px; width: 7px; height: 1.5px; background: currentColor; transform-origin: 100% 50%;
    transition: transform .36s var(--out), width .36s var(--out), right .36s var(--out); }
  .tog i:first-child { transform: rotate(42deg); }
  .tog i:last-child { transform: rotate(-42deg); }
  .side:hover .tog i:first-child, .side[data-kit-hover] .tog i:first-child { transform: translateX(2px) rotate(52deg); }
  .side:hover .tog i:last-child, .side[data-kit-hover] .tog i:last-child { transform: translateX(2px) rotate(-52deg); }
  .side[aria-expanded="true"] .tog i { width: 12px; right: 1px; transform: rotate(0); }
  .side[aria-expanded="true"]:hover .tog i, .side[aria-expanded="true"][data-kit-hover] .tog i { width: 8px; right: 3px; }
  .side:active .tog { transform: scale(.8); }

  /* leaf rows: a rule draws under the hovered name; the others step back */
  .leafrow .t { display: inline-block; position: relative; }
  .w { display: inline-block; white-space: nowrap; }
  /* while a gust carries the letters off, the underline and chevrons go with them */
  .gusting .leafrow .t::after { transform: scaleX(0) !important; transition-duration: .12s !important; }
  .gusting .leafrow .chev { opacity: 0 !important; }
  .ch { display: inline-block; white-space: pre; transform-origin: 50% 0; color: var(--ink); transition: color .3s ease; }   /* each letter reads the theme color itself, so none is left behind on a theme switch */
  .leafrow .num { font-size: 12px; }
  .leafrow .t::after { content: ""; position: absolute; left: 0; right: 0; bottom: 5px; height: 1px; background: currentColor;
    transform: scaleX(0); transform-origin: 0 50%; transition: transform .14s var(--in); }
  .leafrow:hover .t::after, .leafrow[data-kit-hover] .t::after, .leafrow:focus-visible .t::after { transform: scaleX(1); transition: transform .3s var(--out); }
  .leafrow .name, .leafrow .num { transition: opacity .2s ease; }
  .kids:has(.leafrow:hover) .leafrow:not(:hover) :is(.name, .num), .kids:has(.leafrow[data-kit-hover]) .leafrow:not([data-kit-hover]) :is(.name, .num) { opacity: .45; }
  .leafrow:active .t { transform: translateY(1px); }
  .leafrow .chev { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.5; align-self: center;
    opacity: 0; transform: translateX(-4px); transition: opacity .14s var(--in), transform .14s var(--in); }
  .leafrow:hover .chev, .leafrow[data-kit-hover] .chev, .leafrow:focus-visible .chev { opacity: 1; transform: none; transition: opacity .25s ease, transform .3s var(--out); }

  /* accordion: names rise from a mask on open, sink on close */
  .kwrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .56s cubic-bezier(.45,0,.25,1); }
  .kwrap.open { grid-template-rows: 1fr; transition: grid-template-rows .42s var(--out); }
  .kids { min-height: 0; overflow: hidden; }
  .kids > li:last-child { padding-bottom: 8px; }
  .rise .t { animation: rise .42s var(--out) both; animation-delay: calc(var(--i) * 45ms + 60ms); }
  .rise .num { animation: fade .3s ease both; animation-delay: calc(var(--i) * 45ms + 120ms); }
  .sink .t { animation: sink .15s var(--in) both; animation-delay: calc(var(--r) * 28ms); }
  @keyframes rise { from { transform: translateY(110%); } to { transform: none; } }
  @keyframes sink { to { transform: translateY(110%); } }
  @keyframes fade { from { opacity: 0; } }

  /* ---------- detail: the giant leaf comes fully into frame ---------- */
  /* detail uses the list's own layout: same leaf, the leaf's name takes the masthead, one short note in the list column */
  .detail { position: relative; z-index: 1; display: none; height: 100%; mix-blend-mode: var(--blend); padding: 14px 22px 26px; }
  .sleeve.detail-on .detail { display: grid; grid-template-rows: auto auto 1fr auto; }
  .sleeve.detail-on .print { display: none; }
  .back { justify-self: start; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 0; color: inherit;
    font: 400 14px/20px var(--ui); letter-spacing: .02em; opacity: .8; cursor: pointer; transition: opacity .2s ease; }
  .back:hover, .back[data-kit-hover] { opacity: 1; }
  .back .chev { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.5; transform: rotate(180deg); transition: transform .3s var(--out); }
  .back:hover .chev, .back[data-kit-hover] .chev { transform: rotate(180deg) translateX(3px); }
  .back:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  .d-name { margin: 6px 0 0; font-style: italic; font-weight: 400; font-size: 52px; line-height: 1.02; letter-spacing: -.015em; text-wrap: balance; max-width: 9ch; }
  .d-fact { grid-row: 4; justify-self: end; width: 60%; margin: 0; font-size: 15px; line-height: 22px; text-wrap: pretty; }
  .detail.show .d-name { animation: fade .4s ease both; }
  .detail.show .d-fact { animation: fade .4s ease .12s both; }
  .detail.show .back { animation: fade .3s ease both; }

  @media (max-width: 520px) {
    .big { font-size: 20px; line-height: 24px; }
  }
  /* during a gust, outgoing letters may leave their box, and the outgoing page stays on screen until they're gone */
  .kwrap.gusting .kids { overflow: visible; }
  .sleeve.detail-on .print.leaving, .sleeve .detail.leaving { display: grid; position: absolute; inset: 0; pointer-events: none; }
  .sleeve .detail.leaving { grid-template-rows: auto auto 1fr auto; }
  #stage[data-demo] :focus-visible { outline: none; }
  @media (prefers-reduced-motion: reduce) { #stage *, #stage *::before, #stage *::after { transition: none !important; animation: none !important; } }
</style>

/* Each leaf gets its own tilt so they sit like leaves dropped on paper, not specimens pinned upright */
const TILT = { maple: -18, sweetgum: 24, sassafras: -8, ginkgo: -28, birch: 34, aspen: 12, tulip: -16, beech: -14, oak: 26, chestnut: -36 };
const BOX = {};
function tiltBox(id) {
  if (BOX[id]) return BOX[id];
  const s = P[id], a = (TILT[id] || 0) * Math.PI / 180, cx = s.w / 2, cy = s.h / 2, c = Math.cos(a), n = Math.sin(a);

  for (let i = 0; i + 1 < v.length; i += 2) {
    const dx = v[i] - cx, dy = v[i + 1] - cy, x = cx + dx * c - dy * n, y = cy + dx * n + dy * c;
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);

  const m = Math.max(x1 - x0, y1 - y0) * 0.04;

    const gustW = (70 + 45 * Math.sin(t * .9 + f.n) + 25 * Math.sin(t * 2.3 + f.n * 2)) * boost;   /* turbulence */
    const vx = wx * gustW + swing * f.glide * (1 - Math.abs(wx) * .3);
    const vy = f.fall * (.45 + .9 * (1 - turn)) + wy * gustW * .6;
    f.x += vx * dt; f.y += vy * dt;
    const dx = f.x - ptr.x, dy = f.y - ptr.y, d = Math.hypot(dx, dy);                        /* the pointer is a hand brushing them aside */
    if (d < 80) { const k = (1 - d / 80) * 900 * dt; f.px += dx / (d || 1) * k; f.py += dy / (d || 1) * k; }
    f.px *= Math.pow(.04, dt); f.py *= Math.pow(.04, dt); f.x += f.px * dt; f.y += f.py * dt;
    f.rot += f.tumble * boost * dt;
    const tilt = swing * 38 + Math.atan2(vy, vx) * 0;                                          /* leans into each swing */
    const fl = Math.cos(t * f.flip * boost + f.n);                                             /* turning over in the air */
    f.el.style.transform = `translate(${f.x.toFixed(1)}px, ${f.y.toFixed(1)}px) rotate(${(f.rot + tilt).toFixed(1)}deg) scaleX(${(Math.sign(fl) * Math.max(.15, Math.abs(fl))).toFixed(2)})`;
    if (f.x < -60 || f.x > W + 60 || f.y > H + 40 || f.y < -80) spawn(f, false);
  });
}
requestAnimationFrame(flyTick);
/* a breeze crosses the whole card every few seconds: every visible letter leans downwind as the front reaches it,
   upwind side first, so you can watch it travel across the page. Big type leans only a little. */
function idle() {
  setTimeout(idle, rnd(6000, 10000));
  if (reduce || document.hidden || busy || !windy()) return;          /* still while a group is open; windy on the cover and on a leaf's page */
  const box = sleeve.getBoundingClientRect(), dx = Math.cos(WIND), dy = Math.sin(WIND);
  const chs = [...(current ? detail : print).querySelectorAll('.ch')]
    .filter(c => c.offsetParent && !c.closest('.kwrap:not(.open)') && c.textContent.trim() && !c.getAnimations().length);
  const at = chs.map(c => { const r = c.getBoundingClientRect(); return (r.left + r.width / 2 - box.left) * dx + (r.top + r.height / 2 - box.top) * dy; });
  const lo = Math.min(...at), span = Math.max(...at) - lo || 1, gust = rnd(.8, 1.2);
  leafGust(1300 * .5 - 150, gust * .7);
  /* one to three letters ride the gust a little further: from the middle of longer words, so every word still reads */
  const riders = new Set(chs.filter(c => { const w = [...c.parentNode.children]; const k = w.indexOf(c);
      return w.length >= 5 && k > 0 && k < w.length - 1 && /[a-z]/.test(c.textContent) && parseFloat(getComputedStyle(c).fontSize) <= 30; })
    .sort(() => Math.random() - .5).slice(0, Math.random() < .6 ? 1 : 2));   /* one, sometimes two: the sentence stays readable */
  chs.forEach((c, i) => {
    if (riders.has(c)) {
      const d = rnd(9, 15) * gust, r = rnd(50, 110) * WX, x = dx * d, y = dy * d * .5 - rnd(5, 8);
      /* a letter only changes color when the wind actually lifts it: it takes one of the group's tints while airborne */
      const tl = getComputedStyle(sleeve).getPropertyValue('--tints').split(',').map(v => v.trim()).filter(Boolean), tc = { color: tl[(Math.random() * tl.length) | 0] };
      c.animate([{ transform: 'none' }, { transform: `translate(${(x * .5).toFixed(1)}px, ${(y * .6).toFixed(1)}px) rotate(${(r * .4).toFixed(0)}deg)`, ...tc, offset: .2 },
        { transform: `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${r.toFixed(0)}deg)`, ...tc, offset: .4 },
        { transform: `translate(${(x * 1.1).toFixed(1)}px, ${(y * .85).toFixed(1)}px) rotate(${(r * .7).toFixed(0)}deg)`, ...tc, offset: .58 },   /* hangs in the air */
        { transform: `translate(${(x * .35).toFixed(1)}px, ${(y * .3).toFixed(1)}px) rotate(${(-r * .15).toFixed(0)}deg)`, ...tc, offset: .82 }, { transform: 'none' }],
        { duration: rnd(2400, 2900), delay: (at[i] - lo) / span * 1300, easing: 'ease-in-out' });
      /* on its way out it knocks into the letters downwind of it; they only swing, they keep their color */
      const sib = [...c.parentNode.children], k = sib.indexOf(c), hit = WX > 0 ? sib.slice(k + 1, k + 3) : sib.slice(Math.max(0, k - 2), k).reverse();
      hit.forEach((h, j) => setTimeout(() => flutter(h, true, .7 - j * .25, false), (at[i] - lo) / span * 1300 + 500 + j * 120));
      return;
    }
    const big = parseFloat(getComputedStyle(c).fontSize) > 30, a = (big ? rnd(3, 5) : rnd(9, 15)) * WX * gust, d = (big ? 1.5 : 3) * gust;
    c.animate([{ transform: 'none' }, { transform: `translate(${(dx * d).toFixed(1)}px, ${(dy * d * .5).toFixed(1)}px) rotate(${a.toFixed(1)}deg)`, offset: .3 },
      { transform: `rotate(${(-a * .4).toFixed(1)}deg)`, offset: .58 }, { transform: `rotate(${(a * .15).toFixed(1)}deg)`, offset: .8 }, { transform: 'none' }],
      { duration: rnd(1200, 1500), delay: (at[i] - lo) / span * 1300 + rnd(0, 90), easing: 'ease-in-out' });
  });
}

render(); showLeaf('maple'); setTimeout(idle, 1200);
</script>
<script>
addEventListener('pointerdown', e => { if (e.isTrusted) delete document.getElementById('stage').dataset.demo; }, true);
KIT.demo(async c => {
  document.getElementById('stage').dataset.demo = '';   // synthetic clicks would read as keyboard focus
  // open the Golden group: the theme turns and the names blow in
  await c.move(...c.at('[data-side-id="gold"] .name', .5, .5), 800);
  await c.wait(300);
  await c.click();
  await c.wait(1100);
  // run down the leaves: the big leaf behind cuts to each one
  const row = id => c.at(`[data-leaf="${id}"] .t`, .4, .5);
  await c.move(...row('birch'), 450); await c.wait(600);
  await c.move(...row('aspen'), 350); await c.wait(600);
  await c.move(...row('tulip'), 350); await c.wait(700);
  // open its page
  await c.click();
  await c.wait(1800);
  await c.move(...c.at('.back', .5, .5), 650);
  await c.wait(250);
  await c.click();
  await c.wait(900);
  await c.leave();
  document.activeElement && document.activeElement.blur && document.activeElement.blur();
}, { tint: '#C55129', reset() {
  busy = false; queued = null; current = null;
  sleeve.classList.remove('detail-on', 'gusting'); detail.classList.remove('leaving'); print.classList.remove('leaving'); detail.innerHTML = '';
  Object.keys(open).forEach(k => open[k] = false);
  sleeve.getAnimations({ subtree: true }).forEach(a => { try { a.cancel(); } catch (e) {} });
  render(); sleeve.dataset.side = 'red'; shown = null; showLeaf('maple');
} });
</script>
