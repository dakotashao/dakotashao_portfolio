<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Dial · Tablet</title>
<style>
/* The Liquid Dial running live on an 11-inch tablet, landscape (1194 × 834 points). kit.js scales the whole tablet into the card. */
.device{position:absolute;left:3px;top:3px;padding:3px;border-radius:50px;
  background:linear-gradient(180deg,#f7f8f9 0,#d9dbde 6%,#c3c6ca 50%,#d6d8db 94%,#eef0f2 100%);
  box-shadow:0 0 0 .5px #8f9297,inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(0,0,0,.18),
    0 60px 100px -40px rgba(20,22,26,.45),0 24px 40px -18px rgba(20,22,26,.28),0 4px 10px rgba(20,22,26,.08)}
.device::before{content:"";position:absolute;inset:1px;border-radius:49px;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,.55),rgba(255,255,255,0) 8%,rgba(255,255,255,0) 92%,rgba(255,255,255,.4))}
.glass{position:relative;padding:20px;border-radius:47px;background:#0a0a0b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 0 0 2px #000}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.10) 0,rgba(255,255,255,.03) 28%,rgba(255,255,255,0) 42%)}
.cam{position:absolute;left:50%;top:9px;width:6px;height:6px;margin-left:-3px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#3a4256 0,#14161c 55%,#08090b 100%);box-shadow:0 0 0 1px #1b1c1f}
.btn{position:absolute;background:linear-gradient(180deg,#e6e8ea,#b9bcc0);border-radius:2px;box-shadow:0 0 0 .5px #8f9297}
.btn.top1{top:-2.5px;left:120px;width:46px;height:3px}
.btn.top2{top:-2.5px;left:176px;width:46px;height:3px}
.btn.pwr{top:-2.5px;right:96px;width:52px;height:3px}
.screen{position:relative;width:1194px;height:834px;border-radius:26px;overflow:hidden;background:#000}
.screen iframe{display:block;width:100%;height:100%;border:0}
.screen iframe{transition:transform 1s cubic-bezier(.4,0,.2,1)}
.push .screen iframe{transform:scale(1.6)}
@media (prefers-reduced-motion:reduce){.screen iframe{transition:none}}
/* the dial draws its own dot for the pointer, so the demo shows that dot and not a second arrow */
.kit-cursor{display:none!important}
/* while the demo plays, a real mouse can't reach the dial and pull its hover away; touching the screen stops the demo */
.playing .screen iframe{pointer-events:none}
</style>
</head><body>
<div id="stage" data-w="1252" data-h="892" data-pad="24">
  <div class="device">
    <i class="btn top1"></i><i class="btn top2"></i><i class="btn pwr"></i>
    <div class="glass">
      <span class="cam" aria-hidden="true"></span>
      <div class="screen"><iframe title="Liquid Dial running on a tablet" allow="autoplay"></iframe></div>
    </div>
  </div>
</div>
<script src="kit.js"></script>
<script>
// tapping outside the screen (card or bezel) folds the dial back, like tapping the room
const frame = document.querySelector('.screen iframe');
addEventListener('pointerdown', e => { if (e.isTrusted) frame.contentWindow.postMessage('liquid-dial:rest', '*'); });

// the demo cursor lives on this page; its taps and drags on the screen are passed through to the dial as touches
const SCR = 26; // device edge + bezel: where the screen starts on the stage
// in the small gallery card the camera pushes in on hover (and while the demo plays): the whole screen,
// room and dial together, zooms around its centre so the dial reads without changing its proportions.
// The detail view and the full page always show the whole screen.
const inCard = /[?&]zoom=/.test(location.search) && !/[?&]detail=1/.test(location.search);
const stageEl = document.getElementById('stage');
let overCard = false, overScreen = false, wide = false; // wide: the demo pulls the camera back to reach the day/night switch in the corner
const syncZoom = () => { const h = document.documentElement; h.classList.toggle('push', inCard && !wide && (overCard || overScreen || KIT.playing)); h.classList.toggle('playing', !!KIT.playing); };
document.documentElement.addEventListener('mouseenter', () => { overCard = true; syncZoom(); });
document.documentElement.addEventListener('mouseleave', () => { overCard = false; syncZoom(); });
// screen point (inside the dial page) <-> stage point (where the demo cursor moves), read live so it holds mid-zoom
const live = () => { const r = frame.getBoundingClientRect(), s = stageEl.getBoundingClientRect(); return { r, s, k: r.width / 1194 }; };
const toStage = (x, y) => { const { r, s, k } = live(); return [(r.left + x * k - s.left) / KIT.scale, (r.top + y * k - s.top) / KIT.scale]; };
const fromStage = (x, y) => { const { r, s, k } = live(); return [(s.left + x * KIT.scale - r.left) / k, (s.top + y * KIT.scale - r.top) / k]; };
let held = null; // the dial element a demo press started on; moves and the release go to it, like a captured pointer
let over = null;  // the dial element the demo mouse is over, so the dial sees it come and go like a real hover
const inner = e => { const { r, k } = live(); return [(e.clientX - r.left) / k, (e.clientY - r.top) / k]; };
const chain = el => { const a = []; for (let e = el; e && e.nodeType === 1; e = e.parentElement) a.push(e); return a; };
const send = (el, type, x, y, buttons = 0) => {
  const o = { bubbles: !/enter|leave/.test(type), cancelable: true, composed: true, clientX: x, clientY: y, button: 0, buttons, view: frame.contentWindow };
  el.dispatchEvent(type.startsWith('pointer') ? new PointerEvent(type, { ...o, pointerId: 9, pointerType: 'mouse', isPrimary: true }) : new MouseEvent(type, o));
};
const hoverTo = (el, x, y) => {
  if (el === over) return;
  const prev = chain(over), next = chain(el);
  if (over) send(over, 'pointerout', x, y);
  prev.filter(e => !next.includes(e)).forEach(e => send(e, 'pointerleave', x, y));
  if (el) send(el, 'pointerover', x, y);
  next.filter(e => !prev.includes(e)).reverse().forEach(e => send(e, 'pointerenter', x, y));
  over = el;
};
const scr = frame.parentElement; // the demo cursor lands on the screen (the iframe ignores the pointer while it plays)
['pointerdown', 'pointermove', 'pointerup', 'click'].forEach(type => scr.addEventListener(type, e => {
  if (e.isTrusted) return;
  const [x, y] = inner(e), doc = frame.contentDocument, at = doc.elementFromPoint(x, y) || doc.body;
  if (!held) hoverTo(at, x, y);
  const el = (type === 'pointermove' || type === 'pointerup') && held || at;
  if (type === 'pointerdown') held = el; if (type === 'pointerup') held = null;
  send(el, type, x, y, type === 'pointerdown' || (type === 'pointermove' && held) ? 1 : 0);
}));
scr.addEventListener('pointerleave', e => { if (!e.isTrusted) hoverTo(null, 0, 0); });
// synthetic touches have no real pointer to capture: let the dial's setPointerCapture calls pass quietly
frame.addEventListener('load', () => { const P = frame.contentWindow.Element.prototype, sp = P.setPointerCapture;
  P.setPointerCapture = function (id) { if (id !== 9) return sp.call(this, id); };
  // the pointer over the screen is inside the dial's own page, so it reports its own hover
  const de = frame.contentDocument.documentElement;
  de.addEventListener('mouseenter', () => { overScreen = true; syncZoom(); });
  de.addEventListener('mouseleave', () => { overScreen = false; syncZoom(); }); });
frame.src = 'liquid-dial/dial.html?device=tablet&hover=1';
const dial = sel => frame.contentDocument.querySelector(sel);
const spot = (el, fy = .5) => { const r = el.getBoundingClientRect(); return toStage(r.left + r.width / 2, r.top + r.height * fy); };
const face = j => frame.contentDocument.querySelectorAll('.oc')[j];
const lobe = name => spot(dial(`.ic[aria-label$="${name}"]`)); // an open lobe reads "Pause Music", "Turn off Ceiling light"…
// one notch of scrolling over the record turns it to the next song
const scroll = (c, dir) => { const [x, y] = fromStage(c.pos.x, c.pos.y), doc = frame.contentDocument;
  (doc.elementFromPoint(x, y) || doc.body).dispatchEvent(new WheelEvent('wheel', { bubbles: true, cancelable: true, clientX: x, clientY: y, deltaY: 50 * dir, view: frame.contentWindow })); };

// The demo uses a mouse, so the dial's hover effects show: point at two devices,
// then Scenes: open it, point at Night and Movie (the room previews each), then pick Reading.
// Music: open it, pick a playlist, click it again for the record, scroll through a few songs, click to play.
// Then pull back and switch to night, push in again and dim the Floor lamp, then bring it up. Then click the room to fold it.
const zoomTo = async (c, isWide) => { wide = isWide; syncZoom(); await c.wait(inCard ? 1100 : 200); };
KIT.demo(async c => {
  syncZoom(); await c.wait(inCard ? 1100 : 300);
  // the cursor comes in from below: point at two devices, then go to Scenes
  for (const name of ['Blinds', 'Floor lamp']) { await c.move(...lobe(name), 520); await c.wait(800); }

  await c.move(...lobe('Scenes'), 600); await c.wait(700);
  await c.click(...lobe('Scenes')); await c.wait(1000);
  await c.move(...spot(face(3)), 480); await c.wait(1300);  // point at Night
  await c.move(...spot(face(2)), 420); await c.wait(1300);  // point at Movie
  await c.click(...spot(face(0)), 520); await c.wait(1500); // pick Reading

  // Music: open it, pick a playlist, open its record and turn it through a few songs, then play
  await c.click(...lobe('Music')); await c.wait(700);
  await c.click(...lobe('Music')); await c.wait(1000);
  await c.click(...spot(face(2)), 480); await c.wait(1300);
  await c.click(...spot(face(2))); await c.wait(1000);
  await c.move(...spot(dial('.recC'))); await c.wait(400);
  for (let i = 0; i < 3; i++) { scroll(c, 1); await c.wait(1000); }
  await c.click(...spot(dial('.recC'))); await c.wait(1400);

  await zoomTo(c, true);
  await c.click(...spot(dial('#dn'))); await c.wait(1800);
  await zoomTo(c, false);

  await c.click(...lobe('Floor lamp')); await c.wait(700);
  await c.click(...lobe('Floor lamp')); await c.wait(900);
  // the bulb: higher is brighter; press where the light is now so it doesn't jump. Reading left it at full, so dim it, then bring it back up
  const tank = dial('.tank'), now = parseInt(dial('.mid').innerText.match(/(\d+)%/)?.[1] ?? 60, 10) / 100;
  await c.move(...spot(tank, 1 - now)); await c.drag(...spot(tank, .85), 900); await c.wait(600);
  await c.drag(...spot(tank, .3), 900); await c.up(); await c.wait(1200);

  await c.click(...toStage(380, 600)); await c.wait(400);
}, { reset() { // every run starts folded and by day
  frame.contentWindow.postMessage('liquid-dial:rest', '*'); wide = false;
  const dn = dial('#dn'); if (dn && dn.getAttribute('aria-checked') !== 'true') dn.click(); } });
const kitStop = KIT.stop; KIT.stop = n => { kitStop(n); wide = false; syncZoom(); };
</script>
</body></html>
