<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dominoes List · Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap">
<style>
/* The Dominoes Drag slider, turned into a list. Same parts: a grey tape, a fixed black reading line, items that tip
   over like dominoes once the line has passed them, the card that takes the weight. Here the tape runs vertically and
   every domino is a track. */
:root {
  --bg: #f6f6f6; --card: #ffffff; --ink: #17181b; --muted: #62666d; --faint: #b9bcc2; --tape: #eeeef1; --tape-hover: #e8e8ec; --tape-press: #e3e3e7;
  --card-shadow: 0 22px 44px -14px rgba(26, 28, 36, 0.18), 0 3px 8px rgba(26, 28, 36, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.9);
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
#stage, #stage * { box-sizing: border-box; }
#stage { color: var(--ink); font: 400 15px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
.card { position: absolute; left: 70px; top: 60px; width: 320px; max-width: calc(100vw - 32px); padding: 8px; border-radius: 24px; background: var(--card); box-shadow: var(--card-shadow); will-change: transform; }
.head { display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 16px; }
.head .label { flex: 1; font: 600 15px/20px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; letter-spacing: -0.01em; }
.count { font: 400 14px/20px var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; }
.reset { width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 16px; background: none; color: var(--ink); cursor: pointer; }
.reset:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.reset svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.reset:focus-visible, .tape:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* The tape: 304 wide, five rows tall, rows 44. */
.tape { position: relative; height: 220px; border-radius: 20px; background: var(--tape); overflow: hidden; cursor: grab; touch-action: none; user-select: none; outline: none; transition: background-color 140ms ease;
  perspective: 520px; }
.tape:hover { background: var(--tape-hover); }
.tape.drag { background: var(--tape-press); cursor: grabbing; }
.rows { position: absolute; left: 0; right: 0; top: 0; will-change: transform; transform-style: preserve-3d; }
.row { position: absolute; left: 0; right: 0; height: 44px; display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 8px; padding: 0 16px; transform-origin: 50% 100%; will-change: transform; }
.row .ico { width: 16px; height: 16px; color: var(--muted); fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.row .ico .f { fill: currentColor; stroke: none; }
.row .t { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 400 16px/24px var(--sans); letter-spacing: -0.005em; color: var(--muted); }
.row .t b { font-weight: 400; color: inherit; }
.row .y { font: 400 16px/24px var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; }
.row.now .ico, .row.now .y, .row.now .t { color: var(--ink); }
/* The reading line: 1 wide, full width, fixed. It is what knocks the rows over. */
.line { position: absolute; left: 0; right: 0; height: 1px; background: var(--ink); pointer-events: none; will-change: transform; }
.tape[data-kit-hover] { background: var(--tape-hover); }
.tape.drag[data-kit-hover] { background: var(--tape-press); }
.reset[data-kit-hover] { background: color-mix(in srgb, var(--ink) 6%, transparent); }
#stage[data-demo] :focus-visible { outline: none; }
</style>
</head><body>
<div id="stage" data-w="460" data-h="408">
  <div class="card" id="card">
    <div class="head">
      <span class="label" id="lbl">Adjust</span>
      <span class="count" id="count" aria-hidden="true">01 / 08</span>
      <button class="reset" type="button" id="reset" aria-label="Back to the first item"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.05-4.95"/><path d="M5 4.5v3.5h3.5"/><circle cx="12" cy="12" r="1.75" fill="currentColor" stroke="none"/></svg></button>
    </div>
    <div class="tape" id="tape" role="listbox" tabindex="0" aria-labelledby="lbl" aria-activedescendant="r0">
      <div class="rows" id="rows"></div>
      <span class="line" id="line" aria-hidden="true"></span>
    </div>
  </div>
</div>
<script src="kit.js"></script>
<script>
(() => {
  const TRACKS = [['Exposure', '+12'], ['Contrast', '0'], ['Highlights', '\u221230'], ['Shadows', '+18'],
    ['Saturation', '0'], ['Warmth', '0'], ['Sharpness', '0'], ['Grain', '+40']];
  const ICONS = {
    Exposure: '<path d="M12 4v8M8 8h8M8 18.5h8"/>',
    Contrast: '<circle cx="12" cy="12" r="8.5"/><path class="f" d="M12 3.5a8.5 8.5 0 0 1 0 17z"/>',
    Highlights: '<circle cx="12" cy="12" r="3.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>',
    Shadows: '<path d="M19.5 14.2A7.8 7.8 0 1 1 9.8 4.5a6.2 6.2 0 0 0 9.7 9.7z"/>',
    Saturation: '<path d="M12 3.5s6 6.3 6 10.6a6 6 0 0 1-12 0c0-4.3 6-10.6 6-10.6z"/>',
    Warmth: '<path d="M10 14.3V5.5a2 2 0 0 1 4 0v8.8a4 4 0 1 1-4 0z"/><path d="M12 16.5V10"/>',
    Sharpness: '<path d="M12 4.5 20.5 19h-17z"/><path class="f" d="M12 4.5 20.5 19H12z"/>',
    Grain: '<circle class="f" cx="7" cy="7" r="1.25"/><circle class="f" cx="13" cy="5.5" r="1.25"/><circle class="f" cx="17.5" cy="9" r="1.25"/><circle class="f" cx="10" cy="11.5" r="1.25"/><circle class="f" cx="5.5" cy="15" r="1.25"/><circle class="f" cx="15" cy="14" r="1.25"/><circle class="f" cx="10.5" cy="18" r="1.25"/><circle class="f" cx="18.5" cy="18.5" r="1.25"/>'
  };
  const N = TRACKS.length, RH = 44, LINE = 124;           // row height; the line sits low so the fallen pile has room above it
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id), rowsEl = $('rows'), tape = $('tape'), card = $('card'), lineEl = $('line'), countEl = $('count');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sp = (s, t, k, c, dt) => { if (REDUCE) { s.x = t; s.v = 0; return; } s.v += (-k * (s.x - t) - c * s.v) * dt; s.x += s.v * dt; };
  let speed = 1;

  // Dominoes: the row the line has just passed leans first; every one behind it rests on the one in front.
  // Rest angles from the slider's chain: φ1 = asin(gap/h), φk = φk-1 + asin(gap/h · cos φk-1), capped at 76°.
  const GAP = 0.6, CAP = 78, chain = [0];
  for (let k = 1; k <= N + 1; k++) { const prev = chain[k - 1] * Math.PI / 180; chain.push(Math.min(CAP, chain[k - 1] + Math.asin(GAP * Math.cos(prev)) * 180 / Math.PI)); }

  const rows = TRACKS.map(([t, y], i) => {
    const el = document.createElement('div'); el.className = 'row'; el.id = 'r' + i; el.setAttribute('role', 'option');
    el.innerHTML = `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[t]}</svg><span class="t"><b>${t}</b></span>`;
    el.style.top = '0px'; rowsEl.append(el);
    return { el, ang: { x: 0, v: 0 }, lift: { x: 0, v: 0 }, knock: 0 };
  });
  lineEl.style.top = LINE + 'px';

  const st = { p: { x: 0, v: 0 }, target: 0, drag: false, hover: -1, last: 0, dip: { x: 0, v: 0 }, rot: { x: 0, v: 0 }, line: { x: 0, v: 0 } };
  const current = () => clamp(Math.round(st.p.x), 0, N - 1);

  // ---- input: drag the tape, scroll it, tap a row, keys
  let y0 = 0, p0 = 0, lastY = 0, lastT = 0, vel = 0, moved = false;
  tape.addEventListener('pointerdown', (e) => {
    tape.setPointerCapture(e.pointerId); st.drag = true; moved = false; tape.classList.add('drag');
    y0 = lastY = (e.clientY / KIT.scale); p0 = st.p.x; lastT = performance.now(); vel = 0;
  });
  tape.addEventListener('pointermove', (e) => {
    const r = tape.getBoundingClientRect(), yy = (e.clientY / KIT.scale) - (r.top / KIT.scale);
    st.hover = clamp(Math.floor((yy - LINE + RH / 2) / RH + st.p.x), -1, N);
    if (!st.drag) return;
    const dy = (e.clientY / KIT.scale) - y0; if (Math.abs(dy) > 3) moved = true;
    st.p.x = clamp(p0 - dy / RH, -0.4, N - 0.6); st.p.v = 0;
    const now = performance.now(); vel = -((e.clientY / KIT.scale) - lastY) / RH / Math.max(0.008, (now - lastT) / 1000); lastY = (e.clientY / KIT.scale); lastT = now;
  });
  tape.addEventListener('pointerleave', () => { if (!st.drag) st.hover = -1; });
  const up = (e) => {
    if (!st.drag) return; st.drag = false; tape.classList.remove('drag');
    if (!moved) { const r = tape.getBoundingClientRect(); st.target = clamp(Math.round(((e.clientY / KIT.scale) - (r.top / KIT.scale) - LINE) / RH + st.p.x), 0, N - 1); }
    else st.target = clamp(Math.round(st.p.x + clamp(vel, -12, 12) * 0.18), 0, N - 1);   // flick: coast a little, land on a row
    st.p.v = moved ? vel : 0;
  };
  tape.addEventListener('pointerup', up); tape.addEventListener('pointercancel', up);
  let wheelT = 0;
  tape.addEventListener('wheel', (e) => { e.preventDefault(); st.p.x = clamp(st.p.x + e.deltaY / RH * 0.6, -0.4, N - 0.6); st.p.v = 0; clearTimeout(wheelT); st.wheel = true; wheelT = setTimeout(() => { st.wheel = false; st.target = current(); }, 140); }, { passive: false });
  tape.addEventListener('keydown', (e) => {
    const k = e.key; let t = null;
    if (k === 'ArrowDown') t = st.target + 1; else if (k === 'ArrowUp') t = st.target - 1; else if (k === 'Home') t = 0; else if (k === 'End') t = N - 1;
    if (t == null) return; e.preventDefault(); st.target = clamp(t, 0, N - 1);
  });
  $('reset').addEventListener('click', () => { st.target = 0; });
  window.setSpeed = (v) => { speed = v; };

  // ---- a row going over (or standing back up) knocks the tape and the line, a little
  function knock(dir) {
    if (REDUCE) return;
    const v = Math.min(1, Math.abs(st.p.v) / 8);
    st.rot.v += dir * (6 + 10 * v); st.dip.v += 8 + 10 * v; st.line.v += dir * (40 + 60 * v);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000) * speed; last = now;
    const n = Math.max(1, Math.ceil(dt / (1 / 240))), h = dt / n;
    for (let s = 0; s < n; s++) {
      if (!st.drag && !st.wheel) sp(st.p, st.target, 160, 22, h);
      const fallen = Math.floor(st.p.x + 0.5);
      if (fallen !== st.last) { knock(fallen > st.last ? 1 : -1); st.last = fallen; }
      const P = st.p.x, base = Math.floor(P), frac = P - base;
      rows.forEach((r, i) => {
        const k = base - i;                                   // how many rows ahead of this one the line is
        let target = 0;
        if (k >= 0) target = chain[k] + (chain[k + 1] - chain[k]) * clamp(frac, 0, 1);   // leaning, pushed by the one behind
        sp(r.ang, target, 900, 46, h);
        sp(r.lift, st.hover === i && !st.drag && i > current() ? -2 : 0, 500, 30, h);
      });
      const L = clamp(st.p.x / (N - 1), 0, 1);               // how much of the side has played: the card takes the pile
      sp(st.dip, 3 * L, 200, 16, h); sp(st.rot, 0, 160, 12, h); sp(st.line, 0, 600, 18, h);
    }
    // Standing rows keep their 44px slots; rows the line has passed lie down and pile up, each taking only
    // the height its tilt leaves it (cos θ), like dominoes stacked on the ones in front.
    const P = st.p.x, base = Math.floor(P), ys = new Array(N);
    for (let i = Math.max(0, base); i < N; i++) ys[i] = LINE - RH + (i - P) * RH;
    for (let i = Math.min(N - 1, base) - 1; i >= 0; i--) {
      const a = clamp(rows[i + 1].ang.x, 0, 85) * Math.PI / 180;
      ys[i] = ys[i + 1] - RH * Math.max(0.2, Math.cos(a));
    }
    rows.forEach((r, i) => {
      const a = clamp(r.ang.x, -10, 85);
      r.el.style.transform = `translateY(${(ys[i] + r.lift.x).toFixed(2)}px) rotateX(${a.toFixed(2)}deg)`;
      r.el.style.opacity = (1 - 0.6 * clamp(a / 76, 0, 1)).toFixed(3);
      r.el.classList.toggle('now', i === current());
    });
    lineEl.style.transform = `translateY(${clamp(st.line.x, -3, 3).toFixed(2)}px)`;
    card.style.transform = `translateY(${st.dip.x.toFixed(2)}px) rotate(${(st.rot.x * 0.02).toFixed(3)}deg)`;
    const c = current();
    countEl.textContent = String(c + 1).padStart(2, '0') + ' / ' + String(N).padStart(2, '0');
    tape.setAttribute('aria-activedescendant', 'r' + c);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.WHEEL = { st, rows };
})();
</script>
<script>
addEventListener('pointerdown', e => { if (e.isTrusted) delete document.getElementById('stage').dataset.demo; }, true);
KIT.demo(async c => {
  document.getElementById('stage').dataset.demo = '';
  const [tx, ty] = c.at('#tape', .55, .5), [, top] = c.at('#tape', .5, 0);
  // wind the tape up: each row the line passes tips back onto the pile above it
  await c.move(tx, top + 176, 900);
  await c.wait(350);
  await c.down();
  await c.wait(120);
  await c.drag(tx, top + 176 - 44 * 3.1, 1500);
  await c.wait(250);
  await c.up();
  await c.wait(900);
  // tap a row further down: the tape runs to it
  await c.click(tx, top + 124 + 44 * 1.5, 600);
  await c.wait(900);
  // and back to the first item
  await c.click(...c.at('#reset'), 800);
  await c.wait(1100);
  await c.leave();
}, { tint: '#17181b', reset() {
  const W = window.WHEEL; if (!W) return;
  Object.assign(W.st, { target: 0, drag: false, wheel: false, hover: -1 }); W.st.p.x = 0; W.st.p.v = 0;
  W.rows.forEach(r => { r.ang.x = r.ang.v = 0; r.lift.x = r.lift.v = 0; });
  document.getElementById('tape').classList.remove('drag');
} });
</script>
</body></html>
