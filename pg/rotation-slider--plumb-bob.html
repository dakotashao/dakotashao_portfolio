<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotation Slider · Plumb Bob Drag</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root {
  --card: #ffffff; --ink: #17181b; --muted: #62666d; --line: #dfe0e4; --press: #eeeef1;
  --rail: #eeeef1; --rail-hover: #e8e8ec; --rail-press: #e3e3e7; --stop: #b9bcc2; --solid: #1b1c20;
  --card-shadow: 0 22px 44px -14px rgba(26, 28, 36, 0.18), 0 3px 8px rgba(26, 28, 36, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.9);
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
#stage { color: var(--ink); font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
.wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
.list { position: relative; width: 320px; padding: 8px; border-radius: 24px; background: var(--card); box-shadow: var(--card-shadow); will-change: transform; }
.srow { padding: 14px 16px 16px; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.label { font: 400 16px/24px var(--sans); letter-spacing: -0.005em; }
.unit { font: 400 12px/16px var(--mono); color: var(--muted); }

/* Ruler: 272 × 46 pill, no border; value 18 from the left; tape window 160 centred on 136; 1 centre line;
   ticks 6.65 apart (one per day), centred on 23: counted 14 #62666D, the rest 7 #B9BCC2. */
.ruler { position: relative; width: 272px; max-width: 100%; height: 46px; margin-top: 8px; border-radius: 23px; background: var(--rail); touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; outline: none; transition: background-color 140ms ease; }
.ruler.is-hover { background: var(--rail-hover); }
.ruler.is-press, .ruler.is-drag { background: var(--rail-press); }
.ruler.is-drag { cursor: grabbing; }
.ruler:focus-visible { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ink); }
.r-val { position: absolute; left: 18px; top: 13px; font: 400 16px/20px var(--sans); font-variant-numeric: tabular-nums; pointer-events: none; }
.r-val .d { display: inline-block; will-change: transform; }
.r-window { position: absolute; left: 56px; width: 160px; top: 0; height: 46px; overflow: hidden; pointer-events: none;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); }
.r-window svg { position: absolute; left: 0; top: 0; overflow: visible; }
.tk { stroke: var(--stop); stroke-width: 1; stroke-linecap: round; }
.tk.on { stroke: var(--muted); stroke-width: 1.25; }
.bar { stroke: var(--muted); stroke-width: 1.25; stroke-linecap: round; }
.r-ind { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.r-ind .ln { stroke: var(--ink); stroke-width: 1; }
.ruler.is-press .r-ind .ln.taut, .ruler.is-drag .r-ind .ln.taut { stroke-width: 1.25; }
.r-ind .solid { fill: var(--solid); }
.r-rod { position: absolute; left: 136px; top: 0; width: 1px; height: 31px; margin-left: -0.5px; background: var(--ink); transform-origin: 50% 0; pointer-events: none; will-change: transform; }
.r-rod.full { height: 46px; }
.ruler.big .tk { stroke-width: 1.75; }
.tk.stage { stroke: var(--ink); stroke-width: 1.5; transition: stroke 120ms ease; }
.wall { stroke: #a9adb4; stroke-width: 3; stroke-linecap: round; }
.r-rod .r-bob { position: absolute; left: -3.5px; top: 30px; width: 8px; height: 11px; overflow: visible; will-change: transform; }
.r-rod .r-bob path { fill: var(--solid); }
.r-who { position: absolute; right: 8px; top: 7px; display: grid; place-items: center; width: 32px; height: 32px; color: var(--ink); pointer-events: none; }
.r-who svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.r-reset { position: absolute; right: 8px; top: 7px; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 16px; background: none; color: var(--ink); cursor: pointer; transition: background-color 140ms ease; }
.r-reset:hover, .r-reset[data-kit-hover] { background: rgba(23, 24, 27, 0.06); }
.r-reset:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.r-reset svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
html.pointer-mode *:focus, html.pointer-mode *:focus-visible { outline: none !important; }
html.pointer-mode .ruler:focus-visible { box-shadow: none; }
</style>
</head><body>
<div id="stage" data-w="460" data-h="300">
  <div class="wrap">
    <div class="demo" data-mode="pluck">
      <div class="list"><div class="srow"><div class="head"><span class="label" id="lap">Grain</span><span class="unit">%</span></div></div></div>
    </div>
  </div>
</div>
<script src="kit.js"></script>
<script>
(() => {
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NS = 'http://www.w3.org/2000/svg';
  const MIN = 0, MAX = 100, DEF = 40, HOME = 0, STEP = 5, PX = 1.33, MID = 23, LEAN_MAX = Math.asin(6.65 / 14) * 180 / Math.PI, DH = 14, DFOOT = 30, CX = 80, ACX = 136, G = 2600;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; };
  const sp = (s, t, k, c, dt) => { if (REDUCE) { s.x = t; s.v = 0; return; } s.v += (-k * (s.x - t) - c * s.v) * dt; s.x += s.v * dt; };
  let speed = 1;
  // A fallen row of dominoes, as in the real world: the one nearest the standing ones rests its top on the first
  // standing one (asin(gap / height)); each one behind rests on the one in front, which already leans, so it lies
  // further down: phi[k] = phi[k-1] + asin(gap / height · cos phi[k-1]). Far back they lie low (cap 76°).
  const PHI = [0];
  // Dominoes have thickness (3 here), so the gap a top falls across is 6.65 − 3: the row lowers gradually.
  for (let k = 1; k <= 30; k++) PHI.push(Math.min(76, PHI[k - 1] + Math.asin(((1.33 * 5 - 3) / 14) * Math.cos(PHI[k - 1] * Math.PI / 180)) * 180 / Math.PI));
  const SC = () => (window.KIT && KIT.scale) || 1;   // #stage is scaled: pointer px -> design px

  function makeRuler(demo) {
    const mode = demo.dataset.mode;
    const card = demo.querySelector('.list'), row = demo.querySelector('.srow'), labelId = demo.querySelector('.label').id;
    const el = document.createElement('div');
    el.className = 'ruler'; el.tabIndex = 0; el.setAttribute('role', 'slider'); el.setAttribute('aria-labelledby', labelId);
    el.setAttribute('aria-valuemin', MIN); el.setAttribute('aria-valuemax', MAX);
    el.innerHTML = `<span class="r-val" aria-hidden="true"></span><div class="r-window"><svg height="46"></svg></div>
      <svg class="r-ind" width="272" height="46" viewBox="0 0 272 46" aria-hidden="true"></svg>
      <button class="r-reset" type="button" aria-label="Reset grain to 0"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.05-4.95"/><path d="M5 4.5v3.5h3.5"/><circle cx="12" cy="12" r="1.75" fill="currentColor" stroke="none"/></svg></button>`;
    row.append(el);
    const out = el.querySelector('.r-val'), tape = el.querySelector('.r-window svg'), ind = el.querySelector('.r-ind');

    // Ticks
    const ticks = [];
    for (let u = MIN; u <= MAX; u += STEP) {
      const x = (u - MIN) * PX;
      const t = { u, x, i: ticks.length, on: false, h: { x: 7, v: 0 }, sink: { x: 0, v: 0 }, rot: { x: 0, v: 0 }, m: rand(0.75, 1.25) };
      t.l = mk('line', { class: 'tk', x1: x, x2: x }, tape);
      if (mode === 'ticks') { t.bar = mk('line', { class: 'bar', x1: x, x2: x }, tape); t.state = 'off'; t.y = 0; t.vy = 0; t.op = 0; t.g = G; t.bounce = 0.3; }
      if (mode === 'domino') { t.dom = { x: 0, v: 0, state: 'up', at: 0, tgt: 0, next: 0, nextAt: 0 }; }
      ticks.push(t);
    }

    // Indicator
    const I = {};
    if (mode === 'pluck') {
      // A+: built like the ball-and-line ruler: an HTML line hung from the top, rotated with CSS; the bob at its foot.
      I.rod = document.createElement('span'); I.rod.className = 'r-rod'; I.rod.setAttribute('aria-hidden', 'true');
      I.rod.innerHTML = '<svg class="r-bob" viewBox="-4 0 8 11"><path d="M-4 0H4V3.2C4 6 2.2 8.6 0 11C-2.2 8.6 -4 6 -4 3.2Z"/></svg>';
      el.append(I.rod); I.bobEl = I.rod.firstChild;
    } else if (mode === 'bob') {
      I.g = mk('g', {}, ind);
      I.ln = mk('line', { class: 'ln taut', x1: ACX, x2: ACX, y1: 0, y2: 32 }, I.g);
      // Plumb bob: flat shoulder, pointed tip; 8 wide, 11 tall, hung at y 31.
      I.bob = mk('path', { class: 'solid', d: 'M-4 0H4V3.2C4 6 2.2 8.6 0 11C-2.2 8.6 -4 6 -4 3.2Z' }, I.g);
    } else if (mode === 'cursor') {
      I.ln = mk('line', { class: 'ln', x1: ACX, x2: ACX, y1: 0, y2: 46 }, ind);
      // Cursor: a solid trapezoid resting on the tall ticks (bottom at 15); 12 wide on top, 6 at the bottom, 6 tall.
      I.cur = mk('path', { class: 'solid', d: 'M-6 -6H6L3 0H-3Z' }, ind);
    } else {
      // C: the same hung line, full height, no bob.
      I.rod = document.createElement('span'); I.rod.className = 'r-rod full'; I.rod.setAttribute('aria-hidden', 'true');
      el.append(I.rod);
    }

    const st = {
      value: DEF, prev: DEF, aV: 0, vV: 0, tapeV: 0, time: 0, pending: [], lastQ: 0, tapAt: 0, vel: 0, sv: 0, target: null, snapping: true, settled: true,
      dragging: false, pressed: false, moved: false, hover: false, startX: 0, startV: 0, lastX: 0, lastT: 0,
      pill: { x: 0, v: 0 }, cdip: { x: 0, v: 0 }, swing: { x: 0, v: 0 }, lift: { x: 0, v: 0 },
      cur: { y: 0, v: 0, falling: false, hit: true }, digits: [], dtxt: '',
    };
    const load = () => (clamp(st.value, MIN, MAX) - MIN) / (MAX - MIN);
    const countedNow = (t) => t.u < Math.round(clamp(st.value, MIN, MAX));
    const offX = () => CX - (st.value - MIN) * PX;
    const firstUp = () => Math.max(0, Math.min(ticks.length, Math.ceil(Math.round(clamp(st.value, MIN, MAX)) / STEP)));
    const rankOf = (t) => Math.max(1, firstUp() - t.i);          // 1 = the fallen one nearest the line

    function setDigits(text) {
      if (st.dtxt === text) return;
      const old = st.digits; out.textContent = '';
      st.digits = [...text].map((ch, i) => { const s = document.createElement('span'); s.className = 'd'; s.textContent = ch; out.append(s); return { el: s, x: old[i] ? old[i].x : 0, v: old[i] ? old[i].v : 0 }; });
      st.dtxt = text;
    }
    function setCounted(t, on, instant) {
      if (mode === 'domino') {
        t.on = on; t.l.classList.toggle('on', on);
        const d = t.dom;
        if (instant || REDUCE) { d.x = on ? PHI[rankOf(t)] : 0; d.tgt = d.x; d.next = d.x; d.v = 0; d.state = on ? 'down' : 'up'; return; }
        if (on) { d.at = Math.max(st.time, st.lastQ + 0.03); st.lastQ = d.at; d.state = 'queued'; d.tgt = d.next = PHI[1]; d.nextAt = 0; }   // one after another
        else { d.state = 'rising'; }
        return;
      }
      t.on = on; t.l.classList.toggle('on', on && mode !== 'ticks');
      if (mode === 'ticks') {
        if (instant || REDUCE) { t.state = on ? 'rest' : 'off'; t.y = 0; t.vy = 0; t.op = on ? 1 : 0; return; }
        if (on) { t.state = 'fall'; t.y = -rand(9, 13); t.vy = 0; t.g = G * rand(0.85, 1.15); t.bounce = rand(0.25, 0.4); t.hit = false; t.op = 1; }
        else { t.state = 'lift'; t.vy = -rand(70, 110); }
      } else if (instant || REDUCE) { t.h.x = on ? 14 : 7; t.h.v = 0; }
    }
    function knock(i, k) {   // a landing: the floor around tick i gives
      ticks.forEach((o, j) => { const d = Math.abs(j - i); if (d < 4) o.sink.v += 22 * k * Math.exp(-d / 1.4) * rand(0.7, 1.3); });
      st.pill.v += 4 * k; st.cdip.v += 2.5 * k;
    }

    function step(dt) {
      // Motion of the reading point, for the indicators' inertia.
      const v = (st.value - st.prev) * PX / Math.max(dt, 1e-4); st.prev = st.value;
      st.tapeV += (v - st.tapeV) * Math.min(1, dt * 30);
      st.time += dt;
      if (st.tapAt && st.time >= st.tapAt) { st.tapAt = 0; const o = ticks[firstUp()]; if (o && o.dom && o.dom.state === 'up') o.dom.v += 70; }
      for (let i = st.pending.length - 1; i >= 0; i--) { const p = st.pending[i]; if (st.time >= p.at) { p.o.rot.v += p.k * p.o.m; st.pending.splice(i, 1); } }
      const a = (v - st.vV) / Math.max(dt, 1e-4); st.vV += (v - st.vV) * Math.min(1, dt * 40); st.aV = a;
      const off = offX();
      for (const t of ticks) {
        const on = countedNow(t);
        if (on !== t.on) setCounted(t, on, false);
        if (mode === 'ticks') {
          if (t.state === 'fall') {
            t.vy += t.g * dt; t.y += t.vy * dt;
            if (t.y >= 0) { t.y = 0; if (!t.hit) { t.hit = true; knock(ticks.indexOf(t), Math.min(1, t.vy / 240)); } if (t.vy > 50) t.vy *= -t.bounce; else { t.vy = 0; t.state = 'rest'; } }
          } else if (t.state === 'lift') {
            t.vy += 900 * dt; t.y += t.vy * dt; t.op -= dt / 0.16;
            if (t.op <= 0) { t.op = 0; t.y = 0; t.vy = 0; t.state = 'off'; }
          }
        } else if (mode === 'domino') {
          const d = t.dom;
          // Where it should rest now. When a new one falls in front, the ones behind settle further down, one after
          // another going back (a wave), like a real row.
          if (t.on) {
            const rk = rankOf(t), want = PHI[rk];
            if (want !== d.next) { d.next = want; d.nextAt = st.time + 0.03 * (rk - 1); }
            if (st.time >= d.nextAt) d.tgt = d.next;
          }
          if (d.state === 'queued' && st.time >= d.at) { d.state = 'falling'; d.v = Math.max(d.v, 40); }
          if (d.state === 'falling') {
            // Toppling: gravity's pull grows as it leans; it lands on the one in front with a small knock back.
            d.v += 2600 * (0.25 + Math.sin(d.x * Math.PI / 180)) * dt; d.x += d.v * dt;
            if (d.x >= d.tgt) {
              d.x = d.tgt;
              if (d.v > 60) { const o = ticks[t.i + 1]; if (o && o.dom.state === 'up') o.dom.v += 30; st.pill.v += 1.2; d.v *= -0.22; }
              else { d.v = 0; d.state = 'down'; }
            }
          } else if (d.state === 'down') {
            // Settling further down is a slide under gravity (accelerating), never a spring back up past rest.
            if (d.x < d.tgt - 0.2) { d.v += 900 * (0.3 + Math.sin(d.x * Math.PI / 180)) * dt; d.x = Math.min(d.tgt, d.x + d.v * dt); if (d.x >= d.tgt) d.v = 0; }
            else { d.v += (-260 * (d.x - d.tgt) - 32 * d.v) * dt; d.x += d.v * dt; }
            // It can't sink through the one in front of it.
            if (d.x > d.tgt + 0.5 && d.v > 0) { d.x = d.tgt + 0.5; d.v = 0; }
            // (When the one in front is stood up, this one is pushed up with it: the spring lifts it to its new rest.)
          } else { // up or rising: the line pushes it back upright; it stops at vertical, never swings past
            d.v += (-260 * d.x - 32 * d.v) * dt; d.x += d.v * dt;
            if (d.x < 0) { d.x = 0; if (d.v < 0) d.v = 0; }
            if (d.state === 'rising' && Math.abs(d.x) < 0.3 && Math.abs(d.v) < 5) d.state = 'up';
          }
        } else sp(t.h, t.on ? 14 : 7, 500, 18, dt);
        // Press sinks the ticks right under the reading point (B: the one the cursor sits on).
        const dx = Math.abs(t.x + off - CX);
        let target = 0;
        if (st.pressed && !st.moved) {
          if (mode === 'cursor') target = dx < 3.4 ? 3 : 0;
          else if (mode === 'ticks' || mode === 'domino') target = dx < 10 ? 1.5 * (1 - dx / 10) : 0;
        }
        sp(t.sink, target, 500, 20, dt);
        // A+ and C: while the tape runs, the counted ticks behind the line lean with it (most near the line).
        let lean = 0;
        if ((mode === 'pluck' || mode === 'ticks') && t.on && !REDUCE) {
          const d = (CX - (t.x + off)) / (PX * STEP);
          if (d > 0) lean = clamp(st.tapeV * 0.22, -LEAN_MAX, LEAN_MAX) * Math.exp(-d / 9);
        }
        if (mode === 'pluck' || mode === 'ticks') {
          if (REDUCE) { t.rot.x = 0; t.rot.v = 0; }
          else {
            // Stand back up slowly; a tick that tips far enough comes to rest on its neighbour (top touches it at
            // ~28°) and hands it the push: a real domino chain.
            t.rot.v += (-140 * (t.rot.x - lean) - 11 * t.rot.v) * dt; t.rot.x += t.rot.v * dt;
            if (Math.abs(t.rot.x) > LEAN_MAX) {
              const sg = Math.sign(t.rot.x), nb = ticks[t.i + sg];
              t.rot.x = sg * LEAN_MAX;
              if (sg * t.rot.v > 0) { if (nb) nb.rot.v += t.rot.v * 0.55; t.rot.v *= -0.15; }
            }
          }
        } else sp(t.rot, lean, 300, 9, dt);
        // A+ and C: the line sweeps through the ticks like through dominoes. A tick it passes tips over the way the
        // line is going (pivoting on its foot); the knock runs back through the counted ticks behind it; they stand back up.
        if (mode === 'pluck' || mode === 'ticks') {
          const side = Math.sign(t.x + off - CX);
          if (t.side && side && side !== t.side && !REDUCE) {
            const dir = t.side > 0 ? 1 : -1;                 // value going up: the line moves right through the tape
            const k = clamp(Math.abs(st.tapeV) * 0.6, 120, 420) * t.m;
            t.rot.v += dir * k;
            const i = ticks.indexOf(t);
            // The knock runs back through the counted ticks behind the line, one after another, each tipping the same way.
            [1, 2, 3, 4, 5, 6, 7, 8].forEach((n) => { const o = ticks[i - dir * n]; if (o) st.pending.push({ o, at: st.time + 0.035 * n, k: dir * k * Math.pow(0.82, n) }); });
          }
          t.side = side;
        }
      }
      for (const d of st.digits) sp(d, 0, 520, 16, dt);
      const L = load();
      sp(st.pill, L * 1.6, 260, 18, dt);
      sp(st.cdip, L * 1.2, 200, 16, dt);

      if (mode === 'pluck' || mode === 'ticks' || mode === 'domino') {
        // The line sweeps through the ticks and they hold its foot back: value going up, the foot trails left;
        // it swings back when the tape stops.
        if (!REDUCE) {
          const drag = clamp(st.tapeV * 0.022, -9, 9);
          st.swing.v += (-90 * (st.swing.x - drag) - 5 * st.swing.v) * dt; st.swing.x += st.swing.v * dt;
        }
        if (mode === 'domino') sp(st.lift, st.hover && !st.dragging ? -5 : 0, 420, 28, dt);   // C: hover lifts the line off the floor
        else sp(st.lift, st.pressed && !st.moved ? 2 : st.hover && !st.dragging ? -3 : 0, 500, 30, dt);
      } else if (mode === 'bob') {
        // Pendulum hung from the top: it lags the reading point's acceleration; a heavier tape swings slower.
        if (!REDUCE) {
          const k = 70 - 25 * L;
          st.swing.v += (-k * st.swing.x - 4.5 * st.swing.v - clamp(st.aV, -6000, 6000) * 0.0045) * dt;
          st.swing.x = clamp(st.swing.x + st.swing.v * dt, -14, 14);
        }
        sp(st.lift, st.pressed && !st.moved ? 1.5 : st.hover && !st.dragging ? -2.5 : 0, 400, 26, dt);
      } else if (mode === 'cursor') {
        const c = st.cur;
        if (c.falling) {
          c.v += G * dt; c.y += c.v * dt;
          if (c.y >= 0) { c.y = 0; if (!c.hit) { c.hit = true; const i = ticks.findIndex((t) => Math.abs(t.x + off - CX) < 3.4); if (i >= 0) knock(i, 0.9); ticks.forEach((t) => { if (Math.abs(t.x + off - CX) < 3.4) t.sink.v += 40; }); } if (c.v > 40) c.v *= -0.3; else { c.v = 0; c.falling = false; } }
        } else {
          const tgt = st.dragging && st.moved ? -3 : st.pressed ? 2.5 : st.hover ? -3 : 0;
          if (REDUCE) { c.y = tgt; c.v = 0; } else { c.v += (-500 * (c.y - tgt) - 30 * c.v) * dt; c.y += c.v * dt; }
        }
      }
    }

    function render() {
      tape.style.transform = `translateX(${offX().toFixed(2)}px)`;
      const shown = Math.round(clamp(st.value, MIN, MAX));
      setDigits(String(shown));
      for (const d of st.digits) d.el.style.transform = Math.abs(d.x) > 0.05 ? `translateY(${d.x.toFixed(2)}px)` : '';
      el.setAttribute('aria-valuenow', shown); el.setAttribute('aria-valuetext', shown + '%');
      for (const t of ticks) {
        const c = MID + t.sink.x;
        if (mode === 'domino') {
          // Every domino is 12 tall on a foot at 29; it pivots on its foot. Standing light, fallen dark.
          const foot = DFOOT + t.sink.x;
          t.l.setAttribute('y1', (foot - DH).toFixed(2)); t.l.setAttribute('y2', foot.toFixed(2));
          const a = t.dom.x + (t.dom.state === 'up' ? t.rot.x : 0);
          t.l.style.transform = Math.abs(a) > 0.05 ? `rotate(${a.toFixed(2)}deg)` : '';
          t.l.style.transformOrigin = `${t.x}px ${foot}px`;
          continue;
        }
        if (mode === 'ticks') {
          t.l.setAttribute('y1', (c - 3.5).toFixed(2)); t.l.setAttribute('y2', (c + 3.5).toFixed(2));
          if (t.state === 'off') t.bar.style.display = 'none';
          else { t.bar.style.display = ''; t.bar.setAttribute('y1', (c - 7 + t.y).toFixed(2)); t.bar.setAttribute('y2', (c + 7 + t.y).toFixed(2)); t.bar.style.opacity = t.op.toFixed(3); }
        } else {
          // B: the cursor presses its tick down from the top, so that tick's top moves, its foot stays.
          const top = c - t.h.x / 2 + (mode === 'cursor' ? t.sink.x : 0), bot = mode === 'cursor' ? MID + t.h.x / 2 : c + t.h.x / 2;
          t.l.setAttribute('y1', top.toFixed(2)); t.l.setAttribute('y2', bot.toFixed(2));
        }
        t.l.style.transform = Math.abs(t.rot.x) > 0.05 ? `rotate(${t.rot.x.toFixed(2)}deg)` : '';
        const foot = mode === 'pluck' || mode === 'ticks' ? MID + 7 : MID;
        t.l.style.transformOrigin = `${t.x}px ${foot}px`;
        if (t.bar) { t.bar.style.transform = t.l.style.transform; t.bar.style.transformOrigin = `${t.x}px ${foot}px`; }
      }
      if (mode === 'domino') I.rod.style.height = (46 + st.lift.x).toFixed(2) + 'px';
      if (mode === 'ticks' || mode === 'domino') I.rod.style.transform = Math.abs(st.swing.x) > 0.01 ? `rotate(${st.swing.x.toFixed(3)}deg)` : '';
      if (mode === 'pluck') {
        I.rod.style.transform = Math.abs(st.swing.x) > 0.01 ? `rotate(${st.swing.x.toFixed(3)}deg)` : '';
        I.rod.style.height = (31 + st.lift.x).toFixed(2) + 'px';
        I.bobEl.style.top = (30 + st.lift.x).toFixed(2) + 'px';
      } else if (mode === 'bob') {
        const hang = 31;
        I.g.setAttribute('transform', `rotate(${st.swing.x.toFixed(3)} ${ACX} 0)`);
        I.ln.setAttribute('y2', (hang + st.lift.x).toFixed(2));
        I.bob.setAttribute('transform', `translate(${ACX} ${(hang + st.lift.x).toFixed(2)})`);
      } else if (mode === 'cursor') {
        I.cur.setAttribute('transform', `translate(${ACX} ${(15 + st.cur.y).toFixed(2)})`);
      }
      el.classList.toggle('is-hover', st.hover && !st.pressed && !st.dragging);
      el.classList.toggle('is-press', st.pressed && !st.moved);
      el.classList.toggle('is-drag', st.dragging && st.moved);
      el.style.transform = Math.abs(st.pill.x) > 0.01 ? `translateY(${st.pill.x.toFixed(2)}px)` : '';
      card.style.transform = Math.abs(st.cdip.x) > 0.01 ? `translateY(${st.cdip.x.toFixed(2)}px)` : '';
    }

    // Input
    el.addEventListener('pointerenter', () => {
      st.hover = true;
      // C: as it is lifted, the line's foot taps the next domino once; that one shivers, nothing loops.
      if (mode === 'domino' && !st.dragging && !REDUCE) { st.swing.v -= 30; st.tapAt = st.time + 0.09; }
      if ((mode === 'ticks' || mode === 'domino') && !REDUCE) ticks.forEach((t) => { if (Math.abs(t.u - st.value) < 3 * STEP && !t.on) t.rot.v += rand(-50, 50); });   // the ticks near the line stir
    });
    el.addEventListener('pointerleave', () => { st.hover = false; });
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || e.target.closest('.r-reset')) return;
      el.setPointerCapture(e.pointerId);
      Object.assign(st, { dragging: true, pressed: true, moved: false, snapping: false, vel: 0, target: null, startX: e.clientX, lastX: e.clientX, startV: st.value, lastT: performance.now() });
      st.cur.falling = false;
      if (!REDUCE) st.pill.v += 4;
    });
    el.addEventListener('pointermove', (e) => {
      if (!st.dragging) return;
      if (!st.moved && Math.abs(e.clientX - st.startX) > 3) { st.moved = true; st.pressed = false; }
      let v = st.startV - (e.clientX - st.startX) / SC() / PX;
      if (v < MIN) v = MIN - Math.sqrt(MIN - v) * 1.5;
      if (v > MAX) v = MAX + Math.sqrt(v - MAX) * 1.5;
      const now = performance.now(), dt = Math.max(1, now - st.lastT) / 1000;
      st.vel = clamp(0.7 * st.vel + 0.3 * (-(e.clientX - st.lastX) / SC() / PX / Math.max(dt, 0.008)), -240, 240);
      st.lastX = e.clientX; st.lastT = now; st.value = v;
    });
    const up = () => {
      if (!st.dragging) return;
      const wasMoved = st.moved;
      Object.assign(st, { dragging: false, pressed: false, moved: false, snapping: true, settled: false });
      if (REDUCE || performance.now() - st.lastT > 80) st.vel = 0;
      if (mode === 'cursor' && !REDUCE) { st.cur.falling = wasMoved; st.cur.hit = !wasMoved; st.cur.v = 0; }
    };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('wheel', (e) => { const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; st.value = clamp(st.value + d / PX / 2, MIN, MAX); st.vel = 0; st.target = null; st.snapping = true; st.settled = false; e.preventDefault(); }, { passive: false });
    el.addEventListener('keydown', (e) => {
      const k = e.key, r = Math.round(st.value); let t = null;
      if (k === 'ArrowRight' || k === 'ArrowUp') t = r + (e.shiftKey ? 10 : 1);
      else if (k === 'ArrowLeft' || k === 'ArrowDown') t = r - (e.shiftKey ? 10 : 1);
      else if (k === 'PageUp') t = r + 10; else if (k === 'PageDown') t = r - 10;
      else if (k === 'Home') t = MIN; else if (k === 'End') t = MAX;
      if (t == null) return; e.preventDefault(); st.target = clamp(t, MIN, MAX); st.vel = 0; st.snapping = true; st.settled = false;
    });

    el.querySelector('.r-reset').addEventListener('click', () => { st.target = HOME; st.vel = 0; st.snapping = true; st.settled = false; });

    function reset() {
      Object.assign(st, { value: DEF, prev: DEF, vel: 0, sv: 0, target: null, settled: true, snapping: true });
      ticks.forEach((t) => { setCounted(t, countedNow(t), true); t.sink.x = t.sink.v = t.rot.x = t.rot.v = 0; });
      st.pill.x = st.pill.v = st.cdip.v = 0; st.pill.x = load() * 1.6; st.cdip.x = load() * 1.2;
      st.swing.x = st.swing.v = 0; st.cur.y = st.cur.v = 0; st.cur.falling = false; st.lastQ = st.time;
    }
    reset();

    function tick(dt) {
      if (!st.dragging && st.snapping) {
        const L = load();
        if (REDUCE) { st.value = Math.round(clamp(st.target ?? st.value, MIN, MAX)); st.target = null; st.vel = 0; }
        else if (st.target != null) {
          st.sv += (-170 * (st.value - st.target) - 26 * st.sv) * dt; st.value += st.sv * dt;
          if (Math.abs(st.value - st.target) < 0.02 && Math.abs(st.sv) < 0.5) { st.value = st.target; st.target = null; st.sv = 0; }
        } else if (Math.abs(st.vel) > 2 && st.value >= MIN && st.value <= MAX) {
          st.value += st.vel * dt; st.vel *= Math.exp(-(3 + 9 * L) * dt);          // heavier tape, shorter coast
        } else {
          const t = clamp(Math.round(st.value), MIN, MAX);
          st.sv += (-170 * (st.value - t) - 26 * st.sv) * dt; st.value += st.sv * dt; st.vel = 0;
          if (Math.abs(st.value - t) < 0.01 && Math.abs(st.sv) < 0.3) {
            st.value = t; st.sv = 0;
            if (!st.settled) { st.settled = true; if (!REDUCE) st.digits.forEach((d) => { d.v -= (0.8 + L) * rand(30, 70); }); }
          }
        }
      }
      const n = Math.max(1, Math.ceil(dt / (1 / 240)));
      for (let i = 0; i < n; i++) step(dt / n);
      render();
    }
    return { tick, reset };
  }

  const ruler = makeRuler(document.querySelector('.demo'));
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000) * speed; last = now;
    ruler.tick(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__rot = { reset() { ruler.reset(); } };
  const root = document.documentElement;
  addEventListener('pointerdown', () => root.classList.add('pointer-mode'), true);
  addEventListener('keydown', (e) => { if (!e.metaKey && !e.ctrlKey && !e.altKey) root.classList.remove('pointer-mode'); }, true);
})();
</script>
<script>
KIT.demo(async c => {
  const r = c.el('.ruler');
  // hover lifts the bob; scrub the tape: the line swings against the drag and the ticks it passes tip like dominoes
  const [ax, ay] = c.at(r, 0.6, 0.5);
  await c.move(ax + 10, ay + 40, 700);
  await c.move(ax, ay, 450);
  await c.wait(450);
  await c.down();
  await c.wait(140);
  await c.drag(ax - 70, ay, 1000);
  await c.wait(250);
  await c.up();
  await c.wait(900);
  // a quick flick the other way: it coasts and settles on a whole value
  await c.down();
  await c.drag(ax - 30, ay, 300);
  await c.up();
  await c.wait(1300);
  await c.leave();
}, { tint: '#1b1c20', reset() { window.__rot.reset(); } });
</script>
</body></html>
