<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#4b4b4b;--mute:#cacaca;--spring:cubic-bezier(.34,1.56,.64,1);
  --dots:radial-gradient(rgba(0,0,0,.07) .8px,transparent 1.15px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;font-family:Montserrat,system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
.wrap{max-width:1100px;margin:0 auto;padding:26px 16px 70px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 6px 14px}
header h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.01em}
header span{font-size:12px;color:#9a9a9a;font-weight:600}

.stage{position:relative;overflow:hidden;border-radius:26px;background-color:#efefef;
  display:grid;place-items:center;isolation:isolate}
.burst{position:absolute;inset:0;z-index:0;pointer-events:none}
.hero{height:440px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:14px}
.card .stage{height:300px}
.cap{display:flex;gap:8px;align-items:baseline;padding:9px 8px 2px;font-size:12.5px;line-height:1.45;font-weight:600;color:#8a8a8a}
.cap b{color:#333;font-weight:800;font-size:13px;white-space:nowrap}

/* states strip */
.states{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;margin-top:10px;overflow-x:auto;padding-bottom:4px}
.states .stage{height:120px;border-radius:20px}
.states .hold{transform:scale(.62);pointer-events:none}
.states .cap{justify-content:center;padding-top:6px}

/* ───────── button ───────── */
.btn{position:relative;z-index:2;display:flex;align-items:stretch;height:64px;cursor:pointer;user-select:none;-webkit-user-select:none;
  font-weight:700;font-size:26px;letter-spacing:-.02em;color:#4b4b4b;outline:none;
  transition:transform .5s var(--spring),translate .55s var(--spring),opacity .3s}
.face{position:absolute;inset:0;z-index:1;border-radius:26px;background:linear-gradient(180deg,#fff 0%,#fefefe 50%,#f7f7f7 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.03),0 6px 14px -6px rgba(0,0,0,.07),0 22px 40px -14px rgba(0,0,0,.13),inset 0 -4px 10px rgba(0,0,0,.018);
  transition:box-shadow .6s ease}
.main,.sep,.cnt{position:relative;z-index:2}
.main{display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0 22px}
.lbl{white-space:pre}
.sep{width:1.5px;background:rgba(0,0,0,.055);margin:0}
.cnt{display:flex;align-items:center;justify-content:center;min-width:72px;padding:0 20px;color:var(--mute);transition:color .6s ease}
.num{display:inline-flex}
.dg{display:inline-block;position:relative}
.dg>span{display:inline-block}
.plus{position:absolute;right:8px;top:-4px;font-size:19px;font-weight:800;color:var(--hot);pointer-events:none;opacity:0}

.ico{position:relative;flex:none;width:34px;height:34px;margin-right:12px;perspective:220px;
  transition:width .38s cubic-bezier(.6,0,.2,1),margin .38s cubic-bezier(.6,0,.2,1),opacity .18s}
.ico.hide{opacity:0}
.ico.gone{width:0!important;margin-right:0}
.ico>span{position:absolute;inset:0;transition:opacity .22s}
.ico svg,.fly svg,.fly img{display:block;width:100%;height:100%;overflow:visible}
.v3d{display:block;height:100%;width:auto;aspect-ratio:1/1;flex:none}
.ico>span,.fly,.tag span{display:flex;align-items:center;justify-content:center}
.v3d{transform:scale(1.32)}
.fly .v3d,.tag .v3d{transform:scale(1.32)}
.ico .gl,.ico .ok{opacity:0}
.gl svg,.fly svg,.tag svg{filter:drop-shadow(0 3px 2.5px rgba(120,80,0,.18))}
.v3d{filter:drop-shadow(0 3px 3px rgba(60,40,0,.13))}

@media (hover:hover){
  .btn:hover{transform:scale(1.22)}
  .card .btn:hover{transform:scale(1.14)}
  .btn:active{transform:scale(1.12)}
  .card .btn:active{transform:scale(1.06)}
  .btn:hover .ico .gl{opacity:1}
  .btn:hover .ico .fl{opacity:0}
  .btn.k-like:not(.on):hover .ico .gl>*{animation:beat .9s ease-in-out infinite}
  .btn.k-bell:hover .ico .gl>*{animation:wig .55s ease-in-out infinite;transform-origin:50% 20%}
  .btn.k-save:not(.on):hover .ico .gl>*{animation:nod .5s ease-in-out infinite alternate}
  .btn.k-get:not(.done):hover .ico .gl svg .arr{animation:bob .6s ease-in-out infinite alternate}
  .btn.k-fork:hover .ico .gl>*{animation:wig .7s ease-in-out infinite;transform-origin:50% 90%}
  .btn.k-no:hover .ico .gl>*{animation:shiver .12s linear infinite}
  .btn.on:hover .tag.hang{animation-duration:1.1s}
}
.btn:active .face{box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 14px -8px rgba(0,0,0,.16),inset 0 2px 4px rgba(0,0,0,.05)}
.btn:focus-visible .face{outline:2px solid #9bb7ff;outline-offset:3px}
.btn.on .ico .gl{opacity:1}.btn.on .ico .fl{opacity:0}
.btn.done .ico .ok{opacity:1}.btn.done .ico .gl,.btn.done .ico .fl{opacity:0}
.btn.hot .cnt{color:var(--hot)}
.btn.hot .face{box-shadow:0 1px 2px rgba(0,0,0,.025),0 6px 14px -6px rgba(0,0,0,.05),0 22px 44px -10px var(--glow),inset 0 -4px 10px rgba(0,0,0,.015)}

.fly{position:absolute;z-index:3;pointer-events:none}
.fly.behind{z-index:0}
.s3d{position:absolute;inset:0;transform-style:preserve-3d}
.s3d svg{position:absolute;inset:0}

/* bookmark tag */
.tag{position:absolute;top:calc(100% - 12px);width:30px;z-index:0;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;pointer-events:none}
.tag i{width:2px;height:24px;background:linear-gradient(#cfcfcf,#b5b5b5);border-radius:2px}
.tag span{width:30px;height:32px;margin-top:-3px}
.tag.hang{animation:sway 3.2s ease-in-out infinite}

/* get */
.liq{position:absolute;inset:4px 4px 4px 0;border-radius:0 20px 20px 0;overflow:hidden;pointer-events:none}
.water{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#cfe5ff,#a7cdff)}
.wave{position:absolute;bottom:calc(100% - 1px);left:0;width:200%;height:8px;animation:wv .9s linear infinite}
.pct{position:relative;z-index:2;color:#2a5bd7;font-weight:800}

/* twin (fork) */
.twin{position:absolute!important;pointer-events:none;margin:0}

@keyframes spinY{to{transform:rotateY(360deg)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}60%{transform:scale(1)}}
@keyframes wig{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(11deg)}}
@keyframes nod{to{transform:translateY(-3px) rotate(-6deg)}}
@keyframes bob{to{transform:translateY(7px)}}
@keyframes shiver{0%{transform:translate(0,0)}25%{transform:translate(1px,-.5px)}50%{transform:translate(-1px,.5px)}75%{transform:translate(.5px,1px)}}
@keyframes sway{0%,100%{rotate:-5deg}50%{rotate:5deg}}
@keyframes wv{to{transform:translateX(-50%)}}
@keyframes drip{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(12px);opacity:0}}
@keyframes pant{0%,100%{scale:1}50%{scale:1.035 .97}}
.btn.tired{animation:pant .5s ease-in-out infinite}

@media (max-width:560px){
  .hero{height:360px}
  .wrap{padding:18px 10px 60px}
  .btn{font-size:23px;height:58px}
  .ico{width:30px;height:30px;margin-right:10px}
  .cnt{min-width:62px;padding:0 16px}
  .main{padding:0 18px}
}

/* emoji icons */
.emo{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:30px;line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;user-select:none}
.fly .emo,.tag .emo{font-size:inherit}
.fly{font-size:30px}.tag span{font-size:28px}
.ico .gl,.ico .ok{transform-style:preserve-3d}
.k-follow .emo{font-size:30px}
@media (hover:hover){.btn.k-star:hover .ico .gl .emo{animation:spinY 1.1s linear infinite}}

/* ───────── iOS design language ───────── */
:root{--ios:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",system-ui,sans-serif;--sec:rgba(60,60,67,.6)}
body{background:#F2F2F7;font-family:var(--ios);color:#000;-webkit-font-smoothing:antialiased}
.wrap{padding-top:34px}
header{margin:0 6px 16px}
header h1{font-family:var(--ios);font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.1}
.stage{border-radius:26px;background-color:#fff}
.card .stage,.hero{box-shadow:0 0 0 .5px rgba(0,0,0,.04)}
.burst{background-image:none}
.cap{font-family:var(--ios);font-size:13px;font-weight:400;color:var(--sec);padding:8px 10px 2px}
.cap b{font-weight:600;color:#000;font-size:13px}
.states .cap{color:var(--sec)}
.btn{font-family:var(--ios);font-weight:600;font-size:21px;letter-spacing:-.02em;color:#000;height:58px}
.face{border-radius:999px;background:rgba(255,255,255,.58);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.35),inset 0 0 0 .5px rgba(255,255,255,.7),0 0 0 .5px rgba(0,0,0,.06),0 10px 30px -6px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.05)}
.face::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 46%),radial-gradient(120% 90% at 50% 120%,rgba(255,255,255,.35),transparent 60%);mix-blend-mode:soft-light}
.btn.hot .face{box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 .5px rgba(255,255,255,.7),0 0 0 .5px rgba(0,0,0,.05),0 14px 36px -8px var(--glow),0 2px 6px rgba(0,0,0,.05)}
.btn:active .face{background:rgba(255,255,255,.7);box-shadow:inset 0 1px 0 #fff,0 0 0 .5px rgba(0,0,0,.06),0 4px 12px -4px rgba(0,0,0,.14)}
.btn{transition:transform .5s cubic-bezier(.32,1.4,.5,1),translate .55s cubic-bezier(.32,1.3,.5,1),opacity .3s}
@media (hover:hover){.btn:hover{transform:scale(1.08)}.card .btn:hover{transform:scale(1.06)}.btn:active{transform:scale(.96)}.card .btn:active{transform:scale(.96)}}
.main{padding:0 20px 0 22px}
.ico{width:30px;height:30px;margin-right:9px}
.emo{font-size:26px}.fly{font-size:26px}
.sep{width:1px;background:rgba(60,60,67,.16);margin:15px 0}
.cnt{min-width:0;padding:0 22px 0 16px;color:var(--sec);font-weight:500;font-variant-numeric:tabular-nums}
.plus{font-weight:600;font-size:16px;top:-2px}
.tag i{background:#C7C7CC;width:1.5px}
.liq{inset:5px 5px 5px 0;border-radius:0 23px 23px 0}
.water{background:linear-gradient(rgba(0,122,255,.25),rgba(0,122,255,.38))}.wave path{fill:rgba(0,122,255,.25)}
.pct{color:#007AFF;font-weight:600}
.twin{font-size:.8em}
@media (max-width:560px){.btn{font-size:19px;height:52px}.main{padding:0 16px 0 18px}.cnt{padding:0 18px 0 13px}}

/* ───────── iOS: tinted → filled ───────── */
.card .stage,.hero{box-shadow:none}
.btn{font-size:20px;font-weight:600;height:52px;letter-spacing:-.015em;color:var(--ink)}
.face,.btn.hot .face,.btn:active .face{background:color-mix(in srgb,var(--hot) 14%,#fff);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;
  transition:background-color .35s cubic-bezier(.32,.72,0,1),filter .15s}
.face::before{display:none}
.btn.on .face,.btn.done .face{background:var(--hot)}
.btn.on,.btn.done{color:#fff}
.btn.on .cnt,.btn.done .cnt,.btn.on.hot .cnt,.btn.done.hot .cnt{color:rgba(255,255,255,.75)}
.lbl{transition:color .3s}
.sep{display:none}
.main{padding:0 8px 0 20px}
.cnt{padding:0 20px 0 2px;color:var(--ink);opacity:1;font-weight:500}
.cnt .num{opacity:.6}.btn.hot .cnt .num{opacity:1}
.btn.hot .cnt{color:var(--ink)}
.plus{color:var(--ink)}
.ico{color:var(--ink);width:24px;height:24px;margin-right:8px}
.btn.on .ico,.btn.done .ico{color:#fff}
.emo{font-size:22px}.fly{font-size:22px}
.k-follow .ico{width:32px!important}
@media (hover:hover){
  .btn:hover,.card .btn:hover{transform:none}
  .btn:hover .face{filter:brightness(.97)}
  .btn:not(.on):not(.done):hover .ico .gl{opacity:0}
  .btn:not(.on):not(.done):hover .ico .fl{opacity:1}
  .btn.k-star:not(.on):hover .ico .fl svg{animation:spinY 1.1s linear infinite}
  .btn:active,.card .btn:active{transform:scale(.97)}
}
.btn:active .face{filter:brightness(.92)}
.liq{inset:0;border-radius:0 26px 26px 0}
.water{background:linear-gradient(color-mix(in srgb,var(--hot) 30%,#fff),color-mix(in srgb,var(--hot) 45%,#fff))}
.wave path{fill:color-mix(in srgb,var(--hot) 30%,#fff)}
.pct{color:var(--ink)}
@media (max-width:560px){.btn{font-size:18px;height:48px}.main{padding:0 7px 0 17px}.cnt{padding:0 17px 0 2px}}
.btn.k-star.on{color:#1c1c1e}.btn.k-star.on .cnt{color:rgba(0,0,0,.55)}.btn.k-star.on .ico{color:#1c1c1e}

/* ───────── lumen ───────── */
:root{--ios:"Geist",-apple-system,"Helvetica Neue",Arial,sans-serif}
body{background:#0b0b0c;color:#ececee;font-family:var(--ios)}
header h1{color:#ececee;font-family:var(--ios);font-weight:600;font-size:28px;letter-spacing:-.02em}
.stage,.card .stage,.hero,.states .stage{background:#111113!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);border-radius:22px}
.cap,.states .cap{color:#7c7c84;font-family:var(--ios)}.cap b{color:#ececee;font-weight:500}
.btn,.btn.on,.btn.done,.btn.k-star.on{font-family:var(--ios);font-weight:500;font-size:19px;letter-spacing:-.01em;color:#ececee;height:52px}
.face,.btn.hot .face,.btn:active .face,.btn.on .face,.btn.done .face,.btn.on.hot .face{background:#18181b;filter:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),inset 0 1px 0 rgba(255,255,255,.05);transition:box-shadow .5s ease,background-color .3s}
@media (hover:hover){.btn:hover .face,.btn.on:hover .face,.btn.done:hover .face{background:#1e1e22;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.06)}}
.btn.on .face,.btn.done .face,.btn.on:hover .face,.btn.on.hot .face{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 60%,transparent),inset 0 0 24px -6px color-mix(in srgb,var(--acc) 40%,transparent),0 0 30px -8px color-mix(in srgb,var(--acc) 60%,transparent)!important}
.btn:active .face{background:#141417}
.ico,.btn.on .ico,.btn.done .ico,.btn.k-star.on .ico{color:#a9a9b0}
.btn.on .ico,.btn.done .ico{color:var(--acc)}
.btn.on .ico .fl svg path,.btn.on .ico .fl svg circle{fill:var(--acc)!important;stroke:var(--acc)}
.k-follow.on .ico .fl svg circle.eb{fill:#fff!important}
.ico .gl,.ico .ok{display:none!important}.ico .fl{display:block!important;opacity:1!important}
.btn.done .ico .fl{display:none!important}.btn.done .ico .ok{display:block!important;opacity:1!important}
.cnt,.btn.hot .cnt{color:#77777f}
.btn.on .cnt,.btn.done .cnt,.btn.on.hot .cnt{color:var(--acc)}
.cnt .num{opacity:1}
.plus{color:var(--acc)}
.bloom{position:absolute;inset:0;z-index:1;border-radius:999px;pointer-events:none;opacity:0;mix-blend-mode:screen}
.spark{position:absolute;z-index:3;pointer-events:none}.spark svg{display:block;width:100%;height:100%;overflow:visible}
.spark.outline svg path,.spark.outline svg circle,.spark.outline svg ellipse{fill:none!important;stroke:currentColor!important;stroke-width:9}
.oi{display:flex;width:100%;height:100%;color:inherit}.oi svg{width:100%;height:100%}
.fly{color:var(--acc)}.fly .oi{color:var(--acc)}
.tag span{width:26px;height:28px;color:var(--acc)}.tag i{background:#3a3a40}
.prog i{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 10%,transparent),color-mix(in srgb,var(--acc) 32%,transparent));box-shadow:inset -2px 0 0 var(--acc)}
.pct{color:var(--acc)}
.twin .face{background:#18181b}.twin{color:#ececee}
.ribbon{position:absolute;top:0;width:14px;height:32px;z-index:0;color:var(--acc);pointer-events:none;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--acc) 50%,transparent))}
.ribbon svg{display:block;width:100%;height:100%}
@media (hover:hover){.btn.k-like:hover .ico .fl svg{animation:spinY 1.1s linear infinite!important}}
.ico{perspective:200px}
.btn.k-star.on .cnt,.btn.on .cnt{color:var(--acc)!important}.btn.k-star.on{color:#ececee}

/* ───────── tilt + hover light ───────── */
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.seg{display:inline-flex;align-items:center;gap:2px;background:#161618;border-radius:999px;padding:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);font-family:var(--ios)}
.seg span{font-size:12px;color:#6c6c74;padding:0 10px 0 12px}
.seg button{all:unset;cursor:pointer;font-size:13px;padding:7px 13px;border-radius:999px;color:#8a8a92}
.seg button.act{background:#2a2a2e;color:#ececee}
.stage{perspective:700px}
.btn,.btn:hover,.card .btn:hover,.btn:active,.card .btn:active{transform:perspective(520px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1))!important;
  transition:transform .65s cubic-bezier(.2,1.5,.35,1),translate .55s var(--spring),opacity .3s!important;will-change:transform}
.btn.tilting{transition:transform .14s ease-out,translate .55s var(--spring),opacity .3s!important}
.btn .main .ico{transform:translate(calc(var(--mx,0)*4px),calc(var(--my,0)*3px));transition:transform .3s ease-out,width .38s cubic-bezier(.6,0,.2,1),margin .38s cubic-bezier(.6,0,.2,1),opacity .18s}
.btn .lbl{display:inline-block;transform:translate(calc(var(--mx,0)*2px),calc(var(--my,0)*1.5px));transition:transform .3s ease-out}
.btn .face{box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),inset 0 1px 0 rgba(255,255,255,.05),calc(var(--mx,0)*-10px) calc(10px + var(--my,0)*-8px) 26px -12px rgba(0,0,0,.75)}
.glare,.rim{position:absolute;inset:0;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .35s ease}
.glare{z-index:1;mix-blend-mode:screen;
  background:radial-gradient(64px 40px at var(--gx,50%) var(--gy,50%),color-mix(in srgb,var(--acc) 16%,transparent),transparent 72%),
             radial-gradient(26px 18px at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.06),transparent 75%)}
.rim{z-index:2;padding:1px;background:radial-gradient(60px 40px at var(--gx,50%) var(--gy,50%),color-mix(in srgb,var(--acc) 65%,transparent),transparent 72%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.btn.lit .glare,.btn.lit .rim{opacity:1}
.btn.bursting .glare,.btn.bursting .rim{opacity:0!important;transition:opacity .15s}

/* ───────── selected-state modes (override lumen glow) ───────── */
body.sel-c .btn.on .face,body.sel-c .btn.done .face{background:color-mix(in srgb,var(--acc) 16%,#141416)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),calc(var(--mx,0)*-10px) calc(10px + var(--my,0)*-8px) 26px -12px rgba(0,0,0,.75)!important}
body.sel-c .btn.on,body.sel-c .btn.done{color:var(--acc)!important}
body.sel-c .btn.on .cnt,body.sel-c .btn.done .cnt{color:color-mix(in srgb,var(--acc) 70%,transparent)!important}

body.sel-e .btn.on .face,body.sel-e .btn.done .face{background:radial-gradient(ellipse 70px 44px at var(--ix,30px) 50%,color-mix(in srgb,var(--acc) 38%,transparent) 0%,color-mix(in srgb,var(--acc) 18%,transparent) 38%,color-mix(in srgb,var(--acc) 6%,transparent) 68%,transparent 100%),#19191c!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),calc(var(--mx,0)*-10px) calc(10px + var(--my,0)*-8px) 26px -12px rgba(0,0,0,.75)!important}
body.sel-e .btn.on .ico,body.sel-e .btn.done .ico{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--acc) 70%,transparent))}
body.sel-e .btn.on .cnt,body.sel-e .btn.done .cnt{color:#b4b4bb!important}

body.sel-f .btn.on .face,body.sel-f .btn.done .face{background:#1c1c20!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),calc(var(--mx,0)*-10px) calc(10px + var(--my,0)*-8px) 26px -12px rgba(0,0,0,.75)!important}

/* ───────── Lumen button component ───────── */
.lb{--a:#ffd84a;--on:#1b1606;--tx:#ffd84a;--tintbg:color-mix(in srgb,var(--a) 16%,#141416);
  all:unset;box-sizing:border-box;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:999px;
  font-family:var(--ios);font-size:17px;font-weight:500;line-height:22px;letter-spacing:-.01em;cursor:pointer;user-select:none;isolation:isolate;
  transform:perspective(420px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));transition:transform .65s cubic-bezier(.2,1.5,.35,1),background-color .25s,color .25s,box-shadow .25s,filter .25s}

.lb::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;opacity:0;transition:opacity .3s;pointer-events:none;
  background:radial-gradient(60px 38px at var(--gx,30%) var(--gy,35%),var(--glow),transparent 72%)}
.lb:hover::before,.lb.is-hover::before{opacity:1}
/* primary */
.lb.p{background:var(--a);color:var(--on);--glow:rgba(255,255,255,.45)}
.lb.p:hover,.lb.p.is-hover{filter:brightness(1.04)}
.lb.p:active,.lb.p.is-press{--sc:.96;filter:brightness(.9);box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
/* secondary */

.lb.s:active,.lb.s.is-press{--sc:.96;background:color-mix(in srgb,var(--a) 26%,#141416)}
/* tertiary */

.lb.t3:active,.lb.t3.is-press{--sc:.96;background:rgba(255,255,255,.07)}

.lb[disabled]::before{display:none}

.light .lb.t3:hover,.light .lb.t3.is-hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,#F5B400 70%,rgba(0,0,0,.16));background:rgba(0,0,0,.02)}

<script type="module">

function starPath(cx=50,cy=54,R=40,r=19){let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(2)+' '+(cy+rr*Math.sin(a)).toFixed(2)}return d+'Z'}
const SP=starPath();
const HL=(x=36,y=31)=>`<ellipse cx="${x}" cy="${y}" rx="12" ry="6.5" fill="#fff" opacity=".85" filter="url(#soft)" transform="rotate(-28 ${x} ${y})"/>`;

const FLAT='currentColor';

const HEART='M50 84 C22 66 10 48 15 31 C20 16 40 13 50 29 C60 13 80 16 85 31 C90 48 78 66 50 84Z';

const CHECK='M22 52 L42 72 L78 30';

const star3d=spin=>{let edges='';for(let i=5;i>=1;i--)edges+=`<svg viewBox="0 0 100 100" style="transform:translateZ(${-i*1.25}px)">${shapeFill(SP,'#d99c00',12)}</svg>`;
  return `<div class="s3d">${edges}<svg viewBox="0 0 100 100">${shapeFill(SP,'url(#gStar)',12)}${shaded(SP,12)}${HL(38,36)}</svg></div>`};
const eyes=(fl)=>{const ball=fl?'#fff':'url(#gEye)',pup=fl?'currentColor':'#232323',st=fl?'currentColor':'#cdcdcd';
  const e=cx=>`<circle class="eb" cx="${cx}" cy="50" r="21" fill="${ball}" stroke="${st}" stroke-width="1.6"/><g class="pp" data-cx="${cx}"><circle cx="${cx}" cy="51" r="9" fill="${pup}"/><circle cx="${cx-3}" cy="48" r="2.6" fill="#fff" opacity="${fl?.5:1}"/></g>`;
  return S(e(29)+e(71),'4 26 92 50')};
const sad=fl=>{const f=fl?'#bdbdbd':'url(#gSad)',k=fl?'#fff':'#3b4556';
  return S(`<circle cx="50" cy="50" r="40" fill="${f}"/>${fl?'':`<circle cx="50" cy="50" r="40" fill="url(#gShade)"/>`}<ellipse cx="36" cy="45" rx="4.5" ry="6" fill="${k}"/><ellipse cx="64" cy="45" rx="4.5" ry="6" fill="${k}"/><path d="M34 71 Q50 58 66 71" fill="none" stroke="${k}" stroke-width="5.5" stroke-linecap="round"/>${fl?'':HL(34,28)}`)};

const ICON={
  star:{fl:S(shapeFill(SP,FLAT,12)),gl:star3d(),fly:S(shapeFill(SP,'url(#gStar)',12)+shaded(SP,12)+HL(38,36))},

};

/* ───────── helpers ───────── */
function pos(el,ref){let x=0,y=0,n=el;while(n&&n!==ref){x+=n.offsetLeft;y+=n.offsetTop;n=n.offsetParent}
  if(el.classList&&el.classList.contains('cnt')&&ref&&ref._mw){const m=ref.querySelector('.main');x+=ref._mw-m.offsetWidth}return{x,y,w:el.offsetWidth,h:el.offsetHeight}}
function center(el,stage){const a=el.getBoundingClientRect(),s=stage.getBoundingClientRect();return[a.left+a.width/2-s.left,a.top+a.height/2-s.top]}
function fly(b,html,x,y,w,h,cls=''){const f=document.createElement('div');f.className='fly '+cls;f.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;if(html instanceof Node)f.appendChild(html);else f.innerHTML=html;b.appendChild(f);return f}
function setNum(el,n){el.dataset.n=n;el.innerHTML=[...String(n)].map(c=>`<span class="dg"><span>${c}</span></span>`).join('')}
function roll(el,to,dir=1){
  const a=el.dataset.n,b=String(to);
  if(a.length!==b.length){setNum(el,to);return}
  el.dataset.n=to;
  [...b].forEach((ch,i)=>{
    if(a[i]===ch)return;

  ${T('Disabled','opacity <code>0.36</code>, saturation <code>0.3</code>, no tilt or light')}
  ${T('Toggle off','neutral surface <code>#18181B</code> / <code>#F1F1F3</code>, no stroke, grey icon <code>#A9A9B0</code>')}
  ${T('Toggle on / group selected','switches to the secondary tint; the icon is lit in the button’s own color')}
  <tr><td colspan="2"><h4>Motion</h4></td></tr>
  ${T('Follow','<code>140ms ease-out</code> while the cursor moves')}
  ${T('Settle','<code>650ms cubic-bezier(.2,1.5,.35,1)</code> spring back when the cursor leaves')}
  ${T('Press → on','icon leaves, travels and lands in the count (<code>~1.1s</code>); count rolls, <code>+1</code> floats <code>1.3s</code>')}
 </table></div></div>`;

/* ───────── tilt + hover light ───────── */
document.querySelectorAll('#selseg button').forEach(x=>x.onclick=()=>{document.querySelectorAll('#selseg button').forEach(y=>y.classList.toggle('act',y===x));document.body.classList.remove('sel-c','sel-e','sel-f');document.body.classList.add('sel-'+x.dataset.m)});
document.querySelectorAll('#modeseg button').forEach(x=>x.onclick=()=>{document.querySelectorAll('#modeseg button').forEach(y=>y.classList.toggle('act',y===x));document.body.classList.toggle('light',x.dataset.m==='light')});
const ACCL={forkb:['#A445F2','#7322B8'],share:['#0EA5E9','#0369A1'],star:['#F5B400','#8A6100'],like:['#FF2D55','#B8173A'],save:['#14B8A6','#0B7468'],follow:['#6E56F8','#4C35C9'],bell:['#65A30D','#3F6212'],fork:['#A445F2','#7322B8'],get:['#1F7AFF','#0B57C9'],no:['#7C8494','#4F5664']};
all.forEach(c=>{const k=c.cfg.icon;c.b.style.setProperty('--accL',ACCL[k][0]);c.b.style.setProperty('--txtL',ACCL[k][1])});
function rigTilt(b){
  const g=document.createElement('div');g.className='glare';const r=document.createElement('div');r.className='rim';
  b.querySelector('.face').after(g);b.appendChild(r);
  const setIx=()=>{const ico=b.querySelector('.ico');if(ico&&!ico.classList.contains('gone')){const p=pos(ico,b);b.style.setProperty('--ix',(p.x+p.w/2)+'px')}};setIx();
  b.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const q=b.getBoundingClientRect();
    const nx=Math.max(-.5,Math.min(.5,(e.clientX-q.left)/q.width-.5)),ny=Math.max(-.5,Math.min(.5,(e.clientY-q.top)/q.height-.5));
    const sx=b.offsetWidth/q.width;
    b.style.setProperty('--ry',(nx*34).toFixed(2)+'deg');b.style.setProperty('--rx',(-ny*36).toFixed(2)+'deg');
    b.style.setProperty('--mx',(nx*2).toFixed(3));b.style.setProperty('--my',(ny*2).toFixed(3));
    b.style.setProperty('--gx',((e.clientX-q.left)*sx).toFixed(1)+'px');b.style.setProperty('--gy',((e.clientY-q.top)*sx).toFixed(1)+'px');
    b.classList.add('tilting','lit');clearTimeout(b._tt);b._tt=setTimeout(()=>b.classList.remove('tilting'),160)});
  b.addEventListener('pointerleave',()=>{['--rx','--ry','--mx','--my'].forEach(v=>b.style.setProperty(v,0));b.style.setProperty('--rx','0deg');b.style.setProperty('--ry','0deg');b.classList.remove('lit','tilting');setIx()});
  b.addEventListener('pointerdown',()=>b.style.setProperty('--sc',.96));
  addEventListener('pointerup',()=>b.style.setProperty('--sc',1));
}
all.forEach(c=>rigTilt(c.b));

/* states strip (frozen) */
const ST=[['Default',b=>{}],['Hover',b=>{b.querySelector('.fl').style.opacity=0;b.querySelector('.gl').style.opacity=1}],
  ['Pressed',b=>{b.style.transform='scale(.96)';b.querySelector('.face').style.boxShadow='0 1px 2px rgba(0,0,0,.06),inset 0 2px 4px rgba(0,0,0,.06)';b.querySelector('.fl').style.opacity=0;b.querySelector('.gl').style.opacity=1}],
  ['Starred',b=>{b.classList.add('on');b.querySelector('.ico').classList.add('gone','hide');b.querySelector('.lbl').textContent='Starred';setNum(b.querySelector('.num'),39)}],
  ['Disabled',b=>{b.style.opacity=.42;b.style.cursor='not-allowed'}]];
const sw=document.getElementById('states');const minis=[];
for(const[n,fn]of ST){const d=document.createElement('div');d.innerHTML=`<div class="stage"><div class="hold"></div></div><div class="cap">${n}</div>`;sw.appendChild(d);
  const b=build(B.star);b.style.pointerEvents='none';d.querySelector('.hold').appendChild(b);minis.push([b,fn])}

/* eyes follow the pointer */
let px=innerWidth/2,py=innerHeight/2,raf=0;
addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;if(!raf)raf=requestAnimationFrame(look)},{passive:true});
function look(){raf=0;for(const v of VIEWS){if(v.key!=='follow'||!v.c.isConnected)continue;const r=v.c.getBoundingClientRect();if(!r.width)continue;
  const dx=px-(r.left+r.width/2),dy=py-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(1,d/180);v.look={x:dx/d*k,y:-dy/d*k};v.dirty=true}document.querySelectorAll('.k-follow svg, .fly svg').forEach(svg=>{svg.querySelectorAll('.eb').forEach(eb=>{
  const pp=eb.nextElementSibling;if(!pp||!pp.classList.contains('pp'))return;const r=eb.getBoundingClientRect();if(!r.width)return;
  const dx=px-(r.left+r.width/2),dy=py-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(1,d/160)*9;pp.setAttribute('transform',`translate(${(dx/d*k).toFixed(2)} ${(dy/d*k).toFixed(2)})`)})})}

/* size after font load */
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{all.forEach(c=>sizeMain(c.b,c.cfg));minis.forEach(([b,fn])=>{sizeMain(b,B.star);fn(b)});look()});
</script>
</body>
