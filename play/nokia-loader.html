<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fling Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Instrument+Sans:wght@400;500&display=swap">
<style>
:root{
  --page:#DFDBD7;
  --glass-1:#F7F9F9; --glass-2:#E4E9E9; --glass-3:#CDD4D4; --glass-edge:#A9B2B2; --glass-line:#BCC4C4;
  --screen:#6F7C66; --window:#7F8986;
  --ink-key:#6B7373;
  --caption:#3A3D3C;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--caption);font-family:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  margin:0;padding:0;overflow:hidden;}
html,body{height:100%}
/* full-window frame; fixed so the page height never feeds back into the stage size */
.wrap{position:fixed;inset:0}
/* 4:3 stage: the whole phone at rest; hovering leans in on the screen */
.stage{position:absolute;inset:0;overflow:hidden;background:var(--page);container-type:size}


/* ---------- handset: photo, with the LCD placed in its screen window ---------- */
.handset{position:absolute;top:50%;left:50%;height:min(96cqh, 100cqw * 1560 / 900);aspect-ratio:900/1560;
  transform-origin:50% 41.79%;transform:translate(-50%, -50%);transition:transform 3s cubic-bezier(.45,0,.25,1);}
.stage.zoom .handset{transform:translate(-50%, -50%) translateY(13.5%) scale(1.5);}
@media (prefers-reduced-motion: reduce){ .handset{transition:none} }
.shell{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;user-select:none}
.screen{position:absolute;z-index:1;left:31.23%;top:33.98%;width:37.53%;height:15.62%;background:var(--screen);justify-content:center;
  display:flex;align-items:center;overflow:hidden;}
.screen::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 7px 9px -6px rgba(20,24,18,.45), inset 0 0 6px -2px rgba(20,24,18,.35);}
#lcd{display:block;flex:none;width:100%;max-width:100%;aspect-ratio:166/121;touch-action:none;background:var(--screen)}
#lcd.grab{cursor:grab} #lcd.grabbing{cursor:grabbing} #lcd.key{cursor:pointer}
#lcd:focus-visible{outline:none}
.screen:has(#lcd:focus-visible){box-shadow:inset 0 0 0 2px #3C4630}
.hot{position:absolute;z-index:3;border:0;padding:0;background:transparent;cursor:pointer;border-radius:50%;-webkit-tap-highlight-color:transparent;transition:background .08s}
.hot:hover{background:rgba(255,255,255,.12)}
.hot:active{background:rgba(0,0,0,.12)}
.hot:focus-visible{outline:2px solid #5E6B58;outline-offset:1px}
#kNavi{left:40.1%;top:52.7%;width:19.4%;height:3%}
#kLeft{left:31.5%;top:53.5%;width:10.8%;height:5.7%;border-radius:40% 30% 50% 40%}
#kRight{left:53.9%;top:53.2%;width:15.5%;height:7%;border-radius:30% 40% 40% 50%}
</style>

  const tail = yy => BIRD_IDLE[yy] ? BIRD_IDLE[yy].slice(0, 2) : '..';
  return (y >= 3 && y <= 7 ? tail(y + 1) : r.slice(0, 2)) + r.slice(2);
});
const BIRD_HIT = BIRD_IDLE.map((r, y) => {             // X eyes
  const a = r.split('');
  if(y >= 4 && y <= 6) for(let x = 5; x <= 8; x++) a[x] = '.';
  [[5,4],[7,4],[6,5],[5,6],[7,6]].forEach(([x, yy]) => { if(yy === y) a[x] = '#'; });
  return a.join('');
});
const rot90 = rows => rows[0].split('').map((_, x) => rows.map(r => r[x]).reverse().join(''));
const BIRD_FALL1 = rot90(BIRD_HIT), BIRD_FALL2 = rot90(BIRD_FALL1);
const BIRD_FLAT = BIRD_HIT.filter((_, y) => y !== 2 && y !== 8);   // squashed on the ground
const BIRD = BIRD_IDLE;
const MAILBOX = [
"............####","............####","............#...","............#...","............#...",
"...##########...",".##.......#oo##.","#.........#oooo#","#.........#oooo#","#.........#o#oo#","#.........#oooo#",
"#.........#oooo#","#.........#oooo#","################",
"......###.......","......###.......","......###.......","......###.......","......###.......","......###.......",
"......###.......","......###.......","......###.......","......###.......","....#######....."];

/* =========================================================
   LAYOUT (LCD pixels)
   ========================================================= */
const W = CONFIG.screen.w, H = CONFIG.screen.h, S = CONFIG.screen.scale;
const M = 9;
const STATUS_Y = 8;                               // status bar: signal · clock · battery
const TOP_Y = 29, BOTTOM_Y = 99;                  // top of cap height
const GROUND = 83;                                 // slingshot, mailbox and progress line share this baseline
const SLING_X = 16, SLING_Y = GROUND - SLING.length;
const MAIL_X = 134, MAIL_Y = GROUND - MAILBOX.length;
const BM = M;                                      // bottom row lines up with the slingshot / mailbox edges
const RAIL_Y = GROUND - 1;                         // dotted progress line along the feet
const RAIL_START = SLING_X + 17, RAIL_END = MAIL_X + 3;
const BIRD_W = BIRD[0].length, BIRD_H = BIRD.length;
const REST = { x: SLING_X + 8.5, y: SLING_Y + 1.5 };  // sits in the fork

const cvs = document.getElementById('lcd');
cvs.width = W*S; cvs.height = H*S;
const ctx = cvs.getContext('2d');
const caption = {};                                // (step captions removed from the page)
/* LCD layers, drawn once: BASE = panel colour with a soft falloff; OVER = grain + edge shade on top */
function layer(){ const c = document.createElement('canvas'); c.width = cvs.width; c.height = cvs.height; return c; }
const BASE = layer(), OVER = layer();
(() => {
  const b = BASE.getContext('2d'), o = OVER.getContext('2d'), w = BASE.width, h = BASE.height;
  const rg = b.createRadialGradient(w*.45, h*.42, h*.1, w*.5, h*.5, w*.72);
  rg.addColorStop(0, CONFIG.colors.bg); rg.addColorStop(1, CONFIG.colors.edge);
  b.fillStyle = rg; b.fillRect(0, 0, w, h);
  // grain
  const id = o.createImageData(w, h), d = id.data;
  for(let i = 0; i < d.length; i += 4){ const v = Math.random() < .5 ? 0 : 255; d[i] = d[i+1] = d[i+2] = v; d[i+3] = Math.random()*255*CONFIG.lcd.grain; }
  o.putImageData(id, 0, 0);
  const vg = o.createRadialGradient(w*.5, h*.5, h*.45, w*.5, h*.5, w*.66);
  vg.addColorStop(0, 'rgba(30,40,28,0)'); vg.addColorStop(1, `rgba(30,40,28,${CONFIG.lcd.vignette})`);
  o.fillStyle = vg; o.fillRect(0, 0, w, h);
})();


/* =========================================================
   DRAWING
   ========================================================= */
// LCD pixel with slight tone variation, like an old panel
const hash = (x, y) => { let h = (x*374761393 + y*668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
function px(x, y, c){
  x = Math.round(x); y = Math.round(y);
  ctx.globalAlpha = c ? 1 : .88 + hash(x, y)*.12;     // slight unevenness, like an old panel
  ctx.fillStyle = c || CONFIG.colors.fg;
  const g = CONFIG.lcd.gap; ctx.fillRect(x*S, y*S, S - g, S - g);
  ctx.globalAlpha = 1;
}
function sprite(rows, x, y){ rows.forEach((row, r) => { for(let i=0;i<row.length;i++){ const c = row[i];
  if(c === '#') px(x+i, y+r); else if(c === 'o') px(x+i, y+r, CONFIG.colors.half);
  else if(c === 'w'){ const X = Math.round(x+i)*S, Y = Math.round(y+r)*S; ctx.drawImage(BASE, X, Y, S, S, X, Y, S, S); } } }); }
// mark cells enclosed by the outline as 'w' (opaque panel colour)
function solid(rows){
  const h = rows.length, w = rows[0].length, out = rows.map(r => r.split('')), seen = new Set(), q = [];
  for(let x=0;x<w;x++){ q.push([x,0],[x,h-1]); } for(let y=0;y<h;y++){ q.push([0,y],[w-1,y]); }
  while(q.length){ const [x,y] = q.pop(); const k = x+','+y;
    if(x<0||y<0||x>=w||y>=h||seen.has(k)||out[y][x] !== '.') continue; seen.add(k); q.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]); }
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(out[y][x] === '.' && !seen.has(x+','+y)) out[y][x] = 'w';
  return out.map(r => r.join(''));
}
function dash(x0, y0, x1, y1){ const n = Math.max(Math.abs(x1-x0), Math.abs(y1-y0)); for(let i=0;i<=n;i++) px(x0 + (x1-x0)*i/n, y0 + (y1-y0)*i/n); }

// VT323 text; size set so that capital letters are CONFIG.font.cap LCD pixels tall
let capRatio = 0.62;
function measureCap(){ ctx.font = `100px ${CONFIG.font.family}, monospace`; const m = ctx.measureText('H'); if(m.actualBoundingBoxAscent) capRatio = m.actualBoundingBoxAscent/100; }
function setFont(k=1){ ctx.font = `${Math.round(CONFIG.font.cap*k*S/capRatio)}px ${CONFIG.font.family}, monospace`; }
function textWidth(str, k=1){ setFont(k); return ctx.measureText(str).width / S; }
function text(str, x, y, opts={}){
  const k = opts.k || 1; setFont(k);
  ctx.fillStyle = opts.c || CONFIG.colors.fg; ctx.textBaseline = 'alphabetic'; ctx.textAlign = opts.align === 'right' ? 'right' : 'left';
  ctx.fillText(str, Math.round(x*S), Math.round((y + CONFIG.font.cap*k)*S));
  ctx.textAlign = 'left';
}
function softKey(label, side){
  const w = textWidth(label), x = side === 'left' ? BM : W - BM - w;
  const box = { x:x - 2, y:BOTTOM_Y - 2, w:w + 4, h:CONFIG.font.cap + 4 };
  const lit = hover === side || (press && press.side === side) || navDown === side;
  if(lit){                                         // hover / press: black block, pale text
    ctx.fillStyle = CONFIG.colors.fg; ctx.fillRect(Math.round(box.x*S), Math.round(box.y*S), Math.round(box.w*S), Math.round(box.h*S));
    text(label, x, BOTTOM_Y, {c:CONFIG.colors.bg});
  } else text(label, x, BOTTOM_Y);
  return {x:box.x - 3, y:box.y - 4, w:box.w + 6, h:box.h + 8};
}


/* ---------- status bar (after the reference handset screen) ---------- */
const SIGNAL = ["................###","................###","............###.###","............###.###","........###.###.###","........###.###.###","....###.###.###.###","###.###.###.###.###","###.###.###.###.###"];
const BATTERY = [".#################..","#.................#.","#.###.###.###.###.##","#.###.###.###.###.##","#.###.###.###.###.##","#.###.###.###.###.##","#.................#.",".#################.."];
function clockText(){ const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
const ENVELOPE = ["###########","##.......##","#.#.....#.#","#..#...#..#","#...#.#...#","#....#....#","#.........#","###########"];
const SEND_ARROW = ["#..","##.","###","##.","#.."];
function statusBar(){
  sprite(SIGNAL, M, STATUS_Y);
  if(state === 'sending' || state === 'game' || state === 'made'){      // outgoing-message indicator
    sprite(ENVELOPE, M + 23, STATUS_Y + 1);
    if(state !== 'game' || Math.floor(clock*2) % 2 === 0) sprite(SEND_ARROW, M + 35, STATUS_Y + 2.5);
  }
  sprite(BATTERY, W - M - 20, STATUS_Y);
  const t = clockText(), k = .8;
  text(t, W/2 - textWidth(t, k)/2, STATUS_Y + 1.5, {k});
}

/* =========================================================
   STATE
   ========================================================= */
let state = 'confirm';                 // confirm | sending | game | made | sent
let stateAt = 0, clock = 0;
let press = null, keys = {}, hover = null, navDown = null;
let pct = 0, progIdx = 0, progPhase = 'hold', progT = 0;
const bird = { x:REST.x, y:REST.y, vx:0, vy:0, mode:'idle', shakeUntil:0, resetAt:0 };
let dragging = false, trail = [], lastTrail = null, hit = null, mailHit = null;

const VMAX = () => Math.sqrt(CONFIG.launch.power * (MAIL_X - REST.x) * CONFIG.launch.gravity);
const markerX = () => Math.round(RAIL_START + (pct/100) * (RAIL_END - RAIL_START));
const wallX = () => Math.max(markerX(), REST.x + BIRD_W/2 + 2);     // the invisible wall above the marker
const statusText = () => CONFIG.status.find(s => pct <= s.max).text;

const CAPTIONS = {12:'4. 12% — first launch', 24:'5. 24% — hits the wall', 42:'6. 42% — fly further', 63:'7. 63% — almost there', 87:'8. 87% — very close', 100:'9. 100% — wall disappears'};
function go(next){
  state = next; stateAt = clock; press = null;
  if(next === 'confirm') caption.textContent = '1. Select and send';
  if(next === 'sending') caption.textContent = '2. Start sending';
  if(next === 'game'){ resetGame(); caption.textContent = '3. 0% — initial state'; }
  if(next === 'made') caption.textContent = '10. Bird reaches the mailbox';
  if(next === 'sent') caption.textContent = '11. Success message';
}
function resetGame(){ pct = 0; progIdx = 0; progPhase = 'hold'; progT = 0; hit = null; mailHit = null; resetBird(); }
function resetBird(){ Object.assign(bird, {x:REST.x, y:REST.y, vx:0, vy:0, mode:'idle', shakeUntil:0, resetAt:0, hitAt:0}); trail = []; lastTrail = null; }
function pressKey(side){ const k = keys[side]; if(!k || press) return; if(side === 'right' && state === 'confirm') zoomIn(true); press = { side, until: clock + .15, action: k.action }; }

/* =========================================================
   UPDATE
   ========================================================= */
function stepProgress(dt){
  const P = CONFIG.progress, stops = P.stops;
  if(progIdx >= stops.length - 1){ pct = 100; return; }
  progT += dt*1000;
  if(progPhase === 'hold'){ if(progT >= P.holdMs){ progPhase = 'ramp'; progT = 0; } return; }
  const a = stops[progIdx], b = stops[progIdx+1], k = Math.min(1, progT / P.rampMs);
  pct = Math.floor(a + (b - a)*k);
  if(k >= 1){ progIdx++; pct = b; progPhase = 'hold'; progT = 0; if(CAPTIONS[b]) caption.textContent = CAPTIONS[b]; }
}
function launch(vx, vy){ Object.assign(bird, {mode:'fly', vx, vy}); trail = []; lastTrail = {x:bird.x + 5, y:bird.y}; }

function update(dt){
  clock += dt;
  if(press && clock >= press.until){ const a = press.action; press = null; a && a(); }
  if(state === 'sending' && (clock - stateAt)*1000 >= CONFIG.sendingHoldMs) go('game');
  if(state === 'made' && (clock - stateAt)*1000 >= CONFIG.sentDelayMs) go('sent');
  if(state !== 'game' && state !== 'made') return;
  if(state === 'game') stepProgress(dt);

  if(bird.mode === 'fly' || bird.mode === 'fall'){
    bird.vy += CONFIG.launch.gravity*dt; bird.x += bird.vx*dt; bird.y += bird.vy*dt;
    if(bird.mode === 'fly'){
      if(Math.hypot(bird.x - lastTrail.x, bird.y - lastTrail.y) >= 4.4){ trail.push({x:bird.x, y:bird.y}); lastTrail = {x:bird.x, y:bird.y}; }
      const front = bird.x + BIRD_W/2;
      if(pct < 100 && front >= wallX()) hitWall();
      else if(pct >= 100 && front >= MAIL_X && bird.y + BIRD_H/2 >= MAIL_Y - 3 && bird.y <= GROUND) reachMailbox();
    }
    if(bird.y + BIRD_H/2 >= GROUND){
      bird.y = GROUND - BIRD_H/2; bird.vy = 0; bird.vx = 0;
      if(bird.mode === 'fly'){ bird.mode = 'fall'; bird.resetAt = clock + .9; }
    }
    if(bird.x > W + 10 || bird.x < -10) bird.resetAt = Math.min(bird.resetAt || 1e9, clock + .2);
    if(bird.resetAt && clock >= bird.resetAt && state === 'game') resetBird();
  }
}
function birdFrame(){
  if(bird.mode === 'fly') return Math.floor(clock*10) % 2 ? BIRD_FLAP : BIRD_IDLE;
  if(bird.mode === 'fall'){
    if(!bird.hitAt) return BIRD_IDLE;                         // plain landing, no wall
    const t = clock - bird.hitAt;
    if(t < .22) return BIRD_HIT;                               // hit wall 1–2
    if(bird.vy !== 0 || bird.vx !== 0) return Math.floor(t*8) % 2 ? BIRD_FALL2 : BIRD_FALL1;
    return BIRD_FLAT;                                          // fall 3: on the ground
  }
  return BIRD_IDLE;
}
function hitWall(){
  const wx = wallX();
  bird.x = wx - BIRD_W/2 - 1; bird.vx = -8; bird.vy = Math.max(0, bird.vy*.15);
  bird.mode = 'fall'; bird.hitAt = clock; bird.shakeUntil = clock + .25; bird.resetAt = clock + 1.3;
  hit = { x:wx, y:Math.round(bird.y), until: clock + .5 };
}
function reachMailbox(){
  bird.mode = 'stop'; bird.x = MAIL_X - BIRD_W/2 - 2;
  mailHit = { until: clock + 1.1, shakeUntil: clock + .4 };
  go('made');
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  ctx.drawImage(BASE, 0, 0);
  keys = {};
  const big = CONFIG.font.big;
  statusBar();

  if(state === 'confirm'){
    text('SEND THIS', M, 27, {k:big}); text('MESSAGE?', M, 46, {k:big});
    keys.left  = { ...softKey('BACK', 'left'), action: null };
    keys.right = { ...softKey('SEND', 'right'), action: () => go('sending') };
  }
  else if(state === 'sending'){
    text('SENDING...', M, 27, {k:big});
    keys.right = { ...softKey('CANCEL', 'right'), action: () => go('confirm') };
  }
  else if(state === 'game' || state === 'made'){
    text('SENDING', M, TOP_Y);
    text(pct + '%', W - M, TOP_Y, {align:'right'});

    // slingshot and mailbox share the same ground line
    sprite(dragging ? SLING_PULLED : SLING, SLING_X, SLING_Y);
    if(bird.mode === 'idle' && dragging){   // band stretches from both arms to the bird
      dash(SLING_X + 1, SLING_Y + 2, bird.x - 5, bird.y + 1);
      dash(SLING_X + 15, SLING_Y + 2, bird.x - 5, bird.y + 1);
    }
    const shake = mailHit && clock < mailHit.shakeUntil ? (Math.floor(clock*24) % 2 ? 1 : -1) : 0;
    sprite(MAILBOX, MAIL_X + shake, MAIL_Y);

    // progress line underneath, with the marker
    // dotted progress line: dots fill in from the slingshot as the task advances; the next dot blinks
    const dot = (x, c) => { px(x, RAIL_Y, c); px(x + 1, RAIL_Y, c); px(x, RAIL_Y - 1, c); px(x + 1, RAIL_Y - 1, c); };
    const reach = markerX();
    let next = true;
    for(let x = RAIL_START; x <= RAIL_END - 1; x += 5){
      if(x <= reach || pct >= 100) dot(x);
      else if(next){ next = false; if(Math.floor(clock*3) % 2) dot(x); else dot(x, CONFIG.colors.half); }
      else dot(x, CONFIG.colors.ghost);
    }

    if(hit && clock < hit.until){
      const x = hit.x, y = hit.y;
      dash(x, y - 11, x, y - 6); dash(x + 6, y - 2, x + 9, y - 5); dash(x + 7, y + 3, x + 12, y + 3); dash(x + 5, y + 8, x + 8, y + 11);
    }
    if(mailHit && clock < mailHit.until){
      const cx = MAIL_X + 8, cy = MAIL_Y + 10;
      [[0,-1],[.7,-.7],[1,0],[.7,.7],[-.7,.7],[-1,0],[-.7,-.7]].forEach(([dx,dy]) => dash(cx + dx*13, cy + dy*13, cx + dx*17, cy + dy*17));
    }

    trail.forEach(p => px(p.x, p.y));
    const jx = clock < bird.shakeUntil ? (Math.floor(clock*30) % 2 ? 1 : -1) : 0;
    const f = solid(birdFrame());
    sprite(f, bird.x - f[0].length/2 + jx, bird.y + BIRD_H/2 - f.length);

    if(state === 'game'){
      text(statusText(), BM, BOTTOM_Y);
      keys.right = { ...softKey('LAUNCH', 'right'), action: keyLaunch };
    } else text('MADE IT!', BM, BOTTOM_Y);
  }
  else if(state === 'sent'){
    text('MESSAGE', M, 27, {k:big}); text('SENT', M, 46, {k:big});
    keys.right = { ...softKey('OK', 'right'), action: () => { go('confirm'); zoomOut(true); } };
  }
}
function keyLaunch(){
  if(bird.mode !== 'idle') return;
  const v = VMAX() * CONFIG.launch.keyStrength;
  launch(v*Math.cos(Math.PI/4), -v*Math.sin(Math.PI/4));
}

/* =========================================================
   LOOP
   ========================================================= */
let last = performance.now(), acc = 0;
const STEP = 1 / CONFIG.fps;
function loop(now){
  acc += Math.min(.25, (now - last)/1000); last = now;
  let stepped = false;
  while(acc >= STEP){ update(STEP); acc -= STEP; stepped = true; }
  if(stepped){ render(); ctx.drawImage(OVER, 0, 0); }
  requestAnimationFrame(loop);
}

/* =========================================================
   INPUT
   ========================================================= */
function toLogical(e){ const r = cvs.getBoundingClientRect(); return { x:(e.clientX - r.left)/r.width*W, y:(e.clientY - r.top)/r.height*H }; }
const inBox = (p, b) => b && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const onBird = p => state === 'game' && bird.mode === 'idle' && Math.hypot(p.x - bird.x, p.y - bird.y) <= 11;

cvs.addEventListener('pointerdown', e => {
  const p = toLogical(e);
  if(inBox(p, keys.left)) return pressKey('left');
  if(inBox(p, keys.right)) return pressKey('right');
  if(onBird(p)){ dragging = true; cvs.setPointerCapture(e.pointerId); cvs.className = 'grabbing'; }
});
cvs.addEventListener('pointermove', e => {
  const p = toLogical(e);
  if(!dragging){
    hover = inBox(p, keys.left) ? 'left' : inBox(p, keys.right) ? 'right' : null;
    cvs.className = hover ? 'key' : onBird(p) ? 'grab' : ''; return;
  }
  let dx = Math.min(1, p.x - REST.x), dy = p.y - REST.y;
  const len = Math.hypot(dx, dy), max = CONFIG.launch.maxPull;
  if(len > max){ dx *= max/len; dy *= max/len; }
  bird.x = REST.x + dx; bird.y = Math.min(GROUND - BIRD_H/2, REST.y + dy);
});
function release(){
  if(!dragging) return; dragging = false; cvs.className = '';
  const dx = REST.x - bird.x, dy = REST.y - bird.y;
  if(Math.hypot(dx, dy) < 1.5 || state !== 'game'){ resetBird(); return; }
  const k = VMAX() / CONFIG.launch.maxPull;
  launch(dx*k, dy*k);
}
cvs.addEventListener('pointerup', release);
cvs.addEventListener('pointercancel', release);
cvs.addEventListener('pointerleave', () => { hover = null; });
cvs.addEventListener('keydown', e => {
  if(e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight'){ e.preventDefault(); pressKey('right'); }
  if(e.key === 'Escape' || e.key === 'ArrowLeft' || e.key === 'Backspace'){ e.preventDefault(); pressKey('left'); }
});

// hardware keys on the handset map to the on-screen soft keys
const hw = (id, side) => {
  const el = document.getElementById(id);
  el.addEventListener('pointerenter', () => { if(keys[side]) navDown = side; });
  el.addEventListener('pointerleave', () => { navDown = null; });
  el.addEventListener('click', () => pressKey(side));
};
hw('kLeft', 'left'); hw('kRight', 'right'); hw('kNavi', 'right');



/* ---------- camera: pressing SEND leans in; OK at the end pulls back ---------- */
const stageEl = document.getElementById('stage'), handsetEl = document.getElementById('handset');
let holdOut = false;                               // after OK, stay out until the pointer leaves once
function zoomIn(force){ if(force) holdOut = false; if(!holdOut) stageEl.classList.add('zoom'); }
function zoomOut(hold){ stageEl.classList.remove('zoom'); hover = null; navDown = null; if(hold) holdOut = true; }
stageEl.addEventListener('pointerleave', () => { holdOut = false; if(state === 'confirm') zoomOut(); });
document.fonts && document.fonts.load(`40px ${CONFIG.font.family}`).then(measureCap).catch(()=>{});
measureCap();
go('confirm');
requestAnimationFrame(loop);
})();
</script>

</body></html>
