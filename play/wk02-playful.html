<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notifications Pile Up</title>
<style>
/* Layout: one phone mockup on the left with a single bell anchor, a rail of state triggers on the right; stacks to one column on phones. */
:root{
  --ground:#F6F6F6;
  --screen:#F2F2F7;
  --cell:#FFFFFF;
  --panel:#FFFFFF;
  --chip:#E8E8ED;
  --glass:rgba(255,255,255,.82);
  --sk:rgba(118,118,128,.14);
  --glow:#F6F6F6;
  --ink:#000000;
  --muted:#6C6C70;
  --line:#D1D1D6;
  --fill:rgba(118,118,128,.12);
  --tint:#007AFF;
  --on-tint:#FFFFFF;
  --pop:#FF3B30;
  --on-pop:#FFFFFF;
  --shade:drop-shadow(0 18px 26px rgba(0,0,0,.13)) drop-shadow(0 0 .5px rgba(0,0,0,.32));
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  --spring:cubic-bezier(.3,1.45,.5,1);
  --bezel:#17171A;
  --bezel-edge:#5A5A61;
  --bezel-btn:#2B2B30;
  --cutout:#000000;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#000000;--screen:#000000;--cell:#1C1C1E;--panel:#2C2C2E;--chip:#48484A;--glass:rgba(40,40,42,.82);--sk:rgba(118,118,128,.3);--glow:#1A1A1E;--ink:#FFFFFF;--muted:#98989F;--line:#38383A;--fill:rgba(118,118,128,.28);
    --tint:#0A84FF;--on-tint:#FFFFFF;--pop:#FF453A;--on-pop:#FFFFFF;
    --shade:drop-shadow(0 12px 22px rgba(0,0,0,.6)) drop-shadow(0 0 1px rgba(255,255,255,.4));color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#000000;--screen:#000000;--cell:#1C1C1E;--panel:#2C2C2E;--chip:#48484A;--glass:rgba(40,40,42,.82);--sk:rgba(118,118,128,.3);--glow:#1A1A1E;--ink:#FFFFFF;--muted:#98989F;--line:#38383A;--fill:rgba(118,118,128,.28);
  --tint:#0A84FF;--on-tint:#FFFFFF;--pop:#FF453A;--on-pop:#FFFFFF;
  --shade:drop-shadow(0 12px 22px rgba(0,0,0,.6)) drop-shadow(0 0 1px rgba(255,255,255,.4));color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(70% 55% at 50% 42%,var(--glow) 0%,var(--ground) 72%) fixed var(--ground);color:var(--ink);font:400 15px/1.45 var(--ui);margin:0;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--tint) 55%,transparent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.page{min-height:100%;display:grid;place-items:center;padding-inline:16px;padding-block:32px 110px}
.head{display:grid;gap:6px}
.eyebrow{font-weight:600;font-size:13px;color:var(--muted)}
h1{font:700 clamp(40px,8vw,56px)/1.05 var(--ui);margin:0;letter-spacing:-.02em}
.lead{margin:0;max-width:46ch;color:var(--muted);font-size:17px;line-height:1.4}

.fit{width:calc(415px * var(--s,1));height:calc(874px * var(--s,1))}
.dock{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:20;display:flex;align-items:center;gap:6px;padding:7px;max-width:calc(100% - 24px);border-radius:999px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 10px 30px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.1)}
.dock .btn{white-space:nowrap}
.dock .sep{width:.5px;height:22px;margin:0 4px;background:var(--line)}
@media (max-width:540px){.dock{flex-wrap:wrap;justify-content:center;border-radius:26px;width:calc(100% - 24px)}.dock .sep{display:none}.page{padding-bottom:140px}}

/* ---------- screen ---------- */
.device{position:relative;width:415px;transform:scale(var(--s,1));transform-origin:0 0;padding:11px;border-radius:66px;background:linear-gradient(150deg,#3B3B41,var(--bezel) 38%,#26262A);box-shadow:inset 0 0 0 1.5px var(--bezel-edge),inset 0 0 0 5px #0A0A0C,0 34px 60px -24px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.35)}
.device::before,.device::after{content:"";position:absolute;width:3px;background:var(--bezel-btn)}
.device::before{left:-3px;top:196px;height:60px;border-radius:2px 0 0 2px;box-shadow:0 76px 0 var(--bezel-btn)}
.device::after{right:-3px;top:246px;height:98px;border-radius:0 2px 2px 0}
.stage{position:relative;width:100%;height:852px;background:var(--screen);border-radius:55px;overflow:hidden}
.island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:var(--cutout);z-index:10}
.island::after{content:"";position:absolute;right:13px;top:12px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2A2F45,#0B0C12 60%)}
.status{height:54px;display:flex;align-items:center;justify-content:space-between;padding:14px 32px 0 50px;font-weight:600;font-size:16px;letter-spacing:.01em}
.sys{display:flex;align-items:center;gap:6px}
.sys svg{display:block;fill:currentColor}
.bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--sk)}
.large{font:700 34px/41px var(--ui);letter-spacing:.01em;padding:2px 20px 10px}
.sk{display:block;border-radius:6px;background:var(--sk)}
.next{margin:0 16px;padding:18px 16px;border-radius:20px;background:var(--cell);display:grid;gap:11px}
.sec{padding:26px 20px 12px}
.cells{list-style:none;margin:0 16px;padding:0;border-radius:20px;background:var(--cell)}
.cells li{display:flex;align-items:center;gap:12px;height:60px;padding:0 16px;position:relative}
.cells li+li::before{content:"";position:absolute;left:60px;right:0;top:0;height:.5px;background:var(--line)}
.tile{flex:none;width:32px;height:32px;border-radius:8px;background:var(--sk)}
.cells .tx{flex:1;min-width:0;display:grid;gap:8px}
.tabs{position:absolute;left:24px;right:24px;bottom:26px;height:62px;z-index:3;display:flex;padding:4px;border-radius:31px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 8px 24px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.08)}
.tabs span{flex:1;display:grid;place-items:center}
.tabs i{width:26px;height:26px;border-radius:9px;background:var(--sk)}

.bell{position:relative;width:36px;height:36px;padding:0;display:grid;place-items:center;border:0;border-radius:50%;background:var(--fill);color:var(--ink);transition:background .15s,transform .2s var(--spring)}
.bell:hover,.bell[aria-expanded="true"]{background:color-mix(in srgb,var(--tint) 16%,transparent);color:var(--tint);transform:scale(1.06)}
.bell svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;transform-origin:50% 12%;transition:transform .3s var(--spring)}
.bell.pouring svg{transform:rotate(-26deg)}

/* ---------- badge ---------- */
.badge{position:absolute;top:-5px;left:21px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--pop);color:var(--on-pop);font-weight:500;font-size:13px;line-height:18px;text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--screen);transform:scale(0);transform-origin:50% 100%;transition:transform .14s ease-in,min-width .2s,height .2s,padding .2s,top .2s,left .2s;pointer-events:none}
.badge.on{transform:scale(1)}
.badge[data-kind="dot"]{min-width:10px;height:10px;padding:0;top:0;left:26px;font-size:0}
.badge.cut{transition:none}
.ring{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid var(--pop);pointer-events:none}
.dotfall{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--pop)}

/* ---------- rich tooltip: the container the notifications pour into ---------- */
.panel{position:absolute;right:10px;top:106px;width:calc(100% - 20px);z-index:4;filter:var(--shade);transform-origin:calc(100% - 28px) -12px;transform:scale(.25);opacity:0;visibility:hidden;transition:transform .2s ease-in,opacity .16s ease-in,visibility 0s .2s}
.panel.open{transform:none;opacity:1;visibility:visible;transition:transform .32s var(--spring),opacity .1s}
.panel::before{content:"";position:absolute;top:-7px;right:20px;width:16px;height:8px;background:var(--panel);clip-path:polygon(50% 0,100% 100%,0 100%)}
.shell{background:var(--panel);border-radius:20px;height:400px;overflow:hidden;transition:height .35s cubic-bezier(.2,.9,.3,1)}
.panel.released .shell{transition:height .22s cubic-bezier(.4,0,.8,.4)}
.p-head{height:48px;display:flex;align-items:center;justify-content:space-between;padding:2px 12px 0 20px}
.p-title{font-weight:600;font-size:17px;line-height:22px}
.textbtn{border:0;background:none;color:var(--tint);font-size:15px;line-height:20px;padding:5px 8px;border-radius:8px;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.panel.listed .textbtn{opacity:1;visibility:visible;transition:opacity .25s .2s}
.textbtn:hover{background:var(--fill)}

/* each notification: a loose chip while physical, a row once sorted */
.notes{position:absolute;inset:0;z-index:5;pointer-events:none}
.note{position:absolute;left:0;top:0;width:120px;height:26px;will-change:transform;transition:transform .55s cubic-bezier(.2,1.15,.3,1),width .45s cubic-bezier(.2,.9,.3,1),height .45s cubic-bezier(.2,.9,.3,1)}
.note.phys{transition:width .15s ease-out,height .15s ease-out}
.skin{position:absolute;inset:0;border-radius:8px;background:var(--chip);overflow:hidden;transition:border-radius .3s}
.note.is-row .skin{border-radius:12px}
.raw{position:absolute;left:10px;top:0;font-weight:600;font-size:11px;line-height:26px;letter-spacing:.05em;white-space:nowrap;transition:opacity .15s}
.clean{position:absolute;inset:0;display:flex;align-items:center;gap:10px;padding:0 12px;white-space:nowrap;opacity:0;transition:opacity .12s}
.note.is-row .raw{opacity:0}
.note.is-row .clean{opacity:1;transition:opacity .25s .18s}
.pip{flex:none;width:8px;height:8px;border-radius:50%;background:var(--tint)}
.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:15px}
.m{font-size:13px;color:var(--muted)}
.fly{position:absolute;left:0;top:0;height:26px;padding:0 10px;border-radius:8px;background:var(--chip);font-weight:600;font-size:11px;line-height:26px;letter-spacing:.05em;white-space:nowrap}

/* ---------- plain tooltip: the empty bell ---------- */
.tip{position:absolute;right:10px;top:106px;z-index:4;background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:13px;line-height:18px;white-space:nowrap;filter:var(--shade);pointer-events:none;transform-origin:calc(100% - 28px) -12px;transform:scale(.25);opacity:0;visibility:hidden;transition:transform .16s ease-in,opacity .14s ease-in,visibility 0s .16s}
.tip::before{content:"";position:absolute;top:-7px;right:20px;width:16px;height:8px;background:var(--panel);clip-path:polygon(50% 0,100% 100%,0 100%)}
.tip.open{transform:none;opacity:1;visibility:visible;transition:transform .28s var(--spring),opacity .08s}
.word{display:inline-block;white-space:nowrap}
.ch{display:inline-block}
.open [data-drop] .ch,.tip.open .ch{animation:drop .26s var(--spring) both;animation-delay:calc(var(--i) * 9ms)}
.tip.open.falling .ch{animation:fall .38s cubic-bezier(.5,0,1,.6) both;animation-delay:calc(var(--i) * 5ms)}
@keyframes drop{from{opacity:0;transform:translateY(-20px) rotate(var(--r))}50%{opacity:1}}
@keyframes fall{to{opacity:0;transform:translate(var(--dx),240px) rotate(var(--fr))}}

/* ---------- rail ---------- */
.rail{display:grid;gap:24px;min-width:0;align-content:start;padding-top:8px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;column-gap:12px;color:var(--muted);font-size:17px;line-height:24px}
.steps li::before{content:counter(s);grid-row:1/3;width:28px;height:28px;border-radius:50%;background:var(--fill);color:var(--ink);font-weight:600;font-size:15px;line-height:28px;text-align:center}
.steps b{display:block;color:var(--ink);font-weight:600}
.more{border-top:.5px solid var(--line);padding-top:14px}
.more summary{cursor:pointer;color:var(--tint);font-size:15px;line-height:20px}
.more[open] summary{margin-bottom:12px}
.more table{margin-top:20px}
.rail .group{display:grid;gap:12px}
h2{font:700 22px/1.25 var(--ui);margin:0}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-top:12px;border-top:.5px solid var(--line)}
.what{display:grid;gap:1px;min-width:0;flex:1 1 190px}
.k{font-weight:600;font-size:17px;line-height:22px}
.v{color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:7px 16px;font-weight:600;font-size:15px;line-height:20px;background:var(--tint);color:var(--on-tint);transition:transform .2s var(--spring),opacity .12s}
.btn.tinted{background:color-mix(in srgb,var(--tint) 15%,transparent);color:var(--tint)}
.btn.tinted[aria-pressed="true"]{background:var(--tint);color:var(--on-tint)}
.btn:hover:not(:disabled){opacity:.82}
.btn:active:not(:disabled){transform:scale(.95)}
.btn:disabled{opacity:.3;cursor:default}
.hint{margin:0;color:var(--muted);font-size:13px;line-height:18px}
table{border-collapse:collapse;width:100%}
td{padding:9px 0;border-top:.5px solid var(--line);vertical-align:top}
td:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:16px;white-space:nowrap}

@media (prefers-reduced-motion: reduce){
  .open [data-drop] .ch,.tip.open .ch,.tip.open.falling .ch{animation:none}
  .note,.note.phys,.panel,.panel.open,.tip,.tip.open,.shell,.badge,.bell,.bell svg,.btn,.clean,.raw{transition:none}
}

/* Thumbnail mode (page opened with #thumb): just the phone, centred on a flat ground, no dock. */
html.thumb body{background:#f6f6f6}
html.thumb .page{padding-block:0}
html.thumb .dock{display:none}
</style>
</head>

<script>if (location.hash === "#thumb") document.documentElement.classList.add("thumb");</script>
<main class="page">
  <div class="fit">
    <div class="device">
    <div class="stage" id="stage">
      <div class="island" aria-hidden="true"></div>
      <div class="status" aria-hidden="true">
        <span>9:41</span>
        <span class="sys">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 008.5.5C5.7.5 3.200 1.600 1.300 3.400l1.2 1.3a8.600 8.600 0 016-2.4z"/><path d="M8.500 6.100c1.300 0 2.500.5 3.400 1.300l1.200-1.300a6.800 6.800 0 00-9.200 0l1.200 1.300c.9-.8 2.100-1.300 3.400-1.300z"/><path d="M8.500 9.300a2 2 0 00-1.400.6l1.400 1.600 1.400-1.600a2 2 0 00-1.400-.6z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.800" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2.500"/><path d="M24 4.500v4c.9-.3 1.500-1.100 1.500-2s-.6-1.700-1.500-2z" opacity=".45"/></svg>
        </span>
      </div>
      <div class="bar">
        <span class="avatar" aria-hidden="true"></span>
        <button class="bell" id="bell" type="button" aria-label="Notifications" aria-expanded="false" aria-controls="panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0112 0v5.5l1.5 2h-15zM10 21a2.2 2.2 0 004 0M12 3.2V5"/></svg>
          <span class="badge" id="badge" data-kind="count"></span>
        </button>
      </div>
      <div class="large">Home</div>
      <div class="next" aria-hidden="true"><i class="sk" style="width:22%;height:10px"></i><i class="sk" style="width:62%;height:16px"></i><i class="sk" style="width:40%;height:10px"></i></div>
      <div class="sec" aria-hidden="true"><i class="sk" style="width:30%;height:14px"></i></div>
      <ul class="cells" aria-hidden="true">
        <li><span class="tile"></span><span class="tx"><i class="sk" style="width:56%;height:12px"></i><i class="sk" style="width:34%;height:9px"></i></span></li>
        <li><span class="tile"></span><span class="tx"><i class="sk" style="width:44%;height:12px"></i><i class="sk" style="width:38%;height:9px"></i></span></li>
        <li><span class="tile"></span><span class="tx"><i class="sk" style="width:60%;height:12px"></i><i class="sk" style="width:28%;height:9px"></i></span></li>
      </ul>
      <div class="tabs" aria-hidden="true"><span><i></i></span><span><i></i></span><span><i></i></span><span><i></i></span></div>

      <div class="panel" id="panel">
        <div class="shell" id="shell">
          <div class="p-head">
            <strong class="p-title" id="pTitle" data-drop>Notifications</strong>
            <button class="textbtn" id="clearAll" type="button">Clear all</button>
          </div>
        </div>
      </div>
      <span class="tip" id="plainTip" role="tooltip">No new notifications</span>
      <div class="notes" id="notes" role="list" aria-label="Notifications"></div>
    </div>
    </div>
  </div>
  <div class="sr" id="live" aria-live="polite"></div>
</main>
<div class="dock" role="toolbar" aria-label="Controls">
  <button class="btn" id="newBtn" type="button">New notification</button>
  <button class="btn tinted" id="clearBtn" type="button">Clear all</button>
  <span class="sep" aria-hidden="true"></span>
  <button class="btn tinted" id="dotBtn" type="button" aria-pressed="false">Dot badge</button>
  <button class="btn tinted" id="restoreBtn" type="button">Restore seven</button>
</div>

</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const { Engine, Bodies, Body, Composite } = Matter;
  const stage = $('stage'), bell = $('bell'), bellIcon = bell.querySelector('svg'), badge = $('badge');
  const panel = $('panel'), shell = $('shell'), layer = $('notes'), plainTip = $('plainTip');
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const say = msg => { $('live').textContent = msg; };
  const rnd = (a, b) => a + Math.random() * (b - a);

  const HEAD = 48, ROW = 44, GAP = 6, CH = 26, MAX = 9, STEP = 1000 / 60;
  const DEFAULTS = [
    { raw: 'NEW MESSAGE', t: 'New message', m: 'now' },
    { raw: 'FILE SHARED', t: 'File shared with you', m: '4m' },
    { raw: 'ASSIGNMENT DUE', t: 'Assignment due tomorrow', m: '12m' },
    { raw: '3 COMMENTS', t: '3 new comments', m: '26m' },
    { raw: 'NEW FOLLOWER', t: 'New follower', m: '1h' },
    { raw: 'CALENDAR INVITE', t: 'Calendar invite', m: '2h' },
    { raw: 'MENTIONED YOU', t: 'You were mentioned', m: '3h' }
  ];
  const EXTRA = [
    { raw: 'REMINDER', t: 'Reminder in 10 minutes', m: 'now' },
    { raw: 'UPDATE READY', t: 'Update ready to install', m: 'now' },
    { raw: 'BACKUP DONE', t: 'Backup finished', m: 'now' },
    { raw: 'NEW REPLY', t: 'New reply to your post', m: 'now' }
  ];

  const engine = Engine.create();
  engine.positionIterations = 8; engine.velocityIterations = 6;
  let walls = [], flapBodies = [], floorBody = null, loose = [];
  let notes = [], shown = 0, mode = 'count', phase = 'closed', clearing = false, want = false;
  let raf = 0, last = 0, acc = 0, calm = 0, idle = 0, lastSpawn = 0, extraI = 0, sortPending = false;
  let pauseT = 0, holdT = 0, collapseT = 0, floorT = 0, plainT = 0, plainOn = false;

  /* ---------- geometry (stage coordinates) ---------- */
  function geo() {
    const left = panel.offsetLeft, top = panel.offsetTop, w = panel.offsetWidth;
    const sh = HEAD + notes.length * (ROW + GAP) + 2;
    return { left, top, w, sh, floor: top + sh - 6 };
  }
  const slot = (i, g) => ({ cx: g.left + g.w / 2, cy: g.top + HEAD + i * (ROW + GAP) + ROW / 2, w: g.w - 16 });
  const bellPt = () => ({ x: bell.offsetLeft + bell.offsetWidth / 2, y: bell.offsetTop + bell.offsetHeight / 2, bottom: bell.offsetTop + bell.offsetHeight });
  function put(n, x, y, a) {
    n.x = x; n.y = y; n.a = a;
    n.el.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) translate(-50%,-50%) rotate(${a.toFixed(4)}rad)`;
  }
  const norm = a => { a %= 2 * Math.PI; if (a > Math.PI) a -= 2 * Math.PI; if (a < -Math.PI) a += 2 * Math.PI; return a; };

  /* ---------- the container: side walls and a floor ---------- */
  function clearStatics() {
    for (const b of [...walls, ...flapBodies]) Composite.remove(engine.world, b);
    if (floorBody) Composite.remove(engine.world, floorBody);
    walls = []; flapBodies = []; floorBody = null;
  }
  function buildWalls(g) {
    clearStatics();
    const T = 60;
    walls = [
      Bodies.rectangle(g.left + 6 - T / 2, g.floor - 1000, T, 2000, { isStatic: true }),
      Bodies.rectangle(g.left + g.w - 6 + T / 2, g.floor - 1000, T, 2000, { isStatic: true })
    ];
    floorBody = Bodies.rectangle(g.left + g.w / 2, g.floor + T / 2, g.w + T * 2, T, { isStatic: true });
    Composite.add(engine.world, [...walls, floorBody]);
  }
  function letGo() {                    // the container pulls up and away, leaving its contents unsupported
    clearStatics();
    panel.classList.add('released');
    shell.style.height = HEAD + 'px';
  }

  /* ---------- notification objects ---------- */
  function makeNote(d) {
    const el = document.createElement('div');
    el.className = 'note phys'; el.setAttribute('role', 'listitem');
    el.innerHTML = '<div class="skin"><span class="raw" aria-hidden="true"></span><span class="clean"><i class="pip"></i><span class="t"></span><span class="m"></span></span></div>';
    el.querySelector('.raw').textContent = d.raw;
    el.querySelector('.t').textContent = d.t;
    el.querySelector('.m').textContent = d.m;
    el.style.visibility = 'hidden';
    layer.appendChild(el);
    const cw = Math.ceil(el.querySelector('.raw').offsetWidth) + 20;
    el.style.width = cw + 'px'; el.style.height = CH + 'px';
    return { d, el, skin: el.firstChild, cw, body: null, spawned: false, skip: false, out: false, gone: false, spawnAt: 0, x: 0, y: 0, a: 0 };
  }
  function dropBody(n) { if (n.body) { Composite.remove(engine.world, n.body); n.body = null; } }
  function addBody(n, x, y, a, vx, vy, va) {
    const b = Bodies.rectangle(x, y, n.cw, CH, { chamfer: { radius: 8 }, restitution: .32, friction: .5, frictionAir: .012, angle: a });
    Body.setVelocity(b, { x: vx, y: vy }); Body.setAngularVelocity(b, va);
    Composite.add(engine.world, b);
    n.body = b; n.out = false; n.gone = false;
    put(n, x, y, a);
  }
  function chipForm(n) {
    const el = n.el;
    el.classList.add('phys'); el.classList.remove('is-row');
    el.style.transitionDelay = '0ms'; el.style.width = n.cw + 'px'; el.style.height = CH + 'px'; el.style.visibility = 'visible';
  }
  function rowForm(n, i, g, delay) {
    const el = n.el, s = slot(i, g);
    el.classList.remove('phys'); el.classList.add('is-row');
    el.style.transitionDelay = delay + 'ms'; el.style.visibility = 'visible';
    el.style.width = s.w + 'px'; el.style.height = ROW + 'px';
    put(n, s.cx, s.cy, 0);
  }
  function popIn(n) {
    n.skin.animate([{ transform: 'scale(.2)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 170, easing: 'ease-out' });
  }
  function spawnInto(n, g) {           // out of the bell, into the container
    const bp = bellPt(), lo = g.left + 8 + n.cw / 2, hi = g.left + g.w - 8 - n.cw / 2;
    chipForm(n);
    addBody(n, Math.min(hi, Math.max(lo, bp.x - n.cw / 2 + 10)), g.top - 4, rnd(-.5, .5), rnd(-5, -.5), 1.5, rnd(-.12, .12));
    popIn(n); lastSpawn = performance.now();
  }
  function pourOne(n) {                // out of the bell, with nothing to catch it
    const bp = bellPt();
    chipForm(n);
    addBody(n, bp.x - 6, bp.bottom + 2, rnd(-.6, .6), rnd(-4.5, 1), rnd(-3, -1), rnd(-.15, .15));
    popIn(n); n.out = true;
    departed();
  }

  /* ---------- badge ---------- */
  function renderBadge(bump) {
    const on = shown > 0;
    badge.dataset.kind = mode;
    if (on) badge.textContent = mode === 'count' ? shown : '';
    badge.classList.toggle('cut', !on && mode === 'dot');
    badge.classList.toggle('on', on);
    if (bump && on && !RM) badge.animate(
      [{ transform: 'scale(1.4,.6)' }, { transform: 'scale(.88,1.15)', offset: .4 }, { transform: 'scale(1.06,.96)', offset: .7 }, { transform: 'scale(1)' }],
      { duration: 300, easing: 'ease-out' });
    bell.setAttribute('aria-label', shown ? 'Notifications, ' + shown + ' new' : 'Notifications, none new');
  }
  function wiggle() {
    if (RM) return;
    bellIcon.animate(
      [{ transform: 'rotate(0)' }, { transform: 'rotate(-18deg)' }, { transform: 'rotate(13deg)' }, { transform: 'rotate(-8deg)' }, { transform: 'rotate(4deg)' }, { transform: 'rotate(0)' }],
      { duration: 560, easing: 'ease-out' });
  }
  const badgePt = () => ({ x: bell.offsetLeft + badge.offsetLeft + badge.offsetWidth / 2, y: bell.offsetTop + badge.offsetTop + badge.offsetHeight / 2 });
  function landed() {                   // an arrival reaches the bell
    const was = badge.classList.contains('on');
    shown = notes.length;
    if (mode === 'count') { renderBadge(true); wiggle(); return; }
    renderBadge(false);                 // dot: no label, no number, so the reaction is smaller and quieter
    if (RM) return;
    if (!was) {
      badge.animate(
        [{ transform: 'scale(1.3,.65)' }, { transform: 'translateY(-7px) scale(.95,1.08)', offset: .35 },
         { transform: 'translateY(0) scale(1.1,.9)', offset: .65 }, { transform: 'translateY(-2px) scale(1)', offset: .82 }, { transform: 'scale(1)' }],
        { duration: 420, easing: 'ease-out' });
    } else {
      badge.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(1.5,.7)', offset: .25 }, { transform: 'scale(.85,1.2)', offset: .5 }, { transform: 'scale(1.1,.95)', offset: .75 }, { transform: 'scale(1)' }],
        { duration: 380, easing: 'ease-out' });
      const r = document.createElement('i');
      r.className = 'ring'; r.style.left = badge.offsetLeft + 'px'; r.style.top = badge.offsetTop + 'px';
      bell.appendChild(r);
      r.animate([{ transform: 'scale(1)', opacity: .8 }, { transform: 'scale(2.8)', opacity: 0 }], { duration: 460, easing: 'ease-out' }).onfinish = () => r.remove();
    }
  }
  function departed() {                 // one notification leaves for good
    shown = Math.max(0, shown - 1);
    if (mode === 'count') { renderBadge(true); return; }
    if (shown === 0) { const p = badgePt(); renderBadge(false); dropDot(p); }   // dot holds until the last one, then lets go
  }
  function dropDot(p) {
    if (RM) return;
    const el = document.createElement('div');
    el.className = 'dotfall'; layer.appendChild(el);
    const b = Bodies.circle(p.x, p.y, 5, { frictionAir: .008, collisionFilter: { mask: 0 } });
    Body.setVelocity(b, { x: rnd(-2.2, -.6), y: -2.5 });
    Composite.add(engine.world, b);
    el.style.transform = `translate(${p.x}px,${p.y}px)`;
    loose.push({ el, body: b }); run();
  }
  function syncButtons() {
    $('newBtn').disabled = clearing || notes.length >= MAX;
    $('clearBtn').disabled = clearing || notes.length === 0;
  }
  const stopTimers = () => { clearTimeout(pauseT); clearTimeout(collapseT); clearTimeout(floorT); sortPending = false; };

  /* ---------- entrance: pour, pile, pause, sort ---------- */
  function openPanel() {
    stopTimers(); hidePlain(true);
    panel.classList.remove('released', 'listed'); panel.classList.add('open');
    bell.setAttribute('aria-expanded', 'true');
    const g = geo();
    shell.style.transition = 'none'; shell.style.height = g.sh + 'px'; void shell.offsetHeight; shell.style.transition = '';
    if (RM) {
      phase = 'list';
      notes.forEach((n, i) => { dropBody(n); rowForm(n, i, g, 0); });
      panel.classList.add('listed');
      return;
    }
    phase = 'opening'; engine.gravity.y = 2; buildWalls(g);
    const now = performance.now();
    notes.forEach((n, i) => {
      dropBody(n);
      n.el.style.visibility = 'hidden'; n.el.classList.add('phys'); n.el.classList.remove('is-row');
      n.spawned = false; n.skip = false; n.out = false; n.gone = false; n.spawnAt = now + 110 + i * 90;
    });
    bell.classList.add('pouring'); calm = 0; lastSpawn = now;
    run();
  }
  function organize() {                 // from wherever each object is, into the list
    stopTimers();
    bell.classList.remove('pouring');
    panel.classList.add('open'); panel.classList.remove('released');
    bell.setAttribute('aria-expanded', 'true');
    clearStatics();
    const g = geo(), bp = bellPt();
    shell.style.height = g.sh + 'px';
    notes.forEach(n => {
      if (n.body) { put(n, n.body.position.x, n.body.position.y, norm(n.body.angle)); dropBody(n); }
      else if (n.gone) { chipForm(n); put(n, n.x, n.y, norm(n.a)); }
      else if (n.el.style.visibility === 'hidden') { chipForm(n); put(n, bp.x - n.cw / 2 + 10, g.top - 4, rnd(-.4, .4)); }
      n.el.style.visibility = 'visible';
      n.spawned = true; n.skip = false; n.out = false; n.gone = false;
    });
    void layer.offsetWidth;
    phase = 'list';
    notes.forEach((n, i) => rowForm(n, i, g, i * 40));
    panel.classList.add('listed');
  }

  /* ---------- exit: hold, let go, collapse, floor opens, fall out, close ---------- */
  function release(clear) {
    stopTimers();
    bell.classList.remove('pouring');
    if (clear) clearing = true;
    panel.classList.remove('listed');
    if (RM) {
      panel.classList.remove('open'); bell.setAttribute('aria-expanded', 'false');
      notes.forEach(n => { n.el.style.visibility = 'hidden'; n.gone = true; });
      phase = 'closed';
      if (clearing) finishClear();
      return;
    }
    const g = geo(), wasList = phase === 'list';
    engine.gravity.y = 3;
    if (!walls.length) buildWalls(g);
    notes.forEach((n, i) => {
      if (n.body) return;
      if (n.el.classList.contains('is-row')) {
        const s = slot(i, g);
        chipForm(n);
        addBody(n, s.cx - s.w / 2 + n.cw / 2 + rnd(2, 26), s.cy, rnd(-.2, .2), rnd(0, 2.5), 0, rnd(-.1, .1));
      } else { n.skip = true; n.el.style.visibility = 'hidden'; }
    });
    phase = 'releasing';
    floorT = setTimeout(() => { if (phase === 'releasing') letGo(); }, wasList ? 240 : 60);
    syncButtons(); run();
  }
  function collapse() {
    phase = 'collapsing';
    panel.classList.remove('open', 'released', 'listed');
    bell.setAttribute('aria-expanded', 'false');
    collapseT = setTimeout(() => { if (phase === 'collapsing') phase = 'closed'; }, 230);
  }
  function pour() {                     // clearing while the tooltip is closed
    stopTimers(); hidePlain(true);
    clearing = true;
    if (RM) { finishClear(); return; }
    if (mode === 'dot') {               // a dot holds no content, so nothing pours out: the dot alone lets go
      const p = badgePt();
      engine.gravity.y = 2.6; shown = 0; renderBadge(false); dropDot(p);
      bellIcon.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-9deg)' }, { transform: 'rotate(4deg)' }, { transform: 'rotate(0)' }], { duration: 360, easing: 'ease-out' });
      finishClear();
      return;
    }
    phase = 'pour'; clearStatics(); engine.gravity.y = 2.6;
    panel.classList.remove('open', 'released', 'listed');
    const now = performance.now();
    notes.forEach((n, i) => {
      dropBody(n); n.el.style.visibility = 'hidden';
      n.spawned = false; n.skip = false; n.out = false; n.gone = false; n.spawnAt = now + i * 75;
    });
    bell.classList.add('pouring');
    syncButtons(); run();
  }
  function finishClear() {
    notes.forEach(n => { dropBody(n); n.el.remove(); });
    notes = []; shown = 0; clearing = false;
    if (phase === 'pour') phase = 'closed';
    bell.classList.remove('pouring');
    renderBadge(false); syncButtons();
    say('All notifications cleared.');
    setTimeout(() => { if (want && !notes.length && !clearing) showPlain(); }, 280);
  }
  function clearAll() {
    if (clearing || !notes.length) return;
    if (phase === 'closed' || phase === 'collapsing') pour(); else release(true);
  }

  /* ---------- arrivals ---------- */
  function flyIn(d, done) {
    if (RM) { done(); return; }
    if (mode === 'dot') {               // dot badge: a bare dot drops onto the badge spot, no label
      const p = badgePt(), dot = document.createElement('div');
      dot.className = 'dotfall'; layer.appendChild(dot);
      const fall = dot.animate([{ transform: `translate(${p.x}px,-12px)` }, { transform: `translate(${p.x}px,${p.y}px)` }],
        { duration: 340, easing: 'cubic-bezier(.55,0,1,.45)', fill: 'forwards' });
      fall.onfinish = () => { dot.remove(); done(); };
      return;
    }
    const bp = bellPt(), el = document.createElement('div'), r = rnd(-.5, .5);
    el.className = 'fly'; el.textContent = d.raw; layer.appendChild(el);
    const a = el.animate(
      [{ transform: `translate(${bp.x + rnd(-50, 0)}px,-20px) translate(-50%,-50%) rotate(${r}rad) scale(1)` },
       { transform: `translate(${bp.x}px,${bp.y - 4}px) translate(-50%,-50%) rotate(${-r}rad) scale(.3)` }],
      { duration: 400, easing: 'cubic-bezier(.55,0,1,.5)', fill: 'forwards' });
    a.onfinish = () => { el.remove(); done(); };
  }
  function arrive() {
    if (clearing || notes.length >= MAX) return;
    hidePlain(true);
    const d = EXTRA[extraI++ % EXTRA.length], n = makeNote(d);
    notes.unshift(n);
    if (phase === 'list') {
      landed();
      organize();
    } else if (phase === 'opening' || phase === 'piled') {
      phase = 'opening';
      const g = geo();
      shell.style.height = g.sh + 'px'; buildWalls(g);
      n.spawnAt = performance.now(); calm = 0;
      landed(); run();
    } else {
      if (phase === 'releasing') n.skip = true;
      flyIn(d, () => { if (!clearing) landed(); });
    }
    say(d.t);
    syncButtons();
  }
  function restore() {
    cancelAnimationFrame(raf); raf = 0; stopTimers(); clearStatics();
    notes.forEach(n => { dropBody(n); n.el.remove(); });
    loose.forEach(o => { Composite.remove(engine.world, o.body); o.el.remove(); }); loose = [];
    panel.classList.remove('open', 'released', 'listed'); bell.classList.remove('pouring');
    bell.setAttribute('aria-expanded', 'false');
    hidePlain(true);
    clearing = false; phase = 'closed';
    notes = DEFAULTS.map(makeNote); shown = notes.length;
    shell.style.height = geo().sh + 'px';
    renderBadge(true); wiggle(); syncButtons();
  }

  /* ---------- physics loop ---------- */
  function tick(t) {
    acc += Math.min(t - last, 50); last = t;
    if (phase === 'opening' || phase === 'pour') {
      const g = geo();
      for (const n of notes) if (!n.spawned && !n.skip && n.spawnAt <= t) { n.spawned = true; phase === 'pour' ? pourOne(n) : spawnInto(n, g); }
      if (notes.every(n => n.spawned || n.skip)) bell.classList.remove('pouring');
    }
    while (acc >= STEP) { Engine.update(engine, STEP); acc -= STEP; }
    const g = geo(), H = stage.clientHeight, W = stage.clientWidth;
    let live = 0, still = true;
    for (const n of notes) {
      const b = n.body;
      if (!b) continue;
      put(n, b.position.x, b.position.y, b.angle);
      if (b.speed > .3 || b.angularSpeed > .03) still = false;
      if (phase === 'releasing' && !n.out && b.position.y - CH / 2 > g.floor + 4) {
        n.out = true;
        if (clearing) departed();
      }
      if (b.position.y > H + 80 || b.position.x < -220 || b.position.x > W + 220) {
        dropBody(n); n.gone = true; n.out = true; n.el.style.visibility = 'hidden';
      } else live++;
    }
    for (let i = loose.length - 1; i >= 0; i--) {
      const o = loose[i], b = o.body;
      o.el.style.transform = `translate(${b.position.x.toFixed(1)}px,${b.position.y.toFixed(1)}px)`;
      if (b.position.y > H + 40) { Composite.remove(engine.world, b); o.el.remove(); loose.splice(i, 1); } else live++;
    }
    if (phase === 'opening' && notes.every(n => n.spawned)) {
      calm = still ? calm + 1 : 0;
      if (calm > 12 || t - lastSpawn > 1200) { phase = 'piled'; idle = 0; if (sortPending) pauseT = setTimeout(() => { if (phase === 'piled') organize(); }, 140); }
    }
    if (phase === 'releasing' && notes.every(n => n.out || n.skip)) collapse();
    if (clearing && phase !== 'releasing' && notes.every(n => n.gone || n.skip)) finishClear();
    idle = (phase === 'piled' && still) ? idle + 1 : 0;        // a resting pile needs no simulation
    raf = ((live > 0 && idle < 40) || phase === 'opening' || phase === 'pour') ? requestAnimationFrame(tick) : 0;
  }
  function run() { if (!raf) { last = performance.now(); acc = 0; raf = requestAnimationFrame(tick); } }

  /* ---------- plain tooltip (empty bell) ---------- */
  function split(el) {
    const words = el.textContent.trim().split(' ');
    el.textContent = '';
    let i = 0;
    words.forEach((w, wi) => {
      const ws = document.createElement('span'); ws.className = 'word';
      for (const ch of w) {
        const s = document.createElement('span'); s.className = 'ch'; s.textContent = ch;
        s.style.setProperty('--i', i++);
        s.style.setProperty('--r', Math.round(rnd(-35, 35)) + 'deg');
        s.style.setProperty('--dx', Math.round(rnd(-28, 28)) + 'px');
        s.style.setProperty('--fr', Math.round(rnd(-120, 120)) + 'deg');
        ws.appendChild(s);
      }
      el.appendChild(ws);
      if (wi < words.length - 1) el.appendChild(document.createTextNode(' '));
    });
  }
  split(plainTip); split($('pTitle'));
  function showPlain() {
    clearTimeout(plainT);
    if (plainOn) return;
    plainTip.classList.remove('falling'); void plainTip.offsetWidth;
    plainTip.classList.add('open'); plainOn = true;
  }
  function hidePlain(now) {
    clearTimeout(plainT);
    if (!plainTip.classList.contains('open')) { plainOn = false; return; }
    plainOn = false;
    if (now || RM) { plainTip.classList.remove('open', 'falling'); return; }
    plainTip.classList.add('falling');                        // letters fall out first,
    plainT = setTimeout(() => plainTip.classList.remove('open'), 480);   // then the empty bubble closes
  }

  /* ---------- hover, focus, touch ---------- */
  let lastType = 'mouse', openedAt = 0;
  function enter() {
    if (clearing) return;
    if (!notes.length) { showPlain(); return; }
    if (mode === 'dot') return;         // a dot has nothing to unpack: it opens nothing, a click dismisses it
    if (phase === 'closed') openPanel();
    else if (phase === 'releasing' || phase === 'collapsing') organize();
  }
  function leave() {
    hidePlain();
    if (phase === 'opening' || phase === 'piled' || phase === 'list') release(false);
  }
  function setWant(v) {
    clearTimeout(holdT);
    if (v) { if (!want) { want = true; openedAt = performance.now(); } enter(); }
    else holdT = setTimeout(() => { want = false; leave(); }, 220);
  }
  const shut = () => { clearTimeout(holdT); want = false; leave(); };
  [bell, panel].forEach(el => {
    el.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') setWant(true); });
    el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') setWant(false); });
  });
  const reach = () => { if (phase === 'piled') organize(); else if (phase === 'opening') sortPending = true; };
  panel.addEventListener('pointerenter', reach);
  panel.addEventListener('pointermove', reach);
  panel.addEventListener('click', reach);
  bell.addEventListener('pointerdown', e => { lastType = e.pointerType; });
  bell.addEventListener('click', () => {
    if (mode === 'dot') { clearAll(); return; }
    if (lastType === 'mouse' || performance.now() - openedAt < 350) return;
    if (phase === 'piled') { organize(); return; }
    want ? shut() : setWant(true);
  });
  bell.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') && phase === 'piled') { e.preventDefault(); organize(); }
  });
  bell.addEventListener('focus', () => setWant(true));
  const focusGone = e => {
    const to = e.relatedTarget;
    if (to && (to === bell || panel.contains(to))) return;
    if (bell.matches(':hover') || panel.matches(':hover')) return;
    setWant(false);
  };
  bell.addEventListener('blur', focusGone);
  panel.addEventListener('focusout', focusGone);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && want) shut(); });
  document.addEventListener('pointerdown', e => {
    if (want && e.pointerType !== 'mouse' && !bell.contains(e.target) && !panel.contains(e.target)) shut();
  });

  $('clearAll').addEventListener('click', () => { if (phase === 'list') release(true); });
  $('clearBtn').addEventListener('click', clearAll);
  $('newBtn').addEventListener('click', arrive);
  $('restoreBtn').addEventListener('click', restore);
  $('dotBtn').addEventListener('click', e => {
    mode = mode === 'count' ? 'dot' : 'count';
    if (mode === 'dot' && !clearing && (phase === 'opening' || phase === 'piled' || phase === 'list')) release(false);
    e.currentTarget.setAttribute('aria-pressed', mode === 'dot');
    renderBadge(true);
  });
  new ResizeObserver(() => { if (phase === 'list') organize(); }).observe(stage);

  /* ---------- fit the phone to the viewport (everything inside works in unscaled coordinates) ---------- */
  const fit = () => document.documentElement.style.setProperty('--s',
    Math.max(.42, Math.min(.86, (window.innerHeight - 210) / 874, (window.innerWidth - 32) / 415)).toFixed(4));
  fit(); window.addEventListener('resize', fit);

  /* ---------- boot: seven waiting in the bell ---------- */
  notes = DEFAULTS.map(makeNote); shown = notes.length;
  shell.style.height = geo().sh + 'px';
  renderBadge(false); syncButtons();
})();
</script>
</body>
</html>
