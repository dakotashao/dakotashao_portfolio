<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Dakota Shao — Interaction Designer</title>
<meta name="description" content="Dakota Shao, Interaction Designer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#151515;--grey:#6a6a66}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff}
  body{font-family:"Courier Prime","Courier New",monospace;color:var(--ink);min-height:100svh;
       display:flex;align-items:center;justify-content:center;
       padding:calc(env(safe-area-inset-top) + 40px) 24px calc(env(safe-area-inset-bottom) + 40px)}
  main{width:100%;max-width:400px}
  .qiu{font-family:"Noto Serif SC","Songti SC",serif;font-size:40px;line-height:1}
  h1{font-weight:700;font-size:17px;letter-spacing:1.6px}
  h1 span{margin-left:12px}
  p{margin-top:8px;font-size:13px;color:var(--grey)}
  nav{margin-top:36px}
  a{display:grid;grid-template-columns:96px 1fr auto;align-items:center;min-height:56px;
    border-top:1px solid var(--ink);color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
  a:last-child{border-bottom:1px solid var(--ink)}
  .k{font-size:10px;letter-spacing:2.4px}
  .v{font-size:15px;overflow-wrap:anywhere}
  .arr{transition:transform .25s cubic-bezier(.2,.7,.2,1)}
  a:active{background:#f4f4f2}
  a:active .arr,a:hover .arr{transform:translate(3px,-3px)}
</style>
</head>
<body>
<main>
  <h1>DAKOTA SHAO</h1>
  <p>Interaction Designer</p>
  <nav>
    <a href="https://dakotashao.com"><span class="k">PORTFOLIO</span><span class="v">dakotashao.com</span><span class="arr">↗</span></a>
    <a href="https://www.linkedin.com/in/dakota-shao-0b9b39311/" target="_blank" rel="noopener"><span class="k">LINKEDIN</span><span class="v">Dakota Shao</span><span class="arr">↗</span></a>
    <a href="mailto:wenqiushao@gmail.com"><span class="k">EMAIL</span><span class="v">wenqiushao@gmail.com</span><span class="arr">↗</span></a>
  </nav>
</main>
</body>
</html>
