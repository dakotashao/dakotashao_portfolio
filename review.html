<style>



:root {
  --ink: #111111; --sub: #6f6f6f; --faint: #a3a3a3; --line: #ebebeb; --tile: #f5f5f4;
  --font: "Season Sans", "Geist", "Inter", system-ui, -apple-system, "PingFang SC", sans-serif;
  --side: 220px; --cw: 880px; --tw: 600px;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--font); color: var(--ink); background: #fff; -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.5; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

/* ---------- main column ---------- */
main#app { margin-left: var(--side); padding: 72px 64px 120px; }
.col { max-width: var(--cw); margin: 0 auto; }

/* home */
.hi { font-size: 34px; line-height: 1.22; font-weight: 300; letter-spacing: -0.02em; max-width: 20ch; }
.ids { margin-top: 24px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--sub); }
.ids p { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.pill { display: inline-block; font-size: 13px; color: var(--ink); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; }
.sec-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 88px; padding-bottom: 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--faint); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px 24px; margin-top: 96px; }
.card .im { aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; background: var(--tile); }
.card .im img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
.card:hover .im img { transform: scale(1.025); }
.card .row { display: flex; align-items: baseline; gap: 10px; margin-top: 14px; }
.card .row i { font-style: normal; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.card .row b { font-weight: 500; font-size: 16px; flex: 1; }
.card .row em { font-style: normal; font-size: 13px; color: var(--faint); }
.card p { margin: 6px 0 0 28px; color: var(--sub); font-size: 14px; line-height: 1.5; }
.card .tg { margin: 12px 0 0 28px; display: flex; flex-wrap: wrap; gap: 6px; }
.tg span { font-size: 12px; color: var(--sub); background: var(--tile); border-radius: 99px; padding: 3px 9px; }

/* case study */
.top .idx { display: flex; align-items: baseline; gap: 10px; font-size: 14px; color: var(--sub); }
.top .idx i { font-style: normal; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.top .idx em { font-style: normal; margin-left: auto; font-size: 13px; color: var(--faint); }
.top h1 { margin-top: 28px; font-size: 44px; line-height: 1.12; font-weight: 300; letter-spacing: -0.025em; max-width: 17ch; }
.hero-img { margin-top: 40px; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; background: var(--tile); }
.facts { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 56px; margin-top: 28px; }
.fh { font-size: 12px; color: var(--faint); }
.mine ul { list-style: none; margin-top: 10px; }
.mine li { position: relative; padding-left: 16px; font-size: 15px; line-height: 1.5; margin-top: 6px; }
.mine li::before { content: ""; position: absolute; left: 0; top: .68em; width: 6px; height: 1px; background: var(--ink); }
.spec { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; align-content: start; }
.spec div:first-child { grid-column: 1 / -1; }
.spec dt { font-size: 12px; color: var(--faint); }
.spec dd { margin-top: 4px; font-size: 14px; line-height: 1.45; color: var(--sub); }
.next { display: flex; justify-content: space-between; align-items: center; margin-top: 140px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--sub); font-size: 14px; }
.next b { font-weight: 400; color: var(--ink); font-size: 24px; letter-spacing: -0.02em; display: block; margin-top: 4px; }
.next a:hover b { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }

/* Wildlink body (generic blocks) */
.blk .lb { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-top: 120px; scroll-margin-top: 40px; }
.blk .h2 { font-size: 28px; line-height: 1.25; font-weight: 400; letter-spacing: -0.02em; margin-top: 12px; max-width: var(--tw); }
.blk .sub { font-size: 16px; font-weight: 500; margin-top: 36px; max-width: var(--tw); }
.blk .p { margin-top: 14px; color: var(--sub); font-size: 16px; line-height: 1.6; max-width: var(--tw); }
.blk .p p + p { margin-top: 10px; }
.blk .img { margin-top: 32px; width: 100%; border-radius: 12px; background: var(--tile); object-fit: contain; }
.blk .gal { margin-top: 32px; display: grid; grid-template-columns: repeat(var(--c), minmax(0, 1fr)); gap: 12px; }
.blk .gal + .gal { margin-top: 12px; }
.blk .fd { margin-top: 32px; outline: none; }
.fd-stage { --w: 104px; position: relative; height: min(820px, 92vw); background: var(--tile, #f4f4f4); border-radius: 12px; overflow: hidden; perspective: 2600px; cursor: pointer; }
.fd-sheet { position: absolute; left: 50%; top: 50%; width: calc(var(--w) * 4); height: calc(var(--w) * 6); transform-style: preserve-3d; transition: transform 1.2s cubic-bezier(.5,.05,.25,1); }
.fd-c { position: absolute; top: calc(var(--w) * 2); width: var(--w); height: calc(var(--w) * 2); transform-style: preserve-3d; transition: transform 1.2s cubic-bezier(.5,.05,.25,1); transform-origin: left center; }
.fd-c0 { left: 0; } .fd-c .fd-c { top: 0; left: 100%; }
.fd-p { position: absolute; inset: 0; transform-style: preserve-3d; }
.fd-fr, .fd-bk { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.fd-fr { background-image: var(--img); background-size: 400% 300%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25); }
.fd-bk { background: #ecebe6; transform: rotateY(180deg); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08); }
.fd-t, .fd-b { position: absolute; left: 0; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 1.1s cubic-bezier(.5,.05,.25,1); }
.fd-t { bottom: 100%; transform-origin: center bottom; } .fd-b { top: 100%; transform-origin: center top; }
.s0 .fd-c1, .s0 .fd-c3 { transform: translateZ(-1px) rotateY(180deg); } .s0 .fd-c2 { transform: translateZ(1px) rotateY(-180deg); }
.s0 .fd-t, .s1 .fd-t { transform: translateZ(-.5px) rotateX(180deg); } .s0 .fd-b, .s1 .fd-b { transform: translateZ(-.5px) rotateX(-180deg); }
.s0 .fd-c1 .fd-t, .s0 .fd-c1 .fd-b, .s1 .fd-t, .s1 .fd-b { transition-delay: 0s; }
.rest.s0 .fd-c1, .rest.s0 .fd-t, .rest.s0 .fd-b, .rest.s1 .fd-t, .rest.s1 .fd-b { visibility: hidden; }
.rest.s0 .fd-c0 > .fd-t, .rest.s0 .fd-c0 > .fd-b { visibility: hidden; }
.fd-sheet.rest.s2 { background: var(--img) center / 100% 100% no-repeat; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 30px rgba(0,0,0,.08); } .rest.s2 .fd-c0 { visibility: hidden; }
/* wall mode (Type 3): an image wall in the manner of narinkim.com — no section heads, tiny labels inside the tiles */
.blk.wall { --g: 10px; }
.blk.wall .gal, .blk.wall .bk, .blk.wall .fd { margin-top: var(--g); }
.blk.wall > :first-child { margin-top: 56px; }
.blk.wall .sec { margin-top: 140px; display: flex; gap: 16px; align-items: baseline; font-size: 15px; }
.blk.wall .sec:first-child { margin-top: 72px; }
.blk.wall .sec h3 { font-weight: 500; color: var(--ink); }
.blk.wall .sec p { color: var(--sub); }
.blk.wall .sec + * { margin-top: 20px; }
.blk.wall .pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--g); margin-top: var(--g); }
.blk.wall .pair > *, .blk.wall .pair .gal { margin-top: 0; }
.blk.wall .pair .gal { height: 100%; } .blk.wall .pair figure { height: 100%; } .blk.wall .pair .gal img { height: 100%; }
.blk.wall .pair .bk { display: flex; flex-direction: column; }
.blk.wall .pair .bk-stage { flex: 1; display: flex; align-items: center; padding: 40px 28px 64px; }
.blk.wall .pair .bk-book { width: 100%; }
@media (max-width: 900px) { .blk.wall .pair { grid-template-columns: 1fr; } }
.blk.wall .gal { gap: var(--g); }
.blk .fb { position: relative; height: 100%; }
.blk .fb > .fd, .blk .fb > .bk { margin: 0 !important; height: 100%; }
.blk .fb > .fd .fd-stage { height: 100% !important; }
.blk .fb > .fd .bk-bar { display: none; }
.blk .fb > .bk { position: absolute !important; inset: 0; opacity: 0; pointer-events: none; }
.blk .fb { overflow: hidden; border-radius: 14px; }
.blk .fb.done > .bk { opacity: 1; pointer-events: auto; } .blk .fb.done > .fd { opacity: 0; }
.blk .fds { height: 260vh; margin-top: var(--g, 32px); }
.blk .fds-in { position: sticky; top: 0; height: 100vh; display: flex; align-items: center; }
.blk .fds .fd { width: 100%; margin: 0 !important; }
.blk .fds .fd-stage { height: 86vh !important; }
.blk .fds .fd-prev, .blk .fds .fd-next { visibility: hidden; }
.blk .rw { display: flex; gap: var(--g, 12px); margin-top: var(--g, 32px); } .blk .rw img { display: block; width: 100%; height: auto; border-radius: 14px; }
.blk .rw figcaption, .blk .pst figcaption { font-size: 13px; color: var(--faint); margin-top: 8px; }
@media (max-width: 700px) { .blk .rw { flex-direction: column; } }
.blk .pst { margin-top: var(--g, 32px); } .blk .pst img { display: block; height: min(88vh, 1100px); width: auto; max-width: 100%; margin: 0 auto; }
.blk .frm { margin-top: var(--g, 32px); border-radius: 14px; overflow: hidden; background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
.blk .frm iframe { display: block; width: 100%; height: 100%; border: 0; }
.blk.wall .bk.dk .bk-bar { color: rgba(255,255,255,.45); } .blk.wall .bk.dk .bk-bar button { color: #fff; } .blk.wall .bk.dk .bk-bar button:not(:disabled):hover { background: rgba(255,255,255,.1); }
.bk-sh + .bk-leaf .bk-fr::after { opacity: 0; transition: opacity .3s; } .bk-book.mid .bk-sh + .bk-leaf .bk-fr::after { opacity: 1; }
.bk-book:not(.end) .bk-leaf:last-child .bk-bk::after { opacity: 1; } .bk-book.end .bk-leaf:last-child .bk-bk::after { opacity: 0; }
.blk.wall .bk.lt .bk-bar { color: rgba(0,0,0,.5); }
.blk.wall .bk.dk .bk-sh { box-shadow: 0 4px 12px -6px rgba(0,0,0,.6); }
.blk.wall .gal img { border-radius: 14px; background: #f0f0f0; }
.blk.wall figure.tgd, .blk.wall .bk, .blk.wall .fd { position: relative; }
.blk.wall .tag { position: absolute; left: 22px; top: 20px; z-index: 3; font-size: 9px; line-height: 1.35; letter-spacing: .06em; text-transform: uppercase; color: #222; white-space: pre-line; pointer-events: none; }
.blk.wall .tag.lt, .blk.wall figure.lt .tag { color: #f4f1e8; }
.blk.wall .bk-stage, .blk.wall .fd-stage { border-radius: 14px; background: #f0f0f0; }
.blk.wall .bk-bar { position: absolute; left: 0; right: 0; bottom: 14px; margin: 0; }
.blk.wall .bk-stage { padding: 64px 40px 72px; }
.blk.wall .bk[data-c] .bk-book { width: min(100%, 620px); }
.blk.wall .fd-stage { height: min(640px, 70vw); }
.blk.wall .desc2 { margin-top: 96px; display: grid; grid-template-columns: 2fr 1fr; gap: 48px; }
.blk.wall .desc2 h2 { font-size: 15px; font-weight: 400; color: var(--ink); margin-bottom: 12px; }
.blk.wall .desc2 h2:not(:first-child) { margin-top: 28px; }
.blk.wall .desc2 p { font-size: 17px; line-height: 1.45; color: var(--ink); max-width: 720px; }
.blk.wall .desc2 p + p { margin-top: 14px; }
.blk.wall .desc2 > div:last-child p { font-size: 15px; color: var(--sub); margin-top: 2px; }
@media (max-width: 900px) { .blk.wall .desc2 { grid-template-columns: 1fr; } }
.blk.wall .notes { margin-top: 96px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; border-top: 1px solid var(--line); padding-top: 24px; }
.blk.wall .notes h3 { font-size: 15px; font-weight: 500; }
.blk.wall .notes p { margin-top: 8px; font-size: 15px; line-height: 1.55; color: var(--sub); }
@media (max-width: 900px) { .blk.wall .notes { grid-template-columns: 1fr; } }
.blk .bk { margin-top: 32px; outline: none; }
.bk-stage { background: var(--tile, #f4f4f4); border-radius: 12px; padding: 56px 40px; overflow: hidden; perspective: 2400px; }
.bk-book { position: relative; width: min(100%, 860px); margin: 0 auto; aspect-ratio: var(--r); transition: transform .9s cubic-bezier(.3,.1,.2,1); transform: translateX(-25%); cursor: pointer; user-select: none; }
.bk-book.end { transform: translateX(25%); } .bk-book.mid { transform: none; }
.bk-leaf { position: absolute; top: 0; left: 50%; width: 50%; height: 100%; transform-origin: left center; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.3,.1,.2,1); }
.bk-leaf.on { transform: rotateY(-180deg); }
.bk-f { position: absolute; inset: 0 0 0 -1px; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: #fff; overflow: hidden; }
.bk-sh { position: absolute; top: 0; bottom: 0; left: 50%; right: 0; box-shadow: 0 0 0 .5px rgba(0,0,0,.07), 1px 1px 0 #ebe7df, 2px 2px 0 #e2ddd3, 3px 3px 0 #d8d2c6, 3px 4px 10px -3px rgba(40,30,20,.22), 0 14px 24px -14px rgba(40,30,20,.3); transition: left .9s cubic-bezier(.3,.1,.2,1), right .9s cubic-bezier(.3,.1,.2,1); pointer-events: none; }
.bk-book.mid .bk-sh { left: 0; } .bk-book.end .bk-sh { left: 0; right: 50%; }
.bk-f img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.bk-bk { transform: rotateY(180deg); }
.bk-fr::after, .bk-bk::after { content: ""; position: absolute; top: 0; bottom: 0; width: 14%; pointer-events: none; mix-blend-mode: multiply; }
/* paper: fine grain over every page, multiplied so it reads as stock rather than a filter */
.bk-f::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); background-size: 160px; mix-blend-mode: multiply; opacity: .32; }
/* the page curls into the gutter: a soft fall-off, a faint highlight where the curve turns toward the light */
.bk-fr::after { left: 0; background: linear-gradient(90deg, rgba(50,38,25,.38) 0%, rgba(50,38,25,.12) 20%, rgba(255,255,255,.10) 38%, rgba(0,0,0,0) 100%); }
.bk-bk::after { right: 0; background: linear-gradient(270deg, rgba(50,38,25,.38) 0%, rgba(50,38,25,.12) 20%, rgba(255,255,255,.10) 38%, rgba(0,0,0,0) 100%); }
/* a leaf darkens as it lifts and clears as it lands, like a sheet catching less light mid-turn */
.bk-f > .bk-lt { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: #1a140c; opacity: 0; }
@keyframes bkLand { 0% { opacity: .22; } 100% { opacity: 0; } }
.bk-leaf.on .bk-bk > .bk-lt { animation: bkLand .9s cubic-bezier(.3,.1,.2,1); }
.bk-leaf.back .bk-fr > .bk-lt { animation: bkLand .9s cubic-bezier(.3,.1,.2,1); }
.bk-bar { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 14px; font-size: 13px; color: var(--faint); }
.bk-bar button { border: 0; background: none; font: inherit; font-size: 16px; color: var(--ink, #111); padding: 4px 10px; cursor: pointer; border-radius: 6px; }
.bk-bar button:disabled { opacity: .25; cursor: default; }
.bk-bar button:not(:disabled):hover { background: rgba(0,0,0,.05); }
.bk-pg { min-width: 120px; text-align: center; font-variant-numeric: tabular-nums; }
@media (max-width: 700px) { .bk-stage { padding: 28px 12px; } }

.blk .gal img { width: 100%; border-radius: 10px; background: var(--tile); }
.blk .gal figcaption { font-size: 13px; color: var(--faint); margin-top: 8px; }
.blk .cards { margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.blk .cards div { background: var(--tile); border-radius: 12px; padding: 18px 18px 22px; }
.blk .cards h3 { font-size: 15px; font-weight: 500; }
.blk .cards p { margin-top: 8px; font-size: 14px; line-height: 1.5; color: var(--sub); }
.blk .steps { margin-top: 28px; list-style: none; counter-reset: s; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 24px; }
.blk .steps li { counter-increment: s; border-top: 1px solid var(--line); padding-top: 12px; }
.blk .steps li::before { content: counter(s, decimal-leading-zero); display: block; font-size: 12px; color: var(--faint); }
.blk .steps b { display: block; margin-top: 6px; font-weight: 500; }
.blk .steps span { display: block; margin-top: 4px; font-size: 14px; line-height: 1.5; color: var(--sub); }
.blk .vid { position: relative; margin-top: 32px; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #111; }
.blk .vid iframe { width: 100%; height: 100%; border: 0; }
.blk .vid a { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 15px; background: #1b1b1b; }
.blk .vid a span { border: 1px solid rgba(255,255,255,.4); border-radius: 99px; padding: 10px 20px; }

/* ---------- 24 Hour Home Care body: her own page content, set into this layout ---------- */
/* 24 Hour Home Care case study: the whole page from its own artifact, unchanged, every rule scoped under .cs24. */
#app .cs.cs24-page{max-width:none;padding-top:0}
#app .view:has(.cs24){overflow-x:clip}
/* the artifact's own page defaults (its runtime base: 14px system type, images never wider than their box) */
#app .cs24{font-size:14px;line-height:normal;--ink-rgb:0,0,0}
#app .cs24 img{max-width:100%}
/* the site has its own .hero, .nav, .label, .chip and link rules; undo them inside the page so only the artifact's apply */
#app .cs24 .hero{display:block;position:static;height:auto;min-height:0;overflow:visible;place-items:normal;grid-template-columns:none}
#app .cs24 .nav{position:static;top:auto;left:auto;right:auto;z-index:auto;pointer-events:auto;display:block;justify-content:normal;align-items:normal;padding:0}
#app .cs24 .label{color:inherit;margin-bottom:0}
#app .cs24 .chip{display:inline;font-size:inherit;background:none;border-radius:0;padding:0;max-width:none}
#app .cs24 a{color:revert}
#app .cs24{--bg:#ffffff; --fg:#0d0d0d; --body:rgba(0,0,0,.52); --frame:#f4f4f4; --navy:#011c62;
  --cs:#0c65c3; --cs-t:#dbe8f8; --ds:#9a5a00; --ds-t:#fde9c7;
  --sans:"Inter",system-ui,-apple-system,"PingFang SC",sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);}
#app .cs24, #app .cs24 *{box-sizing:border-box;margin:0;padding:0}
#app .cs24{background:var(--bg);color:var(--fg);font-family:var(--sans);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:96px 120px}
#app .cs24 .article{max-width:720px;margin:0 auto}
#app .cs24 .text{max-width:560px;margin:0 auto}
#app .cs24 .label{font-size:14px;line-height:20.5px}
#app .cs24 h2{font-size:32px;line-height:38.5px;font-weight:500;letter-spacing:-.04em;margin-top:9px;max-width:480px}
#app .cs24 .body{font-size:16px;line-height:24px;color:var(--body);margin-top:19px}
@media (max-width:560px){#app .cs24 h2{font-size:26px;line-height:32px}}
#app .cs24 h1{font-size:48px;line-height:53px;font-weight:500;letter-spacing:-.045em;margin-top:12px}
#app .cs24 .cover{display:block;width:100%;height:auto;aspect-ratio:720/405;object-fit:cover;border-radius:20px;margin-top:32px;background:var(--frame)}
#app .cs24 .meta{display:flex;justify-content:space-between;gap:24px;margin-top:52px;font-size:16px;line-height:20px;letter-spacing:-.011em}
#app .cs24 .meta dt{color:var(--fg)}
#app .cs24 .meta dd{color:#7a7a7a}
#app .cs24 .sec{margin-top:110px}
#app .cs24 .body b{font-weight:600}
#app .cs24 .p2{margin-top:24px}

/* layout switcher (for comparing options) */
.sw { position: fixed; bottom: 20px; left: calc(50% + var(--side) / 2); translate: -50% 0; z-index: 30; display: flex; align-items: center; gap: 2px; padding: 4px; background: #fff; border: 1px solid var(--line); border-radius: 99px; box-shadow: 0 6px 24px -10px rgba(0,0,0,.18); font-size: 13px; }
.sw span { color: var(--faint); padding: 0 8px 0 10px; }
.sw button { font: inherit; border: 0; background: none; width: 30px; height: 28px; border-radius: 99px; color: var(--sub); cursor: pointer; }
.sw button.on { background: var(--ink); color: #fff; }
.sw[hidden] { display: none; }
/* B: rows */
.rows { margin-top: 96px; display: flex; flex-direction: column; }
.r { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.55fr); gap: 40px; padding: 32px 0; border-top: 1px solid var(--line); }
.r:last-child { border-bottom: 1px solid var(--line); }
.r-t { display: flex; flex-direction: column; }
.r-t i { font-style: normal; font-size: 12px; color: var(--faint); }
.r-t b { font-weight: 400; font-size: 24px; letter-spacing: -0.02em; margin-top: 8px; }
.r-t p { margin-top: 10px; color: var(--sub); font-size: 14px; line-height: 1.5; }
.r-t .tg { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
.r-t em { font-style: normal; font-size: 13px; color: var(--faint); margin-top: auto; padding-top: 24px; }
.r .im, .f .im { aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; background: var(--tile); }
.r .im img, .f .im img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
.r:hover .im img, .f:hover .im img { transform: scale(1.02); }
/* C: full width */
.full { margin-top: 96px; display: flex; flex-direction: column; gap: 72px; }
.f-c { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 24px; align-items: baseline; margin-top: 16px; }
.f-n { display: flex; gap: 10px; align-items: baseline; }
.f-n i { font-style: normal; font-size: 12px; color: var(--faint); }
.f-n b { font-weight: 500; font-size: 16px; }
.f-c p { color: var(--sub); font-size: 14px; line-height: 1.5; }
.f-c em { font-style: normal; font-size: 13px; color: var(--faint); white-space: nowrap; }
/* D: text index + cursor preview */
.idxl { position: relative; margin-top: 96px; border-top: 1px solid var(--line); }
.x { display: grid; grid-template-columns: 36px 220px 1fr auto; gap: 16px; align-items: baseline; padding: 22px 0; border-bottom: 1px solid var(--line); color: var(--ink); transition: color .25s; }
.x i { font-style: normal; font-size: 12px; color: var(--faint); }
.x b { font-weight: 400; font-size: 22px; letter-spacing: -0.02em; }
.x span { color: var(--sub); font-size: 14px; }
.x em { font-style: normal; font-size: 13px; color: var(--faint); }
.idxl:hover .x { color: var(--faint); }
.idxl:hover .x:hover { color: var(--ink); }
.peek { position: absolute; left: 0; top: 0; width: 320px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; pointer-events: none; opacity: 0; scale: .96; transition: opacity .2s, scale .25s; z-index: 5; box-shadow: 0 20px 40px -20px rgba(0,0,0,.35); }
.peek.on { opacity: 1; scale: 1; }
@media (max-width: 900px) {
  .r { grid-template-columns: 1fr; gap: 16px; }
  .r .im { order: -1; }
  .f-c { grid-template-columns: 1fr; gap: 6px; }
  .x { grid-template-columns: 28px 1fr; } .x span, .x em { grid-column: 2; }
  .peek { display: none; }
}

/* ========== left nav: site level on the home page, sections inside a project ========== */
:root { --side: 232px; --ease: cubic-bezier(.2, .7, .2, 1); }
#nav { position: fixed; inset: 0 auto 0 0; width: var(--side); z-index: 20; display: flex; flex-direction: column; padding: 40px 32px 32px; }
main#app { margin-left: var(--side); padding: 72px 64px 120px; }
.n-me { font-weight: 500; font-size: 15px; display: block; }
.n-role { font-size: 13px; color: var(--faint); margin-top: 2px; }
.n-main { margin-top: 44px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.n-main a { color: var(--faint); transition: color .2s; }
.n-main a:hover, .n-main a.on { color: var(--ink); }
.n-back { margin-top: 44px; font-size: 14px; color: var(--sub); display: inline-flex; gap: 6px; transition: color .2s, gap .25s var(--ease); }

.n-toc a:hover { color: var(--sub); }
.n-toc a.on { color: var(--ink); }
.n-foot { margin-top: auto; font-size: 13px; color: var(--faint); display: flex; flex-direction: column; gap: 4px; }
.n-foot a:hover { color: var(--ink); }
/* small screens: the nav becomes a top bar with a menu */
.n-menu { display: none; }
@media (max-width: 900px) {
  #nav { position: fixed; inset: 0 0 auto 0; width: auto; height: 56px; padding: 0 20px !important; flex-direction: row !important; align-items: center; background: #fff; border-bottom: 1px solid var(--line); overflow: hidden; }
  #nav > :not(.n-top) { display: none !important; }
  #nav .n-top { display: flex !important; width: 100%; justify-content: space-between; align-items: center; }
  #nav.open { height: 100dvh; overflow: auto; flex-direction: column !important; align-items: stretch; padding-top: 16px !important; }

}

  .hi { font-size: 26px; } .grid { grid-template-columns: 1fr; } .facts { grid-template-columns: 1fr; gap: 28px; } .top h1 { font-size: 30px; }

}

/* ===== type system measured from Wendy's case pages =====
   one weight (Light 300), black text, slightly open tracking, four sizes (15 / 20 / 24 / 36),
   tight gaps inside a group (8–10px), wide gaps between groups (60 / 110px) */
:root { --ink: #000; --faint: #969696; --sub: #000; }
body { font-weight: 300; font-size: 15px; line-height: 22px; letter-spacing: .03em; }
h1, h2, h3, b, strong, dt, dd, .n-me, .n-proj, .card .c-n, .meta4 dd, .spec2 dd, .blk .sub, .blk .cards h3, .blk .steps b, .n-toc a.on { font-weight: 300 !important; }

.n-back, .n-toc a, .n-foot { font-size: 14px; letter-spacing: 0; }
.n-toc { gap: 4px; } .n-toc a { padding: 6px 0; }

.ids { font-size: 15px; color: #000; } .pill { font-size: 14px; border-color: #000; }

.card .c-m { font-size: 15px; color: var(--faint); margin-top: 6px; }
/* case header (E) */

.meta4 { margin-top: 60px; gap: 24px; }

.meta4 dt, .spec2 dt, .top .kick { font-size: 15px; letter-spacing: 0; color: var(--faint); text-transform: uppercase; }
.meta4 dd { margin-top: 8px; font-size: 15px; line-height: 22px; color: #000; gap: 0; }
.spec2 dd { font-size: 15px; color: #000; }
/* sections */
.blk .lb, #app .cs24 .sec .label { font-size: 15px; line-height: 18px; letter-spacing: 0; color: var(--faint); margin-top: 110px; }
#app .cs24 .sec { padding-top: 110px; }

/* less thin, less empty: Regular for text, slightly larger body, tighter gaps between groups */
body { font-weight: 400; font-size: 16px; line-height: 24px; letter-spacing: .02em; }
h1, h2, h3, b, strong, dt, dd, .n-me, .n-proj, .card .c-n, .meta4 dd, .spec2 dd, .blk .sub, .blk .cards h3, .blk .steps b, .n-toc a.on { font-weight: 400 !important; }

/* ===== balanced full-screen layout: one fluid content box, even gutters ===== */

/* not too wide: cap the box, keep sparse diagram frames and the meta row narrower than the box */

.meta4 { max-width: 920px; }
#app .cs24 :is(.goals, .demo, .flows, .fd, .dfig, .desk, .desk2, .dsfig, .tokens, .kf, .evo, .shift, .hw, .ovf, .kx, .dcar, .outc) { max-width: 1040px !important; }
.blk .cards, .blk .steps { max-width: 1040px; }

/* keep every line short, like the references: about 60–65 characters for body, ~30 for headings */
.blk .p, #app .cs24 .body, .hE .para, #app .cs24 .text p, #app .cs24 .kf p, #app .cs24 .ft p, #app .cs24 .refl p { max-width: 60ch !important; }

#app .cs24 .text { max-width: 640px !important; }
.hE h1 { max-width: 20ch; }

/* ===================== Narin Kim layout ===================== */
:root { --side: 340px; }
#nav { width: var(--side); padding: 24px 22px 24px 24px; }
.n-me { font-size: 26px !important; line-height: 30px; letter-spacing: -0.01em; }
.nk-big { margin-top: 64px; display: flex; flex-direction: column; }
.nk-big a { font-size: 26px; line-height: 32px; letter-spacing: -0.01em; color: var(--ink); transition: opacity .2s; }
.nk-big a:hover { opacity: .45; }
.nk-list { margin-top: 36px; display: flex; flex-direction: column; gap: 10px; }
.nk-card { background: #f5f5f5; border-radius: 10px; transition: background-color .2s; }
.nk-card:hover, .nk-card.on { background: #ececec; }
.nk-card > a { display: block; padding: 14px 20px; }
.nk-card b { display: block; font-size: 13px; line-height: 17px; letter-spacing: 0; }
.nk-card span { display: block; font-size: 12px; line-height: 16px; color: var(--faint); letter-spacing: 0; }
.nk-toc { display: flex; flex-direction: column; padding: 0 20px 14px; }
.nk-toc a { font-size: 12px; line-height: 16px; padding: 3px 0; color: var(--faint); letter-spacing: 0; transition: color .2s; }
.nk-toc a:hover, .nk-toc a.on { color: var(--ink); }
.nk-clock { margin-top: auto; font-size: 28px; line-height: 32px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
main#app { margin-left: var(--side); padding: 24px 32px 120px 0; }
.col { max-width: none; }
/* home */
.nk-feature { display: block; border-radius: 16px; overflow: hidden; background: var(--tile); }
.nk-feature img { width: 100%; height: min(78vh, 760px); object-fit: cover; display: block; }
.nk-grid { margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
.nk-tile { display: block; background: #f5f5f5; border-radius: 16px; padding: 10px 10px 18px; }
.nk-im { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 4 / 3; background: #e9e9e9; }
.nk-im img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
.nk-tile:hover .nk-im img { transform: scale(1.03); }
.nk-tags { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
.nk-tags i { font-style: normal; font-size: 12px; line-height: 16px; letter-spacing: 0; color: #fff; background: rgba(0,0,0,.32); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border-radius: 6px; padding: 2px 7px; }
.nk-tile b { display: block; margin: 14px 4px 0; font-size: 13px; line-height: 17px; letter-spacing: 0; }
.nk-tile p { margin: 6px 4px 0; font-size: 13px; line-height: 17px; color: var(--faint); letter-spacing: 0; max-width: 46ch; }
/* case page */
.hero-img { margin-top: 0; border-radius: 16px; aspect-ratio: auto; height: min(78vh, 760px); object-fit: cover; }
.nk-cap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 32px; margin-top: 28px; }
.nk-l p { font-size: 18px; line-height: 22px; letter-spacing: 0; }
.nk-l p.g { color: var(--faint); }
.nk-desc { font-size: 18px; line-height: 22px; letter-spacing: 0; max-width: 46ch; }
.nk-meta { margin-top: 28px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; max-width: 760px; }
.nk-meta dt { font-size: 13px; color: var(--faint); letter-spacing: 0; }
.nk-meta dd { margin-top: 4px; font-size: 13px; line-height: 18px; letter-spacing: 0; }
.nk-cap ~ .cs24 .article > .sec:first-of-type { padding-top: 96px; margin-top: 0; }
.nk-cap ~ .blk > .lb:first-child { margin-top: 96px; }
.next { margin-top: 120px; }
@media (max-width: 900px) {
  main#app { margin-left: 0; padding: 80px 16px 80px; }
  .nk-cap { grid-template-columns: 1fr; gap: 16px; } .nk-meta { grid-template-columns: 1fr 1fr; }
  .nk-feature img, .hero-img { height: 52vh; }
  #nav.open .nk-big, #nav.open .nk-list, #nav.open .nk-clock { display: flex !important; }
}

/* ===================== in-project index options ===================== */
.nk-toc { position: relative; }
.nk-ind, .nk-bar, .nk-now { display: none; }
.nk-toc a:hover { color: #5c5c5c; }
.nk-toc a.on { color: var(--ink); }
.nk-toc a { position: relative; z-index: 1; }
/* A: plain list in the grey card */
/* B: hairline track on the left, black segment slides to the current section */
#nav.toc-B .nk-toc { margin: 2px 20px 16px; padding: 0 0 0 14px; border-left: 1px solid #d6d6d6; }
#nav.toc-B .nk-ind { display: block; position: absolute; left: -1px; top: 0; width: 1px; background: var(--ink); transition: transform .45s cubic-bezier(.2,.7,.2,1), height .45s; }
/* C: white chip slides behind the current section */
#nav.toc-C .nk-toc { padding: 0 10px 10px; }
#nav.toc-C .nk-toc a { padding: 5px 10px; }
#nav.toc-C .nk-ind { display: block; position: absolute; left: 10px; right: 10px; top: 0; background: #fff; border-radius: 7px; box-shadow: 0 1px 2px rgba(0,0,0,.05); transition: transform .45s cubic-bezier(.2,.7,.2,1), height .45s; }
/* D: compact — current section + count, page progress bar; the full list opens on hover */
#nav.toc-D .nk-now { display: flex; justify-content: space-between; padding: 0 20px 12px; font-size: 12px; line-height: 16px; }
#nav.toc-D .nk-cnt { color: var(--faint); font-variant-numeric: tabular-nums; }
#nav.toc-D .nk-toc { max-height: 0; overflow: hidden; padding: 0 20px; transition: max-height .45s cubic-bezier(.2,.7,.2,1), padding .45s; }
#nav.toc-D .nk-card.on:hover .nk-toc { max-height: 320px; padding-bottom: 12px; }
#nav.toc-D .nk-bar { display: block; height: 2px; margin: 0 20px 14px; background: #dcdcdc; border-radius: 2px; overflow: hidden; }
#nav.toc-D .nk-bar > i { display: block; height: 100%; background: var(--ink); transform-origin: 0 50%; transform: scaleX(0); }
/* E: the open project leaves the card; its sections sit on white, bigger */
#nav.toc-E .nk-card.on { background: none; }
#nav.toc-E .nk-card.on > a { padding: 14px 0 10px; }
#nav.toc-E .nk-card.on > a b { font-size: 18px; line-height: 22px; }
#nav.toc-E .nk-card.on > a span { font-size: 14px; line-height: 18px; }
#nav.toc-E .nk-toc { padding: 0 0 14px; }
#nav.toc-E .nk-toc a { font-size: 18px; line-height: 22px; padding: 2px 0; color: #c4c4c4; }
#nav.toc-E .nk-toc a:hover { color: #7a7a7a; } #nav.toc-E .nk-toc a.on { color: var(--ink); }
.sw { left: auto; right: 24px; translate: none; }

/* ===================== font: Narin-like neo-grotesk ===================== */
html.f-nk { --font: "Inter Tight", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; --ink: #1f1f1f; }
html.f-nk body, html.f-nk #app .cs24 { letter-spacing: -0.012em; }

html.f-nk h1, html.f-nk h2, html.f-nk h3, html.f-nk .nk-l p, html.f-nk .nk-desc { letter-spacing: -0.025em !important; }
html.f-nk .nk-card b, html.f-nk .nk-card span, html.f-nk .nk-toc a, html.f-nk .nk-tile b, html.f-nk .nk-tile p, html.f-nk .nk-meta dt, html.f-nk .nk-meta dd, html.f-nk .nk-tags i { letter-spacing: -0.005em; }
html.f-nk .nk-card b { font-weight: 500 !important; }
.sw .sep { width: 1px; height: 16px; background: var(--line); margin: 0 6px; }
.sw button.wide { width: auto; padding: 0 10px; }

/* collapsible open project */
.nk-card > a.nk-head { position: relative; cursor: pointer; }
.nk-chev { position: absolute; right: 20px; top: 50%; width: 7px; height: 7px; margin-top: -5px; border-right: 1.2px solid var(--faint); border-bottom: 1.2px solid var(--faint); transform: rotate(45deg); transition: transform .35s cubic-bezier(.2,.7,.2,1), border-color .2s; }
.nk-head:hover .nk-chev { border-color: var(--ink); }
.nk-card.shut .nk-chev { transform: rotate(-45deg); margin-top: -3px; }
.nk-card.on .nk-toc, .nk-card.on .nk-now, .nk-card.on .nk-bar { transition: max-height .45s cubic-bezier(.2,.7,.2,1), opacity .3s, padding .45s, margin .45s; max-height: 420px; overflow: hidden; }
.nk-card.shut .nk-toc, .nk-card.shut .nk-now, .nk-card.shut .nk-bar, #nav.toc-D .nk-card.shut:hover .nk-toc { max-height: 0 !important; opacity: 0; padding-top: 0 !important; padding-bottom: 0 !important; margin-top: 0 !important; margin-bottom: 0 !important; }

/* game flow rows */
.blk .flow { list-style: none; margin: 24px 0 0; padding: 0; max-width: 1040px; display: flex; flex-direction: column; gap: 12px; }
.blk .flow li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 32px; align-items: center; background: #f5f5f5; border-radius: 16px; padding: 28px 32px; }
.blk .flow .fl-n { font-size: 13px; color: var(--faint); }
.blk .flow h3 { margin-top: 6px; font-size: 24px; line-height: 30px; }
.blk .flow .fl-p { margin-top: 8px; font-size: 16px; line-height: 24px; color: #5c5c5c; max-width: 34ch; }
.blk .flow img { width: 100%; max-width: 420px; justify-self: center; mix-blend-mode: multiply; }
@media (max-width: 900px) { .blk .flow li { grid-template-columns: 1fr; } }

/* ===== project text, set the way dakotashao.com sets it: one narrow column, a heavier headline, grey body, small cards ===== */
#app .blk .h2 { font-size: 32px; line-height: 1.2; font-weight: 500 !important; letter-spacing: -0.03em !important; max-width: 480px !important; text-wrap: balance; margin-top: 12px; }
#app .blk .p { margin-top: 16px; font-size: 16px; line-height: 1.5; color: rgba(0,0,0,.52); max-width: 560px !important; }
#app .blk .sub { font-size: 16px; line-height: 20px; font-weight: 500 !important; margin-top: 48px; }
#app .blk .sub + .p { margin-top: 4px; }
#app .blk .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 720px; margin-top: 24px; }
#app .blk .cards div { border-radius: 16px; padding: 20px 22px 22px; }
#app .blk .cards h3 { font-size: 16px; line-height: 1.25; font-weight: 500 !important; letter-spacing: -0.01em !important; }
#app .blk .cards p { font-size: 14.5px; line-height: 1.4; color: rgba(0,0,0,.52); margin-top: 6px; }
#app .blk .flow h3 { font-weight: 500 !important; letter-spacing: -0.02em !important; }

/* tall flowcharts scroll inside equal frames */
.blk .gal-sc .sc { height: 560px; overflow-y: auto; border-radius: 14px; background: var(--tile); overscroll-behavior: contain; scrollbar-width: thin; }
.blk .gal-sc .sc img { width: 100%; height: auto; display: block; border-radius: 0; }
/* deck: a row of slides that scrolls sideways */
.blk .deck { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin-top: 20px; max-width: 1040px; padding-bottom: 8px; scrollbar-width: thin; overscroll-behavior-x: contain; }
.blk .deck img { flex: 0 0 auto; width: min(100%, 1040px); aspect-ratio: 16 / 9; object-fit: cover; border-radius: 14px; background: var(--tile); scroll-snap-align: start; }
.blk .deck img:only-child { width: 100%; }
.blk .deck:has(img + img) img { width: 86%; }

/* animated thumbnails carried over from dakotashao.com */
.ec{--T:11s;--k:calc(31.8cqw / 1080);position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#eff0f2;container-type:inline-size}
.ec .ec-ph{position:absolute;left:50%;top:6cqw;width:34cqw;height:70cqw;margin-left:-17cqw;border-radius:5.6cqw;background:#0e0e10;padding:1.1cqw;
  box-shadow:0 0 0 .22cqw #2e2e31,0 0 0 .3cqw #77777c,0 3cqw 5cqw -2cqw rgba(0,0,0,.16)}
.ec .ec-ph i{position:absolute;width:.42cqw;background:linear-gradient(90deg,#3a3a3d,#1c1c1e);border-radius:.2cqw}
.ec .ec-ph .b1{left:-.62cqw;top:12.5cqw;height:2.6cqw}
.ec .ec-ph .b2{left:-.62cqw;top:17cqw;height:4.6cqw}
.ec .ec-ph .b3{left:-.62cqw;top:22.6cqw;height:4.6cqw}
.ec .ec-ph .b4{right:-.62cqw;top:18cqw;height:7.2cqw;background:linear-gradient(270deg,#3a3a3d,#1c1c1e)}
.ec .ec-scr{position:relative;width:100%;height:100%;border-radius:4.5cqw;overflow:hidden;background:#fff}
.ec .sp{position:absolute;left:0;top:calc(var(--t) * var(--k));width:calc(var(--w,1080) * var(--k));height:calc(var(--h) * var(--k));
  background:var(--img) no-repeat;background-size:calc(1080 * var(--k)) auto;background-position:0 calc(var(--y) * var(--k) * -1)}
.ec .i2{--img:url(img/echos-elias-1.webp)}.ec .i3{--img:url(img/echos-elias-2.webp)}
.ec .ec-head{z-index:2}
.ec .ec-view{position:absolute;left:0;right:0;top:calc(315 * var(--k));bottom:0;overflow:hidden}
.ec .ec-col{position:absolute;left:0;top:calc(-315 * var(--k));width:100%;animation:ec-scroll var(--T) cubic-bezier(.65,0,.35,1) infinite}
.ec .ec-col .sp{opacity:0}
.ec .b-a{animation:ec-a var(--T) cubic-bezier(.2,.8,.2,1) infinite}
.ec .b-b{animation:ec-b var(--T) cubic-bezier(.2,.8,.2,1) infinite}
.ec .b-c{animation:ec-c var(--T) cubic-bezier(.2,.8,.2,1) infinite}
.ec .b-d{animation:ec-d var(--T) cubic-bezier(.2,.8,.2,1) infinite}
.ec .b-e{animation:ec-e var(--T) cubic-bezier(.2,.8,.2,1) infinite}
/* 11s · ask 0.3 · Elias answers 1.2 · paintings 2.2 · scroll 3.3 · "closer look" 4.1 · scroll 5.5 · Fontainebleau 6.0 · hold · fade 9.7 */
@keyframes ec-a{0%,3%{opacity:0;transform:translateY(1.2cqw)}8%,88%{opacity:1;transform:none}94%,100%{opacity:0}}
@keyframes ec-b{0%,11%{opacity:0;transform:translateY(1.2cqw)}16%,88%{opacity:1;transform:none}94%,100%{opacity:0}}
@keyframes ec-c{0%,20%{opacity:0;transform:translateY(1.6cqw) scale(.98)}26%,88%{opacity:1;transform:none}94%,100%{opacity:0}}
@keyframes ec-d{0%,37%{opacity:0;transform:translateY(1.2cqw)}42%,88%{opacity:1;transform:none}94%,100%{opacity:0}}
@keyframes ec-e{0%,54%{opacity:0;transform:translateY(1.6cqw) scale(.98)}60%,88%{opacity:1;transform:none}94%,100%{opacity:0}}
@keyframes ec-scroll{0%,30%{transform:none}37%,50%{transform:translateY(calc(-480 * var(--k)))}57%,95%{transform:translateY(calc(-950 * var(--k)))}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.ec *{animation:none!important}.ec .ec-col .sp{opacity:1}}
.nk-im .ec, .hero-art .ec { position: absolute; inset: 0; aspect-ratio: auto; border-radius: 0; }
.hero-art { position: relative; overflow: hidden; background: #eff0f2; }

/* ===================== Interfaces ===================== */
.if-hero { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 16px; background: #ece5de; }
.blk.ifc { max-width: none; }
.blk.ifc > .lb:first-child { margin-top: 80px; }
.blk.ifc .lb { margin-top: 64px; }
.if-grid { margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: start; }
.if-grid.wide { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.if-set { position: relative; min-width: 0; }
.if-set.feat { grid-column: span 2; grid-row: span 2; align-self: stretch; }
.if-set.feat .if-stage { height: 100%; aspect-ratio: auto !important; }
.if-stage { position: relative; border-radius: 16px; overflow: hidden; background: #f4f4f4; }
.if-stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; transition: opacity .45s cubic-bezier(.25,.8,.25,1); }
.if-stage iframe.b { opacity: 0; pointer-events: none; }
.if-stage.on iframe.b { opacity: 1; pointer-events: auto; }
.if-stage:has(iframe.b).on iframe.a { opacity: 0; }
.if-stage.ext iframe { inset: auto; left: 0; top: 0; transform-origin: 0 0; }
/* on hover: the variant switch bottom left, the expand button bottom right (as on dakotashao.com/playground) */
.if-vsw { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; z-index: 2; opacity: 0; transition: opacity .25s ease; }
.if-open { all: unset; cursor: pointer; position: absolute; right: 10px; bottom: 10px; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: #fff; color: #0d0d0d; z-index: 2; opacity: 0; transition: opacity .25s ease, background-color .2s; }
.if-open:hover { background: #e8e8e8; }
.if-set:hover .if-vsw, .if-set:hover .if-open, .if-set:focus-within .if-vsw, .if-set:focus-within .if-open, .if-vsw.on { opacity: 1; }
@media (hover: none) { .if-vsw, .if-open { opacity: 1; } }
.if-seg { position: relative; display: flex; padding: 3px; border-radius: 10px; background: rgba(0,0,0,.05); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.if-seg .th { position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 7px; background: #fff; transition: left .35s cubic-bezier(.25,.8,.25,1), width .35s cubic-bezier(.25,.8,.25,1); }
.if-seg button { all: unset; position: relative; cursor: pointer; padding: 6px 10px; font-size: 13px; line-height: 16px; letter-spacing: -0.01em; color: rgba(0,0,0,.4); transition: color .2s; white-space: nowrap; }
.if-seg button[aria-pressed="true"], .if-seg button:hover { color: #0d0d0d; }
.if-set.dk .if-seg { background: rgba(255,255,255,.14); } .if-set.dk .if-seg button { color: rgba(255,255,255,.55); } .if-set.dk .if-seg button[aria-pressed="true"] { color: #0d0d0d; }
.if-dlg { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; opacity: 0; transition: opacity .25s ease; }
.if-dlg.in { opacity: 1; }
.if-scrim { all: unset; position: absolute; inset: 0; background: rgba(255,255,255,.82); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.if-big { position: relative; width: min(960px, 86vw); height: min(640px, 80vh); border-radius: 20px; overflow: hidden; background: #f4f4f4; transform: scale(.98); transition: transform .3s cubic-bezier(.25,.8,.25,1); }
.if-dlg.in .if-big { transform: none; }
.if-big iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.if-big.ext iframe { inset: auto; left: 0; top: 0; transform-origin: 0 0; }
.if-big .if-vsw { left: 14px; bottom: 14px; }
.if-x { all: unset; cursor: pointer; position: absolute; right: 14px; top: 14px; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: #fff; color: #0d0d0d; z-index: 2; }
.if-x:hover { background: #e8e8e8; }
.nk-im .if-thumb { position: absolute; inset: 0; border-radius: 0; background: #f4f4f4; }
@media (max-width: 900px) { .if-grid, .if-grid.wide { grid-template-columns: 1fr; } .if-set.feat { grid-column: auto; } }
.sw { display: none !important; }
.if-veil { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; pointer-events: none; opacity: 0; transition: opacity .25s ease; z-index: 2; }
.if-set:hover .if-veil { opacity: 1; }
.if-veil span { font-size: 13px; line-height: 14px; letter-spacing: -0.02em; padding: 5px 10px; border-radius: 40px; color: rgba(0,0,0,.72); background: rgba(255,255,255,.62); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); white-space: nowrap; }
@media (hover: none) { .if-veil { opacity: 1; } }

/* ===== Interfaces wall: no sections, one grid; every row the same height, big pieces span ===== */
.if-hero + .if-wall { margin-top: 8px; }
.if-wall { container-type: inline-size; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: calc((100cqw - 16px) / 3 * .75); gap: 8px; grid-auto-flow: row dense; }

.if-wall .s-f { grid-column: span 2; grid-row: span 2; }
.if-wall .s-w { grid-column: span 2; }
.if-wall .s-w2 { grid-column: span 2; grid-row: span 2; }
.if-wall .s-t { grid-row: span 2; }

n></a></div>"}, {"t": "label", "text": "Reflection"}, {"t": "cards", "items": [{"h": "Building shows what the board doesn’t.", "p": "Plans on the board looked clear. Clicking through a prototype showed what was missing, and what should come first."}, {"h": "AI never says “cut this.”", "p": "Every request added more. Deciding what not to build was our job."}]}, {"t": "html", "html": "<p class=\"hb-try\"><a href=\"pg/hourberry-core.html\" target=\"_blank\" rel=\"noopener\">Try the mid-fi prototype ↗</a></p>"}], "mine": [], "art": "hourberry"}, {"slug": "interfaces", "short": "Interfaces", "no": "03", "name": "Interfaces", "year": "2026", "type": "Advanced Interface", "ifc": true, "title": "Interfaces", "hero": "img/ifc-hero.webp", "thumb": "img/ifc-hero.webp", "desc": "Weekly interface studies: loaders, badges, selectors, sliders, lists and menus.", "tags": ["Live"], "meta": [], "blocks": [], "mine": []}, {"slug": "wildlink", "short": "Wildlink", "no": "04", "name": "Wildlink", "year": "2024", "type": "Partner project", "title": "An interactive puzzle game developed with the Arroyos & Foothills Conservancy.", "hero": "img/wl-thumb.webp", "thumb": "img/wl-thumb.webp", "desc": "Inviting teens to connect habitats for mountain lions in a hands-on puzzle game.", "tags": ["Game design", "Physical + projection"], "meta": [["Role", "Research, game design, puzzle design, video production & editing"], ["Team", "Dakota, Louise, Leta"], ["Tools", "Figma, Illustrator, After Effects, laser lab, CapCut"], ["Timeline", "7 weeks"]], "blocks": [{"t": "label", "text": "Overview"}, {"t": "h2", "text": "Connecting puzzle pieces to solve mountain lion issues."}, {"t": "p", "text": ["The game highlights the survival challenges faced by mountain lions, an iconic species in Los Angeles County, and uses mixed media to engage middle and high school students and visitors to the AFC Education Center in wildlife conservation."]}, {"t": "cards", "items": [{"h": "Education center visitors", "p": "People who visit the AFC Education Center."}, {"h": "Students", "p": "Junior high and high school students."}]}, {"t": "label", "text": "Problem"}, {"t": "h2", "text": "Mountain lions are at risk of separation and inbreeding."}, {"t": "p", "text": ["Habitat fragmentation and road development cut through the large, contiguous habitats they need to survive."]}, {"t": "cards", "items": [{"h": "Deaths from vehicle collisions", "p": "Each year, about 70 mountain lions are killed by vehicle collisions on California highways."}, {"h": "Wildfire", "p": "The 2018 Woolsey Fire burned nearly 100,000 acres in Los Angeles and Ventura counties, forcing mountain lions into riskier areas to find new habitats."}, {"h": "First-order inbreeding", "p": "Researchers found a 93% sperm deformity rate in 9 Santa Monica mountain lions, indicating inbreeding."}, {"h": "Poison", "p": "In the Santa Monica Mountains, 21 of 22 mountain lions tested positive for exposure and four died from poisoning."}]}, {"t": "label", "text": "Learning goal"}, {"t": "gallery", "cols": 1, "items": [{"src": "img/wl-goal-paths.webp", "r": "1920/800", "alt": "What are wildlife corridors? Safe paths that animals use to move between habitats."}, {"src": "img/wl-goal-help.webp", "r": "1920/800", "alt": "How can we help? By understanding mountain lions' needs and challenges, see how human actions can transform the environment to be diverse, balanced, and connected."}]}, {"t": "label", "text": "Game rule"}, {"t": "h2", "text": "You play as a Protector of Mountain Lions, helping them survive in the wild areas near cities."}, {"t": "img", "src": "img/wl-game-rule.webp", "r": "16/9", "alt": "Puzzle pieces connecting a corridor for a mountain lion"}, {"t": "label", "text": "Six pieces"}, {"t": "h2", "text": "Six kinds of piece, six different joints. A data piece cannot lock where a clue belongs."}, {"t": "gallery", "cols": 1, "items": [{"src": "img/wl-pieces.webp", "r": "1275/350", "alt": "Start, Clue, Problem, Data, Fact and Action pieces, each with its own joint"}]}, {"t": "label", "text": "Game flow"}, {"t": "flow", "items": [{"n": 1, "stage": "Onboard", "h": "Start", "p": "Choose a start piece to begin. Different start pieces lead to different missions.", "src": "img/wl-flow-1.webp"}, {"n": 2, "stage": "Game", "h": "Clue", "p": "Match the clue piece to the start piece's theme to learn more about the mountain lions' situation.", "src": "img/wl-flow-2.webp"}, {"n": 3, "stage": "Game", "h": "Problem", "p": "Find the problem the mountain lions face in this situation.", "src": "img/wl-flow-3.webp"}, {"n": 4, "stage": "Game", "h": "Data", "p": "Relevant data on the challenges mountain lions face.", "src": "img/wl-flow-4.webp"}, {"n": 5, "stage": "Game", "h": "Fact", "p": "How building corridors and crossings can help mountain lions overcome their challenges.", "src": "img/wl-flow-5.webp"}, {"n": 6, "stage": "Activate", "h": "Action", "p": "An action that is already happening and supports corridor building.", "src": "img/wl-flow-6.webp"}]}, {"t": "gallery", "cols": 1, "items": [{"src": "img/wl-flow-strip.webp", "r": "2740/512", "alt": "All six pieces connected"}]}, {"t": "label", "text": "Walkthrough"}, {"t": "video", "yt": "L8b917ESDvs", "title": "Wildlink walkthrough video"}, {"t": "label", "text": "Design decisions"}, {"t": "gallery", "cols": 3, "items": [{"src": "img/wl-dd-corridor.webp", "r": "1275/735", "alt": "Corridor representation"}, {"src": "img/wl-dd-data.webp", "r": "1275/696", "alt": "Data visualization: 5% of their life in urban areas"}, {"src": "img/wl-dd-learn.webp", "r": "1275/696", "alt": "Self-driven learning through puzzles"}]}, {"t": "p", "text": ["Our visual style uses flat vector design to align with our target audience."]}, {"t": "gallery", "cols": 1, "items": [{"src": "img/wl-style.webp", "r": "2457/672", "alt": "Puzzle pieces, buttons and colour, map"}]}, {"t": "label", "text": "Exploration"}, {"t": "gallery", "cols": 1, "items": [{"src": "img/wl-explore.webp", "r": "1844/938", "alt": "Design exploration: physical, digital and mixed directions, laser-cut prototypes"}]}, {"t": "label", "text": "Inspiration"}, {"t": "gallery", "cols": 1, "items": [{"src": "img/wl-insp.webp", "r": "1850/776", "alt": "Inspiration: colour palette, board games, illustrated maps, flat animal illustrations, puzzles"}]}], "mine": ["Research", "Game and puzzle design", "Video production and editing"]}, {"slug": "echos", "short": "Echos", "no": "05", "name": "Echos", "year": "2024", "type": "Course project", "title": "An AI voice tour assistant for The Getty Museum.", "hero": "img/echos-cover.webp", "thumb": "img/echos-cover.webp", "desc": "Personalizing Getty visits through AI guides and conversations with artifacts.", "tags": ["Voice UI", "User testing"], "meta": [["Role", "Research, User testing, Design & prototype for Elias, Video production"], ["Team", "Dakota, Louise, Leta"], ["Tools", "Figma, ProtoPie, NFC smart tag, ElevenLabs"], ["Timeline", "7 weeks"]], "blocks": [{"t": "label", "text": "Overview"}, {"t": "h2", "text": "A museum guide you can talk to."}, {"t": "p", "text": ["Echos is an AI voice tour assistant based on The Getty Museum, offering an immersive visiting experience through personalized guidance and interactive storytelling."]}, {"t": "label", "text": "User type"}, {"t": "h2", "text": "Four kinds of visitors, mapped by how long they stay and how deep they go."}, {"t": "p", "text": ["We placed visitors on two axes: a long or short time period at the museum, and an interest in general information or in detail."]}, {"t": "gallery", "cols": 1, "items": [{"src": "img/ec/utype.webp", "r": "1920/1080", "alt": "Visitor matrix: explorers, immersive visitors, social visitors, researchers"}]}, {"t": "cards", "items": [{"h": "Explorers", "p": "Love wandering around, discovering new things, and embracing the unknown."}, {"h": "Immersive visitors", "p": "Seek deep, atmosphere-driven engagement with art or history."}, {"h": "Social visitors", "p": "Enjoy sharing cultural experiences with friends or family to strengthen bonds."}, {"h": "Researchers", "p": "Pursue detailed information on specific themes or exhibits."}]}, {"t": "label", "text": "AI personas"}, {"t": "h2", "text": "Two kinds of AI voice assistants for different visitors and artifacts."}, {"t": "p", "text": ["Main Tourist AI (Joey for explorers, Elias for researchers) offers primary guidance, while Artifact Dedicated AI is tailored for specific museum pieces. As an example, we developed a specialized version for The Getty’s “Golden Ticket.”"]}, {"t": "gallery", "cols": 1, "items": [{"src": "img/ec/persona.webp", "r": "1920/1080", "alt": "Joey, Elias, The Golden Ticket, The Creator"}]}, {"t": "sub", "text": "Personality profiles and user prompts"}, {"t": "deck", "items": [{"src": "img/ec/prof-joey.webp", "r": "1920/1080", "alt": ""}, {"src": "img/ec/prof-artifact.webp", "r": "1920/1080", "alt": ""}, {"src": "img/ec/prof-creator.webp", "r": "1920/1080", "alt": ""}]}, {"t": "sub", "text": "Conversation flows"}, {"t": "gallery", "cols": 3, "scroll": true, "items": [{"src": "img/ec/flow-joey-a.webp", "r": "1726/4096", "cap": "Joey"}, {"src": "img/ec/flow-elias-a.webp", "r": "2139/4096", "cap": "Elias"}, {"src": "img/ec/flow-artifact-a.webp", "r": "994/4096", "cap": "Artifact + Creator"}]}, {"t": "label", "text": "Prototype"}, {"t": "h2", "text": "Prototype showcase"}, {"t": "video", "yt": "s4v0EKhHiQg", "title": "Echos prototype showcase"}, {"t": "label", "text": "User tests"}, {"t": "h2", "text": "Three rounds of testing to validate, refine and decide."}, {"t": "p", "text": ["In our user testing, we focused on three key areas: validating core features and design, refining the overall user flow, and finalizing feature and design choices."]}, {"t": "gallery", "cols": 1, "items": [{"src": "img/ec/setup.webp", "r": "1920/1080", "alt": "User test set up"}]}, {"t": "label", "text": "General features"}, {"t": "sub", "text": "Tap input or voice input (A/B)"}, {"t": "p", "text": ["3 of 6 said voice is a more immersive and smooth way to tour a museum; 3 of 6 said text is the more polite way to get information in a museum."]}, {"t": "deck", "items": [{"src": "img/ec/f1-voice.webp", "r": "1920/1080", "alt": ""}]}, {"t": "sub", "text": "Switching between tap and voice"}, {"t": "p", "text": ["Round 1: 8 of 10 had strong preferences and kept their own method. Round 3: 7 of 10 read the switch as a click, so we changed it to a long press to prevent accidental touches."]}, {"t": "deck", "items": [{"src": "img/ec/f2-mode-r1.webp", "r": "1920/1080", "alt": ""}, {"src": "img/ec/f2-mode-r3.webp", "r": "1920/1080", "alt": ""}]}, {"t": "sub", "text": "Tap mode button"}, {"t": "p", "text": ["Round 1: 9 of 10 felt too much typing breaks the immersion. Round 2: 9 of 10 found the options didn’t fit their mental model. Round 3: 7 of 10 read the new options as clickable."]}, {"t": "deck", "items": [{"src": "img/ec/f3-tap-r1.webp", "r": "1920/1080", "alt": ""}, {"src": "img/ec/f3-tap-r2.webp", "r": "1920/1080", "alt": ""}, {"src": "img/ec/f3-tap-r3.webp", "r": "1920/1080", "alt": ""}]}, {"t": "sub", "text": "Visit route"}, {"t": "p", "text": ["Round 1: 6 of 10 felt the route was incomplete. Round 2: 2 of 10 couldn’t tell how to close the side bar, even with an animated hint."]}, {"t": "deck", "items": [{"src": "img/ec/f4-route-r1.webp", "r": "1920/1080", "alt": ""}, {"src": "img/ec/f4-route-r2.webp", "r": "1920/1080", "alt": ""}, {"src": "img/ec/f4-route-r3.webp", "r": "1920/1080", "alt": ""}]}, {"t": "label", "text": "Main Tourist AI"}, {"t": "sub", "text": "Elias’ communication style"}, {"t": "p", "text": ["Round 2: 8 of 10 found long messages hard to read and asked for highlights. Round 3: 10 of 10 said bold keywords made reading easier."]}, {"t": "deck", "items": [{"src": "img/ec/m1-style-r2.webp", "r": "1920/1080", "alt": ""}, {"src": "img/ec/m1-style-r3.webp", "r": "1920/1080", "alt": ""}]}, {"t": "sub", "text": "Export PDF"}, {"t": "p", "text": ["10 of 10 found it helpful and easy to follow; researchers said it lightens their memory load."]}, {"t": "deck", "items": [{"src": "img/ec/m2-pdf.webp", "r": "1920/1080", "alt": ""}]}, {"t": "sub", "text": "Navigation"}, {"t": "p", "text": ["Round 1: 9 of 10 wanted the map both small and full screen. Round 2: 6 of 10 wanted a bigger map while still being able to chat. Round 3: 7 of 10 preferred a map that adapts its size."]}, {"t": "deck", "items": [{"src": "img/ec/m3-nav-r1.webp", "r": "1920/1080", "alt": ""}, {"src": "img/ec/m3-nav-r2.webp", "r": "1920/1080", "alt": ""}, {"src": "img/ec/m3-nav-r3.webp", "r": "1920/1080", "alt": ""}]}, {"t": "label", "text": "Artifact Dedicated AI"}, {"t": "sub", "text": "Character change"}, {"t": "p", "text": ["Round 1: 7 of 10 weren’t sure which character to talk to. Round 2: we removed the choice and put both in one group chat; 9 of 10 found it clearer who was speaking, but asked how to get back to Joey or Elias. Round 3: 9 of 10 found the jump from the main guide to the artifact and back clear."]}, {"t": "deck", "items": [{"src": "img/ec/a1-char-r1.webp", "r": "1920/1080", "alt": ""}, {"src": "img/ec/a1-char-r2.webp", "r": "1920/1080", "alt": ""}, {"src": "img/ec/a1-char-r2b.webp", "r": "1920/1080", "alt": ""}, {"src": "img/ec/a2-jump-r3.webp", "r": "1920/1080", "alt": ""}]}, {"t": "sub", "text": "Storytelling"}, {"t": "p", "text": ["6 of 10 felt the artifact’s story ran long. After adding double-click to skip, 8 of 10 said the length felt right."]}, {"t": "deck", "items": [{"src": "img/ec/a3-story.webp", "r": "1920/1080", "alt": ""}, {"src": "img/ec/a3-story-r.webp", "r": "1920/1080", "alt": ""}]}, {"t": "label", "text": "Final design"}, {"t": "gallery", "cols": 1, "items": [{"src": "img/ec/final-overview.webp", "r": "1920/1080", "alt": "Joey, the Golden Ticket and Elias screens"}]}, {"t": "sub", "text": "Joey"}, {"t": "deck", "items": [{"src": "img/ec/final-joey.webp", "r": "1920/1080", "alt": ""}, {"src": "img/ec/final-joey-route.webp", "r": "1920/1080", "alt": ""}]}, {"t": "sub", "text": "Golden Ticket"}, {"t": "deck", "items": [{"src": "img/ec/final-ticket.webp", "r": "1920/1080", "alt": ""}, {"src": "img/ec/final-ticket-chat.webp", "r": "1920/1080", "alt": ""}]}, {"t": "sub", "text": "Elias"}, {"t": "deck", "items": [{"src": "img/ec/final-elias.webp", "r": "1920/1080", "alt": ""}, {"src": "img/ec/final-elias-draw.webp", "r": "1920/1080", "alt": ""}]}], "mine": [], "art": "echos"}, {"slug": "type3", "short": "Type 3", "no": "06", "name": "Type 3", "year": "2025", "type": "Typography course", "title": "Three typography projects.", "hero": "img/t3/atypi-poster-mockup-wide.webp", "thumb": "img/t3/thumb.webp", "desc": "An identity for ATypI Tokyo, the type conference, a poster series for the ArtCenter Film Club, and a booklet on Octavia E. Butler.", "tags": ["Typography", "Poster"], "meta": [["Role", "Typography, Identity, Editorial, Poster design"], ["Team", "Solo"], ["Tools", "Illustrator, Photoshop, InDesign"], ["Timeline", "Fall 2025"]], "blocks": [{"t": "sec", "title": "ATypI Tokyo", "text": "Conference identity"}, {"t": "gallery", "cols": 2, "items": [{"src": "img/t3/atypi-mark-1.webp", "alt": "ATypI Tokyo mark", "r": "1/1"}, {"src": "img/t3/name-card.webp", "alt": "Staff name card", "r": "1/1"}]}, {"t": "gallery", "cols": 1, "items": [{"src": "img/t3/atypi-posters.webp", "alt": "ATypI Tokyo posters, light and dark", "r": "3/2"}]}, {"t": "gallery", "cols": 1, "items": [{"src": "img/t3/tee-pair.webp", "alt": "ATypI Tokyo staff T-shirt, front and back", "r": "2400/1300"}]}, {"t": "sec", "title": "The Bizarre Continuum", "text": "Film Club season poster"}, {"t": "pair", "items": [{"t": "gallery", "cols": 1, "items": [{"src": "img/t3/film-poster-half.webp", "alt": "The Bizarre Continuum season poster", "r": "4/5"}]}, {"t": "foldbook", "src": "img/t3/film-poster.webp", "alt": "The season poster folding into its booklet", "book": {"t": "book", "r": "1/1", "coverIsPage": tr bol system"], "meta": [["Role", "Symbol design, Editorial, Typography"], ["Team", "Solo"], ["Tools", "Illustrator, InDesign"], ["Timeline", "2024 – Fall 2025"]], "blocks": [{"t": "sec", "title": "Mix of 615", "text": "Communication Design 2 · A symbol system for Nashville"}, {"t": "frame", "src": "pg/mix-of-615.html", "r": "16/10", "alt": "Mix of 615 booklet"}, {"t": "gallery", "cols": 3, "items": [{"src": "img/bk/c2-symbols.webp", "alt": "Mix of 615 symbol set", "r": "5/7", "span": 1}, {"src": "img/bk/c2-river.webp", "alt": "Mix of 615, The Next Current spread", "r": "10/7", "span": 2}]}, {"t": "sec", "title": "Avant Garde Gothic", "text": "Type 2 · Typeface booklet and poster"}, {"t": "frame", "src": "pg/avant-garde-booklet.html", "r": "2/1", "alt": "Avant Garde Gothic booklet"}, {"t": "poster", "src": "img/bk/t2-poster-flat.webp", "alt": "Typography & Composition poster", "r": "2/3"}, {"t": "sec", "title": "Rooted", "text": "Type 1 · Magazine on eco-brutalism and urban gardening"}, {"t": "gallery", "cols": 1, "items": [{"src": "img/bk/rooted-m-2_stack_green.webp", "alt": "Rooted magazine, three copies", "r": "4/3"}]}, {"t": "gallery", "cols": 1, "items": [{"src": "img/bk/rooted-logo-c2.webp", "alt": "Rooted logo with the arrow's construction lines", "r": "2/1"}]}, {"t": "gallery", "cols": 2, "items": [{"src": "img/bk/rooted-m-1_cover.webp", "alt": "Rooted cover", "r": "4/3"}, {"src": "img/bk/rooted-m-3_turn.webp", "alt": "Rooted, urban gardening spread", "r": "4/3"}]}, {"t": "gallery", "cols": 1, "items": [{"src": "img/bk/rooted-m-4_angle_green.webp", "alt": "Rooted, A Beginner's Guide spread", "r": "4/3"}]}, {"t": "gallery", "cols": 1, "items": [{"src": "img/bk/t1/sp0b.webp", "alt": "Rooted, back and front cover laid flat", "r": "2856/1946"}]}, {"t": "gallery", "cols": 2, "items": [{"src": "img/bk/t1/sp1b.webp", "alt": "Rooted spread 1", "r": "2132/1428"}, {"src": "img/bk/t1/sp2b.webp", "alt": "Rooted spread 2", "r": "2132/1428"}, {"src": "img/bk/t1/sp3b.webp", "alt": "Rooted spread 3", "r": "2132/1428"}, {"src": "img/bk/t1/sp4b.webp", "alt": "Rooted spread 4", "r": "2132/1428"}]}, {"t": "desc", "text": ["Mix of 615 is a symbol system for Nashville, designed for the public to use and built from the city’s living memory. Six symbols carry six layers of the city: its Native roots, French heritage, Southern hospitality, Music City soul, the Athens of the South and the Cumberland River. The booklet sets each symbol beside the archive it came from.", "Avant Garde Gothic is a research booklet on ITC Avant Garde Gothic: its history, its letterforms and the 1970s culture it grew out of. The Typography & Composition poster is the final piece from the same course.", "Rooted is a magazine from Type 1 on eco-brutalism and urban gardening. In its logo the word turns a corner: the T becomes an arrow pointing up, and ED drops down like a root."], "side": [["Contribution", ["Symbol design, editorial design, typography"]], ["Tools", ["Illustrator, InDesign"]], ["Fonts", ["Rooted: Cronos Pro, Myriad Pro, Scala Sans Pro"]]]}], "mine": [], "wall": true}, {"slug": "typography", "short": "Typography", "no": "08", "name": "Typography", "year": "2024–25", "type": "Print work · index", "title": "Type and print, in one place.", "hero": "img/t3/atypi-poster-mockup-wide.webp", "thumb": "img/typo/thumb.webp", "desc": "Five print pieces from three typography courses and Communication Design 2: an identity, a season poster that folds into a booklet, and three booklets.", "tags": ["Typography", "Editorial", "Identity"], "meta": [["Role", "Typography, Editorial, Identity"], ["Team", "Solo"], ["Tools", "InDesign, Illustrator, Photoshop"], ["Timeline", "Fall 2024 – Fall 2025"]], "mine": [], "wall": true, "blocks": [{"t": "gallery", "cols": 1, "items": [{"src": "img/typo/lineup.webp", "alt": "All five pieces side by side at their real relative size", "r": "3200/1400", "cap": "At real relative size, left to right: ATypI Tokyo poster · The Bizarre Continuum, 2   <div class="text ovt"><p class="body">We designed a mobile-first family portal, with a desktop version, to help families manage this care: <span class="hl">scheduling caregivers</span>, <span class="hl">tracking hours</span>, and <span class="hl">renewing the plan</span>. The agency later acquired the design IP.</p></div>

  <div class="text sec">
    <p class="label" id="sec-problem">Problem</p>
    <h2>Families have no easy way to see or manage this care.</h2>
    <p class="body">Everything relies on a phone call — even basic information like how many hours are left, who’s coming next, or when the plan renews. That can mean unused care hours, missed renewal deadlines, and gaps in care.</p>
  </div>

  <section class="text sec">
    <p class="label" id="sec-key-findings">Key findings</p>
    <h2>What we learned from families and caregivers</h2>
  </section>
  <div class="kf kf2">
    <div><span class="n">01</span><p class="big">Families juggle several plans, each with its own rules.</p><p>Many clients have more than one care plan, each with its own hours, dates and caregivers. Families track them all, often in terms they’ve never heard.</p></div>
  </div>
  <div class="kx"><div class="kx-in"><div class="kx-tl">
    <span></span><div class="kx-mo"><span>Jul</span><span>Sep</span><span>Nov</span><span>Jan</span><span>Mar</span><span>May</span><span>Jun</span></div>

  <div class="kf kf2 kfn">
    <div><span class="n">02</span><p class="big">Care is handed off blind, on both sides.</p><p>Families leave their loved one alone with someone new and hear nothing about how it goes. Caregivers get few details about the client, and the match isn’t always right.</p></div>
  </div>
  <div class="kx"><div class="kx-duo">
    <div><p class="kx-h"><i class="kx-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#011c62" stroke-width="2.3" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.3"/><path d="M3.5 19c.6-3 2.8-5 5.5-5s4.9 2 5.5 5M14.5 14.6c.7-.4 1.6-.6 2.5-.6 2.2 0 3.9 1.6 4.4 4"/></svg></i>Family</p><q><mark>NO ONE documented ANYTHING</mark> during the 12 hour day with my dad.</q><p class="kx-src">Yelp review</p></div>
    <div><p class="kx-h"><i class="kx-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#011c62" stroke-width="2.3" stroke-linecap="round"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-6 7-6s6.2 2.4 7 6"/></svg></i>Caregiver</p><q>Every day when I go to the house, <mark>I’m lost on what to do</mark> because every home is run differently.</q><p class="kx-src">Indeed review</p></div>
  </div></div>
  <section class="text sec">
    <p class="label" id="sec-design-goal">Design goal</p>
    <h2>How might we increase family trust and visibility into care so that families can make the most of their hours and stay on top of every detail?</h2>
  </section>
  

  

  <div class="flows"><div class="flow"><div class="ft"><h3>See all your plans clearly.</h3><p>Every plan has its own hours, dates and rules. The app breaks each one down and shows it from a few angles, so families can follow every plan without calling.</p></div><div class="demo"><span class="ftag st-ad">Adopted</span><div class="phone"><div class="screen"><span class="tap" aria-hidden="true"></span><div class="scr img on"><img src="img/btob/screens/f1a.webp?v=4" alt="Hours left, per plan" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f1b.webp?v=5" alt="Hours at risk" decoding="async"></div><div class="scr img tall"><img src="img/btob/screens/f1d.webp?v=4" alt="One plan in detail" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f1c.webp?v=4" alt="All plans side by side" decoding="async"></div></div></div><ol class="steps"><li class="on" data-tap=".80,.52"><button type="button"><span class="n">01</span><span class="l">Hours left, per plan</span><span class="bar"><i></i></span></button></li><li class="" data-tap=".5,.95"><button type="button"><span class="n">02</span><span class="l">Hours at risk</span><span class="bar"><i></i></span></button></li><li class="" data-tap=".07,.10" data-dur="6400"><button type="button"><span class="n">03</span><span class="l">One plan in detail</span><span class="bar"><i></i></span></button></li><li class=""><button type="button"><span class="n">04</span><span class="l">All plans side by side</span><span class="bar"><i></i></span></button></li></ol></div></div><div class="flow"><div class="ft"><h3>Book the hours you’re approved for.</h3><p>Pick which plan the hours come from, then a time and an address. If your usual caregiver can’t come, send the shift to agency caregivers and choose who fits.</p></div><div class="demo" data-step="2000"><span class="ftag st-ad">Adopted</span><div class="phone"><div class="screen"><span class="tap" aria-hidden="true"></span><div class="scr img on"><img src=" t="pr"><button type="button"><span class="n">07</span><span class="l">Rating the caregiver</span><span class="bar"><i></i></span></button></li><li class="" data-st="pr"><button type="button"><span class="n">08</span><span class="l">Feedback sent</span><span class="bar"><i></i></span></button></li></ol></div></div><div class="flow"><div class="ft"><h3>Renew a plan in time.</h3><p>When a plan is about to expire, the family gets an alert. They can ask support what to do, then call their coordinator to start the renewal.</p></div><div class="demo"><span class="ftag st-pr">Proposal</span><div class="phone"><div class="screen"><span class="tap" aria-hidden="true"></span><div class="scr img on"><img src="img/btob/screens/f4a.webp?v=4" alt="Expiry alert" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f4b.webp?v=4" alt="Plan flagged in Care plans" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f4c.webp?v=4" alt="What renewal needs" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f4d.webp?v=4" alt="Support home" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f4e.webp?v=4" alt="Question to live chat" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f4f.webp?v=4" alt="Next steps from support" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f4g.webp?v=4" alt="Call to the coordinator" decoding="async"></div></div></div><ol class="steps"><li class="on" data-tap=".5,.80"><button type="button"><span class="n">01</span><span class="l">Expiry alert</span><span class="bar"><i></i></span></button></li><li class="" data-tap=".5,.61"><button type="button"><span class="n">02</span><span class="l">Plan flagged in Care plans</span><span class="bar"><i></i></span></button></li><li class=""><button type="button"><span class="n">03</span><span class="l">What renewal needs</span><span class="bar"><i></i></span></button></li><li class="" data-tap=".89,.10"><button type="button"><span class="n">04</span><span class="l">Support home</span><span class="bar"><i></i></span></button></li><li class=""><button type="button"><span class="n">05</span><span class="l">Question to live chat</span><span class="bar"><i></i></span></button></li><li class=""><button type="button"><span class="n">06</span><span class="l">Next steps from support</span><span class="bar"><i></i></span></button></li><li class=""><button type="button"><span class="n">07</span><span class="l">Call to the coordinator</span><span class="bar"><i></i></span></button></li></ol></div></div></div>

  

  <div class="dsec">
<section class="text sec">
  <p class="label" id="sec-design-decisions">Design decisions</p>
  <h2>Make the hours card easy to read and act on.</h2>
</section>

<div class="dcar" id="dc1">
  <div class="text heads"><div class="hd3 on"><h3>Lead with hours left.</h3><p class="bd">The old card said “24 / 40 hrs,” so families had to work out how many were left. Hours left became the big number, with used, scheduled and total underneath.</p></div><div class="hd3"><h3>Ticks instead of a plain bar.</h3><p class="bd">The card is almost as wide as the screen, and a plain bar looked empty there. So we split it into ticks. That also made it easy to show hours that are already scheduled.</p></div><div class="hd3"><h3>One sentence instead of a pace tag.</h3><p class="bd">“Behind pace” was hard to understand at first. The card now explains it in one sentence, which also makes the row bigger and easier to tap. When families tap in, they already know what “Behind pace” means.</p></div><div class="hd3"><h3>Final design.</h3><p class="bd">The card sits at the top of Home, so the first thing families see when they open the app is how many hours are left and whether they’re on track.</p></div></div>

<section class="text sec2">
  <h2>Answer what families worry about at each point of a visit.</h2>
</section>
<div class="dcar d2" id="dc2">
  <div class="text heads"><div class="hd3 on"><p class="eb2">Before the visit</p><h3>Who is coming?</h3><p class="bd">Families are letting someone new into their home. They filter by their needs first, then choose from caregivers who chose to apply, so the match works for both sides.</p></div><div class="hd3"><p class="eb2">During the visit</p><h3>Is everything okay right now?</h3><p class="bd">Families can’t be at every visit. Now they can see what the caregiver is doing as it happens, and message them if something comes up.</p></div><div class="hd3"><p class="eb2">After the visit</p><h3>How did it go?</h3><p class="bd">When the shift ends, families rate the caregiver. The score shows on their profile, so the next family has more to go on.</p><p class="why">Why it wasn’t adopted: the first release focused on cutting support calls. Bad reviews could also hurt the agency.</p></div></div>

  <section class="text sec">
    <p class="label" id="sec-design-system">Design system</p>
    <h2>Built on the agency’s Salesforce components</h2>
    <p class="body">The portal runs on Salesforce Lightning, so we started from its stock components, adapting them to match 24 Hour Home Care’s brand and make information easier to read. We documented the changes and the reasons behind them for the agency’s development team.</p>
