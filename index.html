<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dakota Shao — interaction designer turning complex systems into clear, thoughtful experiences.">
<title>Dakota Shao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@500&family=Instrument+Serif:ital@1&display=swap">
<style>
/* Layout: Areal template, 1:1 to Framer home2 / about-2 — corner nav, centered hero, full-width stacked cards */
:root {
  --bg: #ffffff;
  --fg: #0d0d0d;
  --muted: #7a7a7a;
  --faint: #a8a8a8;
  --card: #f4f4f4;
  --chip: #e0e0e0;
  --line: #e8e8e8;
  --btn: #000000;
  --btn-fg: #ffffff;
  --blue: #0a12e6;
  --hl: #f6f6f6;
  --btn2: #f6f6f6;
  --btn2-h: #e8e8e8;
  --rule: rgba(0, 0, 0, .2);
  --q: rgba(0, 0, 0, .52);
  --sun: #f39a1e;
  --sans: "Inter", system-ui, -apple-system, "PingFang SC", sans-serif;
  --logo: "Outfit", "Inter", sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
  --pad: 32px;
  --maxw: calc(821px + 2 * var(--pad));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0b0b; --fg: #f2f2f2; --muted: #8c8c8c; --faint: #5e5e5e; --card: #171717;
  --chip: #262626; --line: #222222; --btn: #f2f2f2; --btn-fg: #0b0b0b; --hl: #1a1a1a; --btn2: #1c1c1c; --btn2-h: #2a2a2a; --rule: rgba(255, 255, 255, .2); --q: rgba(255, 255, 255, .52); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b0b0b; --fg: #f2f2f2; --muted: #8c8c8c; --faint: #5e5e5e; --card: #171717;
  --chip: #262626; --line: #222222; --btn: #f2f2f2; --btn-fg: #0b0b0b; --hl: #1a1a1a; --btn2: #1c1c1c; --btn2-h: #2a2a2a; --rule: rgba(255, 255, 255, .2); --q: rgba(255, 255, 255, .52); color-scheme: dark }

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--sans);
  font-size: 16px; line-height: 1.45; letter-spacing: -0.011em;
  font-feature-settings: "ss03", "ss08";
  -webkit-font-smoothing: antialiased; transition: background .25s, color .25s;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; border-radius: 6px; }

/* ---------- Nav (Areal) ---------- */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 0;
}
.nav > * { pointer-events: auto; }
.nav-left { display: flex; flex-direction: column; gap: 12px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--fg); background: transparent; display: block; padding: 0; }
.nav.open .dot { background: var(--fg); }
@media (hover: hover) { .nav-left:hover .dot { background: var(--fg); } }
.links { opacity: 0; visibility: hidden; transform: translateY(-4px); transition: opacity .2s, transform .2s, visibility .2s; }
.nav.open .links { opacity: 1; visibility: visible; transform: none; }
@media (hover: hover) { .nav-left:hover .links { opacity: 1; visibility: visible; transform: none; } }
.links { display: flex; flex-direction: column; font-size: 16px; line-height: 1.5; }
/* only the dot (or the menu once it's open) reacts to the mouse — the hidden menu area must not */
.nav-left { pointer-events: none !important; }
.nav-left > .dot { pointer-events: auto; }
.links { pointer-events: none; }
.nav.open .links { pointer-events: auto; }
@media (hover: hover) { .nav-left:hover, .nav-left:hover .links { pointer-events: auto !important; } }
.nav.open .nav-left { pointer-events: auto !important; }

.links a { color: var(--muted); transition: color .15s; }
.links a:hover, .links a.on { color: var(--fg); }
.links .sub::before { content: "↳ "; }
.theme {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); display: grid; place-items: center; color: var(--sun);
}
.theme svg { width: 15px; height: 15px; }
.ai {
  position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center;
  background: var(--bg); color: var(--fg);
  box-shadow: inset 0 0 0 1.5px transparent;
  border: 1.5px solid transparent;
  background-image: linear-gradient(var(--bg), var(--bg)), linear-gradient(140deg, #6aa8ff, #ffb347);
  background-origin: border-box; background-clip: padding-box, border-box;
}
.ai svg { width: 18px; height: 18px; }
.toast {
  position: fixed; right: 20px; bottom: 68px; z-index: 40; font-size: 13px;
  background: var(--fg); color: var(--bg); padding: 8px 12px; border-radius: 8px;
}

/* ---------- Shared ---------- */
.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--pad); }
.label { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn { padding: 6px 12px; border-radius: 10px; font-size: 16px; background: var(--btn2); transition: background-color .25s ease; }
.btn:hover { background: var(--btn2-h); }
.btn.dark { background: var(--btn); color: var(--btn-fg); }
.btn.dark:hover { background: color-mix(in srgb, var(--btn) 60%, transparent); }
.chip { display: inline-block; font-size: 12px; background: var(--chip); border-radius: 20px; padding: 4px 10px; }

/* ---------- Hero ---------- */
.hero { position: relative; height: 100vh; height: 100svh; min-height: 560px; display: grid; place-items: center; overflow: hidden; }
.hero-in { text-align: center; max-width: 300px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }
.avatar {
  width: 58px; height: 58px; border-radius: 50%; background: #3a3a3a; overflow: hidden;
  object-fit: cover; margin-bottom: 22px;
}
/* Hero avatar: a grey photo under still water. The pointer stirs the surface; the photo refracts with it,
   and where the pointer passed it is wet with colour that dries back to grey. */
.av-fx { position: relative; display: block; width: 96px; height: 96px; background: none; overflow: visible; flex: none; }
.av-fx img, .av-fx canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; pointer-events: none; }
.hero p .who { color: var(--fg); font-weight: 500; }
.hero-in:has(.who) { max-width: 380px; }
.hero .cyc { margin-top: 4px; }
/* the slot eases to each word's width; words roll up into place (clip-path lets the decorations draw outside the box) */
.cyc .slot{position:relative;display:inline-block;vertical-align:top;box-sizing:content-box;height:1.38em;color:var(--fg);text-decoration:none;
  transition:width .45s cubic-bezier(.3,.7,.2,1);white-space:nowrap;cursor:default;clip-path:inset(-.4em -14px -.4em -4px)}
.cyc .slot.link{cursor:pointer}
.cyc .slot > span{position:absolute;left:0;top:0;display:block;white-space:nowrap;line-height:inherit;transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .3s}
.cyc.s-chip .slot > span{left:10px}
.cyc .slot > span.out{transform:translateY(-120%);opacity:0}
.cyc .slot > span.in{transform:translateY(120%);opacity:0}

/* style: line */
.cyc.s-line .slot{border-bottom:1px dashed var(--faint);height:calc(1.38em - 1px)}

/* style: chip — a soft pill from the site's chip colour */
.cyc.s-chip .slot{padding:0 10px;margin:0 2px;border-radius:40px;background:rgba(0,0,0,.05);clip-path:inset(0 round 40px)}

/* style: act — every word does what it says */
/* sliders: the word is the track — ink fills the letters up to a slim thumb that slides across and settles */
@property --wp{syntax:"<percentage>";inherits:false;initial-value:0%}
.w-sliders{--wp:0%;background:linear-gradient(90deg,var(--fg) var(--wp),var(--faint) var(--wp));-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:wslide 1.5s cubic-bezier(.5,0,.2,1) .15s both}
.w-sliders::after{content:"";position:absolute;top:.18em;height:1.02em;width:1.5px;border-radius:2px;background:var(--fg);left:calc(var(--wp) - .75px);animation:inherit}
@keyframes wslide{0%{--wp:0%}60%{--wp:100%}100%{--wp:68%}}
.w-loaders::after{content:"";position:absolute;left:0;bottom:1px;height:2px;border-radius:2px;background:var(--fg);animation:wload 1.5s cubic-bezier(.6,0,.3,1) .15s both}
.w-loaders::before{content:"";position:absolute;left:0;right:0;bottom:1px;height:2px;border-radius:2px;background:var(--line)}
@keyframes wload{0%{width:0}35%{width:22%}55%{width:30%}100%{width:100%}}
.w-posters{font-family:var(--logo,"Outfit"),Inter,sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.04em;font-size:.94em}
.w-booklets{font-family:var(--serif,"Instrument Serif"),Georgia,serif;font-style:italic;font-size:1.12em;letter-spacing:0}
.w-funk .ch{display:inline-block;animation:wfunk .5s cubic-bezier(.3,1.6,.5,1) infinite alternate;animation-delay:calc(var(--i) * 70ms)}
@keyframes wfunk{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.w-noise .ch{display:inline-block;animation:wnoise .18s steps(2) infinite;animation-delay:calc(var(--i) * -37ms)}
@keyframes wnoise{0%{transform:translate(.6px,-.8px) rotate(-3deg)}50%{transform:translate(-.7px,.6px) rotate(2deg)}100%{transform:translate(.3px,.9px) rotate(-1deg)}}
.w-tea{animation:wtea 1.4s ease-out both}
@keyframes wtea{from{filter:blur(3px);opacity:.2;transform:translateY(3px)}to{filter:none;opacity:1;transform:none}}
.w-tea::after{content:"";position:absolute;right:-7px;top:-4px;width:5px;height:9px;border-right:1.2px solid var(--faint);border-radius:0 6px 6px 0;opacity:0;animation:wsteam 2s ease-out .3s infinite}
@keyframes wsteam{0%{opacity:0;transform:translateY(4px) scaleY(.6)}40%{opacity:.9}100%{opacity:0;transform:translateY(-5px) scaleY(1.1)}}
.w-mistakes .fix{color:#d0453a;transition:color .4s}
.w-mistakes .fix.ok{color:inherit}
@media (prefers-reduced-motion:reduce){.cyc .slot,.cyc .slot>span{transition:none}.w-sliders,.w-sliders::after,.w-loaders::after,.w-funk .ch,.w-noise .ch,.w-tea,.w-tea::after{animation:none}}

.hero h1 { font-size: 26px; font-weight: 500; line-height: 1.15; letter-spacing: -0.025em; margin-bottom: 16px; }
.hero p { color: var(--muted); font-size: 17px; line-height: 1.38; }
.hero .prev { margin: 14px 0 24px; }
.hero .prev i { font-style: italic; }
.hint { margin-top: 12px; font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
kbd { font-family: var(--sans); font-size: 10px; background: var(--card); border-radius: 4px; padding: 1px 4px; color: var(--muted); }
.inst { position: absolute; z-index: 1; cursor: pointer; padding: 0; transform: translate(-50%, -50%) rotate(var(--r)); -webkit-tap-highlight-color: transparent; }
.inst img { width: 100%; height: auto; display: block; pointer-events: none; }
.inst img { animation: drum-in .4s cubic-bezier(.22, 1, .36, 1) var(--delay) both; }
@keyframes drum-in { from { opacity: .001; transform: rotate(var(--r0)) scale(.9); } }

/* ---------- Companies ---------- */
.companies { text-align: center; padding-block: 10px 70px; }
.companies h3 { font-size: 13.5px; font-weight: 500; margin-bottom: 14px; }
.tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 560px; margin: 0 auto; }
.tools .chip { font-size: 14px; padding: 6px 13px; transition: background-color .2s ease, color .2s ease; }
.tools .chip:hover { background: var(--fg); color: var(--bg); }

/* ---------- How I Work ---------- */
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.work { background: var(--card); border-radius: 20px; padding: 40px; min-height: 288px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; min-width: 0; }
.work h3 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 8px; }
.work p { font-size: 14.5px; color: var(--muted); line-height: 1.3; }
.work .tags { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Projects ---------- */
.projects { padding-block: 150px 60px; scroll-margin-top: -60px; }
.proj { display: block; margin-bottom: 74px; }
.shot {
  position: relative; border-radius: 16px; background: var(--card);
  display: grid; place-items: center; overflow: hidden; max-width: 100%;
}
.shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.shot .inner { width: 77%; aspect-ratio: 640 / 357; background: var(--bg); display: grid; place-items: center; color: var(--faint); font-size: 13px; }
.shot.blue { background: var(--blue); aspect-ratio: 16 / 10; }
.shot.blue span { color: #fff; font-size: clamp(48px, 10vw, 96px); font-weight: 500; letter-spacing: -0.04em; }
.shot .meta { position: absolute; z-index: 1; top: 8px; left: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity .25s ease; }
.shot .meta .chip { background: rgba(0, 0, 0, .04); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: rgba(0, 0, 0, .4); font-size: 14px; line-height: 14px; letter-spacing: -0.04em; padding: 4px 10px; border-radius: 40px; }
.proj:hover .meta { opacity: 1; }
.proj.locked, .proj.closed { cursor: default; }
.proj h4 { font-size: 16px; font-weight: 400; margin-top: 12px; }
.proj p { color: var(--muted); font-size: 16px; line-height: 1.4; margin-top: 4px; }

/* ---------- How I Think ---------- */
.think { text-align: center; background: var(--card); border-radius: 20px; padding: 38px 30px; min-height: 288px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; min-width: 0; }
.think h3 { font-size: 23px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 8px; }
.think .t { font-size: 14px; line-height: 1.3; }
.think .d { font-size: 12px; color: var(--muted); line-height: 1.35; max-width: 160px; margin: 0 auto; }

/* ---------- Testimonial ---------- */
.testi { padding-block: 60px 0; }
/* Testimonial — Framer "Testimonial" component: white card, author pills (Selected = black pill with name), quote on the right */
.tcard { background: var(--bg); padding: 80px 30px 40px; display: flex; flex-wrap: wrap; gap: 50px 20px; align-items: flex-start; }
.authors { flex: 1 0 0; min-width: 260px; display: flex; align-items: center; gap: 10px; }
.author { display: flex; align-items: center; height: 56px; padding: 8px 0; border-radius: 40px; background: transparent; color: #fff; transition: background-color .4s cubic-bezier(.34, 1.25, .64, 1), padding .4s cubic-bezier(.34, 1.25, .64, 1), opacity .25s; }
.author img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; }
.author .nr { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; transition: max-width .4s cubic-bezier(.34, 1.25, .64, 1), opacity .25s, margin .4s; }
.author .nr b { font-weight: 500; font-size: 14px; line-height: 1.3; letter-spacing: -0.01em; }
.author .nr small { font-size: 13px; line-height: 1.3; letter-spacing: 0.01em; color: #999; font-weight: 500; }
.author.sel { background: #050505; padding: 8px 18px 8px 8px; cursor: default; }
.author.sel .nr { max-width: 220px; opacity: 1; margin-left: 15px; }
@media (hover: hover) { .author:not(.sel):hover { opacity: .5; } }
.tquote { flex: 1 0 0; min-width: 260px; color: rgba(0, 0, 0, .52); font-size: 16px; line-height: 22.4px; letter-spacing: -0.04em; transition: opacity .2s ease .075s; }
.tquote.out { opacity: 0; transition-delay: 0s; }
:root[data-theme="dark"] .tquote { color: var(--muted); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tquote { color: var(--muted); } }

/* ---------- FAQ ---------- */
.faq { max-width: calc(600px + 40px); margin: 0 auto; padding: 40px 20px 80px; }
/* FAQ — Framer "Closed/Open": height springs open (0.4s, no bounce), answer fades in from a light blur, + turns to – */
.qa { border-bottom: 0.5px solid var(--rule); padding-block: 16px; }
.qa .q { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0; text-align: left; color: var(--q); font-size: 16px; line-height: 19.2px; letter-spacing: -0.04em; }
.qa .q > span { max-width: 380px; }
.qa .ic { position: relative; width: 10px; height: 10px; flex: none; color: var(--faint); }
.qa .ic::before, .qa .ic::after { content: ""; position: absolute; left: 0; top: 4.5px; width: 10px; height: 1px; background: currentColor; transition: transform .4s cubic-bezier(.25, .8, .25, 1), opacity .4s; }
.qa .ic::after { transform: rotate(90deg); }
.qa.open .ic::after { transform: rotate(180deg); opacity: 0; }
.qa .a { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s cubic-bezier(.25, .8, .25, 1); }
.qa.open .a { grid-template-rows: 1fr; }
.qa .a > div { overflow: hidden; min-height: 0; }
.faq .ans { padding-top: 8px; max-width: 361px; font-size: 16px; line-height: 1.4; letter-spacing: -0.04em; color: var(--fg); opacity: 0; filter: blur(6px); transition: opacity .4s ease, filter .4s ease; }
.qa.open .ans { opacity: 1; filter: blur(0); }
@media (prefers-reduced-motion: reduce) { .qa .a, .faq .ans, .qa .ic::before, .qa .ic::after { transition: none; } }

/* ---------- Footer (Areal) ---------- */
.foot { text-align: center; padding-block: 120px 60px; }
.foot .tag { font-size: 23px; letter-spacing: -0.02em; line-height: 1.2; color: var(--muted); }
.foot .tag span { color: var(--fg); display: block; }
.foot .c { margin-top: 36px; font-size: 13px; color: var(--muted); }
.foot .built { margin-top: 28px; font-size: 14px; color: var(--muted); }
.foot .built b { font-weight: 500; color: var(--fg); }

/* ---------- About-2 ---------- */
.strip { overflow: hidden; margin-top: 8px; }
.strip-track { display: flex; gap: 8px; width: max-content; animation: marquee 50s linear infinite; }
.strip .ph { width: 325px; aspect-ratio: 1; flex: none; background: #0e0e0e; display: grid; place-items: end start; color: #6c6c6c; font-size: 12px; padding: 12px; }
.strip .ph:nth-child(3n+2) { background: #121a1c; }
.strip .ph:nth-child(3n) { background: #1a1a1a; }
@keyframes marquee { to { transform: translateX(-50%); } }
.about { max-width: 620px; margin: 0 auto; padding-inline: var(--pad); }
.cols { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 0 0; }
.intro { padding-block: 34px 90px; }
.intro .av { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: block; margin-bottom: 18px; }
.intro p { color: var(--muted); font-size: 16.5px; line-height: 1.42; margin-bottom: 22px; }
.mail { display: inline-block; background: var(--card); color: var(--muted); border-radius: 8px; padding: 5px 11px; font-size: 16px; user-select: all; }
.sec-h { font-size: 14.5px; grid-column: 1 / -1; margin-bottom: 8px; }
.exp { margin-bottom: 22px; }
.exp .date { font-size: 14px; color: var(--muted); padding-top: 4px; }
.exp h3 { font-family: var(--logo); font-weight: 500; font-size: 19px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.exp h3.sans { font-family: var(--sans); }
.exp p.role { color: var(--fg); margin: -4px 0 10px; }
.exp p.role span { color: var(--faint); }
.exp h3.serif { font-family: var(--serif); font-style: italic; font-size: 17px; }
.exp p { color: var(--muted); font-size: 16px; line-height: 1.45; margin-bottom: 22px; }
.exp p:last-child { margin-bottom: 0; }
.books { display: grid; grid-template-columns: repeat(4, 82px); gap: 16px; padding-top: 2px; }
.book { aspect-ratio: 82 / 124; background: var(--card); border: 1px solid var(--line); display: grid; place-items: end start; padding: 6px; font-size: 9px; color: var(--muted); line-height: 1.2; }
.book.dk { background: #151515; color: #888; }
.book.or { background: #e8572e; color: #fff; }
.book.bl { background: #2a56b8; color: #fff; }
.book.tn { background: #d9cfbf; color: #333; }
.book.gy { background: #b9bcbe; color: #333; }
.writ .wcard { position: relative; display: grid; grid-template-columns: minmax(0, 280px) 1fr auto; align-items: start; gap: 12px; margin-bottom: 28px; isolation: isolate; }
.writ .wcard::before { content: ""; position: absolute; inset: -14px; border-radius: 16px; background: var(--hl); opacity: 0; transition: opacity .2s ease; z-index: -1; }
.writ .wcard:hover::before, .writ .wcard:focus-visible::before { opacity: 1; }
.writ .wcard > div { grid-column: 1; display: flex; flex-direction: column; gap: 4px; }
.writ b { font-weight: 400; font-size: 16px; line-height: 1; display: block; letter-spacing: -0.04em; }
.writ span { color: #999; font-size: 16px; line-height: 19px; letter-spacing: -0.04em; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.writ .warr { grid-column: 3; width: 16px; height: 16px; margin-top: 1px; color: var(--fg); opacity: .4; transform: rotate(-45deg); transition: transform .25s ease, opacity .25s ease; }
.writ .wcard:hover .warr, .writ .wcard:focus-visible .warr { transform: rotate(0deg); opacity: 1; }
.locale { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-block: 22px 0; margin-top: 30px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.spacer { height: 110px; }


/* ---------- Works map (left index on project pages) ---------- */
.works-map { position: fixed; left: 20px; top: 188px; z-index: 30; display: flex; flex-direction: column; gap: 14px; font-size: 16px; line-height: 20px; letter-spacing: -0.04em; }
.wm-back { display: inline-flex; align-items: center; gap: 4px; color: var(--fg); opacity: .4; transition: opacity .2s; }
.wm-back svg { width: 14px; height: 14px; }
.wm-back:hover { opacity: 1; }
.wm-list { display: flex; flex-direction: column; gap: 4px; }
.wm-list a { color: var(--fg); opacity: .4; transition: opacity .2s; }
.wm-list a:hover, .wm-list a.on { opacity: 1; }
.cs-back { display: none; align-items: center; gap: 4px; color: var(--muted); font-size: 14px; margin-bottom: 20px; }
.cs-back svg { width: 14px; height: 14px; }
.cs-back:hover { color: var(--fg); }
@media (min-width: 760px) and (max-width: 1199px) { #app .cs { padding-left: calc(var(--pad) + 150px); } }
@media (max-width: 759px) { .works-map { display: none; } .cs-back { display: inline-flex; } }

/* ---------- Case study (works/*) — measured from the published pages ---------- */
.cs { max-width: 720px; margin: 0 auto; padding: 144px var(--pad) 0; box-sizing: content-box; }
.cs-head, .cs-meta, .cs-body, .cs-pn, .cs-live > .cs-label { max-width: 560px; margin-inline: auto; }
.cs-cat { font-size: 14px; letter-spacing: -0.02em; }
.cs-head h1 { font-size: 48px; font-weight: 500; letter-spacing: -0.045em; line-height: 1.1; margin-top: 17px; text-wrap: balance; }
.cs-hero { display: block; width: 100%; max-width: 100%; border-radius: 20px; object-fit: cover; margin-top: 32px; background: var(--card); }
.cs-meta { display: grid; grid-template-columns: repeat(var(--n, 4), auto); justify-content: space-between; gap: 20px 32px; margin-top: 52px; font-size: 16px; line-height: 20px; }
#app .cs-meta { max-width: none; }
.cs-meta dd { max-width: 22ch; }
.cs-meta dt { color: var(--fg); }
.cs-meta dd { color: var(--muted); }
.cs-body { padding-top: 96px; }
.cs-body > :first-child { margin-top: 0; }
.cs-label { font-size: 14px; margin-top: 110px; }
.cs-img + .cs-label { margin-top: 120px; }
.cs-h2 { font-size: 32px; font-weight: 500; letter-spacing: -0.04em; line-height: 1.2; max-width: 480px; margin-top: 12px; text-wrap: balance; }
.cs-p { margin-top: 16px; color: rgba(0,0,0,.52); font-size: 16px; line-height: 1.5; display: grid; gap: 12px; }
.cs-sub { margin-top: 60px; font-size: 16px; line-height: 20px; }
.cs-sub + .cs-p { margin-top: 4px; }
.cs-img { display: block; width: calc(100% + 80px); max-width: calc(100% + 80px); margin: 20px -40px 0; border-radius: 16px; object-fit: cover; background: var(--card); }
.cs-img + .cs-sub { margin-top: 60px; }
.cs-art { overflow: hidden; border: 1px solid var(--line); background: #fff; }
.wl-art { display: block; width: 100%; height: 100%; }
.wl-art text { font-family: var(--sans); fill: #1d2a1f; font-feature-settings: "ss03", "ss08"; }
.wl-k { font-size: 26px; letter-spacing: -0.02em; }
.wl-t { font-size: 104px; font-weight: 500; letter-spacing: -0.05em; }
.wl-s { font-size: 32px; font-weight: 500; letter-spacing: -0.03em; fill: #34463a; }
.wl-p polygon { fill: #cdd67e; transform-box: fill-box; transform-origin: center; animation: wlIn .9s cubic-bezier(.2, .8, .2, 1) var(--d) both; }
.wl-cor path { fill: none; stroke: #e98fb3; stroke-width: 3; stroke-dasharray: 7 8; animation: wlFlow 1.2s linear infinite, wlFade .6s ease .9s both; }
.wl-lion { offset-path: path("M760 172 L752 300 L790 380 L880 420 L1000 488"); offset-rotate: 0deg; animation: wlWalk 9s ease-in-out 1.6s infinite both; }
@keyframes wlIn { from { opacity: 0; transform: translateY(18px) scale(.86) rotate(-6deg); } }
@keyframes wlFlow { to { stroke-dashoffset: -30; } }
@keyframes wlFade { from { opacity: 0; } }
@keyframes wlWalk { 0% { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 88% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .wl-p polygon, .wl-cor path { animation: none; } .wl-lion { animation: none; offset-distance: 45%; } }
.cs-gal { display: grid; grid-template-columns: repeat(var(--c), minmax(0, 1fr)); gap: 12px; width: calc(100% + 80px); margin: 20px -40px 0; }
.cs-gal figure { margin: 0; min-width: 0; }
.cs-gal img { display: block; width: 100%; border-radius: 14px; background: var(--card); }
.cs-gal figcaption { font-size: 14px; color: var(--muted); margin-top: 8px; }
.cs-gal + .cs-gal { margin-top: 12px; }
/* tall images (flowcharts) sit in equal frames and scroll inside them */
.cs-gal.scroll .sc { height: 560px; overflow-y: auto; border-radius: 14px; background: var(--card); overscroll-behavior: contain; scrollbar-width: thin; }
.cs-gal.scroll .sc img { border-radius: 0; background: none; }
@media (max-width: 760px) { .cs-gal.scroll .sc { height: 420px; } }
.cs-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 24px; }
.cs-card { background: var(--card); border-radius: 16px; padding: 20px 22px 22px; }
.cs-card h3 { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; }
.cs-card p { font-size: 14.5px; line-height: 1.4; color: var(--muted); margin-top: 6px; }
.cs-steps { list-style: none; counter-reset: st; margin-top: 24px; padding: 0; }
.cs-steps li { counter-increment: st; display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 8px; padding-block: 16px; border-top: 1px solid var(--line); }
.cs-steps li:last-child { border-bottom: 1px solid var(--line); }
.cs-steps li::before { content: counter(st, decimal-leading-zero); grid-row: span 2; color: var(--muted); font-variant-numeric: tabular-nums; }
.cs-steps b { font-weight: 500; }
.cs-steps span { color: var(--muted); font-size: 15px; line-height: 1.45; }
.cs-video { position: relative; width: calc(100% + 80px); margin: 20px -40px 0; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #000; }
.cs-video iframe, .cs-video img { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
.cs-play { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; transition: transform .2s ease; }
.cs-play svg { width: 26px; height: 26px; margin-left: 3px; }
.cs-video:hover .cs-play { transform: scale(1.06); }
.cs-live { margin-top: 120px; }
.monitor { margin-top: 12px; background: #000; border-radius: 6px; padding: 1.5% 1.7% 1.5% 1.6%; }
.screen { aspect-ratio: 967 / 544; overflow: hidden; border-radius: 2px; background: #fff; }
.screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.stand { display: flex; flex-direction: column; align-items: center; }
.stand i { width: 22%; height: 72px; background: linear-gradient(90deg, #b9babd, #e3e4e6 50%, #b9babd); clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%); }
.stand b { width: 23%; height: 10px; background: #cacbcd; border-radius: 0 0 3px 3px; }
.cs-pn { display: flex; justify-content: space-between; gap: 24px; margin-top: 80px; padding-block: 32px 60px; border-top: 1px solid var(--line); font-size: 16px; line-height: 20px; }
.cs-pn > * { position: relative; width: 250px; max-width: 48%; isolation: isolate; }
.cs-pn a::before { content: ""; position: absolute; inset: -14px; border-radius: 16px; background: var(--hl); opacity: 0; transition: opacity .25s ease; z-index: -1; }
.cs-pn a:hover::before, .cs-pn a:focus-visible::before { opacity: 1; }
.cs-pn div { opacity: .2; }
.cs-pn span { display: block; color: #999; }
.cs-pn b { font-weight: 400; }
.cs-pn .next { text-align: right; margin-left: auto; }
:root[data-theme="dark"] .cs-p { color: var(--muted); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cs-p { color: var(--muted); } }
@media (max-width: 760px) {
  .cs { padding-top: 120px; }
  .cs-head h1 { font-size: 34px; }
  .cs-h2 { font-size: 26px; }
  .cs-img, .cs-gal, .cs-video { width: 100%; max-width: 100%; margin-inline: 0; }
  .cs-meta { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cs-cards { grid-template-columns: minmax(0, 1fr); }
  .cs-gal { grid-template-columns: repeat(min(var(--c), 2), minmax(0, 1fr)); }
  .cs-meta > div { flex: 1 1 40%; }
}

/* the site's case-study column already gives the side margins */
#app .cs24{padding-left:0;padding-right:0}
/* Playground — redesign in the site's language: Inter only, the site's greys, chips like the Tools row,
   glass labels like the project cards, square-cornered buttons like "Get in touch", no shadows, the site's easing. */
.pg { padding: 100px 8px 0; --pg-ease: cubic-bezier(.25, .8, .25, 1); }
.pg [hidden], .pg-dtl[hidden], .pg-dtl [hidden] { display: none !important; }
/* search: pinned top centre, a quiet field in the card grey */
.pg-search { position: fixed; top: 16px; left: 50%; translate: -50% 0; z-index: 40; width: min(320px, 34vw); height: 36px; padding: 0 12px; border-radius: 10px; background: var(--card); display: flex; align-items: center; gap: 8px; color: var(--faint); cursor: text; transition: background-color .25s ease; }
.pg-search:focus-within { background: var(--chip); color: var(--muted); }
body.pg-scrolled .pg-search { background: color-mix(in srgb, var(--card) 86%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.pg-search input { all: unset; flex: 1; min-width: 0; font-size: 16px; line-height: 20px; letter-spacing: -0.04em; color: var(--fg); }
.pg-search input::placeholder { color: var(--faint); }
.pg-search input::-webkit-search-cancel-button { display: none; }
.pg-search kbd { background: none; padding: 0; font-size: 12px; color: var(--faint); }
/* filter: the Tools row's chips */
.pg-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 16px; }
/* wall */
.pg-wall { display: flex; gap: 8px; align-items: flex-start; }
.pg-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.pg-card { position: relative; border-radius: 16px; overflow: hidden; background: #f4f4f4; isolation: isolate; }
.pg-card iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
/* labels: the project cards' glass chips, top left */
.pg-veil { position: absolute; top: 8px; left: 8px; right: 8px; z-index: 1; display: flex; flex-wrap: wrap; gap: 4px; pointer-events: none; opacity: 0; transition: opacity .25s ease; }
.pg-tag { background: rgba(0, 0, 0, .04); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: rgba(0, 0, 0, .4); font-size: 14px; line-height: 14px; letter-spacing: -0.04em; padding: 4px 10px; border-radius: 40px; white-space: nowrap; }
/* actions: small square buttons, bottom right, like the theme toggle */
.pg-rnd { position: absolute; bottom: 8px; z-index: 3; width: 32px; height: 32px; padding: 0; border-radius: 8px; background: #fff; color: #0d0d0d; display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .25s ease, background-color .25s ease, color .25s ease; }
.pg-rnd svg { width: 14px; height: 14px; }
.pg-rnd:hover { background: #e8e8e8; }
.pg-rnd.open { right: 8px; }
.pg-rnd.play { right: 44px; }
.pg-rnd.play[data-on="true"] { background: #000; color: #fff; opacity: 1; }
/* variants: a segmented chip, bottom left */
.pg-vsw { position: absolute; left: 8px; bottom: 8px; right: 84px; z-index: 3; display: flex; flex-wrap: wrap; gap: 4px; pointer-events: none; opacity: 0; transition: opacity .25s ease; }
@media (hover: hover) {
  .pg-card:hover .pg-veil, .pg-card:hover .pg-rnd, .pg-rnd:focus-visible, .pg-card:hover .pg-vsw, .pg-vsw:focus-within { opacity: 1; }
}
@media (hover: none) { .pg-rnd, .pg-veil, .pg-vsw { opacity: 1; } }
.pg-seg { position: relative; display: inline-flex; padding: 2px; border-radius: 10px; background: rgba(0, 0, 0, .04); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); pointer-events: auto; max-width: 100%; }
.pg-seg button { position: relative; z-index: 1; font-size: 14px; line-height: 14px; letter-spacing: -0.04em; padding: 7px 10px; border-radius: 8px; color: rgba(0, 0, 0, .4); white-space: nowrap; transition: color .25s ease; }
.pg-seg button:hover { color: rgba(0, 0, 0, .7); }

.pg-empty { padding-block: 48px 96px; text-align: center; color: var(--muted); font-size: 16px; letter-spacing: -0.04em; }
/* detail: two cards side by side, like the How I Work cards */
.pg-dtl { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px; }
.pg-scrim { position: absolute; inset: 0; padding: 0; background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); cursor: default; animation: pgFade .25s ease both; }

/* facts: the case-study meta, label left, value right, hairlines between */
.pg-rows { display: grid; }
.pg-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 16px; line-height: 20px; letter-spacing: -0.04em; }

/* buttons: the site's .btn and .btn.dark */
.pg-wide { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 12px; border-radius: 10px; font-size: 16px; line-height: 23px; letter-spacing: -0.011em; cursor: pointer; transition: background-color .25s ease; }

.pg-chip:hover { color: rgba(0, 0, 0, .7); }
.pg-chip[aria-pressed="true"] { background: rgba(0, 0, 0, .08); color: var(--fg); }
:root[data-theme="dark"] .pg-chip { background: rgba(255, 255, 255, .06); color: rgba(255, 255, 255, .45); }
:root[data-theme="dark"] .pg-chip[aria-pressed="true"] { background: rgba(255, 255, 255, .12); color: var(--fg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pg-chip { background: rgba(255, 255, 255, .06); color: rgba(255, 255, 255, .45); } :root:not([data-theme="light"]) .pg-chip[aria-pressed="true"] { background: rgba(255, 255, 255, .12); color: var(--fg); } }
.pg-edge { display: none; }
.pg-wide .tx { display: none; }
/* A: one frame, three bands — a viewer bar (where you are, and the window controls), the stage, and a caption.
   Navigation and window controls sit together at the top; what the piece is sits under it, in fixed slots:
   name and story on the left, the facts in labelled columns, the one action on the right. */
.pg-count { display: none; }
.pg-bar { display: none; }
.lay-a .pg-shell { width: min(1040px, 100%); height: min(780px, 100%); grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 0; background: var(--card); border-radius: 20px; overflow: hidden; }
.lay-a .pg-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 12px 0; }
.lay-a .pg-bar > div { display: flex; align-items: center; gap: 4px; }
.lay-a .pg-bar .pg-tools { position: static; display: flex; gap: 4px; }
.lay-a .pg-bar .pg-tool { width: 32px; height: 32px; border-radius: 8px; background: none; color: var(--muted); }
.lay-a .pg-bar .pg-tool:hover { background: var(--chip); color: var(--fg); }
.lay-a .pg-pager { display: flex; gap: 0; align-items: center; height: 32px; }
.lay-a .pg-pager .pg-wide { flex: none; width: 32px; height: 32px; padding: 0; border-radius: 8px; background: none; color: var(--muted); }
.lay-a .pg-pager .pg-wide:hover { background: var(--chip); color: var(--fg); }
.lay-a .pg-count { display: block; min-width: 56px; text-align: center; font-size: 14px; letter-spacing: -0.011em; color: var(--muted); font-variant-numeric: tabular-nums; }
.lay-a .pg-block { border-radius: 0; background: none; }
.lay-a .pg-side { background: none; border-radius: 0; margin: 0 24px; padding: 20px 0 24px; border-top: 1px solid var(--line); overflow: visible;
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "title facts acts" "say facts acts"; column-gap: 40px; row-gap: 4px; align-items: start; }
.lay-a .pg-head { grid-area: title; }
.lay-a .pg-head h2 { font-size: 18px; font-weight: 600; line-height: 21.5px; letter-spacing: -0.02em; }
.lay-a .pg-say { grid-area: say; margin: 0; max-width: 480px; font-size: 14.5px; line-height: 19px; letter-spacing: -0.011em; color: var(--muted); }
.lay-a .pg-rows { grid-area: facts; display: flex; gap: 32px; }
.lay-a .pg-row { flex-direction: column; justify-content: flex-start; gap: 2px; padding: 0; border: 0; font-size: 14px; line-height: 20px; letter-spacing: -0.011em; }
.lay-a .pg-row:last-child { border: 0; }
.lay-a .pg-row span:first-child { font-size: 13px; color: var(--muted); }
.lay-a .pg-row span:last-child { color: var(--fg); }
.lay-a .pg-acts { grid-area: acts; margin: 0; padding: 2px 0 0; display: flex; }
.lay-a #pg-d-open { padding: 6px 14px; }
.lay-a .pg-block #pg-d-vsw { position: absolute; left: 12px; bottom: 12px; z-index: 3; display: flex; gap: 6px; }
.lay-a .pg-block .pg-ctl { margin: 0; }
.lay-a .pg-block .pg-ctl-label { display: none; }
.lay-a .pg-block .pg-ctl .pg-seg { background: rgba(0, 0, 0, .04); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.lay-a .pg-block .pg-ctl .pg-seg .thumb { background: #fff; }
.lay-a .pg-block .pg-ctl .pg-seg button { color: rgba(0, 0, 0, .4); }
.lay-a .pg-block .pg-ctl .pg-seg button[aria-pressed="true"] { color: #0d0d0d; }
@media (max-width: 759px) {
  .lay-a .pg-side { margin: 0 16px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "title" "say" "facts" "acts"; row-gap: 12px; }
}

/* Motion from the Framer page: hero lines rise in on load (20px, 0.4s spring, staggered);
   cards and rows rise in as they scroll into view (20px, 1s, ease [.44,0,.56,1]) */
.hero-in > * { animation: rise .4s cubic-bezier(.25, .8, .25, 1) both; }
.hero-in > .avatar { animation-delay: 0s; }
.hero-in > h1 { animation-delay: .05s; }
.hero-in > p { animation-delay: .1s; }
.hero-in > .btns { animation-delay: .15s; }
.hero-in > .hint { animation-delay: .25s; }
@keyframes rise { from { opacity: 0; transform: translateY(20px); } }
.rv { opacity: 0; transform: translateY(var(--rv-y, 20px)); transition: opacity 1s cubic-bezier(.44, 0, .56, 1), transform 1s cubic-bezier(.44, 0, .56, 1); }
.rv.in { opacity: 1; transform: none; }
.qa.rv { --rv-y: 24px; }
@media (prefers-reduced-motion: reduce) { .hero-in > * { animation: none; } .rv { opacity: 1; transform: none; transition: none; } }

/* ---------- Responsive ---------- */
@media (max-width: 760px) {
  :root { --pad: 16px; }
  .trio, .testi-row { grid-template-columns: 1fr; }
  .work, .think { min-height: 220px; padding: 30px; }
  .inst { width: 64px !important; }
  .cols { grid-template-columns: 1fr; }
  .exp .date { padding: 0 0 4px; }
  .books { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .strip .ph { width: 240px; }
}
@media (prefers-reduced-motion: reduce) {
  .inst img, .strip-track { animation: none; }
  .view { animation: none; }
}
.view { animation: fade .35s ease; }
@keyframes fade { from { opacity: 0; } }
</style>

  let actx = null; const buffers = {};
  function audioCtx() {
    if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function sample(name) {
    const c = audioCtx(); if (!c) return null;
    if (!buffers[name]) {
      const bin = atob(AUDIO[name]), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      buffers[name] = c.decodeAudioData(bytes.buffer);
    }
    return buffers[name];
  }
  function playSample(name, rate = 1, vol = 1) {
    const c = audioCtx(), p = sample(name); if (!c || !p) return;
    p.then((buf) => { const src = c.createBufferSource(); src.buffer = buf; src.playbackRate.value = rate;
      const g = c.createGain(); g.gain.value = vol; src.connect(g).connect(c.destination); src.start(); }).catch(() => {});
  }
  const PERSP = "perspective(500px)";
  const FRAMES = {
    // snare: pushed into the page and bounces back
    push: () => { const z = [0, -40, 12, -18, 6, -6, 0], rx = [0, 4, -1.5, 2, -0.6, 0.6, 0];
      return z.map((v, i) => ({ transform: `${PERSP} translateZ(${v}px) rotateX(${rx[i]}deg)` })); },
    // cymbals: tilt away from where you hit them, then settle
    wobble: (el, e) => { const b = el.getBoundingClientRect(), dx = e.clientX - (b.left + b.width / 2), dy = e.clientY - (b.top + b.height / 2);
      const m = new DOMMatrix(getComputedStyle(el).transform), a = Math.atan2(m.b, m.a);
      const lx = dx * Math.cos(-a) - dy * Math.sin(-a), ly = dx * Math.sin(-a) + dy * Math.cos(-a), len = Math.hypot(lx, ly) || 1;
      const ax = -ly / len, ay = lx / len;
      return [0, 28, -16, 10, -5.5, 2.5, -1, 0].map((v) => ({ transform: `${PERSP} rotate3d(${ax}, ${ay}, 0, ${v}deg)` })); },
    // toms: rock on X with a small squash on impact
    squash: () => [0, 9, -6, 4, -2.4, 1.3, -0.5, 0].map((v, i) => ({ transform: `${PERSP} rotateX(${v}deg) scale(${i === 1 ? 0.96 : 1})` })),
  };
  function hit(el, d, e) {
    playSample(d.s, d.rate || 1, d.vol || 1);
    if (!el.animate) return;
    el.getAnimations().forEach((a) => { if (a.id === "drum-hit") a.cancel(); });

  const PROJECTS = [{"slug": "btob", "name": "24 Hour Home Care", "tags": ["Service Design", "2026"], "desc": "A self-service family portal that turns phone-call care coordination into a clear, transparent digital experience.", "cat": "24 Hour Home Care", "title": "A simpler way for families to manage home care.", "hero": "img/btob/hero.webp", "ratio": 1.7778, "meta": [["Role", "UI/UX Design,\nUXR, Prototyping,\nVisual Design"], ["Team", "Dakota Shao\nJoan Yu\nKeller Wang\nMaitreyi Verma"], ["Tools used", "Figma\nClaude\nVariant AI"], ["Timeline", "Jan – Apr 2026"]], "year": "2026", "blocks": [], "thumb": "img/FnrSI16JhOnY4g9JePQeupNBikY.webp", "custom": "btob"}, {"slug": "wildlink", "name": "Wildlink", "tags": ["Game Design"], "desc": "An interactive puzzle game developed with the Arroyos & Foothills Conservancy.", "cat": "Wildlink", "title": "An interactive puzzle game developed with the Arroyos & Foothills Conservancy.", "hero": "img/wl-cover.webp", "thumb": "img/wl-cover.webp", "ratio": "16/9", "meta": [["My role", "Research, game design, puzzle design, video production & editing"], ["Project", "Team project (Dakota, Louise, Leta)"], ["Timeline", "7 weeks"], ["Tools used", "Figma, Illustrator, After Effects, laser lab, CapCut"]], "blocks": [{"t": "label", "text": "Overview"}, {"t": "h2", "text": "Connecting puzzle pieces to solve mountain lion issues."}, {"t": "p", "text": ["The game highlights the survival challenges faced by mountain lions, an iconic species in Los Angeles County, and uses mixed media to engage middle and high school students and visitors to the AFC Education Center in wildlife conservation."]}, {"t": "label", "text": "Game rule"}, {"t": "h2", "text": "You play as a Protector of Mountain Lions, helping them survive in the wild areas near cities."}, {"t": "img", "src": "img/wl-game-rule.webp", "r": "16/9", "alt": "Puzzle pieces connecting a corridor for a mountain lion"}, {"t": "label", "text": "Problem"}, {"t": "h2", "text": "Mountain lions are at risk of separation and inbreeding."}, {"t": "p", "text": ["Habitat fragmentation and road development cut through the large, contiguous habitats they need to survive."]}, {"t": "cards", "items": [{"h": "Deaths from vehicle collisions", "p": "Each year, about 70 mountain lions are killed by vehicle collisions on California highways."}, {"h": "Wildfire", "p": "The 2018 Woolsey Fire burned nearly 100,000 acres in Los Angeles and Ventura counties, forcing mountain lions into riskier areas to find new habitats."}, {"h": "First-order inbreeding", "p": "Researchers found a 93% sperm deformity rate in 9 Santa Monica mountain lions, indicating inbreeding."}, {"h": "Poison", "p": "In the Santa Monica Mountains, 21 of 22 mountain lions tested positive for exposure and four died from poisoning."}]}, {"t": "label", "text": "Users"}, {"t": "cards", "items": [{"h": "Education center visitors", "p": "People who visit the AFC Education Center."}, {"h": "Students", "p": "Junior high and high school students."}]}, {"t": "label", "text": "Key learning goals"}, {"t": "sub", "text": "What are wildlife corridors?"}, {"t": "p", "text": ["Safe paths that animals use to move between habitats."]}, {"t": "sub", "text": "How can we help?"}, {"t": "p", "text": ["By understanding mountain lions' needs and challenges, see how human actions can transform the environment to be diverse, balanced, and connected."]}, {"t": "img", "src": "img/wl-corridors.webp", "r": "16/9", "alt": "When the game is over, all the corridors light up"}, {"t": "label", "text": "Prototype"}, {"t": "h2", "text": "Walkthrough video"}, {"t": "video", "yt": "L8b917ESDvs", "title": "Wildlink walkthrough video"}, {"t": "label", "text": "Inspiration"}, {"t": "gallery", "cols": 1, "items": [{"src": "img/wl-insp-puzzle.webp", "r": "1400/348", "alt": "Puzzle inspiration"}]}, {"t": "gallery", "cols": 4, "items": [{"src": "img/wl-insp-board.webp", "r": "3/4", "alt": "Board game"}, {"src": "img/wl-insp-map.webp", "r": "3/4", "alt": "Illustrated map"}, {"src": "img/wl-insp-animals.webp", "r": "3/4", "alt": "Flat animal illustrations"}, {"src": "img/wl-insp-palette.webp", "r": "3/4", "alt": "Color palette"}]}, {"t": "label", "text": "Design exploration"}, {"t": "gallery", "cols": 3, "items": [{"src": "img/wl-exp-physical.webp", "r": "4/3", "cap": "Physical"}, {"src": "img/wl-exp-digital.webp", "r": "4/3", "cap": "Digital"}, {"src": "img/wl-exp-mix.webp", "r": "4/3", "cap": "Mix"}]}, {"t": "gallery", "cols": 4, "items": [{"src": "img/wl-exp-wood.webp", "r": "1/1", "alt": "Laser-cut wood puzzle prototype"}, {"src": "img/wl-exp-acrylic.webp", "r": "1/1", "alt": "Acrylic puzzle piece"}, {"src": "img/wl-exp-cut-a.webp", "r": "1/1", "fit": "contain", "alt": "Laser cut file"}, {"src": "img/wl-exp-cut-b.webp", "r": "1/1", "fit": "contain", "alt": "Laser cut file"}]}, {"t": "label", "text": "Design decision"}, {"t": "p", "text": ["Our visual style uses flat vector design to align with our target audience."]}, {"t": "gallery", "cols": 2, "items": [{"src": "img/wl-dec-pieces.webp", "r": "1/1", "fit": "contain", "cap": "Puzzle pieces"}, {"src": "img/wl-dec-map.webp", "r": "1/1", "cap": "Map, buttons and color"}]}, {"t": "label", "text": "Game flow"}, {"t": "steps", "items": [{"h": "Onboard: Start", "p": "Choose a start piece to begin. Different start pieces lead to different missions."}, {"h": "Game: Clue", "p": "Match the clue piece to the start piece's theme to learn more about the mountain lions' situation."}, {"h": "Game: Problem", "p": "Find the problem the mountain lions face in this situation."}, {"h": "Game: Data", "p": "Relevant data on the challenges mountain lions face."}, {"h": "Game: Fact", "p": "How building corridors and crossings can help mountain lions overcome their challenges."}, {"h": "Activate: Action", "p": "An action that is already happening and supports corridor building."}]}], "live": null, "art": "wildlink", "closed": true}, {"slug": "sante", "cat": "Sante", "title": "A brand identity built on calm confidence.", "hero": "img/H6Kl3tacfV4SMP5TOhzwWRZO6E.webp", "ratio": 1.6, "meta": [["Role", "Branding\nGraphic Design"], ["Team", ""], ["Tools used", "Figma\nIllustrator"], ["Year", "2024"]], "year": "2024", "blocks": [{"t": "label", "text": "Overview"}, {"t": "h2", "text": "Creating a wellness identity that feels calm without becoming quiet."}, {"t": "p", "text": ["Sante needed a visual language that felt clinical yet human. We built a wordmark and identity system around a single saturated blue, balancing medical trust with an approachable warmth across every touchpoint."]}, {"t": "label", "text": "Challenge"}, {"t": "h2", "text": "Making trust feel immediate in a crowded wellness space."}, {"t": "p", "text": ["The brand needed to communicate care, clarity, and credibility from the first impression. The challenge was avoiding the expected wellness clichés while still creating a visual language that felt soft, approachable, and reassuring."]}, {"t": "label", "text": "Approach"}, {"t": "h2", "text": "Building the system around restraint, rhythm, and warmth."}, {"t": "p", "text": ["The direction focused on a quiet but confident identity system. Every choice, from spacing to type scale, was shaped to feel intentional and composed rather than decorative."]}, {"t": "img", "src": "img/zyvsbMETnR5FCHSNNTXkB2LF8.webp", "r": 1.925}, {"t": "label", "text": "Research"}, {"t": "h2", "text": "Studying how calm brands earn attention."}, {"t": "p", "text": ["Research looked at wellness platforms, clinical care brands, and lifestyle studios to understand how visual systems can signal support without feeling generic or overly medical."]}, {"t": "sub", "text": "Competitor Analysis"}, {"t": "p", "text": ["Most competitors leaned heavily on muted palettes, soft photography, and familiar wellness language. That opened an opportunity to create something more structured, precise, and memorable while keeping the emotional tone gentle."]}, {"t": "img", "src": "img/7PzfK1rvfwOauy3jzBps1l5eU0.webp", "r": 1.7778}, {"t": "sub", "text": "Visual Direction"}, {"t": "p", "text": ["The visual direction combines clean typography, soft contrast, and measured spacing. The identity avoids loud gestures and instead relies on proportion, tone, and consistency to create recognition."]}, {"t": "img", "src": "img/ISAdHKkTACBmHJ9xCsFpzEwxw8.webp", "r": 1.4953}, {"t": "label", "text": "Design solutions"}, {"t": "h2", "text": "Designing a system that makes calm feel deliberate."}, {"t": "p", "text": ["The final design uses a restrained set of components and layouts that can flex across digital touchpoints while keeping the brand feeling composed and trustworthy."]}, {"t": "sub", "text": "Typography"}, {"t": "p", "text": ["Typography carries much of the brand’s personality. The type treatment is clear and understated, with enough warmth in scale and spacing to keep the experience feeling human."]}, {"t": "img", "src": "img/ymceQwQ8jWHg3v1LtOFctGXcDjU.webp", "r": 1.8768}, {"t": "sub", "text": "Layout System"}, {"t": "p", "text": ["Layouts are intentionally open and balanced, giving content room to breathe while guiding attention through a clear visual sequence."]}, {"t": "img", "src": "img/XJLfn3M5u3EQb1bZusySYCLZI.webp", "r": 1.5623}, {"t": "sub", "text": "Components"}, {"t": "p", "text": ["Reusable components were designed to feel light, functional, and consistent. Tags, cards, and content blocks share the same calm rhythm so the system stays cohesive as it expands."]}, {"t": "img", "src": "img/Q6QaXvqV10c7987dhbZ5UFJwMLQ.webp", "r": 1.64}, {"t": "label", "text": "Outcome"}, {"t": "h2", "text": "A wellness brand with clarity, softness, and staying power."}, {"t": "p", "text": ["The result is an identity that feels approachable without losing credibility. It gives Sante a calm digital presence that can grow across services, campaigns, and future product touchpoints."]}], "live": "img/H6Kl3tacfV4SMP5TOhzwWRZO6E.webp", "thumb": "img/baidu-thumb.webp", "closed": true}, {"slug": "echos", "name": "Echos", "tags": ["AI Voice Assistant"], "desc": "An AI voice tour assistant for The Getty Museum, with personalized guidance and interactive storytelling.", "cat": "Echos", "title": "An AI voice tour assistant for The Getty Museum.", "hero": "img/echos-cover.webp", "thumb": "img/echos-cover.webp", "ratio": "16/9", "meta": [["My role", "Research, user testing, design & prototype for Elias, video production"], ["Project", "Team project (Dakota, Louise, Leta)"], ["Timeline", "7 weeks"], ["Tools used", "Figma, ProtoPie, NFC smart tag, ElevenLabs (AI voice)"]], "blocks": [{"t": "label", "text": "Overview"}, {"t": "h2", "text": "A museum guide you can talk to."}, {"t": "p", "text": ["Echos is an AI voice tour assistant based on The Getty Museum, offering an immersive visiting experience through personalized guidance and interactive storytelling."]}, {"t": "label", "text": "User type"}, {"t": "h2", "text": "Four kinds of visitors, mapped by how long they stay and how deep they go."}, {"t": "p", "text": ["We placed visitors on two axes: a long or short time period at the museum, and an interest in general information or in detail."]}, {"t": "cards", "items": [{"h": "Explorers", "p": "Love wandering around, discovering new things, and embracing the unknown."}, {"h": "Immersive visitors", "p": "Seek deep, atmosphere-driven engagement with art or history."}, {"h": "Social visitors", "p": "Enjoy sharing cultural experiences with friends or family to strengthen bonds."}, {"h": "Researchers", "p": "Pursue detailed information on specific themes or exhibits."}]}, {"t": "label", "text": "AI bot persona"}, {"t": "h2", "text": "Two kinds of AI voice assistants for different visitors and artifacts."}, {"t": "p", "text": ["Main Tourist AI (Joey for explorers, Elias for researchers) offers primary guidance, while Artifact Dedicated AI is tailored for specific museum pieces. As an example, we developed a specialized version for The Getty’s “Golden Ticket.”"]}, {"t": "cards", "items": [{"h": "Joey · Main Tourist AI", "p": "The knowledgeable art companion, for explorers."}, {"h": "Elias · Main Tourist AI", "p": "The expert guide on demand, for researchers."}, {"h": "The Golden Ticket · Artifact Dedicated AI", "p": "The artifact itself tells its story."}, {"h": "The Creator · Artifact Dedicated AI", "p": "The anonymous artist behind the piece."}]}, {"t": "sub", "text": "For explorers: Joey"}, {"t": "p", "text": ["Quick assistance and directions: “Can you show me the nearest restroom?”", "Related artwork suggestions: “Are there any similar pieces I might like?”, also triggered by unintentional interaction."]}, {"t": "sub", "text": "For researchers: Elias"}, {"t": "p", "text": ["In-depth exploration: “Tell me more about this.”, plus more detailed follow-up questions.", "Clarification: “Can you clarify more on this?”"]}, {"t": "sub", "text": "Artifact + Creator"}, {"t": "p", "text": ["The Golden Ticket answers questions about the Greek belief in an afterlife, the legend of the Fountain of Memory, artifacts about afterlife and death from other cultures, and the inscriptions on its surface.", "The Creator talks about production tools, craftsmanship and materials."]}, {"t": "sub", "text": "Conversation flows"}, {"t": "gallery", "cols": 3, "items": [{"src": "img/echos-flow-joey.webp", "r": "1100/2610", "cap": "Joey"}, {"src": "img/echos-flow-elias.webp", "r": "1100/2106", "cap": "Elias"}, {"src": "img/echos-flow-artifact.webp", "r": "996/4096", "cap": "Artifact + Creator"}], "scroll": true}, {"t": "label", "text": "Prototype"}, {"t": "h2", "text": "Prototype showcase"}, {"t": "video", "yt": "s4v0EKhHiQg", "title": "Echos prototype showcase"}, {"t": "label", "text": "User tests"}, {"t": "h2", "text": "Three rounds of testing to validate, refine and decide."}, {"t": "p", "text": ["In our user testing, we focused on three key areas: validating core features and design, refining the overall user flow, and finalizing feature and design choices."]}, {"t": "img", "src": "img/echos-test-setup.webp", "r": "1175/661", "alt": "User test setup"}, {"t": "img", "src": "img/echos-test-photos.webp", "r": "1600/606", "alt": "User test sessions"}, {"t": "sub", "text": "General features"}, {"t": "steps", "items": [{"h": "Tap input or voice input (A/B)", "p": "3 of 6 said voice is a more immersive and smooth way to tour a museum; 3 of 6 said text is the more polite way to get information in a museum."}, {"h": "Switching between tap and voice", "p": "Round 1: 8 of 10 had strong preferences and kept their own method. Round 3: 7 of 10 read the switch as a click, so we changed it to a long press to prevent accidental touches."}, {"h": "Tap mode button", "p": "Round 1: 9 of 10 felt too much typing breaks the immersion. Round 2: 9 of 10 found the options didn’t fit their mental model. Round 3: 7 of 10 read the new options as clickable."}, {"h": "Visit route", "p": "Round 1: 6 of 10 felt the route was incomplete. Round 2: 2 of 10 couldn’t tell how to close the side bar, even with an animated hint."}]}, {"t": "gallery", "cols": 5, "items": [{"src": "img/echos-mode-1.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-mode-2.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-mode-3.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-tap-1.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-tap-2.webp", "r": "393/852", "fit": "contain"}]}, {"t": "gallery", "cols": 5, "items": [{"src": "img/echos-tap-3.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-tap-4.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-route-1.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-route-2.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-route-3.webp", "r": "393/852", "fit": "contain"}]}, {"t": "sub", "text": "Main Tourist AI"}, {"t": "steps", "items": [{"h": "Navigation", "p": "Round 1: 9 of 10 wanted the map both small and full screen. Round 2: 6 of 10 wanted a bigger map while still being able to chat. Round 3: 7 of 10 preferred a map that adapts its size."}, {"h": "Export PDF", "p": "10 of 10 found it helpful and easy to follow; researchers said it lightens their memory load."}, {"h": "Elias’ communication style", "p": "Round 2: 8 of 10 found long messages hard to read and asked for highlights. Round 3: 10 of 10 said bold keywords made reading easier."}]}, {"t": "gallery", "cols": 4, "items": [{"src": "img/echos-nav.webp", "r": "632/816", "fit": "contain"}, {"src": "img/echos-pdf.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-style-1.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-style-2.webp", "r": "393/852", "fit": "contain"}]}, {"t": "sub", "text": "Artifact Dedicated AI"}, {"t": "gallery", "cols": 2, "items": [{"src": "img/echos-ai-1.webp", "r": "16/9", "fit": "cover"}, {"src": "img/echos-ai-2.webp", "r": "16/9", "fit": "cover"}, {"src": "img/echos-ai-3.webp", "r": "16/9", "fit": "cover"}, {"src": "img/echos-ai-4.webp", "r": "16/9", "fit": "cover"}]}, {"t": "gallery", "cols": 2, "items": [{"src": "img/echos-ai-5.webp", "r": "16/9", "fit": "cover"}, {"src": "img/echos-ai-6.webp", "r": "16/9", "fit": "cover"}, {"src": "img/echos-ai-7.webp", "r": "16/9", "fit": "cover"}, {"src": "img/echos-ai-8.webp", "r": "16/9", "fit": "cover"}]}], "live": null, "closed": true}];

  const faqs = [["What kind of designer are you?", "I like stepping into unfamiliar systems, figuring out what actually matters, and choosing the right approach from there."], ["What do you care about most in a project?", "Clarity. I like turning something messy, technical, or overwhelming into something people can actually understand and use."], ["What kinds of projects excite you?", "Projects where there’s a real system to unpack—healthcare, mobility, AI, public experiences, or anything that goes beyond just making another app."], ["What are you like to work with?", "Curious, direct, and pretty involved. I ask a lot of questions, catch small inconsistencies, and usually keep pushing until the logic feels right."], ["Do you code?", "Enough to prototype ideas, understand what’s feasible, and have much better conversations with engineers."], ["What do you do outside of design?", "I dance, play guitar, recently started learning drums, and I’m usually picking up something new just because I want to know how it works."], ["What’s something people don’t expect about you?", "I can be very systems-oriented in my work, but I’m also drawn to playful, weird, and slightly unexpected interactions."]];

 <span class="v6-ln dn"><em>employs</em></span>

  <div class="text ovt"><p class="body">We designed a mobile-first family portal, with a desktop version, to help families manage this care: <span class="hl">scheduling caregivers</span>, <span class="hl">tracking hours</span>, and <span class="hl">renewing the plan</span>. The agency later acquired the design IP.</p></div>

  <div class="text sec">
    <p class="label" id="sec-problem">Problem</p>
    <h2>Families have no easy way to see or manage this care.</h2>
    <p class="body">Everything relies on a phone call — even basic information like how many hours are left, who’s coming next, or when the plan renews. That can mean unused care hours, missed renewal deadlines, and gaps in care.</p>
  </div>

  <section class="text sec">
    <p class="label" id="sec-key-findings">Key findings</p>
    <h2>What we learned from families and caregivers</h2>
  </section>
  <div class="kf kf2">
    <div><span class="n">01</span><p class="big">Families juggle several plans, each with its own rules.</p><p>Many clients have more than one care plan, each with its own hours, dates and caregivers. Families track them all, often in terms they’ve never heard.</p></div>
  </div>
  <div class="kx"><div class="kx-in"><div class="kx-tl">
    <span></span><div class="kx-mo"><span>Jul</span><span>Sep</span><span>Nov</span><span>Jan</span><span>Mar</span><span>May</span><span>Jun</span></div>
    <p class="kx-who">Son · Respite<em>Regional center · 90 hrs / qtr</em></p>
    <div class="kx-tr"><div class="kx-bar c1" style="left:0;width:24.6%">Q1</div><div class="kx-bar c1" style="left:25.1%;width:24.6%">Q2</div><div class="kx-bar c1" style="left:50.2%;width:24.6%">Q3</div><div class="kx-bar c1" style="left:75.3%;width:24.7%">Q4</div></div>

    <div class="kx-tr"><div class="kx-bar c2" style="left:0;width:49.6%">2025 · use by Dec 31</div><div class="kx-bar c2" style="left:50.2%;width:49.8%">resets Jan 1</div></div>

  <div class="kf kf2 kfn">
    <div><span class="n">02</span><p class="big">Care is handed off blind, on both sides.</p><p>Families leave their loved one alone with someone new and hear nothing about how it goes. Caregivers get few details about the client, and the match isn’t always right.</p></div>
  </div>
  <div class="kx"><div class="kx-duo">
    <div><p class="kx-h"><i class="kx-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#011c62" stroke-width="2.3" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.3"/><path d="M3.5 19c.6-3 2.8-5 5.5-5s4.9 2 5.5 5M14.5 14.6c.7-.4 1.6-.6 2.5-.6 2.2 0 3.9 1.6 4.4 4"/></svg></i>Family</p><q><mark>NO ONE documented ANYTHING</mark> during the 12 hour day with my dad.</q><p class="kx-src">Yelp review</p></div>
    <div><p class="kx-h"><i class="kx-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#011c62" stroke-width="2.3" stroke-linecap="round"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-6 7-6s6.2 2.4 7 6"/></svg></i>Caregiver</p><q>Every day when I go to the house, <mark>I’m lost on what to do</mark> because every home is run differently.</q><p class="kx-src">Indeed review</p></div>
  </div></div>
  <section class="text sec">
    <p class="label" id="sec-design-goal">Design goal</p>
    <h2>How might we increase family trust and visibility into care so that families can make the most of their hours and stay on top of every detail?</h2>
  </section>
  

  

  <div class="flows"><div class="flow"><div class="ft"><p class="feb">Core flow 01<span class="st-ad">Adopted</span></p><h3>See all your plans clearly.</h3><p>Every plan has its own hours, dates and rules. The app breaks each one down and shows it from a few angles, so families can follow every plan without calling.</p></div><div class="demo"><div class="phone"><div class="screen"><span class="tap" aria-hidden="true"></span><div class="scr img on"><img src="img/btob/screens/f1a.webp?v=4" alt="Hours left, per plan" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f1b.webp?v=5" alt="Hours at risk" decoding="async"></div><div class="scr img tall"><img src="img/btob/screens/f1d.webp?v=4" alt="One plan in detail" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f1c.webp?v=4" alt="All plans side by side" decoding="async"></div></div></div><ol class="steps"><li class="on" data-tap=".80,.52"><button type="button"><span class="n">01</span><span class="l">Hours left, per plan</span><span class="bar"><i></i></span></button></li><li class="" data-tap=".5,.95"><button type="button"><span class="n">02</span><span class="l">Hours at risk</span><span class="bar"><i></i></span></button></li><li class="" data-tap=".07,.10" data-dur="6400"><button type="button"><span class="n">03</span><span class="l">One plan in detail</span><span class="bar"><i></i></span></button></li><li class=""><button type="button"><span class="n">04</span><span class="l">All plans side by side</span><span class="bar"><i></i></span></button></li></ol></div></div><div class="flow"><div class="ft"><p class="feb">Core flow 02<span class="st-ad">Adopted</span></p><h3>Book the hours you’re approved for.</h3><p>Pick which plan the hours come from, then a time and an address. If your usual caregiver can’t come, send the shift to agency caregivers and choose who fits.</p></div><div class="demo" data-step="2000"><div class="phone"><div class="screen"><span class="tap" aria-hidden="true"></span><div class="scr img on"><img src="img/btob/screens/f2a.webp?v=4" alt="Plan to book from" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f2b.webp?v=4" alt="Date, time, address" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f2c.webp?v=4" alt="Usual caregiver unavailable" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f2d.webp?v=4" alt="Care needs" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f2e.webp?v=4" alt="Caregivers notified" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f2f.webp?v=4" alt="Shift confirmed" decoding="async"></div></div></div><ol class="steps"><li class="on" data-tap=".5,.94"><button type="button"><span class="n">01</span><span class="l">Plan to book from</span><span class="bar"><i></i></span></button></li><li class="" data-tap=".56,.94"><button type="button"><span class="n">02</span><span class="l">Date, time, address</span><span class="bar"><i></i></span></button></li><li class="" data-tap=".5,.43"><button type="button"><span class="n">03</span><span class="l">Usual caregiver unavailable</span><span class="bar"><i></i></span></button></li><li class="" data-tap=".56,.94"><button type="button"><span class="n">04</span><span class="l">Care needs</span><span class="bar"><i></i></span></button></li><li class=""><button type="button"><span class="n">05</span><span class="l">Caregivers notified</span><span class="bar"><i></i></span></button></li><li class="" data-tap=".5,.94"><button type="button"><span class="n">06</span><span class="l">Shift confirmed</span><span class="bar"><i></i></span></button></li></ol></div></div><div class="flow"><div class="ft"><p class="feb">Core flow 03<span class="st-ad">Adopted</span></p><h3>Watch each shift live.</h3><p>Once a caregiver arrives, families usually hear nothing until the visit ends. Now they can follow the shift as it happens and reach the caregiver if something comes up.</p></div><div class="demo"><div class="phone"><div class="screen"><span class="tap" aria-hidden="true"></span><div class="scr img on"><img src="img/btob/screens/f3a.webp?v=5" alt="Live shift on the lock screen" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f3b.webp?v=5" alt="Shift in progress on Home" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f3c.webp?v=5" alt="Clock-in and task log" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f3e.webp?v=5" alt="Message to the caregiver" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f3f.webp?v=5" alt="Caregiver replies" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f3g.webp?v=5" alt="Shift completed" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f3h.webp?v=5" alt="Rating the caregiver" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f3i.webp?v=5" alt="Feedback sent" decoding="async"></div></div></div><ol class="steps"><li class="on" data-tap=".5,.83"><button type="button"><span class="n">01</span><span class="l">Live shift on the lock screen</span><span class="bar"><i></i></span></button></li><li class="" data-tap=".5,.77"><button type="button"><span class="n">02</span><span class="l">Shift in progress on Home</span><span class="bar"><i></i></span></button></li><li class="" data-tap=".31,.50"><button type="button"><span class="n">03</span><span class="l">Clock-in and task log</span><span class="bar"><i></i></span></button></li><li class=""><button type="button"><span class="n">04</span><span class="l">Message to the caregiver</span><span class="bar"><i></i></span></button></li><li class=""><button type="button"><span class="n">05</span><span class="l">Caregiver replies</span><span class="bar"><i></i></span></button></li><li class="" data-tap=".72,.78" data-st="pr"><button type="button"><span class="n">06</span><span class="l">Shift completed</span><span class="bar"><i></i></span></button></li><li class="" data-tap=".5,.94" data-st="pr"><button type="button"><span class="n">07</span><span class="l">Rating the caregiver</span><span class="bar"><i></i></span></button></li><li class="" data-st="pr"><button type="button"><span class="n">08</span><span class="l">Feedback sent</span><span class="bar"><i></i></span></button></li></ol></div></div><div class="flow"><div class="ft"><p class="feb">Core flow 04<span class="st-pr">Proposal</span></p><h3>Renew a plan in time.</h3><p>When a plan is about to expire, the family gets an alert. They can ask support what to do, then call their coordinator to start the renewal.</p></div><div class="demo"><div class="phone"><div class="screen"><span class="tap" aria-hidden="true"></span><div class="scr img on"><img src="img/btob/screens/f4a.webp?v=4" alt="Expiry alert" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f4b.webp?v=4" alt="Plan flagged in Care plans" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f4c.webp?v=4" alt="What renewal needs" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f4d.webp?v=4" alt="Support home" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f4e.webp?v=4" alt="Question to live chat" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f4f.webp?v=4" alt="Next steps from support" decoding="async"></div><div class="scr img"><img src="img/btob/screens/f4g.webp?v=4" alt="Call to the coordinator" decoding="async"></div></div></div><ol class="steps"><li class="on" data-tap=".5,.80"><button type="button"><span class="n">01</span><span class="l">Expiry alert</span><span class="bar"><i></i></span></button></li><li class="" data-tap=".5,.61"><button type="button"><span class="n">02</span><span class="l">Plan flagged in Care plans</span><span class="bar"><i></i></span></button></li><li class=""><button type="button"><span class="n">03</span><span class="l">What renewal needs</span><span class="bar"><i></i></span></button></li><li class="" data-tap=".89,.10"><button type="button"><span class="n">04</span><span class="l">Support home</span><span class="bar"><i></i></span></button></li><li class=""><button type="button"><span class="n">05</span><span class="l">Question to live chat</span><span class="bar"><i></i></span></button></li><li class=""><button type="button"><span class="n">06</span><span class="l">Next steps from support</span><span class="bar"><i></i></span></button></li><li class=""><button type="button"><span class="n">07</span><span class="l">Call to the coordinator</span><span class="bar"><i></i></span></button></li></ol></div></div></div>

  

  <div class="dsec">
<section class="text sec">
  <p class="label" id="sec-design-decisions">Design decisions</p>
  <h2>Make the hours readable, then put them where families decide.</h2>
</section>

<div class="dcar" id="dc1">
  <div class="text heads"><div class="hd3 on"><h3><span class="nm">01</span>Lead with hours left.</h3><p class="bd">“24 / 40 hrs” made families do the math. Hours left became the big number, with used, scheduled and total underneath.</p></div><div class="hd3"><h3><span class="nm">02</span>Ticks instead of a plain bar.</h3><p class="bd">The hours card spans almost the full width of Home, where a plain bar looked empty. Ticks break it up and give scheduled hours their own place.</p></div><div class="hd3"><h3><span class="nm">03</span>One sentence instead of a pace tag.</h3><p class="bd">“Behind pace” was hard to understand at first. The card now explains it in one sentence, which also makes the row bigger and easier to tap. When families tap in, they already know what “Behind pace” means.</p></div><div class="hd3"><h3><span class="nm">04</span>Final design.</h3><p class="bd">The card sits at the top of Home, so the first thing families see when they open the app is how many hours are left and whether they’re on track.</p></div></div>

<section class="text sec2">
  <h2>Answer what families worry about at each point of a visit.</h2>
</section>
<div class="dcar d2" id="dc2">
  <div class="text heads"><div class="hd3 on"><p class="eb2"><span class="nm">01</span>Before the visit<span class="stp ad">Adopted</span></p><h3>Who is coming?</h3><p class="bd">Families are letting someone new into their home. They filter by their needs first, then choose from caregivers who chose to apply, so the match works for both sides.</p></div><div class="hd3"><p class="eb2"><span class="nm">02</span>During the visit<span class="stp ad">Adopted</span></p><h3>Is everything okay right now?</h3><p class="bd">Once the caregiver clocks in, a live card on Home shows each task as it’s logged. If something comes up, families can message the caregiver directly.</p></div><div class="hd3"><p class="eb2"><span class="nm">03</span>After the visit<span class="stp pr">Proposal</span></p><h3>How did it go?</h3><p class="bd">When the shift ends, families rate the caregiver. The score shows on their profile, so the next family has more to go on.</p><p class="why">Why it wasn’t adopted: the first release focused on cutting support calls. Bad reviews could also hurt the agency.</p></div></div>

  <section class="text sec">
    <p class="label" id="sec-design-system">Design system</p>
    <h2>Built on the agency’s Salesforce components</h2>
    <p class="body">The portal runs on Salesforce Lightning, so we started from its stock components, adapting them to match 24 Hour Home Care’s brand and make information easier to read. We documented the changes and the reasons behind them for the agency’s development team.</p>
