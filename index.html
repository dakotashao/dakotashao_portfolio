      leaves = mirror.isConnected ? leaves.filter((l) => now - l.t0 < l.life) : [];
      for (const l of leaves) {
        const t = now - l.t0, age = t / l.life;
        l.ph += (dt / l.per) * 6.283;
        const sw = Math.sin(l.ph), through = Math.abs(Math.cos(l.ph));
        l.ox += l.drift * dt; l.drift *= Math.pow(0.996, dt);
        l.y += l.sink * (0.35 + 0.65 * through) * dt;
        ctx.globalAlpha = 0.9 * Math.min(1, t / 350) * (age < 0.65 ? 1 : 1 - (age - 0.65) / 0.35);
        ctx.save(); ctx.translate(l.ox + sw * l.amp, l.y); ctx.rotate(l.a0 + Math.cos(l.ph) * 0.55); ctx.scale(l.L, l.L);
        ctx.beginPath();
        ctx.moveTo(-1, 0);
        ctx.bezierCurveTo(-0.7, -0.62, 0.35, -0.7, 1.05, 0);
        ctx.bezierCurveTo(0.35, 0.62, -0.7, 0.58, -1, 0);
        ctx.moveTo(-1, -0.04); ctx.lineTo(-1.35, -0.1); ctx.lineTo(-1.35, 0.04); ctx.lineTo(-1, 0.04);
        ctx.restore(); ctx.fillStyle = l.c; ctx.fill();
      }
      ctx.globalAlpha = 1;
      raf = leaves.length || charge > 0 ? requestAnimationFrame(draw) : 0;
    }
  }


function cycMount(root, onOpen) {
  const slot = root.querySelector(".slot");
  if (!slot || slot.dataset.on) return () => {};
  slot.dataset.on = "1";
  const act = root.classList.contains("s-act");
  const WORDS = ["things", "sliders", "loaders", "posters", "booklets", "funk playlists", "noise", "tea", "mistakes"];
  const LINK = { sliders: 1, loaders: 1, posters: 1, booklets: 1 };     // real work → opens the Playground
  const cls = (w) => act ? "w-" + w.split(" ")[0] : "";
  const fill = (el, w) => {
    el.className = cls(w);
    if (act && (w === "funk playlists" || w === "noise")) {
      el.textContent = "";
      [...w].forEach((c, k) => { const s = document.createElement("span"); s.className = "ch"; s.style.setProperty("--i", k); s.textContent = c === " " ? " " : c; el.appendChild(s); });
    } else if (act && w === "mistakes") {
      // typed wrong first, then the two letters swap into place
      el.innerHTML = 'mista<span class="fix">ek</span>s';
      setTimeout(() => { const f = el.querySelector(".fix"); if (f) { f.textContent = "ke"; f.classList.add("ok"); } }, 900);
    } else el.textContent = w;
  };
  const measure = (w) => { const s = document.createElement("span"); fill(s, w); s.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap"; slot.appendChild(s); const x = s.getBoundingClientRect().width; s.remove(); return Math.ceil(x); };
  let i = 0, hold = false, wait = 0;
  const first = document.createElement("span"); fill(first, WORDS[0]); slot.appendChild(first);
  const size = () => (slot.style.width = measure(WORDS[i]) + "px");
  // the poster and booklet words use other faces; load them up front so their widths measure true
  if (document.fonts) Promise.all(['500 17px Outfit', 'italic 19px "Instrument Serif"'].map((f) => document.fonts.load(f).catch(() => {}))).then(size);
  size();
  if (document.fonts) document.fonts.ready.then(size);
  setTimeout(size, 700);
  slot.addEventListener("mouseenter", () => (hold = true));
  slot.addEventListener("mouseleave", () => (hold = false));
  slot.addEventListener("click", (e) => { e.preventDefault(); if (LINK[WORDS[i]] && onOpen) onOpen(WORDS[i]); });
  const step = (force) => {
    if (!slot.isConnected) return clearInterval(tick);
    if (hold || document.hidden) return;
    if (!force && WORDS[i] === "things" && wait++ < 1) return;   // rest on "things" a beat longer (about 4 s), not long enough to lose people
    wait = 0;
    i = (i + 1) % WORDS.length;
    const old = slot.querySelector("span:not(.out)"), nu = document.createElement("span");
    fill(nu, WORDS[i]); nu.classList.add("in"); slot.appendChild(nu);
    size();
    slot.classList.toggle("link", !!LINK[WORDS[i]]);
    if (old) { old.classList.add("out"); setTimeout(() => old.remove(), 500); }
    requestAnimationFrame(() => requestAnimationFrame(() => nu.classList.remove("in")));
  };
  let tick = 0;
  setTimeout(() => { step(true); tick = setInterval(step, 2200); }, 1600);   // first change comes quickly, so visitors see it move
  return () => clearInterval(tick);
}

  function render() {
    const h = location.hash.slice(1) || "home";
    const isAbout = h === "about";
    const work = PROJECTS.find((p) => !p.locked && !p.closed && "work-" + p.slug === h);
    app.innerHTML = `<div class="view">${work ? caseStudy(work) : isAbout ? about() : h === "playground" ? playground() : home()}${footer()}</div>`;
    const key = work ? "works" : isAbout ? "about" : h === "playground" ? "playground" : ["works", "contact"].includes(h) ? h : "home";
    nav.forEach((a) => a.classList.toggle("on", a.dataset.k === key));
    if (h === "works") document.getElementById("works-list").scrollIntoView();
    else if (h === "contact") document.getElementById("contact-block").scrollIntoView();
    else scrollTo(0, 0);
    const wm = app.querySelectorAll(".wm-list a");
    wm.forEach((a) => a.addEventListener("click", (e) => {
      e.preventDefault();
      const t = document.getElementById(a.dataset.target);
      if (t) window.scrollTo({ top: t.getBoundingClientRect().top + scrollY - 140, behavior: "smooth" });
    }));
    spy = wm.length ? () => {
      let cur = null;
      wm.forEach((a) => { const t = document.getElementById(a.dataset.target); if (t && t.getBoundingClientRect().top < innerHeight * 0.4) cur = a; });
      wm.forEach((a) => a.classList.toggle("on", a === cur));
    } : null;
    if (spy) spy();
    if (h === "playground") pgMount(); else pgClose();
    if (work && work.custom === "btob") btobMount(app.querySelector(".cs24"));
    app.querySelectorAll(".inst").forEach((b) => {
      const d = kit.find((x) => x.k === b.dataset.k);
      b.addEventListener("pointerdown", (e) => hit(b, d, e));
      b.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); const r = b.getBoundingClientRect(); hit(b, d, { clientX: r.left + r.width / 2, clientY: r.top }); } });
    });
    tick();
    const cycEl = app.querySelector(".cyc"); if (cycEl) cycMount(cycEl, () => { location.hash = "playground"; });
    const avEl = app.querySelector(".av-fx"); if (avEl) avFx(avEl); else if (avAbort) avAbort.abort();
    // scroll-in reveal (same as Framer "onInView": opacity 0 → 1, y 20 → 0)
    const rvTargets = app.querySelectorAll(".proj, .trio > *, .qa, .tcard, .companies, .exp, .books, .cs-hero, .cs-img, .monitor");
    if ("IntersectionObserver" in window && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const io = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
      rvTargets.forEach((el) => { el.classList.add("rv"); io.observe(el); });
    }
    app.querySelectorAll(".cs-video").forEach((v) => v.querySelector(".cs-play").addEventListener("click", () => {
      v.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.dataset.yt}?autoplay=1&rel=0&playsinline=1" title="${v.dataset.title}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    }));
    app.querySelectorAll("[data-scroll]").forEach((a) => a.addEventListener("click", (e) => {
      const t = document.getElementById(a.dataset.scroll); if (!t) return;
      e.preventDefault(); t.scrollIntoView({ behavior: "smooth", block: "start" });
    }));
    const authors = [...app.querySelectorAll(".author")], tq = app.querySelector(".tquote");
    authors.forEach((a) => a.addEventListener("click", () => {
      if (a.classList.contains("sel")) return;
      authors.forEach((b) => { b.classList.toggle("sel", b === a); b.setAttribute("aria-selected", b === a); });
      tq.classList.add("out");
      setTimeout(() => { tq.textContent = TESTIMONIALS[+a.dataset.i].quote; tq.classList.remove("out"); }, 200);
    }));
    const faqItems = [...app.querySelectorAll(".qa")];
    faqItems.forEach((qa) => qa.querySelector(".q").addEventListener("click", () => {
      const open = !qa.classList.contains("open");
      faqItems.forEach((o) => { o.classList.toggle("open", o === qa && open); o.querySelector(".q").setAttribute("aria-expanded", o === qa && open); });
    }));
  }
  addEventListener("hashchange", render);
  render();
})();
</script>
