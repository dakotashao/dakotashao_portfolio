<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dakota Shao — interaction designer turning complex systems into clear, thoughtful experiences.">
<title>Dakota Shao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@500&family=Instrument+Serif:ital@1&display=swap">
<style>
/* Layout: Areal template, 1:1 to Framer home2 / about-2 — corner nav, centered hero, full-width stacked cards */
:root {
  --bg: #ffffff;
  --fg: #0d0d0d;
  --muted: #7a7a7a;
  --faint: #a8a8a8;
  --card: #f4f4f4;
  --chip: #e0e0e0;
  --line: #e8e8e8;
  --btn: #000000;
  --btn-fg: #ffffff;
  --blue: #0a12e6;
  --hl: #f6f6f6;
  --btn2: #f6f6f6;
  --btn2-h: #e8e8e8;
  --rule: rgba(0, 0, 0, .2);
  --q: rgba(0, 0, 0, .52);
  --sun: #f39a1e;
  --sans: "Inter", system-ui, -apple-system, "PingFang SC", sans-serif;
  --logo: "Outfit", "Inter", sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
  --pad: 32px;
  --maxw: calc(821px + 2 * var(--pad));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0b0b; --fg: #f2f2f2; --muted: #8c8c8c; --faint: #5e5e5e; --card: #171717;
  --chip: #262626; --line: #222222; --btn: #f2f2f2; --btn-fg: #0b0b0b; --hl: #1a1a1a; --btn2: #1c1c1c; --btn2-h: #2a2a2a; --rule: rgba(255, 255, 255, .2); --q: rgba(255, 255, 255, .52); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b0b0b; --fg: #f2f2f2; --muted: #8c8c8c; --faint: #5e5e5e; --card: #171717;
  --chip: #262626; --line: #222222; --btn: #f2f2f2; --btn-fg: #0b0b0b; --hl: #1a1a1a; --btn2: #1c1c1c; --btn2-h: #2a2a2a; --rule: rgba(255, 255, 255, .2); --q: rgba(255, 255, 255, .52); color-scheme: dark }

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--sans);
  font-size: 16px; line-height: 1.45; letter-spacing: -0.011em;
  font-feature-settings: "ss03", "ss08";
  -webkit-font-smoothing: antialiased; transition: background .25s, color .25s;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; border-radius: 6px; }

/* ---------- Nav (Areal) ---------- */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 0;
}
.nav > * { pointer-events: auto; }
.nav-left { display: flex; flex-direction: column; gap: 12px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--fg); background: transparent; display: block; padding: 0; }
.nav.open .dot { background: var(--fg); }
@media (hover: hover) { .nav-left:hover .dot { background: var(--fg); } }
.links { opacity: 0; visibility: hidden; transform: translateY(-4px); transition: opacity .2s, transform .2s, visibility .2s; }
.nav.open .links { opacity: 1; visibility: visible; transform: none; }
@media (hover: hover) { .nav-left:hover .links { opacity: 1; visibility: visible; transform: none; } }
.links { display: flex; flex-direction: column; font-size: 16px; line-height: 1.5; }
/* only the dot (or the menu once it's open) reacts to the mouse — the hidden menu area must not */
.nav-left { pointer-events: none !important; }
.nav-left > .dot { pointer-events: auto; }
.links { pointer-events: none; }
.nav.open .links { pointer-events: auto; }
@media (hover: hover) { .nav-left:hover, .nav-left:hover .links { pointer-events: auto !important; } }
.nav.open .nav-left { pointer-events: auto !important; }

.links a { color: var(--muted); transition: color .15s; }
.links a:hover, .links a.on { color: var(--fg); }
.links .sub::before { content: "↳ "; }
.theme {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); display: grid; place-items: center; color: var(--sun);
}
.theme svg { width: 15px; height: 15px; }
.ai {
  position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center;
  background: var(--bg); color: var(--fg);
  box-shadow: inset 0 0 0 1.5px transparent;
  border: 1.5px solid transparent;
  background-image: linear-gradient(var(--bg), var(--bg)), linear-gradient(140deg, #6aa8ff, #ffb347);
  background-origin: border-box; background-clip: padding-box, border-box;
}
.ai svg { width: 18px; height: 18px; }
.toast {
  position: fixed; right: 20px; bottom: 68px; z-index: 40; font-size: 13px;
  background: var(--fg); color: var(--bg); padding: 8px 12px; border-radius: 8px;
}

/* ---------- Shared ---------- */
.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--pad); }
.label { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn { padding: 6px 12px; border-radius: 10px; font-size: 16px; background: var(--btn2); transition: background-color .25s ease; }
.btn:hover { background: var(--btn2-h); }
.btn.dark { background: var(--btn); color: var(--btn-fg); }
.btn.dark:hover { background: color-mix(in srgb, var(--btn) 60%, transparent); }
.chip { display: inline-block; font-size: 12px; background: var(--chip); border-radius: 20px; padding: 4px 10px; }

/* ---------- Hero ---------- */
.hero { position: relative; height: 100vh; height: 100svh; min-height: 560px; display: grid; place-items: center; overflow: hidden; }
.hero-in { text-align: center; max-width: 300px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }
.avatar {
  width: 58px; height: 58px; border-radius: 50%; background: #3a3a3a; overflow: hidden;
  object-fit: cover; margin-bottom: 22px;
}
.hero h1 { font-size: 26px; font-weight: 500; line-height: 1.15; letter-spacing: -0.025em; margin-bottom: 16px; }
.hero p { color: var(--muted); font-size: 17px; line-height: 1.38; }
.hero .prev { margin: 14px 0 24px; }
.hero .prev i { font-style: italic; }
.hint { margin-top: 12px; font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
kbd { font-family: var(--sans); font-size: 10px; background: var(--card); border-radius: 4px; padding: 1px 4px; color: var(--muted); }
.inst { position: absolute; z-index: 1; cursor: pointer; padding: 0; transform: translate(-50%, -50%) rotate(var(--r)); -webkit-tap-highlight-color: transparent; }
.inst img { width: 100%; height: auto; display: block; pointer-events: none; }
.inst img { animation: drum-in .4s cubic-bezier(.22, 1, .36, 1) var(--delay) both; }
@keyframes drum-in { from { opacity: .001; transform: rotate(var(--r0)) scale(.9); } }

/* ---------- Companies ---------- */
.companies { text-align: center; padding-block: 10px 70px; }
.companies h3 { font-size: 13.5px; font-weight: 500; margin-bottom: 14px; }
.tools { display: flex; flex-direction: column; align-items: center; gap: 26px; margin: 8px auto 0; }
.trow { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 26px 30px; }
/* every logo sits in the same 32px band and is sized by eye to the same visual weight; grey until hovered */
.tl { display: inline-flex; align-items: center; gap: 6px; height: 28px; filter: grayscale(1) opacity(.42); transition: filter .35s ease; cursor: default; }
.tl svg { display: block; width: auto; height: var(--h, 24px); overflow: visible; }
.tl:hover { filter: none; }
@media (max-width: 760px) { .tools { gap: 16px; } .trow { gap: 12px 26px; } .tl { height: 26px; zoom: .82; } }

/* ---------- How I Work ---------- */
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.work { background: var(--card); border-radius: 20px; padding: 40px; min-height: 288px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; min-width: 0; }
.work h3 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 8px; }
.work p { font-size: 14.5px; color: var(--muted); line-height: 1.3; }
.work .tags { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Projects ---------- */
.projects { padding-block: 150px 60px; scroll-margin-top: -60px; }
.proj { display: block; margin-bottom: 74px; }
.shot {
  position: relative; border-radius: 16px; background: var(--card);
  display: grid; place-items: center; overflow: hidden; max-width: 100%;
}
.shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.shot .inner { width: 77%; aspect-ratio: 640 / 357; background: var(--bg); display: grid; place-items: center; color: var(--faint); font-size: 13px; }
.shot.blue { background: var(--blue); aspect-ratio: 16 / 10; }
.shot.blue span { color: #fff; font-size: clamp(48px, 10vw, 96px); font-weight: 500; letter-spacing: -0.04em; }
.shot .meta { position: absolute; z-index: 1; top: 8px; left: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity .25s ease; }
.shot .meta .chip { background: rgba(0, 0, 0, .04); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: rgba(0, 0, 0, .4); font-size: 14px; line-height: 14px; letter-spacing: -0.04em; padding: 4px 10px; border-radius: 40px; }
.proj:hover .meta { opacity: 1; }
.proj.locked { cursor: default; }
.proj h4 { font-size: 16px; font-weight: 400; margin-top: 12px; }
.proj p { color: var(--muted); font-size: 16px; line-height: 1.4; margin-top: 4px; }

/* ---------- How I Think ---------- */
.think { text-align: center; background: var(--card); border-radius: 20px; padding: 38px 30px; min-height: 288px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; min-width: 0; }
.think h3 { font-size: 23px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 8px; }
.think .t { font-size: 14px; line-height: 1.3; }
.think .d { font-size: 12px; color: var(--muted); line-height: 1.35; max-width: 160px; margin: 0 auto; }

/* ---------- Testimonial ---------- */
.testi { padding-block: 60px 80px; }
/* Testimonial — Framer "Testimonial" component: white card, author pills (Selected = black pill with name), quote on the right */
.tcard { background: var(--bg); padding: 80px 30px; display: flex; flex-wrap: wrap; gap: 50px 20px; align-items: flex-start; }
.authors { flex: 1 0 0; min-width: 260px; display: flex; align-items: center; gap: 10px; }
.author { display: flex; align-items: center; height: 56px; padding: 8px 0; border-radius: 40px; background: transparent; color: #fff; transition: background-color .4s cubic-bezier(.34, 1.25, .64, 1), padding .4s cubic-bezier(.34, 1.25, .64, 1), opacity .25s; }
.author img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; }
.author .nr { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; transition: max-width .4s cubic-bezier(.34, 1.25, .64, 1), opacity .25s, margin .4s; }
.author .nr b { font-weight: 500; font-size: 14px; line-height: 1.3; letter-spacing: -0.01em; }
.author .nr small { font-size: 13px; line-height: 1.3; letter-spacing: 0.01em; color: #999; font-weight: 500; }
.author.sel { background: #050505; padding: 8px 18px 8px 8px; cursor: default; }
.author.sel .nr { max-width: 220px; opacity: 1; margin-left: 15px; }
@media (hover: hover) { .author:not(.sel):hover { opacity: .5; } }
.tquote { flex: 1 0 0; min-width: 260px; color: rgba(0, 0, 0, .52); font-size: 16px; line-height: 22.4px; letter-spacing: -0.04em; transition: opacity .2s ease .075s; }
.tquote.out { opacity: 0; transition-delay: 0s; }
:root[data-theme="dark"] .tquote { color: var(--muted); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tquote { color: var(--muted); } }

/* ---------- FAQ ---------- */
.faq { max-width: calc(600px + 40px); margin: 0 auto; padding: 80px 20px; }
/* FAQ — Framer "Closed/Open": height springs open (0.4s, no bounce), answer fades in from a light blur, + turns to – */
.qa { border-bottom: 0.5px solid var(--rule); padding-block: 16px; }
.qa .q { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0; text-align: left; color: var(--q); font-size: 16px; line-height: 19.2px; letter-spacing: -0.04em; }
.qa .q > span { max-width: 380px; }
.qa .ic { position: relative; width: 10px; height: 10px; flex: none; color: var(--faint); }
.qa .ic::before, .qa .ic::after { content: ""; position: absolute; left: 0; top: 4.5px; width: 10px; height: 1px; background: currentColor; transition: transform .4s cubic-bezier(.25, .8, .25, 1), opacity .4s; }
.qa .ic::after { transform: rotate(90deg); }
.qa.open .ic::after { transform: rotate(180deg); opacity: 0; }
.qa .a { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s cubic-bezier(.25, .8, .25, 1); }
.qa.open .a { grid-template-rows: 1fr; }
.qa .a > div { overflow: hidden; min-height: 0; }
.faq .ans { padding-top: 8px; max-width: 361px; font-size: 16px; line-height: 1.4; letter-spacing: -0.04em; color: var(--fg); opacity: 0; filter: blur(6px); transition: opacity .4s ease, filter .4s ease; }
.qa.open .ans { opacity: 1; filter: blur(0); }
@media (prefers-reduced-motion: reduce) { .qa .a, .faq .ans, .qa .ic::before, .qa .ic::after { transition: none; } }

/* ---------- Footer (Areal) ---------- */
.foot { text-align: center; padding-block: 120px 60px; }
.foot .tag { font-size: 23px; letter-spacing: -0.02em; line-height: 1.2; color: var(--muted); }
.foot .tag span { color: var(--fg); display: block; }
.foot .c { margin-top: 36px; font-size: 13px; color: var(--muted); }
.foot .built { margin-top: 28px; font-size: 14px; color: var(--muted); }
.foot .built b { font-weight: 500; color: var(--fg); }

/* ---------- About-2 ---------- */
.strip { overflow: hidden; margin-top: 8px; }
.strip-track { display: flex; gap: 8px; width: max-content; animation: marquee 50s linear infinite; }
.strip .ph { width: 325px; aspect-ratio: 1; flex: none; background: #0e0e0e; display: grid; place-items: end start; color: #6c6c6c; font-size: 12px; padding: 12px; }
.strip .ph:nth-child(3n+2) { background: #121a1c; }
.strip .ph:nth-child(3n) { background: #1a1a1a; }
@keyframes marquee { to { transform: translateX(-50%); } }
.about { max-width: 620px; margin: 0 auto; padding-inline: var(--pad); }
.cols { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 0 0; }
.intro { padding-block: 34px 90px; }
.intro .av { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: block; margin-bottom: 18px; }
.intro p { color: var(--muted); font-size: 16.5px; line-height: 1.42; margin-bottom: 22px; }
.mail { display: inline-block; background: var(--card); color: var(--muted); border-radius: 8px; padding: 5px 11px; font-size: 16px; user-select: all; }
.sec-h { font-size: 14.5px; grid-column: 1 / -1; margin-bottom: 8px; }
.exp { margin-bottom: 22px; }
.exp .date { font-size: 14px; color: var(--muted); padding-top: 4px; }
.exp h3 { font-family: var(--logo); font-weight: 500; font-size: 19px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.exp h3.sans { font-family: var(--sans); }
.exp p.role { color: var(--fg); margin: -4px 0 10px; }
.exp p.role span { color: var(--faint); }
.exp h3.serif { font-family: var(--serif); font-style: italic; font-size: 17px; }
.exp p { color: var(--muted); font-size: 16px; line-height: 1.45; margin-bottom: 22px; }
.exp p:last-child { margin-bottom: 0; }
.books { display: grid; grid-template-columns: repeat(4, 82px); gap: 16px; padding-top: 2px; }
.book { aspect-ratio: 82 / 124; background: var(--card); border: 1px solid var(--line); display: grid; place-items: end start; padding: 6px; font-size: 9px; color: var(--muted); line-height: 1.2; }
.book.dk { background: #151515; color: #888; }
.book.or { background: #e8572e; color: #fff; }
.book.bl { background: #2a56b8; color: #fff; }
.book.tn { background: #d9cfbf; color: #333; }
.book.gy { background: #b9bcbe; color: #333; }
.writ .wcard { position: relative; display: grid; grid-template-columns: minmax(0, 280px) 1fr auto; align-items: start; gap: 12px; margin-bottom: 28px; isolation: isolate; }
.writ .wcard::before { content: ""; position: absolute; inset: -14px; border-radius: 16px; background: var(--hl); opacity: 0; transition: opacity .2s ease; z-index: -1; }
.writ .wcard:hover::before, .writ .wcard:focus-visible::before { opacity: 1; }
.writ .wcard > div { grid-column: 1; display: flex; flex-direction: column; gap: 4px; }
.writ b { font-weight: 400; font-size: 16px; line-height: 1; display: block; letter-spacing: -0.04em; }
.writ span { color: #999; font-size: 16px; line-height: 19px; letter-spacing: -0.04em; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.writ .warr { grid-column: 3; width: 16px; height: 16px; margin-top: 1px; color: var(--fg); opacity: .4; transform: rotate(-45deg); transition: transform .25s ease, opacity .25s ease; }
.writ .wcard:hover .warr, .writ .wcard:focus-visible .warr { transform: rotate(0deg); opacity: 1; }
.locale { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-block: 22px 0; margin-top: 30px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.spacer { height: 110px; }


/* ---------- Works map (left index on project pages) ---------- */
.works-map { position: fixed; left: 20px; top: 188px; z-index: 30; display: flex; flex-direction: column; gap: 14px; font-size: 16px; line-height: 20px; letter-spacing: -0.04em; }
.wm-back { display: inline-flex; align-items: center; gap: 4px; color: var(--fg); opacity: .4; transition: opacity .2s; }
.wm-back svg { width: 14px; height: 14px; }
.wm-back:hover { opacity: 1; }
.wm-list { display: flex; flex-direction: column; gap: 4px; }
.wm-list a { color: var(--fg); opacity: .4; transition: opacity .2s; }
.wm-list a:hover, .wm-list a.on { opacity: 1; }
.cs-back { display: none; align-items: center; gap: 4px; color: var(--muted); font-size: 14px; margin-bottom: 20px; }
.cs-back svg { width: 14px; height: 14px; }
.cs-back:hover { color: var(--fg); }
@media (min-width: 760px) and (max-width: 1199px) { #app .cs { padding-left: calc(var(--pad) + 150px); } }
@media (max-width: 759px) { .works-map { display: none; } .cs-back { display: inline-flex; } }

/* ---------- Case study (works/*) — measured from the published pages ---------- */
.cs { max-width: 720px; margin: 0 auto; padding: 144px var(--pad) 0; box-sizing: content-box; }
.cs-head, .cs-meta, .cs-body, .cs-pn, .cs-live > .cs-label { max-width: 560px; margin-inline: auto; }
.cs-cat { font-size: 14px; letter-spacing: -0.02em; }
.cs-head h1 { font-size: 48px; font-weight: 500; letter-spacing: -0.045em; line-height: 1.1; margin-top: 17px; text-wrap: balance; }
.cs-hero { display: block; width: 100%; max-width: 100%; border-radius: 20px; object-fit: cover; margin-top: 32px; background: var(--card); }
.cs-meta { display: grid; grid-template-columns: repeat(var(--n, 4), auto); justify-content: space-between; gap: 20px 32px; margin-top: 52px; font-size: 16px; line-height: 20px; }
#app .cs-meta { max-width: none; }
.cs-meta dd { max-width: 22ch; }
.cs-meta dt { color: var(--fg); }
.cs-meta dd { color: var(--muted); }
.cs-body { padding-top: 96px; }
.cs-body > :first-child { margin-top: 0; }
.cs-label { font-size: 14px; margin-top: 110px; }
.cs-img + .cs-label { margin-top: 120px; }
.cs-h2 { font-size: 32px; font-weight: 500; letter-spacing: -0.04em; line-height: 1.2; max-width: 480px; margin-top: 12px; text-wrap: balance; }
.cs-p { margin-top: 16px; color: rgba(0,0,0,.52); font-size: 16px; line-height: 1.5; display: grid; gap: 12px; }
.cs-sub { margin-top: 60px; font-size: 16px; line-height: 20px; }
.cs-sub + .cs-p { margin-top: 4px; }
.cs-img { display: block; width: calc(100% + 80px); max-width: calc(100% + 80px); margin: 20px -40px 0; border-radius: 16px; object-fit: cover; background: var(--card); }
.cs-img + .cs-sub { margin-top: 60px; }
.cs-art { overflow: hidden; border: 1px solid var(--line); background: #fff; }
.wl-art { display: block; width: 100%; height: 100%; }
.wl-art text { font-family: var(--sans); fill: #1d2a1f; font-feature-settings: "ss03", "ss08"; }
.wl-k { font-size: 26px; letter-spacing: -0.02em; }
.wl-t { font-size: 104px; font-weight: 500; letter-spacing: -0.05em; }
.wl-s { font-size: 32px; font-weight: 500; letter-spacing: -0.03em; fill: #34463a; }
.wl-p polygon { fill: #cdd67e; transform-box: fill-box; transform-origin: center; animation: wlIn .9s cubic-bezier(.2, .8, .2, 1) var(--d) both; }
.wl-cor path { fill: none; stroke: #e98fb3; stroke-width: 3; stroke-dasharray: 7 8; animation: wlFlow 1.2s linear infinite, wlFade .6s ease .9s both; }
.wl-lion { offset-path: path("M760 172 L752 300 L790 380 L880 420 L1000 488"); offset-rotate: 0deg; animation: wlWalk 9s ease-in-out 1.6s infinite both; }
@keyframes wlIn { from { opacity: 0; transform: translateY(18px) scale(.86) rotate(-6deg); } }
@keyframes wlFlow { to { stroke-dashoffset: -30; } }
@keyframes wlFade { from { opacity: 0; } }
@keyframes wlWalk { 0% { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 88% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .wl-p polygon, .wl-cor path { animation: none; } .wl-lion { animation: none; offset-distance: 45%; } }
.cs-gal { display: grid; grid-template-columns: repeat(var(--c), minmax(0, 1fr)); gap: 12px; width: calc(100% + 80px); margin: 20px -40px 0; }
.cs-gal figure { margin: 0; min-width: 0; }
.cs-gal img { display: block; width: 100%; border-radius: 14px; background: var(--card); }
.cs-gal figcaption { font-size: 14px; color: var(--muted); margin-top: 8px; }
.cs-gal + .cs-gal { margin-top: 12px; }
.cs-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 24px; }
.cs-card { background: var(--card); border-radius: 16px; padding: 20px 22px 22px; }
.cs-card h3 { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; }
.cs-card p { font-size: 14.5px; line-height: 1.4; color: var(--muted); margin-top: 6px; }
.cs-steps { list-style: none; counter-reset: st; margin-top: 24px; padding: 0; }
.cs-steps li { counter-increment: st; display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 8px; padding-block: 16px; border-top: 1px solid var(--line); }
.cs-steps li:last-child { border-bottom: 1px solid var(--line); }
.cs-steps li::before { content: counter(st, decimal-leading-zero); grid-row: span 2; color: var(--muted); font-variant-numeric: tabular-nums; }
.cs-steps b { font-weight: 500; }
.cs-steps span { color: var(--muted); font-size: 15px; line-height: 1.45; }
.cs-video { position: relative; width: calc(100% + 80px); margin: 20px -40px 0; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #000; }
.cs-video iframe, .cs-video img { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
.cs-play { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; transition: transform .2s ease; }
.cs-play svg { width: 26px; height: 26px; margin-left: 3px; }
.cs-video:hover .cs-play { transform: scale(1.06); }
.cs-live { margin-top: 120px; }
.monitor { margin-top: 12px; background: #000; border-radius: 6px; padding: 1.5% 1.7% 1.5% 1.6%; }
.screen { aspect-ratio: 967 / 544; overflow: hidden; border-radius: 2px; background: #fff; }
.screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.stand { display: flex; flex-direction: column; align-items: center; }
.stand i { width: 22%; height: 72px; background: linear-gradient(90deg, #b9babd, #e3e4e6 50%, #b9babd); clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%); }
.stand b { width: 23%; height: 10px; background: #cacbcd; border-radius: 0 0 3px 3px; }
.cs-pn { display: flex; justify-content: space-between; gap: 24px; margin-top: 80px; padding-block: 32px 60px; border-top: 1px solid var(--line); font-size: 16px; line-height: 20px; }
.cs-pn > * { position: relative; width: 250px; max-width: 48%; isolation: isolate; }
.cs-pn a::before { content: ""; position: absolute; inset: -14px; border-radius: 16px; background: var(--hl); opacity: 0; transition: opacity .25s ease; z-index: -1; }
.cs-pn a:hover::before, .cs-pn a:focus-visible::before { opacity: 1; }
.cs-pn div { opacity: .2; }
.cs-pn span { display: block; color: #999; }
.cs-pn b { font-weight: 400; }
.cs-pn .next { text-align: right; margin-left: auto; }
:root[data-theme="dark"] .cs-p { color: var(--muted); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cs-p { color: var(--muted); } }
@media (max-width: 760px) {
  .cs { padding-top: 120px; }
  .cs-head h1 { font-size: 34px; }
  .cs-h2 { font-size: 26px; }
  .cs-img, .cs-gal, .cs-video { width: 100%; max-width: 100%; margin-inline: 0; }
  .cs-meta { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cs-cards { grid-template-columns: minmax(0, 1fr); }
  .cs-gal { grid-template-columns: repeat(min(var(--c), 2), minmax(0, 1fr)); }
  .cs-meta > div { flex: 1 1 40%; }
}

/* Playground — Areal "Works" masonry: full-bleed, 3 columns, 8px gutters, 16px corners, badges on hover */
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 100px 8px 0; align-items: start; }
.pcol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.pitem { position: relative; border-radius: 16px; overflow: hidden; background: var(--card); max-width: 100%; }
.pitem img, .pitem iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; display: block; }
.pitem .meta { pointer-events: none; }
.pitem iframe.scaled { right: auto; bottom: auto; transform-origin: 0 0; }
.pitem .soon { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-size: 14px; letter-spacing: -0.04em; }
.pitem .meta { position: absolute; z-index: 1; top: 8px; left: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity .25s ease; }
.pitem .meta .chip { background: rgba(0, 0, 0, .04); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: rgba(0, 0, 0, .4); font-size: 14px; line-height: 14px; letter-spacing: -0.04em; padding: 4px 10px; border-radius: 40px; }
.pitem:hover .meta { opacity: 1; }
/* Framer "Badge on Dark Theme": 12% white glass, white text */
.pitem.on-dark .meta .chip { background: rgba(255, 255, 255, .12); color: #fff; }
@media (max-width: 759px) { .pgrid { grid-template-columns: minmax(0, 1fr); padding-top: 90px; } }

/* Motion from the Framer page: hero lines rise in on load (20px, 0.4s spring, staggered);
   cards and rows rise in as they scroll into view (20px, 1s, ease [.44,0,.56,1]) */
.hero-in > * { animation: rise .4s cubic-bezier(.25, .8, .25, 1) both; }
.hero-in > .avatar { animation-delay: 0s; }
.hero-in > h1 { animation-delay: .05s; }
.hero-in > p { animation-delay: .1s; }
.hero-in > .btns { animation-delay: .15s; }
.hero-in > .hint { animation-delay: .25s; }
@keyframes rise { from { opacity: 0; transform: translateY(20px); } }
.rv { opacity: 0; transform: translateY(var(--rv-y, 20px)); transition: opacity 1s cubic-bezier(.44, 0, .56, 1), transform 1s cubic-bezier(.44, 0, .56, 1); }
.rv.in { opacity: 1; transform: none; }
.qa.rv { --rv-y: 24px; }
@media (prefers-reduced-motion: reduce) { .hero-in > * { animation: none; } .rv { opacity: 1; transform: none; transition: none; } }

/* ---------- Responsive ---------- */
@media (max-width: 760px) {
  :root { --pad: 16px; }
  .trio, .testi-row { grid-template-columns: 1fr; }
  .work, .think { min-height: 220px; padding: 30px; }
  .inst { width: 64px !important; }
  .cols { grid-template-columns: 1fr; }
  .exp .date { padding: 0 0 4px; }
  .books { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .strip .ph { width: 240px; }
}
@media (prefers-reduced-motion: reduce) {
  .inst img, .strip-track { animation: none; }
  .view { animation: none; }
}
.view { animation: fade .35s ease; }
@keyframes fade { from { opacity: 0; } }
</style>

  let actx = null; const buffers = {};
  function audioCtx() {
    if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function sample(name) {
    const c = audioCtx(); if (!c) return null;
    if (!buffers[name]) {
      const bin = atob(AUDIO[name]), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      buffers[name] = c.decodeAudioData(bytes.buffer);
    }
    return buffers[name];
  }
  function playSample(name, rate = 1, vol = 1) {
    const c = audioCtx(), p = sample(name); if (!c || !p) return;
    p.then((buf) => { const src = c.createBufferSource(); src.buffer = buf; src.playbackRate.value = rate;
      const g = c.createGain(); g.gain.value = vol; src.connect(g).connect(c.destination); src.start(); }).catch(() => {});
  }
  const PERSP = "perspective(500px)";
  const FRAMES = {
    // snare: pushed into the page and bounces back
    push: () => { const z = [0, -40, 12, -18, 6, -6, 0], rx = [0, 4, -1.5, 2, -0.6, 0.6, 0];
      return z.map((v, i) => ({ transform: `${PERSP} translateZ(${v}px) rotateX(${rx[i]}deg)` })); },
    // cymbals: tilt away from where you hit them, then settle
    wobble: (el, e) => { const b = el.getBoundingClientRect(), dx = e.clientX - (b.left + b.width / 2), dy = e.clientY - (b.top + b.height / 2);
      const m = new DOMMatrix(getComputedStyle(el).transform), a = Math.atan2(m.b, m.a);
      const lx = dx * Math.cos(-a) - dy * Math.sin(-a), ly = dx * Math.sin(-a) + dy * Math.cos(-a), len = Math.hypot(lx, ly) || 1;
      const ax = -ly / len, ay = lx / len;
      return [0, 28, -16, 10, -5.5, 2.5, -1, 0].map((v) => ({ transform: `${PERSP} rotate3d(${ax}, ${ay}, 0, ${v}deg)` })); },
    // toms: rock on X with a small squash on impact
    squash: () => [0, 9, -6, 4, -2.4, 1.3, -0.5, 0].map((v, i) => ({ transform: `${PERSP} rotateX(${v}deg) scale(${i === 1 ? 0.96 : 1})` })),
  };
  function hit(el, d, e) {
    playSample(d.s, d.rate || 1, d.vol || 1);
    if (!el.animate) return;
    el.getAnimations().forEach((a) => { if (a.id === "drum-hit") a.cancel(); });
    const anim = el.animate(FRAMES[d.a](el, e), { duration: d.d * 1000, easing: "ease-out", composite: "add" });
    anim.id = "drum-hit";
  }

  const PROJECTS = [{"slug": "btob", "name": "24 Hour Home Care", "tags": ["Service Design", "2026"], "desc": "A self-service family portal that turns phone-call care coordination into a clear, transparent digital experience.", "cat": "24 Hour Home Care", "title": "A portfolio that feels personal, not corporate.", "hero": "img/FnrSI16JhOnY4g9JePQeupNBikY.webp", "ratio": 1.7778, "meta": [["Role", "Dakota Shao"], ["Team", "Dakota Shao Keller Wang"], ["Tools used", "Figma"], ["Year", "2026"]], "year": "2026", "blocks": [{"t": "label", "text": "Overview"}, {"t": "h2", "text": "Building a portfolio that feels less like a showcase and more like a conversation."}, {"t": "p", "text": ["This project began with a simple objective: create a digital presence that communicates both capability and character. Rather than treating the website as a collection of projects, the goal was to design an experience that introduces the person behind the work and creates a genuine connection with visitors."]}, {"t": "label", "text": "Challenge"}, {"t": "h2", "text": "Finding the balance between professionalism and personality."}, {"t": "p", "text": ["Many portfolio websites excel at showcasing work but struggle to communicate the values and perspective behind it. The challenge was creating a website that feels credible and polished without becoming impersonal or overly corporate."]}, {"t": "label", "text": "Approach"}, {"t": "h2", "text": "Turning those constraints into a clear direction."}, {"t": "p", "text": ["Rather than relying on visual complexity, the project focused on creating a strong foundation through typography, spacing, and structure. The design process centered around reducing distractions and allowing content to become the primary point of focus."]}, {"t": "img", "src": "img/zyvsbMETnR5FCHSNNTXkB2LF8.webp", "r": 1.925}, {"t": "label", "text": "Research"}, {"t": "h2", "text": "Understanding what makes digital experiences memorable."}, {"t": "p", "text": ["Research focused on studying independent designers, creative studios, and personal brands whose websites successfully balanced presentation and personality. The goal was to identify common patterns and understand what contributes to a lasting impression."]}, {"t": "sub", "text": "Competitor Analysis"}, {"t": "p", "text": ["By analyzing a range of portfolios and studio websites, several opportunities became apparent. Many experiences either prioritized aesthetics over usability or presented information without a clear narrative structure."]}, {"t": "img", "src": "img/7PzfK1rvfwOauy3jzBps1l5eU0.webp", "r": 1.7778}, {"t": "sub", "text": "Visual Direction"}, {"t": "p", "text": ["The visual direction combines minimal layouts with subtle expressive elements. Typography became the primary design tool, supported by generous spacing, restrained color choices, and carefully selected imagery."]}, {"t": "img", "src": "img/ISAdHKkTACBmHJ9xCsFpzEwxw8.webp", "r": 1.4953}, {"t": "label", "text": "Design solutions"}, {"t": "h2", "text": "Every detail should have a reason to exist."}, {"t": "p", "text": ["A successful experience is often defined by the quality of small decisions. From hierarchy and spacing to motion and component behavior, every element contributes to the overall clarity of the website."]}, {"t": "sub", "text": "Typography"}, {"t": "p", "text": ["Typography serves as the foundation of the visual hierarchy. A clear type scale and consistent spacing system help organize information while creating rhythm throughout the experience."]}, {"t": "img", "src": "img/ymceQwQ8jWHg3v1LtOFctGXcDjU.webp", "r": 1.8768}, {"t": "sub", "text": "Layout System"}, {"t": "p", "text": ["The layout was designed around a structured grid and generous whitespace. This approach improves readability, creates visual balance, and allows individual sections to breathe."]}, {"t": "img", "src": "img/XJLfn3M5u3EQb1bZusySYCLZI.webp", "r": 1.5623}, {"t": "sub", "text": "Components"}, {"t": "p", "text": ["Components were built to be flexible, reusable, and easy to maintain. Buttons, cards, and content blocks follow a unified design language that supports consistency without limiting creativity."]}, {"t": "img", "src": "img/Q6QaXvqV10c7987dhbZ5UFJwMLQ.webp", "r": 1.64}, {"t": "label", "text": "Outcome"}, {"t": "h2", "text": "A portfolio designed to evolve over time."}, {"t": "p", "text": ["The final experience successfully balances clarity, personality, and functionality. It provides a framework for showcasing work while creating meaningful connections with visitors through thoughtful design and storytelling."]}], "live": "img/FnrSI16JhOnY4g9JePQeupNBikY.webp", "thumb": "img/FnrSI16JhOnY4g9JePQeupNBikY.webp", "locked": true}, {"slug": "wildlink", "name": "Wildlink", "tags": ["Game Design"], "desc": "An interactive puzzle game developed with the Arroyos & Foothills Conservancy.", "cat": "Wildlink", "title": "An interactive puzzle game developed with the Arroyos & Foothills Conservancy.", "hero": "img/wl-cover.webp", "thumb": "img/wl-cover.webp", "ratio": "16/9", "meta": [["My role", "Research, game design, puzzle design, video production & editing"], ["Project", "Team project (Dakota, Louise, Leta)"], ["Timeline", "7 weeks"], ["Tools used", "Figma, Illustrator, After Effects, laser lab, CapCut"]], "blocks": [{"t": "label", "text": "Overview"}, {"t": "h2", "text": "Connecting puzzle pieces to solve mountain lion issues."}, {"t": "p", "text": ["The game highlights the survival challenges faced by mountain lions, an iconic species in Los Angeles County, and uses mixed media to engage middle and high school students and visitors to the AFC Education Center in wildlife conservation."]}, {"t": "label", "text": "Game rule"}, {"t": "h2", "text": "You play as a Protector of Mountain Lions, helping them survive in the wild areas near cities."}, {"t": "img", "src": "img/wl-game-rule.webp", "r": "16/9", "alt": "Puzzle pieces connecting a corridor for a mountain lion"}, {"t": "label", "text": "Problem"}, {"t": "h2", "text": "Mountain lions are at risk of separation and inbreeding."}, {"t": "p", "text": ["Habitat fragmentation and road development cut through the large, contiguous habitats they need to survive."]}, {"t": "cards", "items": [{"h": "Deaths from vehicle collisions", "p": "Each year, about 70 mountain lions are killed by vehicle collisions on California highways."}, {"h": "Wildfire", "p": "The 2018 Woolsey Fire burned nearly 100,000 acres in Los Angeles and Ventura counties, forcing mountain lions into riskier areas to find new habitats."}, {"h": "First-order inbreeding", "p": "Researchers found a 93% sperm deformity rate in 9 Santa Monica mountain lions, indicating inbreeding."}, {"h": "Poison", "p": "In the Santa Monica Mountains, 21 of 22 mountain lions tested positive for exposure and four died from poisoning."}]}, {"t": "label", "text": "Users"}, {"t": "cards", "items": [{"h": "Education center visitors", "p": "People who visit the AFC Education Center."}, {"h": "Students", "p": "Junior high and high school students."}]}, {"t": "label", "text": "Key learning goals"}, {"t": "sub", "text": "What are wildlife corridors?"}, {"t": "p", "text": ["Safe paths that animals use to move between habitats."]}, {"t": "sub", "text": "How can we help?"}, {"t": "p", "text": ["By understanding mountain lions' needs and challenges, see how human actions can transform the environment to be diverse, balanced, and connected."]}, {"t": "img", "src": "img/wl-corridors.webp", "r": "16/9", "alt": "When the game is over, all the corridors light up"}, {"t": "label", "text": "Prototype"}, {"t": "h2", "text": "Walkthrough video"}, {"t": "video", "yt": "L8b917ESDvs", "title": "Wildlink walkthrough video"}, {"t": "label", "text": "Inspiration"}, {"t": "gallery", "cols": 1, "items": [{"src": "img/wl-insp-puzzle.webp", "r": "1400/348", "alt": "Puzzle inspiration"}]}, {"t": "gallery", "cols": 4, "items": [{"src": "img/wl-insp-board.webp", "r": "3/4", "alt": "Board game"}, {"src": "img/wl-insp-map.webp", "r": "3/4", "alt": "Illustrated map"}, {"src": "img/wl-insp-animals.webp", "r": "3/4", "alt": "Flat animal illustrations"}, {"src": "img/wl-insp-palette.webp", "r": "3/4", "alt": "Color palette"}]}, {"t": "label", "text": "Design exploration"}, {"t": "gallery", "cols": 3, "items": [{"src": "img/wl-exp-physical.webp", "r": "4/3", "cap": "Physical"}, {"src": "img/wl-exp-digital.webp", "r": "4/3", "cap": "Digital"}, {"src": "img/wl-exp-mix.webp", "r": "4/3", "cap": "Mix"}]}, {"t": "gallery", "cols": 4, "items": [{"src": "img/wl-exp-wood.webp", "r": "1/1", "alt": "Laser-cut wood puzzle prototype"}, {"src": "img/wl-exp-acrylic.webp", "r": "1/1", "alt": "Acrylic puzzle piece"}, {"src": "img/wl-exp-cut-a.webp", "r": "1/1", "fit": "contain", "alt": "Laser cut file"}, {"src": "img/wl-exp-cut-b.webp", "r": "1/1", "fit": "contain", "alt": "Laser cut file"}]}, {"t": "label", "text": "Design decision"}, {"t": "p", "text": ["Our visual style uses flat vector design to align with our target audience."]}, {"t": "gallery", "cols": 2, "items": [{"src": "img/wl-dec-pieces.webp", "r": "1/1", "fit": "contain", "cap": "Puzzle pieces"}, {"src": "img/wl-dec-map.webp", "r": "1/1", "cap": "Map, buttons and color"}]}, {"t": "label", "text": "Game flow"}, {"t": "steps", "items": [{"h": "Onboard: Start", "p": "Choose a start piece to begin. Different start pieces lead to different missions."}, {"h": "Game: Clue", "p": "Match the clue piece to the start piece's theme to learn more about the mountain lions' situation."}, {"h": "Game: Problem", "p": "Find the problem the mountain lions face in this situation."}, {"h": "Game: Data", "p": "Relevant data on the challenges mountain lions face."}, {"h": "Game: Fact", "p": "How building corridors and crossings can help mountain lions overcome their challenges."}, {"h": "Activate: Action", "p": "An action that is already happening and supports corridor building."}]}], "live": null, "art": "wildlink"}, {"slug": "sante", "cat": "Sante", "title": "A brand identity built on calm confidence.", "hero": "img/H6Kl3tacfV4SMP5TOhzwWRZO6E.webp", "ratio": 1.6, "meta": [["Role", "Branding\nGraphic Design"], ["Team", ""], ["Tools used", "Figma\nIllustrator"], ["Year", "2024"]], "year": "2024", "blocks": [{"t": "label", "text": "Overview"}, {"t": "h2", "text": "Creating a wellness identity that feels calm without becoming quiet."}, {"t": "p", "text": ["Sante needed a visual language that felt clinical yet human. We built a wordmark and identity system around a single saturated blue, balancing medical trust with an approachable warmth across every touchpoint."]}, {"t": "label", "text": "Challenge"}, {"t": "h2", "text": "Making trust feel immediate in a crowded wellness space."}, {"t": "p", "text": ["The brand needed to communicate care, clarity, and credibility from the first impression. The challenge was avoiding the expected wellness clichés while still creating a visual language that felt soft, approachable, and reassuring."]}, {"t": "label", "text": "Approach"}, {"t": "h2", "text": "Building the system around restraint, rhythm, and warmth."}, {"t": "p", "text": ["The direction focused on a quiet but confident identity system. Every choice, from spacing to type scale, was shaped to feel intentional and composed rather than decorative."]}, {"t": "img", "src": "img/zyvsbMETnR5FCHSNNTXkB2LF8.webp", "r": 1.925}, {"t": "label", "text": "Research"}, {"t": "h2", "text": "Studying how calm brands earn attention."}, {"t": "p", "text": ["Research looked at wellness platforms, clinical care brands, and lifestyle studios to understand how visual systems can signal support without feeling generic or overly medical."]}, {"t": "sub", "text": "Competitor Analysis"}, {"t": "p", "text": ["Most competitors leaned heavily on muted palettes, soft photography, and familiar wellness language. That opened an opportunity to create something more structured, precise, and memorable while keeping the emotional tone gentle."]}, {"t": "img", "src": "img/7PzfK1rvfwOauy3jzBps1l5eU0.webp", "r": 1.7778}, {"t": "sub", "text": "Visual Direction"}, {"t": "p", "text": ["The visual direction combines clean typography, soft contrast, and measured spacing. The identity avoids loud gestures and instead relies on proportion, tone, and consistency to create recognition."]}, {"t": "img", "src": "img/ISAdHKkTACBmHJ9xCsFpzEwxw8.webp", "r": 1.4953}, {"t": "label", "text": "Design solutions"}, {"t": "h2", "text": "Designing a system that makes calm feel deliberate."}, {"t": "p", "text": ["The final design uses a restrained set of components and layouts that can flex across digital touchpoints while keeping the brand feeling composed and trustworthy."]}, {"t": "sub", "text": "Typography"}, {"t": "p", "text": ["Typography carries much of the brand’s personality. The type treatment is clear and understated, with enough warmth in scale and spacing to keep the experience feeling human."]}, {"t": "img", "src": "img/ymceQwQ8jWHg3v1LtOFctGXcDjU.webp", "r": 1.8768}, {"t": "sub", "text": "Layout System"}, {"t": "p", "text": ["Layouts are intentionally open and balanced, giving content room to breathe while guiding attention through a clear visual sequence."]}, {"t": "img", "src": "img/XJLfn3M5u3EQb1bZusySYCLZI.webp", "r": 1.5623}, {"t": "sub", "text": "Components"}, {"t": "p", "text": ["Reusable components were designed to feel light, functional, and consistent. Tags, cards, and content blocks share the same calm rhythm so the system stays cohesive as it expands."]}, {"t": "img", "src": "img/Q6QaXvqV10c7987dhbZ5UFJwMLQ.webp", "r": 1.64}, {"t": "label", "text": "Outcome"}, {"t": "h2", "text": "A wellness brand with clarity, softness, and staying power."}, {"t": "p", "text": ["The result is an identity that feels approachable without losing credibility. It gives Sante a calm digital presence that can grow across services, campaigns, and future product touchpoints."]}], "live": "img/H6Kl3tacfV4SMP5TOhzwWRZO6E.webp"}, {"slug": "echos", "name": "Echos", "tags": ["AI Voice Assistant"], "desc": "An AI voice tour assistant for The Getty Museum, with personalized guidance and interactive storytelling.", "cat": "Echos", "title": "An AI voice tour assistant for The Getty Museum.", "hero": "img/echos-cover.webp", "thumb": "img/echos-cover.webp", "ratio": "16/9", "meta": [["My role", "Research, user testing, design & prototype for Elias, video production"], ["Project", "Team project (Dakota, Louise, Leta)"], ["Timeline", "7 weeks"], ["Tools used", "Figma, ProtoPie, NFC smart tag, ElevenLabs (AI voice)"]], "blocks": [{"t": "label", "text": "Overview"}, {"t": "h2", "text": "A museum guide you can talk to."}, {"t": "p", "text": ["Echos is an AI voice tour assistant based on The Getty Museum, offering an immersive visiting experience through personalized guidance and interactive storytelling."]}, {"t": "label", "text": "User type"}, {"t": "h2", "text": "Four kinds of visitors, mapped by how long they stay and how deep they go."}, {"t": "p", "text": ["We placed visitors on two axes: a long or short time period at the museum, and an interest in general information or in detail."]}, {"t": "cards", "items": [{"h": "Explorers", "p": "Love wandering around, discovering new things, and embracing the unknown."}, {"h": "Immersive visitors", "p": "Seek deep, atmosphere-driven engagement with art or history."}, {"h": "Social visitors", "p": "Enjoy sharing cultural experiences with friends or family to strengthen bonds."}, {"h": "Researchers", "p": "Pursue detailed information on specific themes or exhibits."}]}, {"t": "label", "text": "AI bot persona"}, {"t": "h2", "text": "Two kinds of AI voice assistants for different visitors and artifacts."}, {"t": "p", "text": ["Main Tourist AI (Joey for explorers, Elias for researchers) offers primary guidance, while Artifact Dedicated AI is tailored for specific museum pieces. As an example, we developed a specialized version for The Getty’s “Golden Ticket.”"]}, {"t": "cards", "items": [{"h": "Joey · Main Tourist AI", "p": "The knowledgeable art companion, for explorers."}, {"h": "Elias · Main Tourist AI", "p": "The expert guide on demand, for researchers."}, {"h": "The Golden Ticket · Artifact Dedicated AI", "p": "The artifact itself tells its story."}, {"h": "The Creator · Artifact Dedicated AI", "p": "The anonymous artist behind the piece."}]}, {"t": "sub", "text": "For explorers: Joey"}, {"t": "p", "text": ["Quick assistance and directions: “Can you show me the nearest restroom?”", "Related artwork suggestions: “Are there any similar pieces I might like?”, also triggered by unintentional interaction."]}, {"t": "sub", "text": "For researchers: Elias"}, {"t": "p", "text": ["In-depth exploration: “Tell me more about this.”, plus more detailed follow-up questions.", "Clarification: “Can you clarify more on this?”"]}, {"t": "sub", "text": "Artifact + Creator"}, {"t": "p", "text": ["The Golden Ticket answers questions about the Greek belief in an afterlife, the legend of the Fountain of Memory, artifacts about afterlife and death from other cultures, and the inscriptions on its surface.", "The Creator talks about production tools, craftsmanship and materials."]}, {"t": "sub", "text": "Conversation flows"}, {"t": "gallery", "cols": 3, "items": [{"src": "img/echos-flow-joey.webp", "r": "1100/2610", "cap": "Joey"}, {"src": "img/echos-flow-elias.webp", "r": "1100/2106", "cap": "Elias"}, {"src": "img/echos-flow-artifact.webp", "r": "996/4096", "cap": "Artifact + Creator"}]}, {"t": "label", "text": "Prototype"}, {"t": "h2", "text": "Prototype showcase"}, {"t": "video", "yt": "s4v0EKhHiQg", "title": "Echos prototype showcase"}, {"t": "label", "text": "User tests"}, {"t": "h2", "text": "Three rounds of testing to validate, refine and decide."}, {"t": "p", "text": ["In our user testing, we focused on three key areas: validating core features and design, refining the overall user flow, and finalizing feature and design choices."]}, {"t": "img", "src": "img/echos-test-setup.webp", "r": "1175/661", "alt": "User test setup"}, {"t": "img", "src": "img/echos-test-photos.webp", "r": "1600/606", "alt": "User test sessions"}, {"t": "sub", "text": "General features"}, {"t": "steps", "items": [{"h": "Tap input or voice input (A/B)", "p": "3 of 6 said voice is a more immersive and smooth way to tour a museum; 3 of 6 said text is the more polite way to get information in a museum."}, {"h": "Switching between tap and voice", "p": "Round 1: 8 of 10 had strong preferences and kept their own method. Round 3: 7 of 10 read the switch as a click, so we changed it to a long press to prevent accidental touches."}, {"h": "Tap mode button", "p": "Round 1: 9 of 10 felt too much typing breaks the immersion. Round 2: 9 of 10 found the options didn’t fit their mental model. Round 3: 7 of 10 read the new options as clickable."}, {"h": "Visit route", "p": "Round 1: 6 of 10 felt the route was incomplete. Round 2: 2 of 10 couldn’t tell how to close the side bar, even with an animated hint."}]}, {"t": "gallery", "cols": 5, "items": [{"src": "img/echos-mode-1.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-mode-2.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-mode-3.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-tap-1.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-tap-2.webp", "r": "393/852", "fit": "contain"}]}, {"t": "gallery", "cols": 5, "items": [{"src": "img/echos-tap-3.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-tap-4.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-route-1.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-route-2.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-route-3.webp", "r": "393/852", "fit": "contain"}]}, {"t": "sub", "text": "Main Tourist AI"}, {"t": "steps", "items": [{"h": "Navigation", "p": "Round 1: 9 of 10 wanted the map both small and full screen. Round 2: 6 of 10 wanted a bigger map while still being able to chat. Round 3: 7 of 10 preferred a map that adapts its size."}, {"h": "Export PDF", "p": "10 of 10 found it helpful and easy to follow; researchers said it lightens their memory load."}, {"h": "Elias’ communication style", "p": "Round 2: 8 of 10 found long messages hard to read and asked for highlights. Round 3: 10 of 10 said bold keywords made reading easier."}]}, {"t": "gallery", "cols": 4, "items": [{"src": "img/echos-nav.webp", "r": "632/816", "fit": "contain"}, {"src": "img/echos-pdf.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-style-1.webp", "r": "393/852", "fit": "contain"}, {"src": "img/echos-style-2.webp", "r": "393/852", "fit": "contain"}]}, {"t": "sub", "text": "Artifact Dedicated AI"}, {"t": "gallery", "cols": 2, "items": [{"src": "img/echos-ai-1.webp", "r": "16/9", "fit": "cover"}, {"src": "img/echos-ai-2.webp", "r": "16/9", "fit": "cover"}, {"src": "img/echos-ai-3.webp", "r": "16/9", "fit": "cover"}, {"src": "img/echos-ai-4.webp", "r": "16/9", "fit": "cover"}]}, {"t": "gallery", "cols": 2, "items": [{"src": "img/echos-ai-5.webp", "r": "16/9", "fit": "cover"}, {"src": "img/echos-ai-6.webp", "r": "16/9", "fit": "cover"}, {"src": "img/echos-ai-7.webp", "r": "16/9", "fit": "cover"}, {"src": "img/echos-ai-8.webp", "r": "16/9", "fit": "cover"}]}], "live": null}];

  const faqs = [["What kind of designer are you?", "I like stepping into unfamiliar systems, figuring out what actually matters, and choosing the right approach from there."], ["What do you care about most in a project?", "Clarity. I like turning something messy, technical, or overwhelming into something people can actually understand and use."], ["What kinds of projects excite you?", "Projects where there’s a real system to unpack—healthcare, mobility, AI, public experiences, or anything that goes beyond just making another app."], ["What are you like to work with?", "Curious, direct, and pretty involved. I ask a lot of questions, catch small inconsistencies, and usually keep pushing until the logic feels right."], ["Do you code?", "Enough to prototype ideas, understand what’s feasible, and have much better conversations with engineers."], ["What do you do outside of design?", "I dance, play guitar, recently started learning drums, and I’m usually picking up something new just because I want to know how it works."], ["What’s something people don’t expect about you?", "I can be very systems-oriented in my work, but I’m also drawn to playful, weird, and slightly unexpected interactions."]];

    <section class="wrap">
      <p class="label">How I Work</p>
      <div class="trio">
        <div class="work"><div><h3>Build to believe it.</h3><p>My sharpest tool is a working prototype.</p></div>
          <div class="tags"><span class="chip">code-based</span><span class="chip">AI-native</span><span class="chip">creative technology</span></div></div>
        <div class="work"><div><h3>Ask why first</h3><p>The clarity isn't from speed. It's from purpose.</p></div>
          <div class="tags"><span class="chip">product strategy</span><span class="chip">0-1</span><span class="chip">outcome-driven</span></div></div>
        <div class="work"><div><h3>Mapping.<br>Structuring.<br>Deifining.</h3><p>Before I design screens, I define relationships.</p></div>
          <div class="tags"><span class="chip">enterprise UX</span><span class="chip">role-based</span><span class="chip">system design</span></div></div>
      </div>
    </section>

      <p class="label">[ Projects ]</p>

        <${p.locked ? `div class="proj locked" aria-disabled="true"` : `a class="proj" href="#work-${p.slug}"`}>
          <div class="shot" style="aspect-ratio:${p.ratio}">
            ${p.art ? HERO[p.art] : p.thumb ? `<img src="${p.thumb}" alt="${p.name || p.cat}" loading="lazy">` : ""}
            <div class="meta">${(p.tags || (p.name ? [p.cat, p.year] : ["BtoB", "2025"])).map((t) => `<span class="chip">${t}</span>`).join("")}${p.locked ? `<span class="chip">Case study coming soon</span>` : ""}</div>
          </div>
          <h4>${p.name || "Baidu"}</h4>
          <p>${p.desc || projDesc}</p>
        </${p.locked ? "div" : "a"}>`).join("")}
    </section>

    <section class="wrap">
      <p class="label">How I Think</p>
      <div class="trio">
        <div class="think"><div><h3>Calibrator</h3><p class="t">Question deeper,<br>Connect wider.</p></div><p class="d">I keep asking why until the answer stops changing.</p></div>
        <div class="think"><div><h3>Navigator</h3><p class="t">Find the goal,<br>Cut the noise.</p></div><p class="d">Trying to satisfy everything has a cost. I prioritize the things that can actually change the outcome.</p></div>
        <div class="think"><div><h3>Igniter</h3><p class="t">Make the first move</p></div><p class="d">I notice gaps, learn what's needed, and find a way forward. That's how I keep momentum alive.</p></div>

      if (b.t === "img") return `<img class="cs-img" src="${b.src}" alt="${esc(b.alt || "")}" style="aspect-ratio:${b.r}" loading="lazy">`;
      if (b.t === "gallery") return `<div class="cs-gal" style="--c:${b.cols || b.items.length}">${b.items.map((it) => `<figure><img src="${it.src}" alt="${esc(it.alt || it.cap || "")}" style="aspect-ratio:${it.r || "4/3"};object-fit:${it.fit || "cover"}" loading="lazy">${it.cap ? `<figcaption>${esc(it.cap)}</figcaption>` : ""}</figure>`).join("")}</div>`;
      if (b.t === "cards") return `<div class="cs-cards">${b.items.map((it) => `<div class="cs-card"><h3>${esc(it.h)}</h3><p>${esc(it.p)}</p></div>`).join("")}</div>`;
      if (b.t === "steps") return `<ol class="cs-steps">${b.items.map((it) => `<li><b>${esc(it.h)}</b><span>${esc(it.p)}</span></li>`).join("")}</ol>`;
      if (b.t === "video") return `<div class="cs-video" data-yt="${b.yt}" data-title="${esc(b.title || "Video")}"><img src="https://i.ytimg.com/vi_webp/${b.yt}/maxresdefault.webp" alt="" loading="lazy"><button type="button" class="cs-play" aria-label="Play ${esc(b.title || "video")}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></button></div>`;
      return "";
    }).join("");
    const pn = (q, dir, cls) => q
      ? `<a class="${cls}" href="#work-${q.slug}"><span>${dir}</span><b>${esc(q.cat)}</b></a>`
      : `<div class="${cls}"><span>${dir}</span><b>More projects soon…</b></div>`;
    const map = p.blocks.filter((b) => b.t === "label").map((b) =>
      `<a href="#work-${p.slug}" data-target="sec-${slugify(b.text)}">${esc(b.text.replace(/\b\w/g, (c) => c.toUpperCase()))}</a>`).join("");
    return `
    <aside class="works-map" aria-label="Sections">
      <a class="wm-back" href="#works"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M6 2.5 1.5 7 6 11.5M1.5 7h11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Back</a>
      <nav class="wm-list">${map}</nav>
    </aside>
    <article class="cs">
      <header class="cs-head">
        <a class="cs-back" href="#works"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M6 2.5 1.5 7 6 11.5M1.5 7h11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Back</a>
        <p class="cs-cat">${esc(p.cat)}</p>
        <h1>${esc(p.title)}</h1>
      </header>
      ${p.art ? `<div class="cs-hero cs-art" style="aspect-ratio:${p.ratio}">${HERO[p.art]}</div>` : `<img class="cs-hero" src="${p.hero}" alt="${esc(p.cat)}" style="aspect-ratio:${p.ratio}">`}
      <dl class="cs-meta" style="--n:${p.meta.length}">${p.meta.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v).replace(/\n/g, "<br>") || "&nbsp;"}</dd></div>`).join("")}</dl>
      <div class="cs-body">${body}</div>
      ${p.live ? `<div class="cs-live"><p class="cs-label">Live website</p>
        <div class="monitor"><div class="screen"><img src="${p.live}" alt=""></div></div>
        <div class="stand"><i></i><b></b></div></div>` : ""}
      <nav class="cs-pn">${pn(prev, "Previous page", "prev")}${pn(next, "Next page", "next")}</nav>
    </article>`;
  };

  const PLAYGROUND = [[{"embed": "play/nokia-loader.html", "name": "Nokia Loader", "year": "2026", "r": "4/5", "link": "https://nokia-loader.vercel.app/"}, {"embed": "play/wk02-quirky.html", "name": "Information Has Weight", "year": "2026", "tone": "Quirky", "r": "4/3", "link": "https://advinterfacewk02.vercel.app/quirky/", "vw": 440}, {"embed": "play/wk02-nostalgic.html", "name": "Resolving Data", "year": "2026", "tone": "Nostalgic", "r": "4/3", "link": "https://advinterfacewk02.vercel.app/nostalgic/", "vw": 760}], [{"embed": "play/push-loader.html", "name": "Push Loader", "year": "2026", "r": "468/293", "dark": true}, {"embed": "play/wk02-playful-reading.html", "name": "Reading Pile", "year": "2026", "tone": "Playful", "r": "4/5", "link": "https://advinterfacewk02.vercel.app/playful-reading/", "vw": 560}, {"embed": "play/wk02-ethereal.html", "name": "Fluid Interface", "year": "2026", "tone": "Ethereal", "r": "4/3", "link": "https://advinterfacewk02.vercel.app/ethereal/", "vw": 520}], [{"embed": "play/tide-endless.html", "name": "Tide Loader", "year": "2026", "r": "1/1", "dark": true}, {"embed": "play/wk02-playful.html", "name": "Notifications Pile Up", "year": "2026", "tone": "Playful", "r": "4/5", "link": "https://advinterfacewk02.vercel.app/playful/", "vw": 560}, {"embed": "play/wk02-glass.html", "name": "Liquid Glass", "year": "2026", "tone": "Ethereal", "r": "1/1", "link": "https://advinterfacewk02.vercel.app/glass/", "vw": 520}]];
  const playground = () => `
    <section class="pgrid" aria-label="Playground">
      ${PLAYGROUND.map((col) => `<div class="pcol">${col.map((it) => `
        <div class="pitem${it.embed ? " live" : ""}${it.dark ? " on-dark" : ""}" style="aspect-ratio:${it.r}">
          ${it.embed ? `<iframe src="${it.embed}" title="${it.name} (interactive)" loading="lazy"${it.vw ? ` class="scaled" data-vw="${it.vw}"` : ""}></iframe>` : `<span class="soon">Coming soon</span>`}
          ${it.embed ? `<div class="meta"><span class="chip">${it.name}</span>${it.tone ? `<span class="chip">${it.tone}</span>` : ""}<span class="chip">${it.year}</span></div>` : ""}
        </div>`).join("")}</div>`).join("")}
    </section>`;

  const exp = (date, title, cls, paras, role) => `
    <div class="cols exp"><p class="date">${date}</p><div><h3 class="${cls}">${title}</h3>${role ? `<p class="role">${role}</p>` : ""}${paras.map((p) => `<p>${p}</p>`).join("")}</div></div>`;
  const hhc = ["Designed a self-service family portal that improves transparency, accessibility, and care coordination for families managing care for loved ones with disabilities. The project IP was later acquired by 24 Hour Home Care."];
  const books = [["dk","Steve Jobs"],["gy",""],["tn","Dieter Rams"],["bl","Design of the 20th Century"],["tn","Helvetica forever"],["dk","The Design Book"],["or","dieter rams"],["",""]];
  const writings = [["Mapping. Structuring. Defining.", "Before I design screens, I define relationships."], ["Learning to Remove", "Early in my design journey, I believed improvement came from adding more. More sections, more interactions, more visual elements. Each new idea felt like progress. Over time, I realised that the opposite was often true. The projects that felt the strongest weren’t the busiest—they were the most focused."], ["Designing Beyond Trends", "Every year introduces a new collection of visual trends. Some disappear within months, while others become so widespread that they begin to define an era of digital design."], ["The Quiet Details Matter Most", "When people talk about memorable websites, they often point to bold visuals or impressive animations. Those moments certainly have their place, but they rarely define an experience on their own."], ["Why Simplicity Is Harder Than It Looks", "Simplicity is often mistaken for the absence of effort. A clean interface, a restrained color palette, or a layout with generous whitespace can appear effortless at first glance."]];

  const about = () => `
    <div class="strip" aria-hidden="true"><div class="strip-track">
      ${[...Array(12)].map((_, i) => `<div class="ph">Photo ${(i % 6) + 1}</div>`).join("")}
    </div></div>
    <div class="about">
      <section class="cols intro"><span></span><div>
        <img class="av" src="${AVATAR}" alt="Dakota">
        <p>I’m Dakota, an interaction designer who enjoys turning complex systems into clear, thoughtful experiences. I’m especially drawn to projects that let me learn something new and approach problems from unexpected angles.</p>
        <span class="mail">${EMAIL}</span>
      </div></section>

      <section>
        <div class="cols"><h2 class="sec-h" style="font-weight:400">Experience</h2></div>
        ${exp("Jan 2026 – Apr 2026", "24 Hour Home Care", "", hhc, 'User Experience Designer <span>(Apprenticeship)</span>')}
        ${exp("May 2025 – Aug 2025", '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="6" cy="9" rx="2.2" ry="3"/><ellipse cx="10" cy="5" rx="2.2" ry="3"/><ellipse cx="14.5" cy="5" rx="2.2" ry="3"/><ellipse cx="18.5" cy="9" rx="2.2" ry="3"/><path d="M12 11c3 0 6.5 4.5 6.5 7.2 0 2-1.6 2.8-3.2 2.4-1.2-.3-2.1-.8-3.3-.8s-2.1.5-3.3.8c-1.6.4-3.2-.4-3.2-2.4C5.5 15.5 9 11 12 11z"/></svg>Baidu', "", ["Assisted in product design and feature iteration for enterprise healthcare systems developed for hospital research and data management."], 'User Experience Designer <span>(Internship)</span>')}
        ${exp("Sep 2024 – Dec 2024", "Arroyos &amp; Foothills Conservancy", "sans", ["Designed a gamified interactive experience combining wildlife data visualization and storytelling to promote awareness of urban wildlife corridors and habitat connectivity in the Los Angeles region.", "Featured in Union Station’s Designing Wildlife Coexistence exhibition, showcasing solutions for wildlife movement and coexistence in LA."], 'Interaction Designer <span>(Apprenticeship)</span>')}
      </section>
      <div class="spacer"></div>

      <section class="cols"><h2 class="sec-h" style="grid-column:auto;font-weight:400">Readings</h2>
        <div class="books">${books.map(([c, t]) => `<div class="book ${c}">${t}</div>`).join("")}</div>
      </section>
      <div class="cols"><span></span><div class="locale"><span id="vloc"></span><span id="clock">--:--</span></div></div>
    </div>`;

  // ---------- nav toggle ----------
  const navEl = document.getElementById("nav"), navDot = document.getElementById("navdot");
  const closeNav = () => { navEl.classList.remove("open"); navDot.setAttribute("aria-expanded", "false"); };
  navDot.addEventListener("click", () => {
    if (matchMedia("(hover: hover)").matches) { location.hash = "#home"; return; }
    const o = navEl.classList.toggle("open"); navDot.setAttribute("aria-expanded", o);
  });
  navEl.querySelector(".nav-left").addEventListener("mouseleave", closeNav);
  document.addEventListener("pointerdown", (e) => { if (!navEl.contains(e.target)) closeNav(); });
  addEventListener("hashchange", () => { navEl.classList.remove("open"); navDot.setAttribute("aria-expanded", "false"); });

  // ---------- theme ----------
  const html = document.documentElement;
  const isDark = () => html.dataset.theme ? html.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.getElementById("theme").addEventListener("click", () => { html.dataset.theme = isDark() ? "light" : "dark"; });

  // ---------- AI button ----------
  const toast = document.getElementById("toast");
  const showToast = () => { toast.hidden = false; clearTimeout(showToast.t); showToast.t = setTimeout(() => (toast.hidden = true), 1800); };
  document.getElementById("ai").addEventListener("click", showToast);
  addEventListener("keydown", (e) => { if (e.metaKey && e.altKey) showToast(); });

  // ---------- clock ----------
  // visitor's own place and time, from their computer's time zone (no location permission needed)
  const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
  const TZ_COUNTRY = {"America/Los_Angeles":"CA","America/Vancouver":"Canada","America/New_York":"NY","America/Chicago":"IL","America/Denver":"CO","America/Phoenix":"AZ","America/Toronto":"Canada","America/Mexico_City":"Mexico","America/Sao_Paulo":"Brazil","Europe/London":"UK","Europe/Paris":"France","Europe/Berlin":"Germany","Europe/Rome":"Italy","Europe/Madrid":"Spain","Europe/Amsterdam":"Netherlands","Europe/Stockholm":"Sweden","Europe/Zurich":"Switzerland","Europe/Lisbon":"Portugal","Europe/Dublin":"Ireland","Asia/Shanghai":"China","Asia/Hong_Kong":"Hong Kong","Asia/Taipei":"Taiwan","Asia/Tokyo":"Japan","Asia/Seoul":"South Korea","Asia/Singapore":"Singapore","Asia/Kolkata":"India","Asia/Ho_Chi_Minh":"Vietnam","Asia/Bangkok":"Thailand","Asia/Dubai":"UAE","Australia/Sydney":"Australia","Australia/Melbourne":"Australia","Pacific/Auckland":"New Zealand"};
  const placeLabel = () => {
    const ALIAS = { "Asia/Calcutta": "Asia/Kolkata", "Asia/Saigon": "Asia/Ho_Chi_Minh", "Asia/Katmandu": "Asia/Kathmandu", "America/Buenos_Aires": "America/Argentina/Buenos_Aires" };
    const zone = ALIAS[TZ] || TZ;
    const city = zone.split("/").pop().replace(/_/g, " ");
    const country = TZ_COUNTRY[zone];
    const abbrIn = (loc) => ((new Intl.DateTimeFormat(loc, { timeZone: TZ, timeZoneName: "short" }).formatToParts(new Date()).find((p) => p.type === "timeZoneName")) || {}).value || "";
    let abbr = abbrIn("en-US"); if (/^(GMT|UTC)/.test(abbr)) abbr = abbrIn("en-GB");
    const off = -new Date().getTimezoneOffset() / 60;
    const offTxt = "UTC " + (off >= 0 ? "+" : "−") + Math.abs(off).toString().replace(".5", ":30").replace(".75", ":45");
    const name = country ? `${city}, ${country}` : city;
    return `${name} ${/^GMT/.test(abbr) ? "" : abbr + " "}(${offTxt})`.replace(/\s+/g, " ");
  };
  function tick() {
    const el = document.getElementById("clock");
    if (el) el.textContent = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    const loc = document.getElementById("vloc");
    if (loc && !loc.textContent) loc.textContent = placeLabel();
  }
  setInterval(tick, 15000);

  // ---------- router ----------
  const app = document.getElementById("app");
  const nav = document.querySelectorAll(".links [data-k]");
  let spy = null;
  addEventListener("scroll", () => spy && spy(), { passive: true });
  function render() {
    const h = location.hash.slice(1) || "home";
    const isAbout = h === "about";
    const work = PROJECTS.find((p) => !p.locked && "work-" + p.slug === h);
    app.innerHTML = `<div class="view">${work ? caseStudy(work) : isAbout ? about() : h === "playground" ? playground() : home()}${footer()}</div>`;
    const key = work ? "works" : isAbout ? "about" : h === "playground" ? "playground" : ["works", "contact"].includes(h) ? h : "home";
    nav.forEach((a) => a.classList.toggle("on", a.dataset.k === key));
    if (h === "works") document.getElementById("works-list").scrollIntoView();
    else if (h === "contact") document.getElementById("contact-block").scrollIntoView();
    else scrollTo(0, 0);
    const wm = app.querySelectorAll(".wm-list a");
    wm.forEach((a) => a.addEventListener("click", (e) => {
      e.preventDefault();
      const t = document.getElementById(a.dataset.target);
      if (t) window.scrollTo({ top: t.getBoundingClientRect().top + scrollY - 140, behavior: "smooth" });
    }));
    spy = wm.length ? () => {
      let cur = null;
      wm.forEach((a) => { const t = document.getElementById(a.dataset.target); if (t && t.getBoundingClientRect().top < innerHeight * 0.4) cur = a; });
      wm.forEach((a) => a.classList.toggle("on", a === cur));
    } : null;
    if (spy) spy();
    app.querySelectorAll(".inst").forEach((b) => {
      const d = kit.find((x) => x.k === b.dataset.k);
      b.addEventListener("pointerdown", (e) => hit(b, d, e));
      b.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); const r = b.getBoundingClientRect(); hit(b, d, { clientX: r.left + r.width / 2, clientY: r.top }); } });
    });
    tick();
    // scroll-in reveal (same as Framer "onInView": opacity 0 → 1, y 20 → 0)
    // Playground: draw each wide demo at its own page width, then shrink it to the card
    app.querySelectorAll("iframe.scaled").forEach((f) => {
      const card = f.parentElement, vw = +f.dataset.vw;
      const size = () => { const k = card.clientWidth / vw; f.style.width = vw + "px"; f.style.height = card.clientHeight / k + "px"; f.style.transform = `scale(${k})`; };
      size(); new ResizeObserver(size).observe(card);
    });
    const rvTargets = app.querySelectorAll(".proj, .trio > *, .qa, .tcard, .companies, .exp, .books, .pitem, .cs-hero, .cs-img, .monitor");
    if ("IntersectionObserver" in window && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const io = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
      rvTargets.forEach((el) => { el.classList.add("rv"); io.observe(el); });
    }
    app.querySelectorAll(".cs-video").forEach((v) => v.querySelector(".cs-play").addEventListener("click", () => {
      v.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.dataset.yt}?autoplay=1&rel=0&playsinline=1" title="${v.dataset.title}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    }));
    app.querySelectorAll("[data-scroll]").forEach((a) => a.addEventListener("click", (e) => {
      const t = document.getElementById(a.dataset.scroll); if (!t) return;
      e.preventDefault(); t.scrollIntoView({ behavior: "smooth", block: "start" });
    }));
    const authors = [...app.querySelectorAll(".author")], tq = app.querySelector(".tquote");
    authors.forEach((a) => a.addEventListener("click", () => {
      if (a.classList.contains("sel")) return;
      authors.forEach((b) => { b.classList.toggle("sel", b === a); b.setAttribute("aria-selected", b === a); });
      tq.classList.add("out");
      setTimeout(() => { tq.textContent = TESTIMONIALS[+a.dataset.i].quote; tq.classList.remove("out"); }, 200);
    }));
    const faqItems = [...app.querySelectorAll(".qa")];
    faqItems.forEach((qa) => qa.querySelector(".q").addEventListener("click", () => {
      const open = !qa.classList.contains("open");
      faqItems.forEach((o) => { o.classList.toggle("open", o === qa && open); o.querySelector(".q").setAttribute("aria-expanded", o === qa && open); });
    }));
  }
  addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
